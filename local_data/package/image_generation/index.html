<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 星月智能 』图片工坊</title>
    <!-- 引入外部资源（保留原引用，若不可用不影响核心功能） -->
    <style>
        @import url("/read/resources/external/fontAwesome/css/all.min.css");
        @import url("/read/resources/universal/multimedia_preview.css");
        @import url("/read/package/image_generation/styles.css");
    </style>
    <script src="/read/resources/universal/multimedia_preview.js"></script>
    <script defer src="/read/package/image_generation/script.js"></script>
</head>
<body>
    <!-- 主容器 -->
    <div class="main-container">
        <!-- 左侧：配置面板（玻璃） -->
        <aside class="glass-panel config-panel" id="config-panel">
            <div class="panel-header-inner">
                <span class="panel-icon">🎨</span>
                <h2>参数设置</h2>
                <button class="btn-icon-only" id="collapse-config-btn" title="折叠面板">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>

            <div class="config-scroll">
                <!-- 预设选择 -->
                <div class="glass-card config-card-preset">
                    <h3>📚 预设模板</h3>
                    <div class="form-group">
                        <select id="preset-select" class="glass-input">
                            <option value="">-- 请选择预设 --</option>
                            <option value="anime">动漫人物</option>
                            <option value="landscape">风景画</option>
                            <option value="sci-fi">科幻世界</option>
                            <option value="portrait">肖像画</option>
                            <option value="fantasy">奇幻场景</option>
                            <option value="architecture">建筑设计</option>
                            <option value="cyberpunk">赛博朋克</option>
                            <option value="watercolor">水彩插画</option>
                        </select>
                    </div>
                </div>

                <!-- 提示词设置 -->
                <div class="glass-card">
                    <h3>📝 提示词</h3>
                    <div class="form-group">
                        <label for="prompt">正面提示词</label>
                        <textarea id="prompt" class="glass-input glass-textarea" placeholder="描述你想要生成的图像内容"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="negative-prompt">负面提示词</label>
                        <textarea id="negative-prompt" class="glass-input glass-textarea" placeholder="描述你不希望在图像中出现的内容"></textarea>
                    </div>
                    <div class="form-group">
                        <label>
                            上传参考图片
                            <button type="button" id="clear-image-btn" class="btn-glass-sm btn-danger-sm" style="display: none;">
                                🗑️ 清除
                            </button>
                        </label>
                        <div class="upload-area-glass" id="upload-area">
                            <div class="upload-preview-wrap">
                                <img id="image-preview" class="image-preview-glass" alt="图片预览" style="display: none;">
                            </div>
                            <div class="upload-placeholder" id="upload-placeholder">
                                <span class="upload-icon-glass">📁</span>
                                <span class="upload-text-glass">点击选择或拖拽图片</span>
                                <span class="upload-hint-glass">支持 JPG, PNG, WebP，最大 10MB</span>
                            </div>
                            <input type="file" id="init-image" accept="image/*" style="display: none;">
                        </div>
                    </div>
                </div>

                <!-- 生成参数 -->
                <div class="glass-card">
                    <h3>⚙️ 生成参数</h3>
                    <div class="form-group">
                        <label for="strength">噪声强度: <span id="strength-value" class="range-value-glass">0.15</span></label>
                        <div class="range-group">
                            <input type="range" id="strength" min="0.1" max="1.0" step="0.01" value="0.85">
                        </div>
                    </div>
                    <div class="param-grid">
                        <div class="form-group">
                            <label for="batch-size">生成数量</label>
                            <input type="number" id="batch-size" class="glass-input" min="1" max="8" value="1">
                        </div>
                        <div class="form-group">
                            <label for="width">宽度: <span id="width-value" class="range-value-glass">512</span></label>
                            <div class="range-group">
                                <input type="range" id="width" min="256" max="2048" step="64" value="512">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="height">高度: <span id="height-value" class="range-value-glass">512</span></label>
                            <div class="range-group">
                                <input type="range" id="height" min="256" max="2048" step="64" value="512">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="steps">迭代步数</label>
                            <input type="number" id="steps" class="glass-input" min="1" max="100" value="20">
                        </div>
                        <div class="form-group">
                            <label for="cfg-scale">提示词权重</label>
                            <input type="number" id="cfg-scale" class="glass-input" min="0.1" max="3.0" step="0.1" value="1.0">
                        </div>
                        <div class="form-group">
                            <label for="seed">随机种子</label>
                            <input type="number" id="seed" class="glass-input" min="0" max="999999999" value="0" placeholder="0表示随机">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 按钮 -->
            <div class="action-buttons-glass">
                <button id="generate-btn" class="btn-glass btn-glass-primary">
                    <i class="fas fa-magic"></i> 开始生成
                </button>
                <button id="reset-btn" class="btn-glass btn-glass-secondary">
                    <i class="fas fa-undo"></i> 重置
                </button>
            </div>

            <!-- 任务状态 -->
            <div id="task-status" class="task-status-glass" style="display: none;">
                <div class="spinner-glass"></div>
                <div class="task-info">
                    <span id="task-message">任务处理中...</span>
                    <div class="progress-bar-glass">
                        <div class="progress-fill-glass" id="task-progress-fill"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 右侧：图片库 -->
        <main class="glass-panel content-panel" id="content-panel">
            <div class="panel-header-inner content-header">
                <div class="content-title-group">
                    <span class="panel-icon">🖼️</span>
                    <h2>图片库</h2>
                    <span class="content-subtitle">— 浏览生成结果与历史数据</span>
                </div>
                <div class="header-actions-glass">
                    <button id="refresh-btn" class="btn-glass btn-glass-icon" title="刷新列表">
                        <i class="fas fa-sync-alt"></i> 刷新
                    </button>
                    <button id="clear-all-btn" class="btn-glass btn-glass-icon btn-glass-danger-icon" title="清空所有">
                        <i class="fas fa-trash-alt"></i> 清空
                    </button>
                </div>
            </div>

            <div id="file-grid" class="file-grid-glass">
                <!-- 文件卡片将通过JS动态插入 -->
            </div>
        </main>
    </div>

    <!-- 移动端浮动按钮 -->
    <button class="mobile-config-fab" id="mobile-config-fab" title="参数设置">
        <i class="fas fa-sliders-h"></i>
    </button>

    <!-- 状态提示 -->
    <div id="status-bar" class="status-bar-glass" style="display: none;">
        <span id="status-message"></span>
    </div>
</body>
</html>
