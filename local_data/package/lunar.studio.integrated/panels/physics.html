<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 星月智能 』物理操纵</title>
    <link rel="stylesheet" href="/file/read/package/standard_dependency/styles.css">
    <script src="/file/read/package/standard_dependency/script.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255,255,255,0.28);
            --glass-border: rgba(255,255,255,0.35);
            --glass-blur: 18px;
            --radius-md: 0.75rem;
            --text-primary: rgba(15,30,15,1);
            --text-secondary: rgba(80,80,80,1);
            --accent: #9d6bff;
            --success: #20c997;
            --danger: #dc3545;
            --transition: all 0.45s ease;
        }
        .dark-mode {
            --text-primary: rgba(244,244,245,1);
            --text-secondary: rgba(180,180,180,1);
            --glass-bg: rgba(38,38,42,0.82);
            --glass-border: rgba(80,80,80,0.6);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: transparent;
            font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            font-size: 13px;
            color: var(--text-primary);
            overflow-y: auto; overflow-x: hidden;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar { display: none; }

        .panel { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

        .panel-title {
            font-size: 14px; font-weight: 600;
            display: flex; align-items: center; gap: 6px;
            color: var(--text-primary);
            padding-bottom: 8px; border-bottom: 1px solid var(--glass-border);
        }
        .panel-title i { color: var(--accent); }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-md);
            padding: 10px 12px;
            transition: var(--transition);
        }

        .field { margin-bottom: 8px; }
        .field:last-child { margin-bottom: 0; }
        .field-label {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .field-value { color: var(--accent); font-weight: 600; font-family: 'SF Mono','Consolas',monospace; }

        input[type="range"] {
            width: 100%; height: 4px;
            background: rgba(157,107,255,0.2);
            border-radius: 2px; appearance: none; -webkit-appearance: none;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none; -webkit-appearance: none;
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); cursor: pointer; border: 2px solid #fff;
        }

        .btn-row { display: flex; gap: 8px; }
        .btn {
            flex: 1; padding: 7px 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 4px;
            transition: var(--transition);
            backdrop-filter: blur(var(--glass-blur));
        }
        .btn:hover { background: rgba(157,107,255,0.15); border-color: var(--accent); }
        .btn.btn-primary { background: rgba(157,107,255,0.25); border-color: var(--accent); color: var(--accent); }
        .btn.btn-danger:hover { background: rgba(220,53,69,0.15); border-color: var(--danger); color: var(--danger); }

        .toggle-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0;
        }
        .toggle {
            position: relative; width: 36px; height: 18px;
            background: rgba(255,255,255,0.2);
            border-radius: 9px; cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--glass-border);
        }
        .toggle::after {
            content: ''; position: absolute;
            top: 1px; left: 1px;
            width: 14px; height: 14px;
            background: #fff; border-radius: 50%;
            transition: var(--transition);
        }
        .toggle.active { background: var(--accent); }
        .toggle.active::after { left: 19px; }

        .stat-row {
            display: flex; justify-content: space-between;
            font-size: 12px; padding: 3px 0;
            color: var(--text-secondary);
        }
        .stat-row span:last-child { color: var(--text-primary); font-family: 'SF Mono','Consolas',monospace; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="panel-title">
            <i class="fas fa-atom"></i><span>物理操纵</span>
        </div>

        <!-- 物理参数 -->
        <div class="glass-card">
            <div class="field">
                <div class="field-label">
                    <span><i class="fas fa-arrow-down"></i> 重力加速度</span>
                    <span class="field-value" id="val-gravity">-9.82</span>
                </div>
                <input type="range" id="slider-gravity" min="-20" max="0" step="0.1" value="-9.82">
            </div>
            <div class="field">
                <div class="field-label">
                    <span><i class="fas fa-compress-arrows-alt"></i> 弹性系数</span>
                    <span class="field-value" id="val-restitution">0.30</span>
                </div>
                <input type="range" id="slider-restitution" min="0" max="1" step="0.05" value="0.3">
            </div>
            <div class="field">
                <div class="field-label">
                    <span><i class="fas fa-hand-paper"></i> 摩擦系数</span>
                    <span class="field-value" id="val-friction">0.30</span>
                </div>
                <input type="range" id="slider-friction" min="0" max="1" step="0.05" value="0.3">
            </div>
            <div class="field">
                <div class="field-label">
                    <span><i class="fas fa-wind"></i> 线性阻尼</span>
                    <span class="field-value" id="val-linear-damping">0.10</span>
                </div>
                <input type="range" id="slider-linear-damping" min="0" max="1" step="0.01" value="0.1">
            </div>
            <div class="field">
                <div class="field-label">
                    <span><i class="fas fa-sync-alt"></i> 角阻尼</span>
                    <span class="field-value" id="val-angular-damping">0.10</span>
                </div>
                <input type="range" id="slider-angular-damping" min="0" max="1" step="0.01" value="0.1">
            </div>
            <div class="field">
                <div class="field-label">
                    <span><i class="fas fa-tachometer-alt"></i> 下落速度倍率</span>
                    <span class="field-value" id="val-fall-speed">2.0</span>
                </div>
                <input type="range" id="slider-fall-speed" min="1" max="5" step="0.1" value="2.0">
            </div>
        </div>

        <!-- 调试与控制 -->
        <div class="glass-card">
            <div class="toggle-row">
                <span><i class="fas fa-vector-square"></i> 碰撞体线框</span>
                <div class="toggle" id="toggle-debug"></div>
            </div>
            <div class="toggle-row">
                <span><i class="fas fa-anchor"></i> 锁定旋转</span>
                <div class="toggle active" id="toggle-fixedRot"></div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="btn-row">
            <button class="btn btn-primary" id="btn-apply" type="button">
                <i class="fas fa-check"></i><span>应用参数</span>
            </button>
            <button class="btn btn-danger" id="btn-reset" type="button">
                <i class="fas fa-redo"></i><span>重置</span>
            </button>
        </div>
    </div>

    <script>
        const CHANNEL_NAME = 'integrated-studio-bus';
        const SOURCE = 'physics-panel';
        const channel = new BroadcastChannel(CHANNEL_NAME);

        const elements = {
            sliderGravity: document.getElementById('slider-gravity'),
            valGravity: document.getElementById('val-gravity'),
            sliderRestitution: document.getElementById('slider-restitution'),
            valRestitution: document.getElementById('val-restitution'),
            sliderFriction: document.getElementById('slider-friction'),
            valFriction: document.getElementById('val-friction'),
            sliderLinearDamping: document.getElementById('slider-linear-damping'),
            valLinearDamping: document.getElementById('val-linear-damping'),
            sliderAngularDamping: document.getElementById('slider-angular-damping'),
            valAngularDamping: document.getElementById('val-angular-damping'),
            sliderFallSpeed: document.getElementById('slider-fall-speed'),
            valFallSpeed: document.getElementById('val-fall-speed'),
            toggleDebug: document.getElementById('toggle-debug'),
            toggleFixedRot: document.getElementById('toggle-fixedRot'),

            btnApply: document.getElementById('btn-apply'),
            btnReset: document.getElementById('btn-reset'),
        };

        const state = {
            gravity: -9.82,
            restitution: 0.3,
            friction: 0.3,
            linearDamping: 0.1,
            angularDamping: 0.1,
            fallSpeedMultiplier: 2.0,
            debugVisible: false,
            fixedRotation: true,
        };

        function init() {
            bindEvents();
            channel.postMessage({ type: 'panel_ready', source: SOURCE, timestamp: Date.now() });
        }

        function bindEvents() {
            elements.sliderGravity.addEventListener('input', () => {
                state.gravity = parseFloat(elements.sliderGravity.value);
                elements.valGravity.textContent = state.gravity.toFixed(2);
            });

            elements.sliderRestitution.addEventListener('input', () => {
                state.restitution = parseFloat(elements.sliderRestitution.value);
                elements.valRestitution.textContent = state.restitution.toFixed(2);
            });

            elements.sliderFriction.addEventListener('input', () => {
                state.friction = parseFloat(elements.sliderFriction.value);
                elements.valFriction.textContent = state.friction.toFixed(2);
            });

            elements.sliderLinearDamping.addEventListener('input', () => {
                state.linearDamping = parseFloat(elements.sliderLinearDamping.value);
                elements.valLinearDamping.textContent = state.linearDamping.toFixed(2);
            });

            elements.sliderAngularDamping.addEventListener('input', () => {
                state.angularDamping = parseFloat(elements.sliderAngularDamping.value);
                elements.valAngularDamping.textContent = state.angularDamping.toFixed(2);
            });

            elements.sliderFallSpeed.addEventListener('input', () => {
                state.fallSpeedMultiplier = parseFloat(elements.sliderFallSpeed.value);
                elements.valFallSpeed.textContent = state.fallSpeedMultiplier.toFixed(1);
            });

            elements.toggleDebug.addEventListener('click', () => {
                state.debugVisible = !state.debugVisible;
                elements.toggleDebug.classList.toggle('active', state.debugVisible);
                channel.postMessage({
                    type: 'physics_param', source: SOURCE,
                    payload: { debugVisible: state.debugVisible },
                    timestamp: Date.now(),
                });
            });

            elements.toggleFixedRot.addEventListener('click', () => {
                state.fixedRotation = !state.fixedRotation;
                elements.toggleFixedRot.classList.toggle('active', state.fixedRotation);
                channel.postMessage({
                    type: 'physics_param', source: SOURCE,
                    payload: { fixedRotation: state.fixedRotation },
                    timestamp: Date.now(),
                });
            });

            elements.btnApply.addEventListener('click', applyParams);
            elements.btnReset.addEventListener('click', resetParams);

            channel.onmessage = (event) => {
                const msg = event.data;
                if (!msg || msg.source === SOURCE) return;
                if (msg.type === 'telemetry') {
                    updateStats(msg.payload);
                } else if (msg.type === 'theme_changed') {
                    document.body.classList.toggle('dark-mode', msg.payload?.dark === true);
                }
            };
        }

        function applyParams() {
            channel.postMessage({
                type: 'physics_param', source: SOURCE,
                payload: {
                    gravity: state.gravity,
                    fixedRotation: state.fixedRotation,
                    restitution: state.restitution,
                    friction: state.friction,
                    linearDamping: state.linearDamping,
                    angularDamping: state.angularDamping,
                    fallSpeedMultiplier: state.fallSpeedMultiplier,
                },
                timestamp: Date.now(),
            });
        }

        function resetParams() {
            state.gravity = -9.82;
            state.restitution = 0.3;
            state.friction = 0.3;
            state.linearDamping = 0.1;
            state.angularDamping = 0.1;
            state.fallSpeedMultiplier = 2.0;
            state.fixedRotation = true;
            elements.sliderGravity.value = state.gravity;
            elements.valGravity.textContent = state.gravity.toFixed(2);
            elements.sliderRestitution.value = state.restitution;
            elements.valRestitution.textContent = state.restitution.toFixed(2);
            elements.sliderFriction.value = state.friction;
            elements.valFriction.textContent = state.friction.toFixed(2);
            elements.sliderLinearDamping.value = state.linearDamping;
            elements.valLinearDamping.textContent = state.linearDamping.toFixed(2);
            elements.sliderAngularDamping.value = state.angularDamping;
            elements.valAngularDamping.textContent = state.angularDamping.toFixed(2);
            elements.sliderFallSpeed.value = state.fallSpeedMultiplier;
            elements.valFallSpeed.textContent = state.fallSpeedMultiplier.toFixed(1);
            elements.toggleFixedRot.classList.toggle('active', state.fixedRotation);
            applyParams();
        }

        function updateStats(p) {
            if (!p) return;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
