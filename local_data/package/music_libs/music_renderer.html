    }

    function resizeCanvas() {
        const canvas = el.visualizerCanvas;
        const container = canvas.parentElement;
        if (!container) return;
        const rect = container.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        const ctx = canvas.getContext('2d');
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
    }

    // ==== 事件绑定 ====
    function bindEvents() {
        el.btnClose.addEventListener('click', hideMusicModal);
        el.overlay.addEventListener('click', (e) => {
            if (e.target === el.overlay) hideMusicModal();
        });

        el.btnPlay.addEventListener('click', togglePlayback);
        el.btnHistory.addEventListener('click', toggleHistoryPanel);
        el.btnHistoryClose.addEventListener('click', () => {
            el.historyPanel.style.display = 'none';
        });
        el.btnDownload.addEventListener('click', downloadAudio);

        el.speedSelect.addEventListener('change', () => {
            if (state.isPlaying || state.isPaused) {
                const currentRealTime = Engine.position();
                seekTo(currentRealTime);
            }
            notifyState();
        });

        el.progressBar.addEventListener('click', (e) => {
            if (state.totalDuration <= 0) return;
            const rect = el.progressBar.getBoundingClientRect();
            const ratio = (e.clientX - rect.left) / rect.width;
            const seekTime = Math.max(0, Math.min(state.totalDuration, ratio * state.totalDuration));
            seekTo(seekTime);
        });

        // 效果器
        el.fxSelect.addEventListener('change', () => {
            const p = FX_PRESETS[el.fxSelect.value];
            if (!p) return;
            fxState = { ...p, master: fxState.master };
            syncFxUI();
            applyFx();
        });
        ['fx-reverb', 'fx-saturation', 'fx-filter', 'fx-compression', 'fx-master'].forEach(id => {
            const input = document.getElementById(id);
            if (!input) return;
            input.addEventListener('input', () => {
                const keyMap = { 'fx-reverb': 'reverb', 'fx-saturation': 'saturation', 'fx-filter': 'filter', 'fx-compression': 'compression', 'fx-master': 'master' };
                const key = keyMap[id];
                if (key === 'master') fxState.master = parseFloat(input.value) / 100;
                else fxState[key] = parseFloat(input.value);
                el.fxSelect.value = 'manual';
                applyFx();
            });
        });

        document.addEventListener('keydown', (e) => {
            if (!el.overlay.classList.contains('visible')) return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayback();
            } else if (e.code === 'Escape') {
                hideMusicModal();
            }
        });
    }

    function syncFxUI() {
        const v = {
            'fx-reverb': fxState.reverb, 'fx-saturation': fxState.saturation,
            'fx-filter': fxState.filter, 'fx-compression': fxState.compression,
            'fx-master': Math.round(fxState.master * 100),
        };
        for (const id in v) {
            const input = document.getElementById(id);
            if (input) input.value = v[id];
        }
    }

    // ==== 状态通知 ====
    function notifyState() {
        postToParent({
            type: 'state',
            playing: state.isPlaying,
            paused: state.isPaused,
            title: state.title,
            totalDuration: state.totalDuration,
        });
    }

    // ==== 渲染乐谱 ====
    function renderMusicScore(abcNotation) {
        if (!abcNotation || typeof abcNotation !== 'string') {
            console.warn('[音乐渲染器] 无效的乐谱数据');
            return;
        }

        if (!samplesReady) {
            console.warn('[音乐渲染器] 音色库仍在生成');
            postToParent({ type: 'error', message: '音色库仍在生成，请稍候再播放' });
            return;
        }

        Engine.stopAll();

        state.abcNotation = abcNotation;

        const titleMatch = abcNotation.match(/^T:\s*(.+)/m);
        state.title = titleMatch ? titleMatch[1].trim() : '未命名作品';

        const tempoMatch = abcNotation.match(/^Q:\s*(.+)/m);
        if (tempoMatch) {
            const bpmMatch = tempoMatch[1].trim().match(/(\d+)/);
            if (bpmMatch) state.bpm = parseInt(bpmMatch[1]);
        }

        const keyMatch = abcNotation.match(/^K:\s*(.+)/m);
        state.key = keyMatch ? keyMatch[1].trim() : 'C';

        const meterMatch = abcNotation.match(/^M:\s*(.+)/m);
        state.meter = meterMatch ? meterMatch[1].trim() : '4/4';

        // 解析声部→乐器映射（来自 musician.ts 注入的 %%voice 指令）
        state.voiceInstruments = parseVoiceInstruments(abcNotation);
        state.instruments = Array.from(state.voiceInstruments.values()).join(',');

        // 解析多声部音符（支持 [V:N] 标记与 [CEG] 和弦）
        const parseResult = parseABCNotes(abcNotation);
        state.notes = parseResult.notes;
        if (state.notes.length === 0) {
            console.warn('[音乐渲染器] 无法解析 ABC 乐谱中的音符');
            postToParent({ type: 'error', message: '乐谱中未找到有效音符' });
            return;
        }

        state.totalDuration = Math.max(...Object.values(parseResult.voiceTimes), 0) + 0.5;
        if (state.totalDuration <= 0.5 && state.notes.length > 0) {
            const lastNote = state.notes[state.notes.length - 1];
            state.totalDuration = lastNote.time + lastNote.duration + 0.5;
        }

        // 构建声部运行时（合成器预设 + 音量）
        buildVoiceRuntimes();

        updateUI();
        resetPlaybackState();
        showMusicModal();
        addToHistory(state.title, abcNotation);

        const voiceCount = new Set(state.notes.map(n => n.voice)).size;
        console.log(`[音乐渲染器] 乐谱就绪: "${state.title}", ${state.notes.length} 个音符, ${voiceCount} 个声部, ${state.totalDuration.toFixed(1)}s`);
        notifyState();
    }

    /** 构建每个声部的运行时信息 */
    function buildVoiceRuntimes() {
        state.voices = {};
        for (const [voiceId, instrumentName] of state.voiceInstruments) {
            const presetKey = matchInstrumentPreset(instrumentName);
            const spec = INSTRUMENTS[presetKey] || INSTRUMENTS.piano;
            state.voices[voiceId] = {
                presetKey,
                instrumentName,
                color: spec.color,
                volume: presetKey === 'drums' ? 0.8 : 0.9,
            };
            console.log(`[音乐渲染器] 声部 ${voiceId}: ${instrumentName} → ${spec.name}`);
        }
    }

    // ==== UI 更新 ====
    function updateUI() {
        el.title.textContent = state.title;
        el.titleScrollText.textContent = state.title;
        el.keyDisplay.textContent = state.key;
        el.meterDisplay.textContent = state.meter;
        el.timeTotal.textContent = formatTime(state.totalDuration);
        el.timeCurrent.textContent = '00:00';
        el.progressFill.style.width = '0%';
        el.speedSelect.value = '1';
        renderVoiceTags();
    }

    function renderVoiceTags() {
        const tags = [];
        for (const [voiceId, instrumentName] of state.voiceInstruments) {
            const v = state.voices[voiceId];
            const specName = v ? INSTRUMENTS[v.presetKey].name : instrumentName;
            tags.push(`<span class="music-voice-tag">声部${voiceId} · ${escapeHtmlSafe(specName)}</span>`);
        }
        el.voiceTags.innerHTML = tags.join('');
    }

    function resetPlaybackState() {
        state.isPlaying = false;
        state.isPaused = false;
        updatePlayButton();
        stopAnimation();
        showScrollingTitle();
    }

    // ==== 播放控制 ====
    function togglePlayback() {
        if (state.isPlaying) {
            pausePlayback();
        } else {
            startPlayback();
        }
        notifyState();
    }

    function startPlayback() {
        if (!state.abcNotation || state.notes.length === 0) return;
        if (!samplesReady) { notifyState(); return; }
        Engine.ensureCtx();
        Engine.ctx.resume().then(() => {
            if (state.isPaused) {
                // 已排程（暂停中），直接恢复
                state.isPlaying = true;
                state.isPaused = false;
            } else {
                Engine.scheduleAll(0);
                state.isPlaying = true;
                state.isPaused = false;
            }
            updatePlayButton();
            startAnimation();
            hideScrollingTitle();
            notifyState();
        }).catch(() => {
            // 自动播放被阻止：等用户再次点击
            state.isPaused = true;
            updatePlayButton();
        });
    }

    function pausePlayback() {
        if (!Engine.ctx) return;
        try { Engine.ctx.suspend(); } catch (e) { }
        state.isPlaying = false;
        state.isPaused = true;
        updatePlayButton();
        stopAnimation();
        showScrollingTitle();
    }

    function stopPlayback() {
        Engine.stopAll();
        state.isPlaying = false;
        state.isPaused = false;
        updatePlayButton();
        stopAnimation();
        disposeSynth();
        showScrollingTitle();
        el.progressFill.style.width = '0%';
        el.timeCurrent.textContent = '00:00';
    }

    function seekTo(seconds) {
        if (state.totalDuration <= 0) return;
        state._lastSeekTime = seconds;
        const wasPlaying = state.isPlaying;
        Engine.stopAll();
        if (!Engine.ctx) Engine.ensureCtx();
        // 暂停态也先排程（resume 前不发声）
        Engine.scheduleAll(Math.min(Math.max(0, seconds), state.totalDuration - 0.05));
        if (wasPlaying) {
            Engine.ctx.resume();
            state.isPlaying = true;
            state.isPaused = false;
            updatePlayButton();
            startAnimation();
            hideScrollingTitle();
        } else {
            state.isPlaying = false;
            state.isPaused = true;
            updatePlayButton();
            showScrollingTitle();
            const progress = (seconds / state.totalDuration) * 100;
            el.progressFill.style.width = progress + '%';
            el.timeCurrent.textContent = formatTime(seconds);
        }
        notifyState();
    }

    // ==== 音频引擎（采样级播放） ====
    const Engine = {
        ctx: null,
        mixer: null,
        voiceNodes: {},
        playing: false,
        scheduled: [],
        startCtxTime: 0,
        startPos: 0,
        _endTimer: null,

        ensureCtx() {
            if (this.ctx) return;
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.mixer = buildMixer(this.ctx, this.ctx.destination);
            this.rebuildVoiceNodes();
            applyFx();
        },
        rebuildVoiceNodes() {
            if (!this.ctx) return;
            for (const id in this.voiceNodes) {
                const n = this.voiceNodes[id];
                try { n.gain.disconnect(); n.pan.disconnect(); } catch (e) { }
            }
            this.voiceNodes = {};
            for (const vid in state.voices) {
                const v = state.voices[vid];
                const gain = this.ctx.createGain(); gain.gain.value = v.volume;
                const pan = this.ctx.createStereoPanner(); pan.pan.value = 0;
                gain.connect(pan);
                pan.connect(this.mixer.busDry);
                pan.connect(this.mixer.reverbIn);
                pan.connect(this.mixer.delayIn);
                this.voiceNodes[vid] = { gain, pan };
            }
        },
        /** 当前播放位置（真实秒） */
        position() {
            if (!this.ctx) return 0;
            return this.ctx.currentTime - this.startCtxTime + this.startPos;
        },
        /** 停止所有已排程音源，保留 AudioContext */
        stopAll() {
            if (this._endTimer) { clearTimeout(this._endTimer); this._endTimer = null; }
            for (const s of this.scheduled) {
                try { s.gain.gain.cancelScheduledValues(this.ctx.currentTime); s.gain.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.03); s.src.stop(this.ctx.currentTime + 0.06); } catch (e) { }
            }
            this.scheduled = [];
            if (this.mixer && this.ctx) this.mixer.tape.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05);
        },
        /** 从指定位置（真实秒）重新排程整首乐曲 */
        scheduleAll(fromPos) {
            this.stopAll();
            if (!this.ctx) this.ensureCtx();
            this.startCtxTime = this.ctx.currentTime + 0.06;
            this.startPos = fromPos;
            const speed = parseFloat(el.speedSelect.value) || 1;
            const timeScale = 1 / speed;
            const notes = ExpressionEngine.applyExpression(state.notes);
            const beatDur = 60 / state.bpm;

            for (const n of notes) {
                const noteEnd = n.time + n.duration;
                if (noteEnd <= fromPos) continue;
                const when = this.startCtxTime + (n.time - fromPos) * timeScale;
                if (when < this.ctx.currentTime - 0.02) continue;
                const remaining = n.time < fromPos ? noteEnd - fromPos : n.duration;
                if (remaining <= 0) continue;
                this.scheduleNote(n, when, remaining * timeScale, beatDur);
            }

            const remainingReal = state.totalDuration - fromPos;
            const ms = Math.max(100, remainingReal * timeScale * 1000 + 400);
            this._endTimer = setTimeout(() => {
                if (state.isPlaying) {
                    this.stopAll();
                    state.isPlaying = false;
                    state.isPaused = false;
                    updatePlayButton();
                    stopAnimation();
                    showScrollingTitle();
                    el.progressFill.style.width = '100%';
                    el.timeCurrent.textContent = formatTime(state.totalDuration);
                    notifyState();
                }
            }, ms);

            if (this.mixer) this.mixer.tape.gain.setTargetAtTime(fxState.noise / 100 * 0.03, this.ctx.currentTime, 0.1);
        },
        scheduleNote(n, when, durSec, beatDur) {
            const v = state.voices[n.voice] || Object.values(state.voices)[0];
            if (!v) return;
            const vn = this.voiceNodes[n.voice] || Object.values(this.voiceNodes)[0];
            if (!vn) return;
            const presetKey = v.presetKey;

            let srcBuf, rate;
            if (presetKey === 'drums') {
                const dn = DRUM_MAP[n.midi] || 'kick';
                srcBuf = drumBufs[dn]; rate = 1;
            } else {
                const spec = INSTRUMENTS[presetKey] || INSTRUMENTS.piano;
                const bases = spec.base; let b = bases[0];
                for (const x of bases) { if (n.midi >= x) b = x; else break; }
                b = Math.min(b, bases[bases.length - 1]);
                srcBuf = samples[presetKey] ? samples[presetKey][b] : null;
                rate = Math.pow(2, (n.midi - b) / 12);
            }
            if (!srcBuf) return;

            const src = this.ctx.createBufferSource();
            src.buffer = srcBuf; src.playbackRate.value = rate;
            const spec = INSTRUMENTS[presetKey] || INSTRUMENTS.piano;
            if (spec.loop) { src.loop = true; src.loopStart = spec.loop[0]; src.loopEnd = spec.loop[1]; }

            const g = this.ctx.createGain();
            const level = Math.pow(n.velocity != null ? n.velocity : 0.75, 1.3) * 0.95;
            const durN = spec.type === 'drums' ? Math.max(durSec * 2, 0.15) : durSec;
            g.gain.setValueAtTime(0.0001, when);
            g.gain.linearRampToValueAtTime(level, when + 0.006);
            const holdEnd = Math.max(when + 0.008, when + durN - 0.05);
            g.gain.setValueAtTime(level, holdEnd);
            g.gain.linearRampToValueAtTime(0.0001, when + durN + 0.05);

            src.connect(g); g.connect(vn.gain);
            src.start(when); src.stop(when + durN + 0.08);
            this.scheduled.push({ src, gain: g });
        },
    };

    function disposeSynth() {
        // 采样引擎无需释放合成器，仅停止播放
    }

    // ==== ABC 解析（多声部 + 和弦 + 力度 + 运音法） ====
    function parseVoiceInstruments(abcNotation) {
        const voiceMap = new Map();
        const voiceRegex = /^%%voice\s+(\d+)\s+(.+)$/gm;
        let match;
        while ((match = voiceRegex.exec(abcNotation)) !== null) {
            const voiceId = parseInt(match[1]);
            const instrument = match[2].trim();
            if (instrument) voiceMap.set(voiceId, instrument);
        }
        if (voiceMap.size > 0) return voiceMap;
        const instMatch = abcNotation.match(/^%%instrument\s+(.+)$/m);
        if (instMatch) {
            const instruments = instMatch[1].replace(/，/g, ',').split(',').map(s => s.trim()).filter(Boolean);
            instruments.forEach((inst, i) => voiceMap.set(i + 1, inst));
        }
        if (voiceMap.size === 0) voiceMap.set(1, '钢琴');
        return voiceMap;
    }

    /* ABC 音名 → MIDI 音高
       ABC 约定：大写 C = C4 = MIDI 60，小写 = 高八度，' 升八度，, 降八度 */
    function abcNoteToMidi(accidental, noteName, octave) {
        const pc = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
        let midi = (noteName === noteName.toUpperCase() ? 60 : 72) + (pc[noteName.toUpperCase()] || 0);
        for (const ch of octave) {
            if (ch === "'") midi += 12;
            else if (ch === ',') midi -= 12;
        }
        if (accidental.includes('^')) midi += 1;
        if (accidental.includes('_')) midi -= 1;
        return midi;
    }

    /* 解析时值后缀（如 "", "2", "/2", "3/4"）→ 相对默认时值的倍数 */
    function parseDurationFactor(numStr, fracStr) {
        let factor = 1;
        if (numStr) factor *= parseInt(numStr);
        if (fracStr && fracStr.startsWith('/')) {
            const f = parseInt(fracStr.substring(1));
            if (f > 0) factor /= f;
        }
        return factor;
    }

    function parseABCNotes(abcNotation) {
        const notes = [];
        const voiceTimes = {};

        const lengthMatch = abcNotation.match(/^L:\s*(\d+)\/(\d+)/m);
        let defaultDuration = 0.125;
        if (lengthMatch) {
            const d1 = parseInt(lengthMatch[1]), d2 = parseInt(lengthMatch[2]);
            if (d2 > 0) defaultDuration = d1 / d2;
        }

        const tempoMatch = abcNotation.match(/^Q:\s*(\d+)\/(\d+)=(\d+)/m);
        let bpm = 120, beatDuration = 0.25;
        if (tempoMatch) {
            const q1 = parseInt(tempoMatch[1]), q2 = parseInt(tempoMatch[2]);
            if (q2 > 0) beatDuration = q1 / q2;
            bpm = parseInt(tempoMatch[3]);
        }
        const secondsPerBeat = 60 / bpm;
        const defaultSeconds = defaultDuration / beatDuration * secondsPerBeat;

        const keyIndex = abcNotation.search(/^K:.*$/m);
        if (keyIndex === -1) return { notes, voiceTimes: { 1: 0 } };

        const musicBody = abcNotation.substring(keyIndex).replace(/^K:.*$/m, '');
        // 移除注释
        const body = musicBody.split('\n').map(l => l.replace(/%.*$/, '')).join('\n');
        // 按 [V:N] 标记分段
        const segments = body.split(/(?=\[V:\s*\d+\])/);

        let currentVoice = 1;
        let currentDynamics = 'mf';
        let pendingArticulation = null;

        // 音符/和弦/休止符/记号 token
        const tokenRe = /\[[^\[\]]*\](?:\d+\/?\d*)?|[\^_=]*[a-gA-G][,'^_=]*\d*\/?\d*|z\d*\/?\d*|![a-zA-Z]+!|[.>-]/g;
        const noteRe = /([\^_=]*)([a-gA-G])([,'^_=]*)(\d*)(\/?\d*)/;
        const chordNoteRe = /([\^_=]*)([a-gA-G])([,'^_=]*)(\d*)(\/?\d*)/g;

        for (const seg of segments) {
            let body = seg;
            const vm = body.match(/^\[V:\s*(\d+)\s*\]/);
            if (vm) {
                currentVoice = parseInt(vm[1]);
                if (voiceTimes[currentVoice] === undefined) voiceTimes[currentVoice] = 0;
                // 移除声部标记，避免被当作和弦块解析而推进时间
                body = body.replace(/^\[V:\s*\d+\s*\]\s*/, '');
            }

            tokenRe.lastIndex = 0;
            let m;
            while ((m = tokenRe.exec(body)) !== null) {
                const tok = m[0];

                // 力度记号 !pp! !p! !mp! !mf! !f! !ff!
                if (tok.startsWith('!')) {
                    const d = tok.slice(1, -1).toLowerCase();
                    if (['pp', 'p', 'mp', 'mf', 'f', 'ff'].includes(d)) currentDynamics = d;
                    continue;
                }
                // 运音法 . > -
                if (tok === '.' || tok === '>' || tok === '-') {
                    pendingArticulation = { '.': 'staccato', '>': 'accent', '-': 'tenuto' }[tok];
                    continue;
                }
                // 休止符
                if (tok.startsWith('z')) {
                    const zf = tok.substring(1).match(/^(\d*)(\/?\d*)/) || ['', '', ''];
                    voiceTimes[currentVoice] += defaultSeconds * parseDurationFactor(zf[1], zf[2]);
                    continue;
                }
                // 和弦块 [CEG] 或 [CEG]2 —— 同刻发声
                if (tok.startsWith('[')) {
                    const closeIdx = tok.indexOf(']');
                    const inner = tok.slice(1, closeIdx);
                    const after = tok.slice(closeIdx + 1);
                    let chordDur = defaultSeconds;
                    const af = after.match(/^(\d*)(\/?\d*)/);
                    if (af && (af[1] || af[2])) chordDur = defaultSeconds * parseDurationFactor(af[1], af[2]);
                    const baseTime = voiceTimes[currentVoice] || 0;
                    chordNoteRe.lastIndex = 0;
                    let nm;
                    while ((nm = chordNoteRe.exec(inner)) !== null) {
                        let dur = chordDur;
                        if (nm[4] || nm[5]) dur = defaultSeconds * parseDurationFactor(nm[4], nm[5]);
                        notes.push({
                            voice: currentVoice,
                            midi: abcNoteToMidi(nm[1], nm[2], nm[3]),
                            time: baseTime,
                            duration: dur,
                            dynamics: currentDynamics,
                            articulation: pendingArticulation || null,
                        });
                    }
                    voiceTimes[currentVoice] = baseTime + chordDur;
                    pendingArticulation = null;
                    continue;
                }
                // 单音符
                const nm = tok.match(noteRe);
                if (nm) {
                    const dur = defaultSeconds * parseDurationFactor(nm[4], nm[5]);
                    const t = voiceTimes[currentVoice] || 0;
                    notes.push({
                        voice: currentVoice,
                        midi: abcNoteToMidi(nm[1], nm[2], nm[3]),
                        time: t,
                        duration: dur,
                        dynamics: currentDynamics,
                        articulation: pendingArticulation || null,
                    });
                    voiceTimes[currentVoice] = t + dur;
                    pendingArticulation = null;
                }
            }
        }

        return { notes, voiceTimes };
    }

    // ==== 后端音频播放（HTML5 Audio） ====
    let _renderedAudio = null;
    let _renderedAudioUrl = null;
    let _renderedAudioName = null;

    function playRenderedAudio(audioUrl, fileName) {
        console.log(`[音乐渲染器] 收到后端渲染音频: ${audioUrl}`);
        if (state.isPlaying || state.isPaused) Engine.stopAll();
        stopAnimation();
        if (_renderedAudio) { _renderedAudio.pause(); _renderedAudio = null; }
        _renderedAudioUrl = audioUrl;
        _renderedAudioName = fileName || 'music.wav';
        const audio = new Audio(audioUrl);
        _renderedAudio = audio;
        audio.addEventListener('loadedmetadata', () => {
            state.totalDuration = audio.duration;
            state.isPlaying = true;
            state.isPaused = false;
            state.title = fileName ? fileName.replace(/\.wav$/, '') : state.title;
            updatePlayButton();
            updateUI();
            showMusicModal();
            hideScrollingTitle();
            console.log(`[音乐渲染器] 后端音频加载完成，时长: ${audio.duration.toFixed(1)}s`);
        });
        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const progress = (audio.currentTime / audio.duration) * 100;
            el.progressFill.style.width = progress + '%';
            el.timeCurrent.textContent = formatTime(audio.currentTime);
        });
        audio.addEventListener('ended', () => {
            state.isPlaying = false;
            state.isPaused = false;
            updatePlayButton();
            showScrollingTitle();
            notifyState();
        });
        audio.addEventListener('error', () => {
            console.error('[音乐渲染器] 后端音频播放失败');
            postToParent({ type: 'error', message: '音频播放失败' });
            if (state.abcNotation) beginFallback();
        });
        audio.play().catch(err => console.warn('[音乐渲染器] 音频自动播放被阻止:', err));
    }

    function beginFallback() {
        stopPlayback();
        startPlayback();
    }

    // ==== 进度动画 ====
    function startAnimation() {
        stopAnimation();
        function tick() {
            if (!state.isPlaying) { state.animationId = null; return; }
            const realTime = Engine.position();
            if (state.totalDuration > 0) {
                const progress = Math.min(100, (realTime / state.totalDuration) * 100);
                el.progressFill.style.width = progress + '%';
                el.timeCurrent.textContent = formatTime(realTime);
            }
            drawVisualizerPlaying(realTime);
            state.animationId = requestAnimationFrame(tick);
        }
        state.animationId = requestAnimationFrame(tick);
    }

    function stopAnimation() {
        if (state.animationId) {
            cancelAnimationFrame(state.animationId);
            state.animationId = null;
        }
    }

    // ==== 可视化 ====
    function drawVisualizerIdle() {
        const canvas = el.visualizerCanvas;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(157, 107, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();
    }

    function drawVisualizerPlaying(currentTime) {
        const canvas = el.visualizerCanvas;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;
        if (w <= 0 || h <= 0) return;
        ctx.clearRect(0, 0, w, h);
        if (state.notes.length === 0) return;

        ctx.strokeStyle = 'rgba(157, 107, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 8]);
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();
        ctx.setLineDash([]);

        const windowStart = Math.max(0, currentTime - 2);
        const windowEnd = Math.min(state.totalDuration, currentTime + 2);
        const windowDuration = windowEnd - windowStart;
        if (windowDuration <= 0) return;

        const barWidth = Math.max(2, w / 80);
        const slotSize = windowDuration / 60;
        const timeSlots = new Map();
        state.notes.forEach(note => {
            if (note.time + note.duration < windowStart || note.time > windowEnd) return;
            const slot = Math.floor((note.time - windowStart) / slotSize);
            if (!timeSlots.has(slot)) timeSlots.set(slot, []);
            timeSlots.get(slot).push(note);
        });

        timeSlots.forEach((notes, slot) => {
            const x = (slot / 60) * w;
            const normalizedPitch = (notes[0].midi - 48) / 36;
            const barHeight = h * 0.15 + normalizedPitch * h * 0.7;
            const distFromCenter = Math.abs((slot / 60) * windowDuration - (currentTime - windowStart));
            const alpha = Math.max(0.15, 1 - distFromCenter / (windowDuration / 2));
            const isNearCurrent = distFromCenter < 0.3;
            const hue = isNearCurrent ? 270 : 260;
            const saturation = isNearCurrent ? '80%' : '60%';
            const lightness = isNearCurrent ? '65%' : '50%';
            ctx.fillStyle = `hsla(${hue}, ${saturation}, ${lightness}, ${alpha})`;
            ctx.fillRect(x, h / 2 - barHeight / 2, barWidth, barHeight);
        });

        const indicatorX = ((currentTime - windowStart) / windowDuration) * w;
        ctx.strokeStyle = 'rgba(157, 107, 255, 0.8)';
        ctx.lineWidth = 2;
        ctx.shadowColor = 'rgba(157, 107, 255, 0.5)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(indicatorX, 0);
        ctx.lineTo(indicatorX, h);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    // ==== 滚动标题 ====
    function showScrollingTitle() {
        if (el.titleScroll) el.titleScroll.style.display = 'flex';
    }
    function hideScrollingTitle() {
        if (el.titleScroll) el.titleScroll.style.display = 'none';
    }

    // ==== 下载（WAV 离线渲染 + ABC 回退） ====
    function encodeWAV(channels, sampleRate, bitDepth) {
        const numCh = channels.length, frames = channels[0].length;
        const bytesPerSample = bitDepth / 8, blockAlign = numCh * bytesPerSample;
        const dataSize = frames * blockAlign;
        const buf = new ArrayBuffer(44 + dataSize), view = new DataView(buf);
        const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
        writeStr(0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); writeStr(8, 'WAVE');
        writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
        view.setUint16(22, numCh, true); view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * blockAlign, true); view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitDepth, true); writeStr(36, 'data'); view.setUint32(40, dataSize, true);
        let off = 44;
        for (let i = 0; i < frames; i++) {
            for (let c = 0; c < numCh; c++) {
                let s = clamp(channels[c][i], -1, 1);
                s += (Math.random() * 2 - 1) / 65536;
                s = clamp(s, -1, 1);
                view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                off += bytesPerSample;
            }
        }
        return new Blob([buf], { type: 'audio/wav' });
    }

    async function exportWAV() {
        if (!samplesReady) return null;
        if (state.notes.length === 0) return null;
        const sampleRate = 44100, bitDepth = 16;
        const endBeat = state.totalDuration;
        const beatDur = 60 / state.bpm;
        const durSec = endBeat + 0.5;
        const len = Math.ceil(durSec * sampleRate);
        const ctx = new OfflineAudioContext(2, len, sampleRate);
        const m = buildMixer(ctx, ctx.destination);
        // 应用效果
        m.filter.frequency.value = fxState.filter;
        m.sat.curve = makeSaturationCurve(fxState.saturation / 100 * 8);
        m.reverbIn.gain.value = fxState.reverb / 100 * 0.85;
        m.delayIn.gain.value = fxState.delay / 100 * 0.7;
        m.delay.delayTime.value = 60 / state.bpm * 0.75;
        m.comp.threshold.value = -6 - (fxState.compression / 100) * 24;
        m.comp.ratio.value = 1 + (fxState.compression / 100) * 9;
        m.trem.gain.value = 1 - (fxState.tremolo / 100 * 0.5);
        m.lfoGain.gain.value = fxState.tremolo / 100 * 0.5;
        m.tape.gain.value = fxState.noise / 100 * 0.03;
        m.master.gain.value = fxState.master;

        const voiceNodes = {};
        for (const vid in state.voices) {
            const v = state.voices[vid];
            const gain = ctx.createGain(); gain.gain.value = v.volume;
            gain.connect(m.busDry); gain.connect(m.reverbIn); gain.connect(m.delayIn);
            voiceNodes[vid] = { gain };
        }

        const speed = parseFloat(el.speedSelect.value) || 1;
        const timeScale = 1 / speed;
        const notes = ExpressionEngine.applyExpression(state.notes);
        for (const n of notes) {
            const vn = voiceNodes[n.voice] || Object.values(voiceNodes)[0];
            if (!vn) continue;
            const v = state.voices[n.voice] || Object.values(state.voices)[0];
            const presetKey = v.presetKey;
            let srcBuf, rate;
            if (presetKey === 'drums') {
                const dn = DRUM_MAP[n.midi] || 'kick';
                srcBuf = drumBufs[dn]; rate = 1;
            } else {
                const spec = INSTRUMENTS[presetKey] || INSTRUMENTS.piano;
                const bases = spec.base; let b = bases[0];
                for (const x of bases) { if (n.midi >= x) b = x; else break; }
                b = Math.min(b, bases[bases.length - 1]);
                srcBuf = samples[presetKey] ? samples[presetKey][b] : null;
                rate = Math.pow(2, (n.midi - b) / 12);
            }
            if (!srcBuf) continue;
            const when = n.time * timeScale;
            const src = ctx.createBufferSource(); src.buffer = srcBuf; src.playbackRate.value = rate;
            const spec = INSTRUMENTS[presetKey] || INSTRUMENTS.piano;
            if (spec.loop) { src.loop = true; src.loopStart = spec.loop[0]; src.loopEnd = spec.loop[1]; }
            const g = ctx.createGain();
            const level = Math.pow(n.velocity != null ? n.velocity : 0.75, 1.3) * 0.95;
            const durN = spec.type === 'drums' ? Math.max(n.duration * timeScale * 2, 0.15) : n.duration * timeScale;
            g.gain.setValueAtTime(0.0001, when); g.gain.linearRampToValueAtTime(level, when + 0.006);
            g.gain.setValueAtTime(level, Math.max(when + 0.008, when + durN - 0.05));
            g.gain.linearRampToValueAtTime(0.0001, when + durN + 0.05);
            src.connect(g); g.connect(vn.gain);
            src.start(when); src.stop(when + durN + 0.08);
        }

        const rendered = await ctx.startRendering();
        const channels = [rendered.getChannelData(0), rendered.getChannelData(1)];
        return encodeWAV(channels, sampleRate, bitDepth);
    }

    function downloadAudio() {
        const safeName = state.title.replace(/[\\/:*?"<>|]/g, '_');
        if (_renderedAudioUrl) {
            fetch(_renderedAudioUrl)
                .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.blob(); })
                .then(blob => downloadBlob(blob, _renderedAudioName || `${safeName}.wav`))
                .catch(err => { console.warn('[音乐渲染器] WAV 下载失败，回退到 ABC:', err); downloadABCFile(safeName); });
            return;
        }
        const btn = el.btnDownload;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        exportWAV().then(blob => {
            if (blob) downloadBlob(blob, `${safeName}.wav`);
            else downloadABCFile(safeName);
        }).catch(err => {
            console.warn('[音乐渲染器] WAV 离线渲染失败，回退到 ABC:', err);
            downloadABCFile(safeName);
        }).finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-download"></i>';
        });
    }

    function downloadABCFile(safeName) {
        if (!state.abcNotation) return;
        const blob = new Blob([state.abcNotation], { type: 'text/plain;charset=utf-8' });
        downloadBlob(blob, `${safeName}.abc`);
    }

    // ==== 播放按钮 ====
    function updatePlayButton() {
        const icon = el.btnPlay.querySelector('i');
        if (state.isPlaying) {
            icon.className = 'fas fa-pause';
            el.btnPlay.title = '暂停';
        } else {
            icon.className = 'fas fa-play';
            el.btnPlay.title = '播放';
        }
    }

    // ==== 模态框 ====
    function showMusicModal() {
        el.overlay.classList.add('visible');
        el.historyPanel.style.display = 'none';
        requestAnimationFrame(() => {
            resizeCanvas();
            drawVisualizerIdle();
        });
    }

    function hideMusicModal() {
        stopPlayback();
        el.overlay.classList.remove('visible');
        postToParent({ type: 'closed' });
        notifyState();
    }

    // ==== 历史记录 ====
    function toggleHistoryPanel() {
        const isVisible = el.historyPanel.style.display !== 'none';
        el.historyPanel.style.display = isVisible ? 'none' : 'block';
        if (!isVisible) renderHistoryList();
    }

    function addToHistory(title, abcNotation) {
        state.history.unshift({ title, abcNotation, time: new Date().toLocaleTimeString() });
        if (state.history.length > 20) state.history.pop();
    }

    function renderHistoryList() {
        if (state.history.length === 0) {
            el.historyList.innerHTML = '<div class="music-history-empty">暂无创作历史</div>';
            return;
        }
        el.historyList.innerHTML = state.history.map((item, index) => `
            <div class="music-history-item" data-index="${index}">
                <span class="music-history-title">${escapeHtmlSafe(item.title)}</span>
                <span class="music-history-time">${item.time}</span>
            </div>
        `).join('');
        el.historyList.querySelectorAll('.music-history-item').forEach(item => {
            item.addEventListener('click', () => {
                const index = parseInt(item.dataset.index);
                const record = state.history[index];
                if (record) {
                    el.historyPanel.style.display = 'none';
                    renderMusicScore(record.abcNotation);
                }
            });
        });
    }

    // ==== 工具函数 ====
    function formatTime(seconds) {
        if (!isFinite(seconds) || seconds < 0) return '00:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function escapeHtmlSafe(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ==== 启动 ====
    init();
    buildSampleLibrary().then(() => {
        console.log('[音乐渲染器] 采样音色库就绪');
    });
    </script>
</body>
