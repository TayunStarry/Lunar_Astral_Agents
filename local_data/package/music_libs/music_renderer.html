<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Renderer</title>
    <!-- Font Awesome 图标 -->
    <link rel="stylesheet" href="/file/read/package/standard_dependency/styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
        }

        /* ===== 模态框遮罩 ===== */
        .music-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .music-modal-overlay.visible {
            display: flex;
            opacity: 1;
        }

        /* ===== 主面板 ===== */
        .music-modal {
            width: 760px;
            max-width: 95vw;
            max-height: 90vh;
            background: rgba(250, 250, 250, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 20px;
            box-shadow:
                0 8px 48px rgba(0, 0, 0, 0.18),
                0 0 0 1px rgba(157, 107, 255, 0.08) inset;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transform: translateY(12px) scale(0.97);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .music-modal-overlay.visible .music-modal {
            transform: translateY(0) scale(1);
        }
        .dark-mode .music-modal {
            background: rgba(30, 30, 38, 0.92);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow:
                0 8px 48px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(157, 107, 255, 0.06) inset;
        }

        /* ===== 标题栏 ===== */
        .music-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(157, 107, 255, 0.15);
            background: linear-gradient(135deg, rgba(157, 107, 255, 0.08), rgba(108, 155, 207, 0.04));
            flex-shrink: 0;
        }
        .dark-mode .music-modal-header {
            background: linear-gradient(135deg, rgba(157, 107, 255, 0.12), rgba(108, 155, 207, 0.06));
            border-bottom-color: rgba(157, 107, 255, 0.12);
        }

        .music-modal-title-area {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        .music-modal-title {
            font-size: 16px;
            font-weight: 700;
            color: #9d6bff;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .music-modal-title::before {
            content: '\f001';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 14px;
            opacity: 0.7;
            animation: music-note-float 2.5s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes music-note-float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-3px) rotate(5deg); opacity: 1; }
        }

        .music-modal-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        /* ===== 通用按钮 ===== */
        .music-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(157, 107, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            color: #9d6bff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .music-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at center, rgba(157, 107, 255, 0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .music-btn:hover {
            background: rgba(157, 107, 255, 0.12);
            border-color: rgba(157, 107, 255, 0.45);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(157, 107, 255, 0.2);
        }
        .music-btn:hover::after { opacity: 1; }
        .music-btn:active {
            transform: translateY(0) scale(0.95);
            transition: all 0.1s ease;
        }
        .music-btn-close:hover {
            background: rgba(220, 53, 69, 0.12);
            border-color: rgba(220, 53, 69, 0.4);
            color: #dc3545;
            box-shadow: 0 4px 14px rgba(220, 53, 69, 0.2);
        }
        .music-btn-close:hover::after {
            background: radial-gradient(circle at center, rgba(220, 53, 69, 0.25) 0%, transparent 70%);
        }
        .dark-mode .music-btn {
            background: rgba(38, 38, 42, 0.5);
            border-color: rgba(157, 107, 255, 0.25);
            color: #b794f4;
        }

        /* 大号播放按钮 */
        .music-btn-play-lg {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 16px;
            flex-shrink: 0;
        }

        /* ===== 可视化区域 ===== */
        .music-modal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0;
            min-height: 0;
        }

        .music-visualizer-container {
            flex: 1;
            position: relative;
            background: rgba(0, 0, 0, 0.04);
            border-bottom: 1px solid rgba(157, 107, 255, 0.08);
            overflow: hidden;
            min-height: 200px;
        }
        .dark-mode .music-visualizer-container {
            background: rgba(0, 0, 0, 0.15);
        }
        .music-visualizer-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 滚动标题（非播放状态） */
        .music-title-scroll {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            pointer-events: none;
        }
        .music-title-scroll-text {
            font-size: 22px;
            font-weight: 700;
            color: rgba(157, 107, 255, 0.25);
            white-space: nowrap;
            animation: title-marquee 12s linear infinite;
            letter-spacing: 2px;
        }
        @keyframes title-marquee {
            0% { transform: translateX(30%); }
            100% { transform: translateX(-30%); }
        }

        /* ===== 设置栏 ===== */
        .music-modal-settings {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 10px 20px;
            border-bottom: 1px solid rgba(157, 107, 255, 0.1);
            background: rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .dark-mode .music-modal-settings {
            background: rgba(20, 20, 28, 0.2);
        }

        .music-setting {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .music-setting-label {
            font-size: 12px;
            color: rgba(157, 107, 255, 0.7);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .music-setting-label i {
            font-size: 11px;
            opacity: 0.7;
        }

        .music-setting-select {
            padding: 4px 8px;
            border: 1px solid rgba(157, 107, 255, 0.25);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.5);
            color: #9d6bff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .music-setting-select:hover {
            border-color: rgba(157, 107, 255, 0.5);
            background: rgba(255, 255, 255, 0.7);
        }
        .music-setting-select:focus {
            border-color: #9d6bff;
            box-shadow: 0 0 0 2px rgba(157, 107, 255, 0.15);
        }
        .dark-mode .music-setting-select {
            background: rgba(38, 38, 42, 0.5);
            color: #b794f4;
        }

        .music-setting-value {
            font-size: 13px;
            font-weight: 600;
            color: #9d6bff;
            padding: 4px 10px;
            background: rgba(157, 107, 255, 0.08);
            border: 1px solid rgba(157, 107, 255, 0.15);
            border-radius: 8px;
            min-width: 36px;
            text-align: center;
        }
        .dark-mode .music-setting-value {
            background: rgba(157, 107, 255, 0.12);
            color: #b794f4;
        }

        /* 乐器标签 */
        .music-voice-tags {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .music-voice-tag {
            font-size: 11px;
            font-weight: 600;
            color: #9d6bff;
            background: rgba(157, 107, 255, 0.1);
            border: 1px solid rgba(157, 107, 255, 0.22);
            border-radius: 20px;
            padding: 3px 10px;
            white-space: nowrap;
        }
        .dark-mode .music-voice-tag {
            background: rgba(157, 107, 255, 0.16);
            color: #b794f4;
        }

        /* ===== 效果器行 ===== */
        .music-fx-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
            border-bottom: 1px solid rgba(157, 107, 255, 0.1);
            background: rgba(157, 107, 255, 0.05);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .dark-mode .music-fx-bar {
            background: rgba(20, 20, 28, 0.25);
        }
        .music-fx-slider {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(157, 107, 255, 0.75);
            white-space: nowrap;
        }
        .music-fx-slider input[type=range] {
            width: 90px;
            accent-color: #9d6bff;
        }

        /* ===== 底部控制栏 ===== */
        .music-modal-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-top: 1px solid rgba(157, 107, 255, 0.12);
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            flex-shrink: 0;
        }
        .dark-mode .music-modal-footer {
            background: rgba(20, 20, 28, 0.4);
            border-top-color: rgba(157, 107, 255, 0.1);
        }

        /* 进度条 */
        .music-progress {
            flex: 1;
            height: 6px;
            background: rgba(157, 107, 255, 0.12);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .music-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #9d6bff, #6c9bcf);
            border-radius: 3px;
            transition: width 0.1s linear;
            position: relative;
        }
        .music-progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translate(50%, -50%);
            width: 10px;
            height: 10px;
            background: #fff;
            border: 2px solid #9d6bff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(157, 107, 255, 0.4);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .music-progress:hover .music-progress-fill::after {
            opacity: 1;
        }

        /* 时间 */
        .music-time {
            font-size: 11px;
            color: #9d6bff;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            min-width: 42px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        /* ===== 历史记录面板 ===== */
        .music-history-panel {
            position: absolute;
            right: 20px;
            top: 56px;
            width: 280px;
            max-height: 360px;
            overflow-y: auto;
            background: rgba(250, 250, 250, 0.96);
            border: 1px solid rgba(157, 107, 255, 0.2);
            border-radius: 14px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(157, 107, 255, 0.06) inset;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            scrollbar-width: none;
            z-index: 1001;
            animation: history-slide-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes history-slide-in {
            from { opacity: 0; transform: translateY(-8px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .music-history-panel::-webkit-scrollbar { display: none; }
        .dark-mode .music-history-panel {
            background: rgba(30, 30, 38, 0.96);
            border-color: rgba(157, 107, 255, 0.2);
        }

        .music-history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 700;
            color: #9d6bff;
            border-bottom: 1px solid rgba(157, 107, 255, 0.12);
            letter-spacing: 0.3px;
        }
        .music-history-list { padding: 6px; }
        .music-history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
        }
        .music-history-item:hover {
            background: rgba(157, 107, 255, 0.08);
            transform: translateX(2px);
        }
        .music-history-item:active {
            background: rgba(157, 107, 255, 0.15);
            transform: translateX(2px) scale(0.98);
        }
        .music-history-title {
            color: #9d6bff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            font-weight: 500;
        }
        .music-history-time {
            font-size: 11px;
            color: rgba(128, 128, 128, 0.7);
            margin-left: 10px;
            font-family: 'SF Mono', 'Consolas', monospace;
        }
        .music-history-empty {
            text-align: center;
            padding: 28px 20px;
            color: rgba(128, 128, 128, 0.5);
            font-size: 13px;
        }
        .music-history-empty::before {
            content: '\f001';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
            opacity: 0.4;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .music-modal {
                width: 98vw;
                max-height: 95vh;
                border-radius: 14px;
            }
            .music-modal-header { padding: 10px 14px; }
            .music-modal-settings { padding: 8px 14px; gap: 12px; }
            .music-modal-footer { padding: 10px 14px; }
            .music-fx-bar { padding: 6px 14px; }
            .music-visualizer-container { min-height: 150px; }
            .music-title-scroll-text { font-size: 18px; }
            .music-history-panel { right: 6px; top: 50px; width: 250px; max-height: 300px; }
            .music-btn { width: 34px; height: 34px; border-radius: 8px; }
            .music-btn-play-lg { width: 40px; height: 40px; }
            .music-time { font-size: 10px; min-width: 36px; }
        }

        @media (max-width: 480px) {
            .music-modal-settings { gap: 8px; justify-content: center; }
            .music-setting-label { font-size: 11px; }
            .music-setting-select { font-size: 11px; }
            .music-setting-value { font-size: 11px; }
            .music-fx-slider input[type=range] { width: 70px; }
            .music-title-scroll-text { font-size: 16px; letter-spacing: 1px; }
        }
    </style>
</head>
<body>
    <div class="music-modal-overlay" id="music-modal-overlay">
        <div class="music-modal">
            <div class="music-modal-header">
                <div class="music-modal-title-area" id="music-title-area">
                    <span class="music-modal-title" id="music-title">音乐播放器</span>
                </div>
                <div class="music-modal-actions">
                    <button class="music-btn" id="music-btn-history" title="历史记录">
                        <i class="fas fa-history"></i>
                    </button>
                    <button class="music-btn" id="music-btn-download" title="下载音频/乐谱">
                        <i class="fas fa-download"></i>
                    </button>
                    <button class="music-btn music-btn-close" id="music-btn-close" title="关闭">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div class="music-modal-body">
                <div class="music-visualizer-container" id="music-visualizer-container">
                    <canvas id="music-visualizer-canvas"></canvas>
                    <div class="music-title-scroll" id="music-title-scroll" style="display:none;">
                        <span class="music-title-scroll-text" id="music-title-scroll-text"></span>
                    </div>
                </div>
            </div>
            <div class="music-modal-settings" id="music-settings">
                <div class="music-setting">
                    <label class="music-setting-label"><i class="fas fa-tachometer-alt"></i> 速度</label>
                    <select class="music-setting-select" id="music-setting-speed">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                    </select>
                </div>
                <div class="music-setting">
                    <label class="music-setting-label"><i class="fas fa-music"></i> 调式</label>
                    <span class="music-setting-value" id="music-setting-key">C</span>
                </div>
                <div class="music-setting">
                    <label class="music-setting-label"><i class="fas fa-clock"></i> 拍号</label>
                    <span class="music-setting-value" id="music-setting-meter">4/4</span>
                </div>
                <div class="music-setting">
                    <label class="music-setting-label"><i class="fas fa-sliders-h"></i> 效果</label>
                    <select class="music-setting-select" id="music-setting-fx">
                        <option value="lofi" selected>标准 LOFI</option>
                        <option value="warm">温暖钢琴厅</option>
                        <option value="dream">梦幻氛围</option>
                        <option value="clean">干净明亮</option>
                        <option value="dark">暗黑深夜</option>
                        <option value="manual">手动精调</option>
                    </select>
                </div>
                <div class="music-voice-tags" id="music-voice-tags"></div>
            </div>
            <div class="music-fx-bar" id="music-fx-bar">
                <div class="music-fx-slider">混响 <input type="range" id="fx-reverb" min="0" max="100" value="32"></div>
                <div class="music-fx-slider">饱和 <input type="range" id="fx-saturation" min="0" max="100" value="28"></div>
                <div class="music-fx-slider">低通 <input type="range" id="fx-filter" min="400" max="18000" step="100" value="8200"></div>
                <div class="music-fx-slider">压缩 <input type="range" id="fx-compression" min="0" max="100" value="30"></div>
                <div class="music-fx-slider">音量 <input type="range" id="fx-master" min="0" max="150" value="90"></div>
            </div>
            <div class="music-modal-footer">
                <span class="music-time" id="music-time-current">00:00</span>
                <div class="music-progress" id="music-progress-bar">
                    <div class="music-progress-fill" id="music-progress-fill"></div>
                </div>
                <span class="music-time" id="music-time-total">00:00</span>
                <button class="music-btn music-btn-play-lg" id="music-btn-play" title="播放">
                    <i class="fas fa-play"></i>
                </button>
            </div>
        </div>
        <div class="music-history-panel" id="music-history-panel" style="display:none;">
            <div class="music-history-header">
                <span>创作历史</span>
                <button class="music-btn music-btn-close" id="music-btn-history-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="music-history-list" id="music-history-list"></div>
        </div>
    </div>

    <script>
    /**
     * 音乐渲染器 - 独立页面（采样级合成引擎）
     *
     * 参考 lofi-studio 方案重构：使用 Web Audio 离线预渲染"采样级音色库"，
     * 播放时按音高移调（playbackRate）实时演奏，并经过统一的混音器效果链
     * （卷积混响 / 反馈延迟 / 磁带饱和 / 复古低通 / 颤音 / 压缩 / 磁带底噪）。
     *
     * 通讯协议（与主应用一致，BroadcastChannel）：
     *   接收（主应用 → 本页）：
     *     { type: 'render', abcNotation: string }  加载并渲染乐谱
     *     { type: 'close' }                         关闭播放器
     *     { type: 'theme', darkMode: boolean }      切换主题
     *   发送（本页 → 主应用）：
     *     { type: 'ready' }                         页面加载完成
     *     { type: 'closed' }                        播放器已关闭
     *     { type: 'error', message: string }        错误通知
     *     { type: 'state', playing, paused, ... }   播放状态变更
     */

    // ==== 广播频道 ====
    const channel = new BroadcastChannel('lunar-astral-music');

    // ==== 基础工具 ====
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);
    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const isBlackKey = m => { const p = ((m % 12) + 12) % 12; return [1, 3, 6, 8, 10].includes(p); };
    const pitchName = m => NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);

            g.gain.exponentialRampToValueAtTime(0.0001, p[2]);

        const env = ctx.createGain();
        out.connect(preLp); preLp.connect(bp); bp.connect(lp); lp.connect(env); env.connect(dest);
        const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = f;
        const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = f * 1.002;
        const g1 = ctx.createGain(); g1.gain.value = 0.40;
        const g2 = ctx.createGain(); g2.gain.value = 0.22;
        o1.connect(g1); o2.connect(g2); g1.connect(out); g2.connect(out);
        const vib = ctx.createOscillator(); vib.frequency.value = 5.0;
        const vg = ctx.createGain(); vg.gain.setValueAtTime(0, 0); vg.gain.linearRampToValueAtTime(6, 0.4);
        vib.connect(vg); vg.connect(o1.detune); vg.connect(o2.detune); vib.start(0);
        const n = ctx.createBufferSource(); n.buffer = makeNoiseBuffer(ctx, dur + 0.1); n.loop = true;
        const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 3000; nf.Q.value = 0.7;
        const ng = ctx.createGain(); ng.gain.value = 0.05;
        n.connect(nf); nf.connect(ng); ng.connect(out); n.start(0);
        env.gain.setValueAtTime(0.0001, 0);
        env.gain.linearRampToValueAtTime(0.8, 0.06);
        env.gain.setValueAtTime(0.72, Math.max(0.1, dur - 0.2));
        env.gain.linearRampToValueAtTime(0.0001, dur);
        [o1, o2].forEach(o => { o.start(0); o.stop(dur + 0.05); });
    }
    /* 尼龙吉他 —— 泛音按序衰减 + 拨弦瞬态 */
    function buildGuitar(ctx, dest, f, dur) {
        const out = ctx.createGain();
        const body = ctx.createBiquadFilter(); body.type = 'peaking'; body.frequency.value = 190; body.gain.value = 2.5; body.Q.value = 0.9;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6200; lp.Q.value = 0.4;
        out.connect(body); body.connect(lp); lp.connect(dest);
        const P = [[1, 1.00, 3.0], [2, 0.40, 1.5], [3, 0.19, 0.85], [4, 0.10, 0.5], [5, 0.05, 0.32], [6, 0.024, 0.2]];
        for (const p of P) {
            const o = ctx.createOscillator(); o.type = 'sine';
            o.frequency.value = f * p[0] * (1 + 0.00015 * p[0] * p[0]);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0001, 0);
            g.gain.exponentialRampToValueAtTime(p[1], 0.004);
            g.gain.exponentialRampToValueAtTime(0.0001, p[2]);
            o.connect(g); g.connect(out);
            o.start(0); o.stop(dur + 0.05);
        }
        pluckTransient(ctx, out, f, 0.22);
    }
    /* 8Bit 芯片 —— 方波脉冲 + 颤音 */
    function buildChip(ctx, dest, f, dur) {
        const out = ctx.createGain();
        const o1 = ctx.createOscillator(); o1.type = 'square'; o1.frequency.value = f;
        const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = f * 2;
        const g1 = ctx.createGain(); g1.gain.value = 0.6;
        const g2 = ctx.createGain(); g2.gain.value = 0.18;
        o1.connect(g1); o2.connect(g2); g1.connect(out); g2.connect(out);
        const vib = ctx.createOscillator(); vib.frequency.value = 6.5;
        const vg = ctx.createGain(); vg.gain.value = 3; vib.connect(vg); vg.connect(o1.detune); vg.connect(o2.detune); vib.start(0);
        const env = ctx.createGain();
        env.gain.setValueAtTime(0.0001, 0); env.gain.linearRampToValueAtTime(0.7, 0.005);
        env.gain.setValueAtTime(0.7, Math.max(0.02, dur - 0.06)); env.gain.linearRampToValueAtTime(0.0001, dur);
        out.connect(env); env.connect(dest);
        [o1, o2].forEach(o => { o.start(0); o.stop(dur + 0.05); });
    }
    /* 鼓组 —— 合成打击 */
    function renderDrum(buildFn, durSec, rate) {
        const ctx = new OfflineAudioContext(1, Math.ceil(durSec * rate), rate);
        buildFn(ctx, ctx.destination);
        return ctx.startRendering();
    }
    function buildKick(ctx, dest) {
        const o = ctx.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(160, 0); o.frequency.exponentialRampToValueAtTime(44, 0.1);
        const g = ctx.createGain(); g.gain.setValueAtTime(1.0, 0); g.gain.exponentialRampToValueAtTime(0.0001, 0.4);
        o.connect(g); g.connect(dest); o.start(0); o.stop(0.45);
        const n = ctx.createBufferSource(); n.buffer = makeNoiseBuffer(ctx, 0.02);
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4000;
        const ng = ctx.createGain(); ng.gain.setValueAtTime(0.35, 0); ng.gain.exponentialRampToValueAtTime(0.0001, 0.02);
        n.connect(hp); hp.connect(ng); ng.connect(dest); n.start(0);
    }
    function buildSnare(ctx, dest) {
        const n = ctx.createBufferSource(); n.buffer = makeNoiseBuffer(ctx, 0.3);
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 0.8;
        const g = ctx.createGain(); g.gain.setValueAtTime(0.9, 0); g.gain.exponentialRampToValueAtTime(0.0001, 0.2);
        n.connect(bp); bp.connect(g); g.connect(dest); n.start(0);
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 190;
        const og = ctx.createGain(); og.gain.setValueAtTime(0.7, 0); og.gain.exponentialRampToValueAtTime(0.0001, 0.1);
        o.connect(og); og.connect(dest); o.start(0); o.stop(0.12);
    }
    function buildClosedHat(ctx, dest) {
        const n = ctx.createBufferSource(); n.buffer = makeNoiseBuffer(ctx, 0.1);
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7600;
        const g = ctx.createGain(); g.gain.setValueAtTime(0.6, 0); g.gain.exponentialRampToValueAtTime(0.0001, 0.06);
        n.connect(hp); hp.connect(g); g.connect(dest); n.start(0);
    }
    function buildOpenHat(ctx, dest) {
        const n = ctx.createBufferSource(); n.buffer = makeNoiseBuffer(ctx, 0.7);
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6400;
        const g = ctx.createGain(); g.gain.setValueAtTime(0.55, 0); g.gain.exponentialRampToValueAtTime(0.0001, 0.55);
        n.connect(hp); hp.connect(g); g.connect(dest); n.start(0);
    }
    function buildTom(ctx, dest, hi) {
        const o = ctx.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(hi ? 210 : 150, 0); o.frequency.exponentialRampToValueAtTime(hi ? 90 : 70, 0.3);
        const g = ctx.createGain(); g.gain.setValueAtTime(0.9, 0); g.gain.exponentialRampToValueAtTime(0.0001, 0.4);
        o.connect(g); g.connect(dest); o.start(0); o.stop(0.45);
    }

    const SYNTH_BUILDERS = {
        piano: buildPiano, piano_stac: buildPiano, epiano: buildEPiano, epiano_bell: buildEPiano,
        harp: buildHarp, bass: buildBass, pad: buildPad,
        cello: buildCello, violin: buildViolin, flute: buildFlute,
        clarinet: buildClarinet, oboe: buildOboe, trumpet: buildTrumpet,
        sax: buildSax, sax_air: buildSax, guitar: buildGuitar, chip: buildChip,
    };

    /* 构建采样音色库（离线渲染，各基音一个样本） */
    async function buildSampleLibrary() {
        const rate = 44100;
        const jobs = [];
        for (const name in INSTRUMENTS) {
            const spec = INSTRUMENTS[name];
            if (spec.type === 'drums') continue;
            samples[name] = {};
            for (const b of spec.base) {
                jobs.push(renderSample(SYNTH_BUILDERS[name], b, spec.dur, rate).then(buf => { samples[name][b] = buf; }));
            }
        }
        drumBufs.kick = await renderDrum(buildKick, 0.6, rate);
        drumBufs.snare = await renderDrum(buildSnare, 0.5, rate);
        drumBufs.chat = await renderDrum(buildClosedHat, 0.3, rate);
        drumBufs.ohat = await renderDrum(buildOpenHat, 0.8, rate);
        drumBufs.tomLo = await renderDrum(ctx => buildTom(ctx, ctx.destination, false), 0.6, rate);
        drumBufs.tomHi = await renderDrum(ctx => buildTom(ctx, ctx.destination, true), 0.6, rate);
        await Promise.all(jobs);
        samplesReady = true;
    }

    /* ---------------- 混音器（效果链） ---------------- */
    function makeSaturationCurve(k) {
        if (k < 0.02) return null;
        const n = 1024, curve = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            const x = i / (n - 1) * 2 - 1;
            curve[i] = Math.tanh(k * x) / Math.tanh(k);
        }
        return curve;
    }
    /* 卷积混响 IR：15ms 预延迟 + 一阶低通去刺，温润不金属 */
    function makeIR(ctx, seconds, decay) {
        const rate = ctx.sampleRate, len = Math.floor(rate * seconds);
        const ir = ctx.createBuffer(2, len, rate);
        const preDelay = Math.floor(rate * 0.015);
        for (let c = 0; c < 2; c++) {
            const d = ir.getChannelData(c);
            let lp = 0;
            for (let i = 0; i < len; i++) {
                if (i < preDelay) { d[i] = 0; continue; }
                const white = Math.random() * 2 - 1;
                lp += 0.3 * (white - lp);
                const t = (i - preDelay) / (len - preDelay);
                d[i] = lp * Math.pow(1 - t, decay);
            }
        }
        return ir;
    }
    /* 磁带底噪循环 */
    function makeNoiseLoop(ctx) {
        const rate = ctx.sampleRate, len = rate * 2;
        const buf = ctx.createBuffer(2, len, rate);
        for (let c = 0; c < 2; c++) {
            const d = buf.getChannelData(c);
            let last = 0;
            for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = 0.98 * last + 0.02 * w; d[i] = last * 2.2; }
        }
        return buf;
    }
    function buildMixer(ctx, dest) {
        const m = {};
        m.masterIn = ctx.createGain(); m.masterIn.gain.value = 1;
        m.busDry = ctx.createGain(); m.busDry.gain.value = 1;
        m.busDry.connect(m.masterIn);
        m.reverbIn = ctx.createGain(); m.reverbIn.gain.value = 0;
        m.convolver = ctx.createConvolver(); m.convolver.buffer = makeIR(ctx, 2.8, 3.2);
        m.reverbReturn = ctx.createGain(); m.reverbReturn.gain.value = 1;
        m.reverbIn.connect(m.convolver); m.convolver.connect(m.reverbReturn); m.reverbReturn.connect(m.masterIn);
        m.delayIn = ctx.createGain(); m.delayIn.gain.value = 0;
        m.delay = ctx.createDelay(3); m.delay.delayTime.value = 0.45;
        m.delayFbLp = ctx.createBiquadFilter(); m.delayFbLp.type = 'lowpass'; m.delayFbLp.frequency.value = 2600;
        m.delayFb = ctx.createGain(); m.delayFb.gain.value = 0.4;
        m.delayWet = ctx.createGain(); m.delayWet.gain.value = 1;
        m.delayIn.connect(m.delay);
        m.delay.connect(m.delayFbLp); m.delayFbLp.connect(m.delayFb); m.delayFb.connect(m.delay);
        m.delay.connect(m.delayWet); m.delayWet.connect(m.masterIn);
        m.filter = ctx.createBiquadFilter(); m.filter.type = 'lowpass'; m.filter.frequency.value = 16000; m.filter.Q.value = 0.6;
        m.sat = ctx.createWaveShaper(); m.sat.curve = null; m.sat.oversample = '2x';
        m.trem = ctx.createGain(); m.trem.gain.value = 1;
        m.lfo = ctx.createOscillator(); m.lfo.frequency.value = 4.5;
        m.lfoGain = ctx.createGain(); m.lfoGain.gain.value = 0;
        m.lfo.connect(m.lfoGain); m.lfoGain.connect(m.trem.gain); m.lfo.start(0);
        m.comp = ctx.createDynamicsCompressor();
        m.comp.threshold.value = -18; m.comp.knee.value = 20; m.comp.ratio.value = 4; m.comp.attack.value = 0.003; m.comp.release.value = 0.25;
        m.master = ctx.createGain(); m.master.gain.value = 0.9;
        m.tape = ctx.createGain(); m.tape.gain.value = 0;
        m.tapeSrc = ctx.createBufferSource(); m.tapeSrc.buffer = makeNoiseLoop(ctx); m.tapeSrc.loop = true; m.tapeSrc.connect(m.tape); m.tapeSrc.start(0);
        m.tape.connect(m.master);
        m.masterIn.connect(m.filter); m.filter.connect(m.sat); m.sat.connect(m.trem);
        m.trem.connect(m.comp); m.comp.connect(m.master); m.master.connect(dest);
        return m;
    }
    const FX_PRESETS = {
        lofi:  { noise: 12, saturation: 28, filter: 8200, reverb: 32, compression: 30, delay: 14, tremolo: 6 },
        warm:  { noise: 8,  saturation: 22, filter: 6800, reverb: 46, compression: 26, delay: 12, tremolo: 4 },
        dream: { noise: 8,  saturation: 16, filter: 10000, reverb: 62, compression: 18, delay: 36, tremolo: 14 },
        clean: { noise: 2,  saturation: 5,  filter: 16000, reverb: 14, compression: 22, delay: 4,  tremolo: 0 },
        dark:  { noise: 20, saturation: 32, filter: 3600, reverb: 46, compression: 46, delay: 20, tremolo: 8 },
    };
    let fxState = { ...FX_PRESETS.lofi, master: 0.9 };

    function applyFx() {
        const m = Engine.mixer; if (!m || !Engine.ctx) return;
        const now = Engine.ctx.currentTime;
        m.filter.frequency.setTargetAtTime(fxState.filter, now, 0.03);
        m.sat.curve = makeSaturationCurve(fxState.saturation / 100 * 8);
        m.reverbIn.gain.setTargetAtTime(fxState.reverb / 100 * 0.85, now, 0.03);
        m.delayIn.gain.setTargetAtTime(fxState.delay / 100 * 0.7, now, 0.03);
        m.delay.delayTime.setTargetAtTime(60 / (state.bpm || 100) * 0.75, now, 0.03);
        m.comp.threshold.setTargetAtTime(-6 - (fxState.compression / 100) * 24, now, 0.03);
        m.comp.ratio.setTargetAtTime(1 + (fxState.compression / 100) * 9, now, 0.03);
        const depth = fxState.tremolo / 100 * 0.5;
        m.trem.gain.setTargetAtTime(1 - depth, now, 0.03);
        m.lfoGain.gain.setTargetAtTime(depth, now, 0.03);
        if (Engine.playing) m.tape.gain.setTargetAtTime(fxState.noise / 100 * 0.03, now, 0.03);
        m.master.gain.setTargetAtTime(fxState.master, now, 0.03);
    }

        bass: ['贝斯', 'bass', '低音提琴', 'double bass'],
        pad: ['铺底', '氛围', 'pad', '弦乐群', '弦乐', 'strings', '合成器垫'],
        cello: ['大提琴', 'cello', 'violoncello'],
        violin: ['小提琴', 'violin', 'fiddle', '中提琴', 'viola'],

    function matchInstrumentPreset(name) {
        if (!name) return 'piano';
        const n = name.toLowerCase().trim();
        for (const [key, kws] of Object.entries(INSTRUMENT_KEYWORDS)) {
            if (kws.some(kw => n.includes(kw) || kw.includes(n))) return key;
        }
        return 'piano';

    /* ---------------- 表达引擎 ---------------- */
    /* 为每个音符注入力度变化、时序偏移、运音法，消除"打点计数器"感 */
    const ExpressionEngine = {
        pseudoRandom(seed) {
            const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
            return x - Math.floor(x);
        },
        parseBeatsPerMeasure(meter) {
            if (!meter) return 4;
            const parts = meter.split('/');
            return parseInt(parts[0]) || 4;
        },
        getBeatPosition(timeSeconds, bpm, beatsPerMeasure) {
            const totalBeats = timeSeconds / (60 / bpm);
            return totalBeats % beatsPerMeasure;
        },
        getPhrasePosition(timeSeconds, bpm) {
            const phraseDuration = 8 * (60 / bpm);
            const pos = (timeSeconds % phraseDuration) / phraseDuration;
            return pos;
        },
        getVelocity(noteIndex, voiceId, beatPosition, phrasePosition, dynamics, presetKey) {
            const dynamicMap = { pp: 0.15, p: 0.30, mp: 0.45, mf: 0.60, f: 0.80, ff: 0.95 };
            let base = dynamicMap[dynamics] || 0.60;
            const beatNum = Math.floor(beatPosition);
            const beatsPerMeasure = this.parseBeatsPerMeasure(state.meter);
            if (beatNum === 0) base *= 1.10;
            else if (beatsPerMeasure === 4 && beatNum === 2) base *= 1.05;
            else if (beatsPerMeasure === 3 && beatNum === 1) base *= 1.03;
            const phraseCurve = Math.sin(phrasePosition * Math.PI);
            base *= 0.88 + phraseCurve * 0.20;
            const rand = this.pseudoRandom(noteIndex * 7 + voiceId * 31 + 13);
            base *= 1 + (rand - 0.5) * 0.24;
            return clamp(base, 0.05, 1.0);
        },
        getTimingOffset(noteIndex, voiceId, beatPosition) {
            const beatNum = Math.floor(beatPosition);
            const beatOffset = beatNum === 0 ? -0.012 : 0.005;
            const randOffset = (this.pseudoRandom(noteIndex * 11 + voiceId * 23 + 7) - 0.5) * 0.036;
            return beatOffset + randOffset;
        },
        getDurationMultiplier(articulation) {
            const map = { staccato: 0.35, staccatissimo: 0.20, tenuto: 1.05, accent: 0.80, legato: 0.95 };
            return map[articulation] || 0.85;
        },
        applyExpression(notes) {
            const bpm = state.bpm;
            const beatsPerMeasure = this.parseBeatsPerMeasure(state.meter);
            return notes.map((n, index) => {
                const beatPos = this.getBeatPosition(n.time, bpm, beatsPerMeasure);
                const phrasePos = this.getPhrasePosition(n.time, bpm);
                const velocity = this.getVelocity(index, n.voice, beatPos, phrasePos, n.dynamics, 'piano');
                const timingOffset = this.getTimingOffset(index, n.voice, beatPos);
                const durationMul = this.getDurationMultiplier(n.articulation);
                return {
                    ...n,
                    velocity,
                    time: Math.max(0, n.time + timingOffset),
                    duration: n.duration * durationMul,
                };
            });
        },
    };

    // ==== 通讯 ====
    function postToParent(msg) {
        channel.postMessage(msg);
    }

    // ==== 接收主应用指令 ====
    channel.onmessage = (event) => {
        const msg = event.data;
        if (!msg || !msg.type) return;
        switch (msg.type) {
            case 'render':
                renderMusicScore(msg.abcNotation);
                break;
            case 'play_audio':
                playRenderedAudio(msg.audioUrl, msg.fileName);
                break;
            case 'close':
                hideMusicModal();
                break;
            case 'theme':
                document.body.classList.toggle('dark-mode', !!msg.darkMode);
                break;
        }
    };

    // ==== 初始化 ====

    function initCanvas() {
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
