<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>点击监控 · 虚拟键盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg: #10141a;
            --panel: #1b212b;
            --panel-2: #222a36;
            --border: #2e3947;
            --ink: #e6edf5;
            --ink-dim: #7c8a9a;
            --ink-faint: #4c5a6b;
            --brand: #4b8bff;
            --hit: #ff6b4a;
            --ok: #2bd488;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 16px;
            gap: 12px;
        }

        /* ---------- 顶栏标题 ---------- */
        .brand {
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding: 2px 4px;
        }
        .brand .mark {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--ink);
        }
        .brand .sub {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--ink-faint);
            text-transform: uppercase;
        }

        /* ---------- 主体双栏 ---------- */
        .main {
            flex: 1;
            min-height: 0;
            display: flex;
            gap: 12px;
        }
        .col {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .col-log {
            flex: 1;
        }
        .col-ops {
            flex: 1.2;
        }

        .section-label {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--ink-dim);
            text-transform: uppercase;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        /* ---------- 随机点击按钮区 ---------- */
        .btn-cloud {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 10px;
            padding: 4px;
        }
        .btn-cloud::-webkit-scrollbar {
            width: 5px;
        }
        .btn-cloud::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        .tbtn {
            height: 46px;
            padding: 0 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel-2);
            color: var(--ink);
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform .1s ease, border-color .15s ease, background .15s ease;
        }
        .tbtn:hover {
            border-color: var(--ink-faint);
        }
        .tbtn.hit {
            border-color: var(--hit);
            background: rgba(255, 107, 74, 0.18);
            color: var(--hit);
        }
        .tbtn .val {
            font-size: 11px;
            color: var(--ink-faint);
            font-family: 'Consolas', 'Menlo', monospace;
        }

        /* ---------- 实时反馈面板 ---------- */
        .feedback {
            flex-shrink: 0;
            margin-top: 10px;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .fb-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            min-height: 20px;
        }
        .fb-tag {
            flex-shrink: 0;
            width: 52px;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--ink-faint);
        }
        .fb-type {
            flex-shrink: 0;
            padding: 1px 8px;
            border-radius: 999px;
            font-size: 11px;
            letter-spacing: 1px;
        }
        .fb-type.click { background: rgba(255, 107, 74, 0.2); color: var(--hit); }
        .fb-type.key   { background: rgba(75, 139, 255, 0.2);  color: var(--brand); }
        .fb-text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--ink);
        }
        .fb-hold {
            flex-shrink: 0;
            font-size: 12px;
            color: var(--ink-dim);
            font-family: 'Consolas', 'Menlo', monospace;
        }

        /* ---------- 虚拟键盘 ---------- */
        .kb {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: center;
        }
        .kb-row {
            display: flex;
            gap: 7px;
            justify-content: center;
        }
        .key {
            height: 52px;
            min-width: 52px;
            padding: 0 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel-2);
            color: var(--ink);
            font-size: 14px;
            font-family: 'Consolas', 'Menlo', monospace;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform .05s ease, background .1s ease, border-color .1s ease, color .1s ease;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
        }
        .key.hold {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
            transform: translateY(2px);
            box-shadow: none;
        }
        .key.animate {
            animation: keyflash .3s ease;
        }
        .key.wide { min-width: 92px; }
        .key.space { min-width: 260px; }
        @keyframes keyflash {
            0% { background: var(--brand); color: #fff; }
            100% { background: var(--panel-2); color: var(--ink); }
        }

        /* ---------- 事件日志 ---------- */
        .log-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .log-head .btn-clear {
            border: none;
            background: transparent;
            color: var(--ink-faint);
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 4px 6px;
        }
        .log-head .btn-clear:hover { color: var(--ink); }
        .log-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin-top: 6px;
        }
        .log-list::-webkit-scrollbar { width: 5px; }
        .log-list::-webkit-scrollbar-thumb { background: var(--border); }
        .log-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 6px 4px;
            border-bottom: 1px solid rgba(46, 57, 71, 0.4);
            font-size: 12px;
        }
        .log-item .t {
            flex-shrink: 0;
            color: var(--ink-faint);
            font-family: 'Consolas', 'Menlo', monospace;
            font-size: 11px;
        }
        .log-item .type {
            flex-shrink: 0;
            font-size: 11px;
            letter-spacing: 1px;
        }
        .log-item .type.click { color: var(--hit); }
        .log-item .type.key { color: var(--brand); }
        .log-item .msg { color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .log-empty { text-align: center; color: var(--ink-faint); padding: 18px 0; font-size: 12px; }

        /* 键鼠操作区内键盘区顶部间距 */
        .ops-kb-label {
            margin-top: 12px;
        }

        @media (max-width: 820px) {
            .main { flex-direction: column; }
            .col-log { flex: none; max-height: 34vh; }
            .col-ops { flex: 1; }
            .key.space { min-width: 160px; }
        }
    </style>
</head>
<body>

<div class="app">
    <header class="brand">
        <span class="mark">点击监控</span>
        <span class="sub">Click Monitor · Virtual Keyboard</span>
    </header>

    <div class="main">
        <!-- 左栏：事件日志 + 状态反馈 -->
        <section class="col col-log">
            <div class="log-head">
                <span class="section-label" style="margin:0;">事件日志 · 状态显示</span>
                <button id="clearLog" class="btn-clear">清空</button>
            </div>
            <div class="log-list" id="logList"></div>
            <div class="feedback">
                <div class="fb-row">
                    <span class="fb-tag">点击反馈</span>
                    <span class="fb-type click" id="fbClickType">CLICK</span>
                    <span class="fb-text" id="fbClickText">尚未收到点击</span>
                </div>
                <div class="fb-row">
                    <span class="fb-tag">键盘反馈</span>
                    <span class="fb-type key" id="fbKeyType">KEY</span>
                    <span class="fb-text" id="fbKeyText">尚未收到按键</span>
                    <span class="fb-hold" id="fbKeyHold">—</span>
                </div>
            </div>
        </section>

        <!-- 右栏：键鼠操作区（随机点击按钮 + 虚拟键盘） -->
        <section class="col col-ops">
            <div class="section-label">可点击按钮 · 随机内容</div>
            <div class="btn-cloud" id="btnCloud"></div>
            <div class="section-label ops-kb-label">虚拟键盘 · 响应并显示按键</div>
            <div class="kb" id="kb"></div>
        </section>
    </div>
</div>

<script>
    // ==========================================================
    // 1. 随机数据源（按钮 / 文案）
    // ==========================================================
    // 随机按钮标识：字母 + 序号（保证 capture_page 能稳定给出 selector: nth-of-type）
    var BUTTON_POOL = [
        '苹果', '香蕉', '橙子', '草莓', '葡萄', '西瓜', '菠萝', '芒果',
        '晴天', '雨天', '多云', '微风', '雷鸣', '雪花', '彩虹', '极光',
        '钢琴', '吉他', '小提琴', '大提琴', '竖琴', '口琴', '长笛',
        '北方', '南方', '东方', '西方', '中原', '边疆', '海角', '天涯',
        '清晨', '午间', '黄昏', '深夜', '黎明', '破晓', '入夜', '子时'
    ];
    // 工具型按钮（模拟快捷键/操作）
    var TOOL_BUTTONS = [
        { label: '回车', value: 'Enter' },
        { label: '空格', value: 'Space' },
        { label: '刷新', value: 'F5' },
        { label: '音量+', value: 'AudioUp' },
        { label: '音量-', value: 'AudioDown' },
        { label: '主屏幕', value: 'Home' }
    ];

    // ==========================================================
    // 2. 全局元素引用
    // ==========================================================
    var btnCloud = document.getElementById('btnCloud');
    var kbEl = document.getElementById('kb');
    var logList = document.getElementById('logList');
    var fbClickText = document.getElementById('fbClickText');
    var fbKeyText = document.getElementById('fbKeyText');
    var fbKeyHold = document.getElementById('fbKeyHold');

    // ==========================================================
    // 3. 随机按钮云：生成多个可点击按钮（含随机文字取值）
    // ==========================================================
    // 每个按钮带一个随机数值（0-999），用于观察 AI 点击后能否读到取值
    function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    function shuffle(a) {
        var arr = a.slice();
        for (var i = arr.length - 1; i > 0; i--) {
            var j = randInt(0, i);
            var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
    }

    function buildButtons() {
        var cloud = shuffle(BUTTON_POOL);       // 打乱顺序，保证每次加载布局不同
        var html = '';
        // 工具型按钮单独成组 + 随机文字按钮（共约 24~28 个）
        TOOL_BUTTONS.forEach(function (tb) {
            html += '<button class="tbtn" data-key="' + tb.value + '">' + tb.label + '<span class="val">' + tb.value + '</span></button>';
        });
        for (var i = 0; i < 22 && cloud.length > 0; i++) {
            var label = cloud.shift();
            var val = randInt(0, 999);
            html += '<button class="tbtn" data-key="' + val + '">' + label + '<span class="val">#' + val + '</span></button>';
        }
        btnCloud.innerHTML = html;
        // 为每个按钮绑定点击高亮
        Array.prototype.forEach.call(btnCloud.querySelectorAll('.tbtn'), function (btn) {
            btn.addEventListener('mousedown', function (e) { onButtonPress(btn, e); }, true);
            btn.addEventListener('click', function (e) { onButtonClick(btn, e); }, true);
        });
    }

    // 按下即高亮（视觉反馈，先于 click 触发）
    function onButtonPress(btn) {
        highlightButton(btn, true);
    }
    // 点击完成：更新反馈面板 + 日志
    function onButtonClick(btn) {
        highlightButton(btn, true);
        var label = btn.childNodes[0].textContent;           // 按钮主文字
        var value = btn.getAttribute('data-key');            // 按钮取值
        var info = '点中了按钮「' + label + '」（值 ' + value + '）';
        setClickFeedback(info);
        pushLog('click', info);
        setTimeout(function () { highlightButton(btn, false); }, 420);
    }
    function highlightButton(btn, on) {
        btn.classList.toggle('hit', !!on);
    }

    // ==========================================================
    // 4. 虚拟键盘：渲染标准键盘布局（覆盖 Mini-LTP 常用按键）
    // ==========================================================
    var KB_ROWS = [
        [['Esc'], ['F1'], ['F2'], ['F3'], ['F4'], ['F5'], ['F6'], ['F7'], ['F8']],
        [['`'], ['1'], ['2'], ['3'], ['4'], ['5'], ['6'], ['7'], ['8'], ['9'], ['0'], ['-'], ['='], ['Backspace', 'Backspace', 'wide']],
        [['Tab', 'Tab', 'wide'], ['Q'], ['W'], ['E'], ['R'], ['T'], ['Y'], ['U'], ['I'], ['O'], ['P'], ['['], [']'], ['\\']],
        [['Caps', 'CapsLock', 'wide'], ['A'], ['S'], ['D'], ['F'], ['G'], ['H'], ['J'], ['K'], ['L'], [';'], ["'"], ['Enter', 'Enter', 'wide']],
        [['Shift', 'Shift', 'wide'], ['Z'], ['X'], ['C'], ['V'], ['B'], ['N'], ['M'], [','], ['.'], ['/'], ['Shift', 'Shift', 'wide']],
        [['Ctrl'], ['Alt'], [' ', ' ', 'space'], ['Alt'], ['Home'], ['End'], ['←', 'ArrowLeft'], ['↑', 'ArrowUp'], ['↓', 'ArrowDown'], ['→', 'ArrowRight']]
    ];

    // 渲染键盘，映射 key（显示名）→ code（事件匹配键）
    var keyMap = {}; // code -> element
    function buildKeyboard() {
        KB_ROWS.forEach(function (row) {
            var rdiv = document.createElement('div');
            rdiv.className = 'kb-row';
            row.forEach(function (spec) {
                var label = spec[0];
                var code = spec[1] !== undefined ? spec[1] : spec[0];
                var extra = spec[2] || '';
                var k = document.createElement('div');
                k.className = 'key' + (extra ? ' ' + extra : '');
                k.textContent = label;
                k.setAttribute('data-code', code);
                // 组合键时的修饰键单独存（Ctrl/Alt/Shift）
                k.setAttribute('data-mod', (code === 'Control' || code === 'Alt' || code === 'Shift') ? '1' : '0');
                keyMap[code] = k;
                rdiv.appendChild(k);
            });
            kbEl.appendChild(rdiv);
        });
        // 常显分号握柄（美化，不影响功能）
    }

    // 把 KeyboardEvent.code 归一到 keyMap 的键名（如 e.code='KeyA' → surface 'A' 不易直接匹配）
    // 因此我们用 e.key 匹配显示名，用 e.code 匹配映射；双向处理：
    //   优先用 code 查 keyMap（标准名），失败再用 key 查（显示标签）
    function kbFind(code, key) {
        if (code && keyMap[code]) return keyMap[code];
        if (key) {
            var alias = {
                'Enter': 'Enter', 'Escape': 'Esc', ' ': ' ', 'Backspace': 'Backspace',
                'ArrowLeft': 'ArrowLeft', 'ArrowUp': 'ArrowUp', 'ArrowRight': 'ArrowRight', 'ArrowDown': 'ArrowDown',
                'Home': 'Home', 'End': 'End', 'Tab': 'Tab', 'Control': 'Ctrl', 'Alt': 'Alt', 'Shift': 'Shift',
                'CapsLock': 'Caps', 'F5': 'F5'
            };
            var target = alias[key] !== undefined ? alias[key] : key;
            // 通过显示文本反查（处理大小写）
            var found = null;
            Object.keys(keyMap).forEach(function (c) {
                var el = keyMap[c];
                if (el.textContent === target || el.textContent === key.toUpperCase()) { found = el; }
            });
            return found;
        }
        return null;
    }

    // ==========================================================
    // 5. 键盘事件监听：keydown 高亮 + 计时，keyup 显示按住时长
    // ==========================================================
    var pressStart = {}; // code -> { t, keyEl }
    var holdTimer = null;

    function currentHoldSeconds(code) {
        var s = pressStart[code];
        if (!s) return 0;
        return Math.round((Date.now() - s.t) / 100) / 10; // 保留 1 位小数
    }

    function updateHoldDisplay() {
        // 更新当前仍在按住的键的"按住秒数"
        var active = Object.keys(pressStart);
        if (active.length === 0) {
            fbKeyHold.textContent = '—';
            return;
        }
        var parts = active.map(function (code) {
            var el = keyMap[code];
            var name = el ? el.textContent : code;
            return name + ' ' + currentHoldSeconds(code) + 's';
        });
        fbKeyHold.textContent = parts.join('  ');
    }

    document.addEventListener('keydown', function (e) {
        var el = kbFind(e.code, e.key);
        if (el) {
            el.classList.add('hold');
            // 记录按下起点
            if (!pressStart[e.code]) {
                pressStart[e.code] = { t: Date.now(), keyEl: el };
            }
            // 若没有 holdTimer，则每 100ms 刷新一次实时按住秒数
            if (!holdTimer) {
                holdTimer = setInterval(updateHoldDisplay, 100);
            }
        }
        setKeyFeedback('按住 ' + (e.key || e.code) + getMods(e), '按住中');
        // 立即刷新一次显示
        updateHoldDisplay();
    });

    document.addEventListener('keyup', function (e) {
        var el = kbFind(e.code, e.key);
        var code = e.code;
        var heldSeconds = 0;
        if (pressStart[code]) {
            heldSeconds = Math.round((Date.now() - pressStart[code].t) / 100) / 10;
            delete pressStart[code];
        }
        if (el) {
            el.classList.remove('hold');
            el.classList.add('animate');
            setTimeout(function () { el.classList.remove('animate'); }, 310);
        }
        // 显示最终按住时长（含语义：瞬时≈0 / 短按≈1s / 长按≈10s）
        setKeyFeedback(
            '按键 ' + (e.key || e.code) + getMods(e) + ' 松开（按住 ' + heldSeconds.toFixed(1) + ' 秒）',
            '按住 ' + heldSeconds.toFixed(1) + 's'
        );
        pushLog('key', '按键 ' + (e.key || e.code) + getMods(e) + ' 按住 ' + heldSeconds.toFixed(1) + 's');
        // 松开后继续刷新剩余按键的按住时间
        updateHoldDisplay();
        if (Object.keys(pressStart).length === 0 && holdTimer) {
            clearInterval(holdTimer);
            holdTimer = null;
        }
    });

    // 修饰键描述（如 "+Ctrl+Shift"）
    function getMods(e) {
        var m = [];
        if (e.ctrlKey) m.push('Ctrl');
        if (e.altKey) m.push('Alt');
        if (e.shiftKey) m.push('Shift');
        if (e.metaKey) m.push('Win');
        return m.length ? (' + ' + m.join('+')) : '';
    }

    // ==========================================================
    // 6. 反馈面板 & 日志
    // ==========================================================
    function setClickFeedback(msg) {
        fbClickText.textContent = msg;
        fbClickText.parentElement.style.borderLeft = '3px solid var(--hit)';
        fbClickText.parentElement.style.paddingLeft = '8px';
        setTimeout(function () {
            if (fbClickText.parentElement) fbClickText.parentElement.style.borderLeft = 'none';
        }, 1200);
    }
    function setKeyFeedback(msg, hold) {
        fbKeyText.textContent = msg;
        if (hold) fbKeyHold.textContent = hold; else updateHoldDisplay();
    }

    function pushLog(type, msg) {
        var empty = logList.querySelector('.log-empty');
        if (empty) empty.remove();
        var item = document.createElement('div');
        item.className = 'log-item';
        var now = new Date();
        var pad = function (n) { return String(n).padStart(2, '0'); };
        var t = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds()) + '.' + String(now.getMilliseconds()).padStart(3, '0');
        item.innerHTML = '<span class="t">' + t + '</span><span class="type ' + type + '">' + (type === 'click' ? '点击' : '按键') + '</span><span class="msg"></span>';
        item.querySelector('.msg').textContent = msg;
        logList.insertBefore(item, logList.firstChild);
        // 最多保留 60 条
        while (logList.children.length > 60) logList.removeChild(logList.lastChild);
    }

    // 清空日志
    document.getElementById('clearLog').addEventListener('click', function () {
        logList.innerHTML = '<div class="log-empty">暂无事件</div>';
        // 同时清空正在计时的按键（若存在）
        Object.keys(pressStart).forEach(function (code) {
            var el = keyMap[code];
            if (el) el.classList.remove('hold');
            delete pressStart[code];
        });
        if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
        updateHoldDisplay();
        fbClickText.textContent = '尚未收到点击';
        fbKeyText.textContent = '尚未收到按键';
    });

    // ==========================================================
    // 7. 初始化
    // ==========================================================
    function init() {
        buildButtons();
        buildKeyboard();
        logList.innerHTML = '<div class="log-empty">暂无事件 · 请点击按钮或按键盘测试</div>';
