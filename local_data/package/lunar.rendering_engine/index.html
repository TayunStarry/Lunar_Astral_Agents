<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Renderer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        #render-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* 调试覆盖层（按 Z 切换显示） */
        #debug-overlay {
            position: fixed;
            top: 8px;
            left: 8px;
            padding: 6px 10px;
            font-size: 12px;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            color: rgba(244, 244, 245, 0.9);
            background: rgba(38, 38, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            pointer-events: none;
            z-index: 10;
            white-space: pre;
            display: none;
        }

        body.show-debug #debug-overlay {
            display: block;
        }

        /* MoLang 监控模态框（按 M 切换显示） */
        #molang-monitor {
            position: fixed;
            top: 8px;
            right: 8px;
            width: 380px; max-width: 90vw; max-height: 80vh;
            padding: 14px;
            font-size: 12px;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            color: rgba(244, 244, 245, 0.95);
            background: rgba(38, 38, 42, 0.88);
            border: 1px solid rgba(157, 107, 255, 0.4);
            border-radius: 12px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 20;
            display: none;
            overflow: hidden;
            flex-direction: column;
        }
        body.show-molang #molang-monitor { display: flex; }
        #molang-monitor .mm-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        #molang-monitor .mm-title { font-size: 13px; font-weight: 600; color: #9d6bff; }
        #molang-monitor .mm-hint { font-size: 10px; opacity: 0.6; }
        #molang-monitor .mm-body { overflow-y: auto; flex: 1; }
        #molang-monitor table { width: 100%; border-collapse: collapse; }
        #molang-monitor th, #molang-monitor td {
            text-align: left; padding: 4px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        #molang-monitor th { font-size: 10px; opacity: 0.5; font-weight: normal; }
        #molang-monitor td.mm-key { color: #9d6bff; }
        #molang-monitor td.mm-age { text-align: right; opacity: 0.6; }
        #molang-monitor .mm-empty { text-align: center; padding: 20px; opacity: 0.4; }

        /* 加载提示 */
        #loading-mask {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(244, 244, 245, 0.85);
            font-size: 14px;
            background: rgba(15, 17, 24, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 5;
            transition: opacity 0.4s ease;
        }

        #loading-mask.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-mask .spinner {
            margin-right: 10px;
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #9d6bff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 指南针覆盖层（左下角，移动时显示） */
        #compass-container {
            position: fixed;
            bottom: 16px;
            left: 16px;
            width: 64px;
            height: 64px;
            pointer-events: none;
            z-index: 15;
            display: none;
        }
        #compass-container.visible {
            display: block;
        }
        #compass-container svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body>
    <!-- 渲染画布 -->
    <canvas id="render-canvas" tabindex="0"></canvas>

    <!-- 调试覆盖层（按 Z 切换显示） -->
    <div id="debug-overlay">引擎启动中...</div>

    <!-- MoLang 监控模态框（按 M 切换显示） -->
    <div id="molang-monitor">
        <div class="mm-header">
            <span class="mm-title">MoLang 变量监控（30秒窗口）</span>
            <span class="mm-hint">按 M 关闭</span>
        </div>
        <div class="mm-body" id="mm-body">
            <div class="mm-empty">等待数据...</div>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div id="loading-mask">
        <span class="spinner"></span>
        <span>正在加载引擎资源...</span>
    </div>

    <!-- 指南针（左下角，角色移动时显示方向） -->
    <div id="compass-container">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="46" fill="rgba(38,38,42,0.75)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
            <text id="compass-n" x="50" y="16" text-anchor="middle" fill="rgba(244,244,245,0.9)" font-size="10" font-weight="600" font-family="sans-serif">N</text>
            <text id="compass-s" x="50" y="94" text-anchor="middle" fill="rgba(244,244,245,0.5)" font-size="10" font-family="sans-serif">S</text>
            <text id="compass-e" x="90" y="54" text-anchor="middle" fill="rgba(244,244,245,0.5)" font-size="10" font-family="sans-serif">E</text>
            <text id="compass-w" x="10" y="54" text-anchor="middle" fill="rgba(244,244,245,0.5)" font-size="10" font-family="sans-serif">W</text>
            <g id="compass-arrow" transform="rotate(0, 50, 50)">
                <polygon points="50,22 46,50 54,50" fill="rgba(157,107,255,0.9)"/>
                <polygon points="50,78 46,50 54,50" fill="rgba(244,244,245,0.3)"/>
            </g>
        </svg>
    </div>

    <!-- 引擎入口（ES Module） -->
    <script src="/file/read/package/ws_bridge.js"></script>
    <script type="module" src="./engine.js"></script>
</body>
</html>
