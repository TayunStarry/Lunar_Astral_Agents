<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 星月智能 』LTP9 引擎测试</title>
    <!-- 标准依赖 -->
    <link rel="stylesheet" href="/file/read/package/standard_dependency/styles.css">
    <script src="/file/read/package/standard_dependency/script.js"></script>
    <!-- 项目私有样式 -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-layer"></div>
    <div class="glass-effect"></div>

    <div class="app">
        <!-- ===== 顶部工具栏 ===== -->
        <header class="topbar">
            <div class="brand">
                <i class="fas fa-project-diagram"></i>
                <span>LTP9 引擎可视化测试</span>
            </div>
            <div class="ws-state" id="wsState">
                <span class="status-dot" id="wsDot"></span>
                <span id="wsText">未连接</span>
            </div>
            <div class="top-actions">
                <button class="btn-primary" id="runBtn" title="按拓扑顺序运行全部节点">
                    <i class="fas fa-play"></i> 运行全部
                </button>
                <button class="btn-ghost" id="demoBtn" title="载入覆盖各能力的示例蓝图">
                    <i class="fas fa-flask"></i> 载入示例
                </button>
                <button class="btn-ghost" id="saveBtn" title="保存画布到本地">
                    <i class="fas fa-save"></i>
                </button>
                <button class="btn-ghost" id="loadBtn" title="加载已保存的画布">
                    <i class="fas fa-folder-open"></i>
                </button>
                <button class="btn-ghost" id="clearBtn" title="清空画布">
                    <i class="fas fa-trash-alt"></i>
                </button>
                <button class="btn-ghost" id="reconnectBtn" title="重连引擎">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </header>

        <!-- ===== 主画布区 ===== -->
        <div class="main">
            <!-- ===== 中央画布 ===== -->
            <main class="canvas-wrap">
                <div class="canvas" id="canvas">
                    <div class="canvas-hint" id="canvasHint">
                        点击左下角「节点模块」添加节点；从节点下方输出端口拖到目标上方输入端口建立连线<br>
                        <span>点击节点编辑参数；时钟线决定执行顺序；双击连线删除</span>
                    </div>
                    <svg class="links-svg" id="linksSvg"></svg>
                    <div class="nodes-layer" id="nodesLayer"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- ===== 节点参数 / 详情 浮窗（可拖动，点外不关闭，仅一个） ===== -->
    <div class="param-pop" id="modal">
        <div class="modal-top drag-handle" id="modalTop"></div>
        <div class="modal-body" id="modalBody"></div>
    </div>

    <!-- ===== 悬浮日志按钮（右下角，不占空间；有新信息时高亮闪烁） ===== -->
    <button class="log-fab" id="logFab" title="引擎日志（有新信息时高亮闪烁）">
        <i class="fas fa-comments"></i>
        <span class="log-fab-badge" id="logCount">0</span>
    </button>

    <!-- ===== 引擎日志悬浮窗 ===== -->
    <div class="message-pop" id="logModal">
        <div class="pop-head drag-handle">
            <i class="fas fa-comments"></i> 引擎日志
            <button class="btn-ghost btn-mini" id="clearLogBtn" title="清空日志">
                <i class="fas fa-trash-alt"></i>
            </button>
            <button class="btn-ghost btn-mini" id="closeLogBtn" title="关闭日志">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="pop-tools">
            <div class="log-filters" id="logFilters">
                <button class="filter-chip active" data-filter="all">全部</button>
                <button class="filter-chip" data-filter="send">发送</button>
                <button class="filter-chip" data-filter="recv">回执</button>
                <button class="filter-chip" data-filter="error">错误</button>
            </div>
        </div>
        <div class="pop-body" id="logList">
            <div class="empty-tip">暂无日志</div>
        </div>
    </div>

    <!-- ===== 节点模块按钮（左下角，圆形） ===== -->
    <button class="node-fab" id="nodeFab" title="节点模块：分类选择节点并加入画布">
        <i class="fas fa-shapes"></i>
    </button>

    <!-- ===== 节点模块悬浮窗（按类型/功能分页） ===== -->
    <div class="node-modal" id="nodeModal">
        <div class="node-modal-head drag-handle">
            <i class="fas fa-shapes"></i> 节点模块
            <button class="btn-ghost btn-mini" id="nodeClose" title="关闭">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="node-modal-tabs" id="nodeTabs"></div>
        <div class="node-modal-body" id="nodeContent"></div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script src="script.js"></script>
</body>

</html>
