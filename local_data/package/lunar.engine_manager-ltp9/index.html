<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 星月智能 』LTP9 引擎</title>
    <!-- 标准依赖 -->
    <link rel="stylesheet" href="/file/read/package/standard_dependency/styles.css">
    <script src="/file/read/package/standard_dependency/script.js"></script>
    <!-- 项目私有样式（按职能拆分） -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/canvas.css">
    <link rel="stylesheet" href="css/modal.css">
</head>

<body>
    <div class="background-layer"></div>
    <div class="glass-effect"></div>

    <div class="app">
        <!-- ===== 顶部工具栏 ===== -->
        <header class="topbar">
            <div class="brand">
                <i class="fas fa-project-diagram"></i>
                <span>LTP9 引擎</span>
            </div>
            <div class="ws-state" id="wsState">
                <span class="status-dot" id="wsDot"></span>
                <span id="wsText">未连接</span>
            </div>
            <div class="top-actions">
                <button class="btn-primary" id="runBtn" title="按拓扑顺序运行全部节点">
                    <i class="fas fa-play"></i> 运行全部
                </button>
                <button class="btn-ghost" id="demoBtn" title="载入覆盖各能力的示例蓝图">
                    <i class="fas fa-flask"></i> 载入示例
                </button>
                <button class="btn-ghost" id="saveBtn" title="保存画布到本地">
                    <i class="fas fa-save"></i>
                </button>
                <button class="btn-ghost" id="loadBtn" title="加载已保存的画布">
                    <i class="fas fa-folder-open"></i>
                </button>
                <button class="btn-ghost" id="clearBtn" title="清空画布">
                    <i class="fas fa-trash-alt"></i>
                </button>
                <button class="btn-ghost" id="compositeBtn" title="封装复合节点：Ctrl+点击 多选节点后，打包为一个复合节点">
                    <i class="fas fa-object-group"></i> 封装
                </button>
                <button class="btn-ghost" id="reconnectBtn" title="重连引擎">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </header>

        <!-- ===== 主画布区：左右侧边栏 + 中央画布 ===== -->
        <div class="main">
            <!-- ===== 左侧边栏：节点模块（与引擎日志互斥，由右侧按钮控制折叠/展开，默认收起） ===== -->
            <aside class="sidebar sidebar-left" id="nodeSidebar">
                <div class="sidebar-panel">
                    <div class="sidebar-head">
                        <i class="fas fa-shapes"></i> 节点模块
                    </div>
                    <div class="sidebar-tabs" id="nodeTabs"></div>
                    <div class="sidebar-body" id="nodeContent"></div>
                </div>
            </aside>

            <!-- ===== 左侧边栏：引擎日志（与节点模块互斥，由右侧按钮控制折叠/展开，默认收起） ===== -->
            <aside class="sidebar sidebar-log" id="logSidebar">
                <div class="sidebar-panel">
                    <div class="sidebar-head">
                        <i class="fas fa-comments"></i> 引擎日志
                    </div>
                    <div class="sidebar-tools">
                        <div class="log-filters" id="logFilters">
                            <button class="filter-chip active" data-filter="all">全部</button>
                            <button class="filter-chip" data-filter="send">发送</button>
                            <button class="filter-chip" data-filter="recv">回执</button>
                            <button class="filter-chip" data-filter="error">错误</button>
                            <!-- 清空按钮不用 filter-chip 类：logFilters 的点击委托会按 data-filter 切换筛选 -->
                            <button class="btn-ghost btn-mini" id="clearLogBtn" title="清空日志">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                    <div class="sidebar-body" id="logList">
                        <div class="empty-tip">暂无日志</div>
                    </div>
                </div>
            </aside>

            <!-- ===== 中央画布 ===== -->
            <main class="canvas-wrap">
                <div class="canvas" id="canvas">
                    <div class="canvas-hint" id="canvasHint">
                        从左侧「节点模块」拖拽节点放入画布；从节点下方输出端口拖到目标上方输入端口建立连线<br>
                        <span>点击节点编辑参数；时钟线传播激活（分支并行独立执行）；双击连线删除</span>
                    </div>
                    <svg class="links-svg" id="linksSvg"></svg>
                    <div class="nodes-layer" id="nodesLayer"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- ===== 节点参数 / 详情 浮窗（可拖动，点外不关闭，仅一个） ===== -->
    <div class="param-pop" id="modal">
        <div class="modal-top drag-handle" id="modalTop"></div>
        <div class="modal-body" id="modalBody"></div>
    </div>

    <!-- ===== 右侧纵向按钮组：引擎日志（上）/ 节点模块（下） ===== -->
    <div class="fab-col">
        <button class="log-fab" id="logFab" title="引擎日志（有新信息时高亮闪烁）">
            <i class="fas fa-comments"></i>
            <span class="log-fab-badge" id="logCount">0</span>
        </button>
        <button class="node-fab" id="nodeFab" title="节点模块：分类选择节点并加入画布">
            <i class="fas fa-shapes"></i>
        </button>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <!-- 脚本按职能拆分，加载顺序即依赖顺序；均为经典脚本共享全局作用域 -->
    <script src="js/core.js"></script>
    <script src="js/node-types.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/log.js"></script>
    <script src="js/render.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/envelope.js"></script>
    <script src="js/image-confusion.js"></script>
    <script src="js/audio-equalizer.js"></script>
    <script src="js/execute.js"></script>
    <script src="js/persistence.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
