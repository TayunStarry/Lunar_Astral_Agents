<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 星月智能 』元素操纵</title>
    <link rel="stylesheet" href="/file/read/package/standard_dependency/styles.css">
    <script src="/file/read/package/standard_dependency/script.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255,255,255,0.28);
            --glass-border: rgba(255,255,255,0.35);
            --glass-blur: 18px;
            --radius-md: 0.75rem;
            --text-primary: rgba(15,30,15,1);
            --text-secondary: rgba(80,80,80,1);
            --accent: #9d6bff;
            --success: #20c997;
            --danger: #dc3545;
            --warning: #fbbf24;
            --transition: all 0.45s ease;
        }
        .dark-mode {
            --text-primary: rgba(244,244,245,1);
            --text-secondary: rgba(180,180,180,1);
            --glass-bg: rgba(38,38,42,0.82);
            --glass-border: rgba(80,80,80,0.6);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: transparent;
            font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            font-size: 13px; color: var(--text-primary);
            overflow-y: auto; overflow-x: hidden;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar { display: none; }

        .panel { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .panel-title {
            font-size: 14px; font-weight: 600;
            display: flex; align-items: center; gap: 6px;
            padding-bottom: 8px; border-bottom: 1px solid var(--glass-border);
        }
        .panel-title i { color: var(--accent); }
        .panel-title .badge {
            margin-left: auto; font-size: 11px; padding: 2px 8px;
            background: rgba(157,107,255,0.15); border-radius: 10px;
            color: var(--accent); font-weight: 500;
        }

        .glass-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-md); padding: 10px 12px;
            transition: var(--transition);
        }
        .card-title {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; color: var(--text-secondary);
            margin-bottom: 8px; padding-bottom: 6px;
            border-bottom: 1px dashed var(--glass-border);
        }
        .card-title i { color: var(--accent); }
        .card-title .card-actions { margin-left: auto; display: flex; gap: 4px; }

        .field { margin-bottom: 8px; }
        .field:last-child { margin-bottom: 0; }
        .field-label {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;
        }
        .field-value { color: var(--accent); font-weight: 600; font-family: 'SF Mono','Consolas',monospace; }

        select, input[type="text"], input[type="number"] {
            width: 100%; padding: 6px 8px;
            background: rgba(255,255,255,0.15);
            border: 1px solid var(--glass-border);
            border-radius: 6px; color: var(--text-primary);
            font-size: 12px; outline: none;
            font-family: inherit;
        }
        .dark-mode select, .dark-mode input[type="text"], .dark-mode input[type="number"] {
            background: rgba(20,20,24,0.4);
        }
        select:focus, input[type="text"]:focus, input[type="number"]:focus { border-color: var(--accent); }
        input[type="number"] { font-family: 'SF Mono','Consolas',monospace; text-align: center; }
        input[type="number"]::-webkit-inner-spin-button { display: none; }

        input[type="range"] {
            width: 100%; height: 4px; background: rgba(157,107,255,0.2);
            border-radius: 2px; appearance: none; -webkit-appearance: none; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none; -webkit-appearance: none;
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); cursor: pointer; border: 2px solid #fff;
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); cursor: pointer; border: 2px solid #fff;
        }

        input[type="color"] {
            width: 32px; height: 24px; padding: 0;
            border: 1px solid var(--glass-border); border-radius: 6px;
            cursor: pointer; background: transparent;
        }

        .coord-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .coord-field { display: flex; flex-direction: column; gap: 3px; }
        .coord-label { font-size: 11px; text-align: center; font-weight: 600; }
        .coord-label.x { color: #dc3545; }
        .coord-label.y { color: #20c997; }
        .coord-label.z { color: #6c9bcf; }

        .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn {
            flex: 1; min-width: 60px; padding: 6px 10px;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: var(--radius-md); color: var(--text-primary);
            font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 4px;
            transition: var(--transition);
            backdrop-filter: blur(var(--glass-blur));
        }
        .btn:hover { background: rgba(157,107,255,0.15); border-color: var(--accent); }
        .btn.btn-primary { background: rgba(157,107,255,0.25); border-color: var(--accent); color: var(--accent); }
        .btn.btn-success { background: rgba(32,201,151,0.2); border-color: var(--success); color: var(--success); }
        .btn.btn-warn { background: rgba(251,191,36,0.2); border-color: var(--warning); color: var(--warning); }
        .btn.btn-danger { background: rgba(220,53,69,0.2); border-color: var(--danger); color: var(--danger); }
        .btn.btn-icon { flex: 0 0 auto; min-width: 28px; padding: 4px 8px; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .prim-list, .compound-list { max-height: 220px; overflow-y: auto; scrollbar-width: none; }
        .prim-list::-webkit-scrollbar, .compound-list::-webkit-scrollbar { display: none; }
        .list-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 8px; margin-bottom: 4px;
            border-radius: 6px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.1);
            font-size: 12px; transition: var(--transition);
        }
        .dark-mode .list-item { background: rgba(255,255,255,0.04); }
        .list-item:hover { background: rgba(157,107,255,0.1); border-color: var(--accent); }
        .list-item.selected { background: rgba(157,107,255,0.18); border-color: var(--accent); }
        .list-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .list-item .meta { font-size: 10px; opacity: 0.6; }
        .list-item .ops { display: flex; gap: 2px; }
        .list-item .ops button {
            background: transparent; border: none; cursor: pointer;
            padding: 2px 4px; font-size: 11px; color: var(--text-secondary);
            border-radius: 4px;
        }
        .list-item .ops button:hover { color: var(--accent); background: rgba(157,107,255,0.15); }
        .list-item .ops button.danger:hover { color: var(--danger); background: rgba(220,53,69,0.15); }
        .prim-color {
            width: 12px; height: 12px; border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0;
        }
        .compound-icon { color: var(--warning); }

        .toggle-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; padding: 4px 0;
        }
        .toggle {
            position: relative; width: 32px; height: 18px;
            background: rgba(80,80,80,0.4); border-radius: 10px; cursor: pointer;
            transition: var(--transition);
        }
        .toggle::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 14px; height: 14px; border-radius: 50%;
            background: #fff; transition: var(--transition);
        }
        .toggle.active { background: var(--accent); }
        .toggle.active::after { left: 16px; }

        .empty-state {
            text-align: center; padding: 16px 10px;
            color: var(--text-secondary); font-size: 12px;
        }
        .empty-state i { font-size: 20px; display: block; margin-bottom: 6px; opacity: 0.5; }

        .toast-container {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; flex-direction: column; gap: 6px;
            pointer-events: none;
        }
        .toast {
            padding: 8px 14px; border-radius: 8px;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(var(--glass-blur));
            font-size: 12px; color: var(--text-primary);
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            animation: toast-in 0.3s ease, toast-out 0.3s ease 2.4s forwards;
            pointer-events: auto;
        }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }
        @keyframes toast-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }

        .texture-preview {
            display: flex; gap: 8px; align-items: center; margin-bottom: 6px;
        }
        .texture-preview img {
            width: 40px; height: 40px; border-radius: 4px;
            border: 1px solid var(--glass-border); object-fit: cover;
        }
        .texture-preview .info { flex: 1; font-size: 11px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="panel">
        <div class="panel-title">
            <i class="fas fa-shapes"></i><span>元素操纵</span>
            <span class="badge" id="badge-count">0 项</span>
        </div>

        <!-- 图元创建 -->
        <div class="glass-card">
            <div class="card-title"><i class="fas fa-cube"></i><span>图元创建</span></div>
            <div class="field">
                <select id="select-type">
                    <option value="cube">立方体</option>
                    <option value="sphere">球体</option>
                    <option value="cylinder">圆柱体</option>
                    <option value="cone">圆锥体</option>
                    <option value="plane">平面</option>
                    <option value="torus">圆环</option>
                    <option value="dodecahedron">十二面体</option>
                    <option value="octahedron">八面体</option>
                    <option value="tetrahedron">四面体</option>
                    <option value="torusKnot">环结</option>
                    <option value="ring">圆环面</option>
                </select>
            </div>
            <div id="params-container"></div>
            <div class="field">
                <div class="field-label">
                    <span><i class="fas fa-palette"></i> 颜色</span>
                    <input type="color" id="input-color" value="#ffffff">
                </div>
            </div>
            <div class="field">
                <div class="field-label">
                    <span><i class="fas fa-adjust"></i> 透明度</span>
                    <span class="field-value" id="val-opacity">1.00</span>
                </div>
                <input type="range" id="slider-opacity" min="0.1" max="1.0" step="0.05" value="1.0">
            </div>
            <div class="field">
                <div class="field-label"><span><i class="fas fa-map-marker-alt"></i> 位置</span></div>
                <div class="coord-row">
                    <div class="coord-field">
                        <span class="coord-label x">X</span>
                        <input type="number" id="input-x" value="0" step="0.5">
                    </div>
                    <div class="coord-field">
                        <span class="coord-label y">Y</span>
                        <input type="number" id="input-y" value="2" step="0.5">
                    </div>
                    <div class="coord-field">
                        <span class="coord-label z">Z</span>
                        <input type="number" id="input-z" value="0" step="0.5">
                    </div>
                </div>
            </div>
            <div class="field">
                <div class="toggle-row">
                    <span><i class="fas fa-anchor"></i> 锚定（静态）</span>
                    <div class="toggle" id="toggle-anchored"></div>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" id="btn-add" type="button">
                    <i class="fas fa-plus"></i><span>添加图元</span>
                </button>
                <button class="btn btn-danger" id="btn-clear" type="button">
                    <i class="fas fa-trash"></i><span>清空</span>
                </button>
            </div>
        </div>

        <!-- 图元列表 -->
        <div class="glass-card">
            <div class="card-title">
                <i class="fas fa-list"></i><span>图元列表</span>
                <span class="card-actions">
                    <button class="btn btn-icon btn-success" id="btn-make-compound" title="将选中图元合并为组合体">
                        <i class="fas fa-object-group"></i>
                    </button>
                </span>
            </div>
            <div class="prim-list" id="prim-list">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <span>暂无图元</span>
                </div>
            </div>
            <div style="font-size:11px;color:var(--text-secondary);margin-top:6px;">
                <i class="fas fa-info-circle"></i> 点击图元项选中（可多选），然后点击右上合并按钮创建组合体
            </div>
        </div>

        <!-- 组合体列表 -->
        <div class="glass-card">
            <div class="card-title">
                <i class="fas fa-cubes"></i><span>组合体</span>
                <span class="field-value" id="compound-count" style="margin-left:auto;">0</span>
            </div>
            <div class="compound-list" id="compound-list">
                <div class="empty-state">
                    <i class="fas fa-cubes"></i>
                    <span>暂无组合体</span>
                </div>
            </div>
        </div>

        <!-- 纹理管理 -->
        <div class="glass-card" id="texture-card">
            <div class="card-title"><i class="fas fa-image"></i><span>纹理管理</span></div>
            <div class="field" id="texture-target-field">
                <div class="field-label"><span>目标</span><span class="field-value" id="tex-target-name">未选择</span></div>
            </div>
            <div class="field">
                <div class="field-label"><span><i class="fas fa-file-image"></i> 上传纹理</span></div>
                <div class="texture-preview" id="tex-preview" style="display:none;">
                    <img id="tex-img" alt="texture preview">
                    <div class="info">
                        <div id="tex-info-name"></div>
                        <div id="tex-info-size"></div>
                    </div>
                    <button class="btn btn-icon btn-danger" id="btn-tex-clear-preview" type="button">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <input type="file" id="tex-file-input" accept="image/*" style="display:none;">
                <button class="btn" id="btn-tex-upload" type="button">
                    <i class="fas fa-upload"></i><span>选择图片</span>
                </button>
            </div>
            <div class="field">
                <div class="field-label">
                    <span>UV 重复</span>
                    <span class="field-value" id="val-repeat">1 × 1</span>
                </div>
                <div class="coord-row">
                    <div class="coord-field">
                        <span class="coord-label x">U</span>
                        <input type="number" id="input-repeat-u" value="1" min="1" step="1">
                    </div>
                    <div class="coord-field">
                        <span class="coord-label y">V</span>
                        <input type="number" id="input-repeat-v" value="1" min="1" step="1">
                    </div>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" id="btn-tex-apply" type="button">
                    <i class="fas fa-check"></i><span>应用纹理</span>
                </button>
                <button class="btn btn-warn" id="btn-tex-clear" type="button">
                    <i class="fas fa-eraser"></i><span>清除纹理</span>
                </button>
            </div>
        </div>

        <!-- 资产管理 -->
        <div class="glass-card">
            <div class="card-title"><i class="fas fa-folder-open"></i><span>资产管理</span></div>
            <div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;">
                资产包含图元/组合体的几何、颜色、纹理、物理参数，可保存到服务器或导出为 JSON 文件
            </div>
            <div class="field">
                <div class="field-label"><span>目标</span><span class="field-value" id="asset-target-name">未选择</span></div>
            </div>
            <div class="field">
                <div class="field-label"><span>保存名称</span></div>
                <input type="text" id="input-asset-name" placeholder="例如：桥墩_01">
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" id="btn-asset-save" type="button">
                    <i class="fas fa-save"></i><span>保存到服务器</span>
                </button>
                <button class="btn btn-success" id="btn-asset-export" type="button">
                    <i class="fas fa-file-export"></i><span>导出 JSON</span>
                </button>
            </div>
            <div class="btn-row" style="margin-top:6px;">
                <button class="btn btn-warn" id="btn-asset-import" type="button">
                    <i class="fas fa-file-import"></i><span>从 JSON 导入</span>
                </button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>
    <input type="file" id="asset-file-input" accept=".json" style="display:none;">

    <script>
        // ==== 元素操纵面板 ====
        const CHANNEL_NAME = 'integrated-studio-bus';
        const SOURCE = 'elements-panel';
        const channel = new BroadcastChannel(CHANNEL_NAME);

        const PRIM_PARAMS = {
            cube: [
                { key: 'w', label: '宽度', min: 0.1, max: 100, step: 0.1, default: 10 },
                { key: 'h', label: '高度', min: 0.1, max: 100, step: 0.1, default: 10 },
                { key: 'd', label: '深度', min: 0.1, max: 100, step: 0.1, default: 10 },
            ],
            sphere: [
                { key: 'r', label: '半径', min: 0.1, max: 50, step: 0.1, default: 5 },
                { key: 'seg', label: '分段', min: 4, max: 128, step: 1, default: 32 },
            ],
            cylinder: [
                { key: 'rt', label: '顶半径', min: 0, max: 50, step: 0.1, default: 5 },
                { key: 'rb', label: '底半径', min: 0, max: 50, step: 0.1, default: 5 },
                { key: 'h', label: '高度', min: 0.1, max: 100, step: 0.1, default: 10 },
                { key: 'seg', label: '分段', min: 4, max: 128, step: 1, default: 32 },
            ],
            cone: [
                { key: 'r', label: '半径', min: 0.1, max: 50, step: 0.1, default: 5 },
                { key: 'h', label: '高度', min: 0.1, max: 100, step: 0.1, default: 10 },
                { key: 'seg', label: '分段', min: 4, max: 128, step: 1, default: 32 },
            ],
            plane: [
                { key: 'w', label: '宽度', min: 0.1, max: 200, step: 0.1, default: 10 },
                { key: 'h', label: '高度', min: 0.1, max: 200, step: 0.1, default: 10 },
            ],
            torus: [
                { key: 'r', label: '大半径', min: 0.1, max: 50, step: 0.1, default: 5 },
                { key: 't', label: '管半径', min: 0.02, max: 20, step: 0.02, default: 2 },
            ],
            dodecahedron: [{ key: 'r', label: '半径', min: 0.1, max: 50, step: 0.1, default: 5 }],
            octahedron: [{ key: 'r', label: '半径', min: 0.1, max: 50, step: 0.1, default: 5 }],
            tetrahedron: [{ key: 'r', label: '半径', min: 0.1, max: 50, step: 0.1, default: 5 }],
            torusKnot: [
                { key: 'r', label: '大半径', min: 0.1, max: 50, step: 0.1, default: 5 },
                { key: 't', label: '管半径', min: 0.02, max: 20, step: 0.02, default: 1.5 },
            ],
            ring: [
                { key: 'inner', label: '内半径', min: 0, max: 50, step: 0.05, default: 3 },
                { key: 'outer', label: '外半径', min: 0.1, max: 50, step: 0.05, default: 5 },
            ],
        };

        const PRIM_NAMES = {
            cube: '立方体', sphere: '球体', cylinder: '圆柱体', cone: '圆锥体',
            plane: '平面', torus: '圆环', dodecahedron: '十二面体',
            octahedron: '八面体', tetrahedron: '四面体', torusKnot: '环结', ring: '圆环面',
        };

        const elements = {
            selectType: document.getElementById('select-type'),
            paramsContainer: document.getElementById('params-container'),
            inputColor: document.getElementById('input-color'),
            sliderOpacity: document.getElementById('slider-opacity'),
            valOpacity: document.getElementById('val-opacity'),
            inputX: document.getElementById('input-x'),
            inputY: document.getElementById('input-y'),
            inputZ: document.getElementById('input-z'),
            toggleAnchored: document.getElementById('toggle-anchored'),
            btnAdd: document.getElementById('btn-add'),
            btnClear: document.getElementById('btn-clear'),
            primList: document.getElementById('prim-list'),
            btnMakeCompound: document.getElementById('btn-make-compound'),
            compoundList: document.getElementById('compound-list'),
            compoundCount: document.getElementById('compound-count'),
            badgeCount: document.getElementById('badge-count'),
            // 纹理
            texTargetName: document.getElementById('tex-target-name'),
            texPreview: document.getElementById('tex-preview'),
            texImg: document.getElementById('tex-img'),
            texInfoName: document.getElementById('tex-info-name'),
            texInfoSize: document.getElementById('tex-info-size'),
            btnTexUpload: document.getElementById('btn-tex-upload'),
            btnTexClearPreview: document.getElementById('btn-tex-clear-preview'),
            texFileInput: document.getElementById('tex-file-input'),
            inputRepeatU: document.getElementById('input-repeat-u'),
            inputRepeatV: document.getElementById('input-repeat-v'),
            valRepeat: document.getElementById('val-repeat'),
            btnTexApply: document.getElementById('btn-tex-apply'),
            btnTexClear: document.getElementById('btn-tex-clear'),
            // 资产
            assetTargetName: document.getElementById('asset-target-name'),
            inputAssetName: document.getElementById('input-asset-name'),
            btnAssetSave: document.getElementById('btn-asset-save'),
            btnAssetExport: document.getElementById('btn-asset-export'),
            btnAssetImport: document.getElementById('btn-asset-import'),
            assetFileInput: document.getElementById('asset-file-input'),
            toastContainer: document.getElementById('toast-container'),
        };

        const state = {
            currentType: 'cube',
            params: {},
            anchored: false,
            primitiveOpacity: 1.0,
            primitives: [], // {id, type, color, selected}
            compounds: [],  // {id, name, memberIds, anchored, selected}
            selectedPrimIds: new Set(),
            // 当前纹理目标（图元或组合体 ID）
            textureTargetId: null,
            textureDataUrl: null,
            textureFileName: null,
            // 当前资产目标
            assetTargetId: null,
        };

        function init() {
            bindEvents();
            renderParams('cube');
            channel.postMessage({ type: 'panel_ready', source: SOURCE, timestamp: Date.now() });
        }

        function bindEvents() {
            elements.selectType.addEventListener('change', () => {
                state.currentType = elements.selectType.value;
                renderParams(state.currentType);
            });

            elements.toggleAnchored.addEventListener('click', () => {
                state.anchored = !state.anchored;
                elements.toggleAnchored.classList.toggle('active', state.anchored);
            });

            elements.sliderOpacity.addEventListener('input', () => {
                state.primitiveOpacity = parseFloat(elements.sliderOpacity.value);
                elements.valOpacity.textContent = state.primitiveOpacity.toFixed(2);
            });

            elements.btnAdd.addEventListener('click', addPrimitive);
            elements.btnClear.addEventListener('click', clearAll);
            elements.btnMakeCompound.addEventListener('click', makeCompound);

            // 纹理
            elements.btnTexUpload.addEventListener('click', () => elements.texFileInput.click());
            elements.btnTexClearPreview.addEventListener('click', clearTexturePreview);
            elements.texFileInput.addEventListener('change', onTextureSelected);
            elements.inputRepeatU.addEventListener('input', updateRepeatLabel);
            elements.inputRepeatV.addEventListener('input', updateRepeatLabel);
            elements.btnTexApply.addEventListener('click', applyTexture);
            elements.btnTexClear.addEventListener('click', clearTexture);

            // 资产
            elements.btnAssetSave.addEventListener('click', saveAsset);
            elements.btnAssetExport.addEventListener('click', exportAsset);
            elements.btnAssetImport.addEventListener('click', () => elements.assetFileInput.click());
            elements.assetFileInput.addEventListener('change', onAssetFileSelected);

            channel.onmessage = (event) => {
                const msg = event.data;
                if (!msg || msg.source === SOURCE) return;
                handleChannelMessage(msg);
            };
        }

        function handleChannelMessage(msg) {
            switch (msg.type) {
                case 'primitive_created':
                    onPrimitiveCreated(msg.payload);
                    break;
                case 'primitive_removed':
                    onPrimitiveRemoved(msg.payload);
                    break;
                case 'compounds_list':
                    renderCompoundList(msg.payload?.compounds ?? []);
                    break;
                case 'compound_created':
                    showToast('组合体已创建', 'success');
                    break;
                case 'compound_dissolved':
                    onCompoundDissolved(msg.payload);
                    break;
                case 'compound_op_result':
                    showToast(msg.payload?.message || '操作完成', msg.payload?.ok ? 'success' : 'error');
                    break;
                case 'texture_op_result':
                    showToast(msg.payload?.action === 'apply' ? '纹理已应用' : '纹理已清除',
                              msg.payload?.ok ? 'success' : 'error');
                    break;
                case 'asset_op_result':
                    showToast(msg.payload?.message || '操作完成', msg.payload?.ok ? 'success' : 'error');
                    break;
                case 'asset_export_result':
                    onAssetExportResult(msg.payload);
                    break;
                case 'primitive_spawn_info':
                    // 更新位置输入框为生成的位置
                    if (msg.payload?.position) {
                        elements.inputX.value = msg.payload.position.x.toFixed(1);
                        elements.inputY.value = msg.payload.position.y.toFixed(1);
                        elements.inputZ.value = msg.payload.position.z.toFixed(1);
                    }
                    break;
                case 'theme_changed':
                    document.body.classList.toggle('dark-mode', msg.payload?.dark === true);
                    break;
            }
        }

        // ==== 图元创建 ====
        function renderParams(type) {
            const defs = PRIM_PARAMS[type] || [];
            state.params = {};
            defs.forEach(d => { state.params[d.key] = d.default; });

            elements.paramsContainer.innerHTML = defs.map(d => `
                <div class="field">
                    <div class="field-label">
                        <span>${d.label}</span>
                        <span class="field-value" id="param-val-${d.key}">${d.default}</span>
                    </div>
                    <input type="range" id="param-${d.key}"
                           min="${d.min}" max="${d.max}" step="${d.step}" value="${d.default}">
                </div>
            `).join('');

            defs.forEach(d => {
                const slider = document.getElementById(`param-${d.key}`);
                const val = document.getElementById(`param-val-${d.key}`);
                slider.addEventListener('input', () => {
                    state.params[d.key] = parseFloat(slider.value);
                    val.textContent = d.step < 1 ? parseFloat(slider.value).toFixed(2) : slider.value;
                });
            });
        }

        function addPrimitive() {
            const spec = {
                type: state.currentType,
                params: { ...state.params },
                // 不传position，由引擎端基于角色位置R50/H40随机生成
                color: parseInt(elements.inputColor.value.replace('#', ''), 16),
                physics: { anchored: state.anchored },
                opacity: state.primitiveOpacity,
            };
            broadcast('primitive_add', { spec });
        }

        function onPrimitiveCreated(payload) {
            if (!payload) return;
            state.primitives.push({
                id: payload.id,
                type: payload.type || state.currentType,
                color: payload.color ?? parseInt(elements.inputColor.value.replace('#', ''), 16),
                selected: false,
            });
            renderPrimList();
        }

        function onPrimitiveRemoved(payload) {
            const id = payload?.id;
            state.primitives = state.primitives.filter(p => p.id !== id);
            state.selectedPrimIds.delete(id);
            if (state.textureTargetId === id) clearTextureTarget();
            if (state.assetTargetId === id) clearAssetTarget();
            renderPrimList();
        }

        function onCompoundDissolved(payload) {
            const id = payload?.compoundId;
            state.compounds = state.compounds.filter(c => c.id !== id);
            if (state.textureTargetId === id) clearTextureTarget();
            if (state.assetTargetId === id) clearAssetTarget();
            renderCompoundList(state.compounds);
            showToast('组合体已解散', 'success');
        }

        function removePrimitive(id) {
            broadcast('primitive_remove', { id });
        }

        function clearAll() {
            if (!confirm('确认清空所有图元与组合体？')) return;
            // 先解散所有组合体（让子图元回归独立列表后再统一删除）
            for (const c of [...state.compounds]) {
                broadcast('compound_dissolve', { id: c.id });
            }
            // 删除所有图元
            for (const p of [...state.primitives]) {
                broadcast('primitive_remove', { id: p.id });
            }
            state.primitives = [];
            state.compounds = [];
            state.selectedPrimIds.clear();
            clearTextureTarget();
            clearAssetTarget();
            renderPrimList();
            renderCompoundList([]);
        }

        // ==== 图元列表 ====
        function renderPrimList() {
            elements.badgeCount.textContent = `${state.primitives.length + state.compounds.length} 项`;
            if (state.primitives.length === 0) {
                elements.primList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><span>暂无图元</span></div>';
                elements.btnMakeCompound.disabled = true;
                return;
            }
            elements.btnMakeCompound.disabled = state.selectedPrimIds.size < 2;
            elements.primList.innerHTML = state.primitives.map(p => {
                const hex = '#' + (p.color ?? 0x9d6bff).toString(16).padStart(6, '0');
                const selected = state.selectedPrimIds.has(p.id);
                const isTexTarget = state.textureTargetId === p.id;
                const isAssetTarget = state.assetTargetId === p.id;
                return `
                    <div class="list-item ${selected ? 'selected' : ''}" data-id="${escapeHtml(p.id)}">
                        <div class="prim-color" style="background:${hex}"></div>
                        <span class="name">${PRIM_NAMES[p.type] || p.type}</span>
                        <span class="meta">${isTexTarget ? '<i class="fas fa-image" title="纹理目标"></i> ' : ''}${isAssetTarget ? '<i class="fas fa-folder" title="资产目标"></i> ' : ''}${p.id}</span>
                        <span class="ops">
                            <button class="tex" title="设为纹理目标"><i class="fas fa-image"></i></button>
                            <button class="asset" title="设为资产目标"><i class="fas fa-folder"></i></button>
                            <button class="danger remove" title="删除"><i class="fas fa-times"></i></button>
                        </span>
                    </div>
                `;
            }).join('');
            elements.primList.querySelectorAll('.list-item').forEach(item => {
                const id = item.dataset.id;
                item.addEventListener('click', (e) => {
                    if (e.target.closest('button')) return;
                    if (state.selectedPrimIds.has(id)) state.selectedPrimIds.delete(id);
                    else state.selectedPrimIds.add(id);
                    renderPrimList();
                });
                item.querySelector('button.tex').addEventListener('click', (e) => {
                    e.stopPropagation();
                    setTextureTarget(id, PRIM_NAMES[state.primitives.find(p => p.id === id)?.type] || id);
                });
                item.querySelector('button.asset').addEventListener('click', (e) => {
                    e.stopPropagation();
                    setAssetTarget(id, PRIM_NAMES[state.primitives.find(p => p.id === id)?.type] || id);
                });
                item.querySelector('button.remove').addEventListener('click', (e) => {
                    e.stopPropagation();
                    removePrimitive(id);
                });
            });
        }

        // ==== 组合体 ====
        function makeCompound() {
            const ids = Array.from(state.selectedPrimIds);
            if (ids.length < 2) {
                showToast('请至少选择 2 个图元', 'error');
                return;
            }
            const name = prompt('组合体名称：', `组合体 ${state.compounds.length + 1}`);
            if (name === null) return;
            const anchored = confirm('组合体是否锚定（静态）？\n确定=锚定，取消=动态');
            broadcast('compound_create', { meshIds: ids, name: name || undefined, anchored });
            // 创建后从独立列表移除（等待 compound_created 事件）
            state.primitives = state.primitives.filter(p => !state.selectedPrimIds.has(p.id));
            state.selectedPrimIds.clear();
            renderPrimList();
        }

        function renderCompoundList(compounds) {
            state.compounds = compounds;
            elements.compoundCount.textContent = compounds.length;
            elements.badgeCount.textContent = `${state.primitives.length + state.compounds.length} 项`;
            if (compounds.length === 0) {
                elements.compoundList.innerHTML = '<div class="empty-state"><i class="fas fa-cubes"></i><span>暂无组合体</span></div>';
                return;
            }
            elements.compoundList.innerHTML = compounds.map(c => {
                const isTexTarget = state.textureTargetId === c.id;
                const isAssetTarget = state.assetTargetId === c.id;
                return `
                    <div class="list-item" data-id="${escapeHtml(c.id)}">
                        <i class="fas fa-cubes compound-icon"></i>
                        <span class="name">${escapeHtml(c.name)}</span>
                        <span class="meta">${c.memberIds?.length || 0} 图元 · ${c.anchored ? '静态' : '动态'}${isTexTarget ? ' · <i class="fas fa-image"></i>' : ''}${isAssetTarget ? ' · <i class="fas fa-folder"></i>' : ''}</span>
                        <span class="ops">
                            <button class="tex" title="设为纹理目标"><i class="fas fa-image"></i></button>
                            <button class="asset" title="设为资产目标"><i class="fas fa-folder"></i></button>
                            <button class="danger dissolve" title="解散"><i class="fas fa-undo"></i></button>
                            <button class="danger remove" title="删除整个组合体"><i class="fas fa-times"></i></button>
                        </span>
                    </div>
                `;
            }).join('');
            elements.compoundList.querySelectorAll('.list-item').forEach(item => {
                const id = item.dataset.id;
                const c = compounds.find(x => x.id === id);
                item.querySelector('button.tex').addEventListener('click', (e) => {
                    e.stopPropagation();
                    setTextureTarget(id, c?.name || id);
                });
                item.querySelector('button.asset').addEventListener('click', (e) => {
                    e.stopPropagation();
                    setAssetTarget(id, c?.name || id);
                });
                item.querySelector('button.dissolve').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm('确认解散此组合体？子图元将回归独立列表。')) {
                        broadcast('compound_dissolve', { id });
                    }
                });
                item.querySelector('button.remove').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm('确认删除整个组合体（含子图元）？')) {
                        broadcast('primitive_remove', { id });
                    }
                });
            });
        }

        // ==== 纹理 ====
        function setTextureTarget(id, name) {
            state.textureTargetId = id;
            elements.texTargetName.textContent = name;
        }

        function clearTextureTarget() {
            state.textureTargetId = null;
            elements.texTargetName.textContent = '未选择';
            clearTexturePreview();
        }

        function clearTexturePreview() {
            state.textureDataUrl = null;
            state.textureFileName = null;
            elements.texPreview.style.display = 'none';
            elements.texFileInput.value = '';
        }

        function onTextureSelected(e) {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                state.textureDataUrl = String(reader.result || '');
                state.textureFileName = file.name;
                elements.texImg.src = state.textureDataUrl;
                elements.texInfoName.textContent = file.name;
                elements.texInfoSize.textContent = `${(file.size / 1024).toFixed(1)} KB`;
                elements.texPreview.style.display = '';
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function updateRepeatLabel() {
            const u = parseInt(elements.inputRepeatU.value) || 1;
            const v = parseInt(elements.inputRepeatV.value) || 1;
            elements.valRepeat.textContent = `${u} × ${v}`;
        }

        function applyTexture() {
            if (!state.textureTargetId) {
                showToast('请先选择纹理目标', 'error');
                return;
            }
            if (!state.textureDataUrl) {
                showToast('请先上传纹理图片', 'error');
                return;
            }
            const u = parseInt(elements.inputRepeatU.value) || 1;
            const v = parseInt(elements.inputRepeatV.value) || 1;
            broadcast('texture_apply', {
                id: state.textureTargetId,
                dataUrl: state.textureDataUrl,
                repeat: { x: u, y: v },
            });
        }

        function clearTexture() {
            if (!state.textureTargetId) {
                showToast('请先选择纹理目标', 'error');
                return;
            }
            broadcast('texture_clear', { id: state.textureTargetId });
        }

        // ==== 资产 ====
        function setAssetTarget(id, name) {
            state.assetTargetId = id;
            elements.assetTargetName.textContent = name;
        }

        function clearAssetTarget() {
            state.assetTargetId = null;
            elements.assetTargetName.textContent = '未选择';
        }

        function saveAsset() {
            if (!state.assetTargetId) {
                showToast('请先选择资产目标', 'error');
                return;
            }
            const name = elements.inputAssetName.value.trim();
            if (!name) {
                showToast('请输入保存名称', 'error');
                return;
            }
            broadcast('asset_save_one', { id: state.assetTargetId, name });
        }

        function exportAsset() {
            if (!state.assetTargetId) {
                showToast('请先选择资产目标', 'error');
                return;
            }
            broadcast('asset_export_one', { id: state.assetTargetId });
        }

        function onAssetExportResult(payload) {
            if (!payload?.asset) {
                showToast('资产导出失败', 'error');
                return;
            }
            try {
                const json = JSON.stringify(payload.asset, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const name = (elements.inputAssetName.value.trim() || `asset_${payload.id}`).replace(/[^\w\-]/g, '_');
                a.href = url;
                a.download = `${name}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('资产已导出', 'success');
            } catch (err) {
                showToast('导出失败：' + err.message, 'error');
            }
        }

        function onAssetFileSelected(e) {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const text = String(reader.result || '');
                    JSON.parse(text); // 校验
                    broadcast('asset_import', { asset: text });
                } catch (err) {
                    showToast('文件解析失败：' + err.message, 'error');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        // ==== Toast ====
        function showToast(message, type = '') {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.textContent = message;
            elements.toastContainer.appendChild(el);
            setTimeout(() => el.remove(), 2800);
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        function broadcast(type, payload) {
            channel.postMessage({ type, source: SOURCE, payload, timestamp: Date.now() });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
