<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 星月智能 』位移操纵</title>
    <link rel="stylesheet" href="/file/read/package/standard_dependency/styles.css">
    <script src="/file/read/package/standard_dependency/script.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255,255,255,0.28);
            --glass-border: rgba(255,255,255,0.35);
            --glass-blur: 18px;
            --radius-md: 0.75rem;
            --text-primary: rgba(15,30,15,1);
            --text-secondary: rgba(80,80,80,1);
            --accent: #9d6bff;
            --success: #20c997;
            --danger: #dc3545;
            --transition: all 0.45s ease;
        }
        .dark-mode {
            --text-primary: rgba(244,244,245,1);
            --text-secondary: rgba(180,180,180,1);
            --glass-bg: rgba(38,38,42,0.82);
            --glass-border: rgba(80,80,80,0.6);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: transparent;
            font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            font-size: 13px; color: var(--text-primary);
            overflow-y: auto; overflow-x: hidden;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar { display: none; }

        .panel { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .panel-title {
            font-size: 14px; font-weight: 600;
            display: flex; align-items: center; gap: 6px;
            padding-bottom: 8px; border-bottom: 1px solid var(--glass-border);
        }
        .panel-title i { color: var(--accent); }

        .glass-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-md); padding: 10px 12px;
            transition: var(--transition);
        }

        .field { margin-bottom: 8px; }
        .field:last-child { margin-bottom: 0; }
        .field-label {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;
        }
        .field-value { color: var(--accent); font-weight: 600; font-family: 'SF Mono','Consolas',monospace; }

        .coord-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .coord-field { display: flex; flex-direction: column; gap: 3px; }
        .coord-label { font-size: 11px; text-align: center; font-weight: 600; color: var(--text-secondary); }
        .coord-label.x { color: #dc3545; }
        .coord-label.y { color: #20c997; }
        .coord-label.z { color: #6c9bcf; }

        input[type="number"] {
            width: 100%; padding: 6px 8px;
            background: rgba(255,255,255,0.15); border: 1px solid var(--glass-border);
            border-radius: 6px; color: var(--text-primary); font-size: 12px;
            font-family: 'SF Mono','Consolas',monospace; text-align: center; outline: none;
        }
        .dark-mode input[type="number"] { background: rgba(20,20,24,0.4); }
        input[type="number"]:focus { border-color: var(--accent); }
        input[type="number"]::-webkit-inner-spin-button { display: none; }

        input[type="range"] {
            width: 100%; height: 4px; background: rgba(157,107,255,0.2);
            border-radius: 2px; appearance: none; -webkit-appearance: none; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none; -webkit-appearance: none;
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); cursor: pointer; border: 2px solid #fff;
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); cursor: pointer; border: 2px solid #fff;
        }

        .btn-row { display: flex; gap: 8px; }
        .btn {
            flex: 1; padding: 7px 10px;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: var(--radius-md); color: var(--text-primary);
            font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 4px;
            transition: var(--transition);
            backdrop-filter: blur(var(--glass-blur));
        }
        .btn:hover { background: rgba(157,107,255,0.15); border-color: var(--accent); }
        .btn.btn-primary { background: rgba(157,107,255,0.25); border-color: var(--accent); color: var(--accent); }
        .btn.btn-danger:hover { background: rgba(220,53,69,0.15); border-color: var(--danger); color: var(--danger); }

        .toggle-row {
            display: flex; justify-content: space-between; align-items: center; padding: 6px 0;
        }
        .toggle {
            position: relative; width: 36px; height: 18px;
            background: rgba(255,255,255,0.2); border-radius: 9px;
            cursor: pointer; transition: var(--transition);
            border: 1px solid var(--glass-border);
        }
        .toggle::after {
            content: ''; position: absolute; top: 1px; left: 1px;
            width: 14px; height: 14px; background: #fff;
            border-radius: 50%; transition: var(--transition);
        }
        .toggle.active { background: var(--accent); }
        .toggle.active::after { left: 19px; }

        .stat-row {
            display: flex; justify-content: space-between;
            font-size: 12px; padding: 3px 0; color: var(--text-secondary);
        }
        .stat-row span:last-child { color: var(--text-primary); font-family: 'SF Mono','Consolas',monospace; }

        .preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .preset-btn {
            padding: 6px 4px; font-size: 11px;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 6px; cursor: pointer; color: var(--text-secondary);
            transition: var(--transition); text-align: center;
        }
        .preset-btn:hover { background: rgba(157,107,255,0.15); border-color: var(--accent); color: var(--accent); }

        .move-phase {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 600;
        }
        .move-phase.idle { background: rgba(150,150,150,0.2); color: var(--text-secondary); }
        .move-phase.moving { background: rgba(157,107,255,0.2); color: var(--accent); }
        .move-phase.jumping { background: rgba(32,201,151,0.2); color: var(--success); }
        .move-phase.sneaking { background: rgba(251,191,36,0.2); color: #fbbf24; }
        .move-phase.sitting { background: rgba(220,53,69,0.2); color: var(--danger); }
    </style>
</head>
<body>
    <div class="panel">
        <div class="panel-title">
            <i class="fas fa-arrows-alt"></i><span>位移操纵</span>
        </div>

        <!-- 目标位置 -->
        <div class="glass-card">
            <div class="field-label" style="margin-bottom: 6px;">
                <span><i class="fas fa-crosshairs"></i> 目标位置</span>
            </div>
            <div class="coord-row">
                <div class="coord-field">
                    <span class="coord-label x">X</span>
                    <input type="number" id="input-x" value="0" step="0.5" min="-100" max="100">
                </div>
                <div class="coord-field">
                    <span class="coord-label y">Y</span>
                    <input type="number" id="input-y" value="0" step="0.5" min="-10" max="50">
                </div>
                <div class="coord-field">
                    <span class="coord-label z">Z</span>
                    <input type="number" id="input-z" value="0" step="0.5" min="-100" max="100">
                </div>
            </div>
        </div>

        <!-- 朝向控制 -->
        <div class="glass-card">
            <div class="field-label" style="margin-bottom: 6px;">
                <span><i class="fas fa-compass"></i> 朝向控制</span>
            </div>
            <div class="field">
                <div class="field-label">
                    <span>偏航（Yaw）</span>
                    <span class="field-value" id="val-yaw">0°</span>
                </div>
                <input type="range" id="slider-yaw" min="-180" max="180" step="1" value="0">
            </div>
            <div class="field">
                <div class="field-label">
                    <span>俯仰（Pitch）</span>
                    <span class="field-value" id="val-pitch">0°</span>
                </div>
                <input type="range" id="slider-pitch" min="-45" max="45" step="1" value="0">
            </div>
        </div>

        <!-- 快捷预设 -->
        <div class="glass-card">
            <div class="field-label" style="margin-bottom: 6px;">
                <span><i class="fas fa-bookmark"></i> 快捷预设</span>
            </div>
            <div class="preset-grid">
                <div class="preset-btn" data-x="0" data-y="0" data-z="0">原点</div>
                <div class="preset-btn" data-x="10" data-y="0" data-z="0">东</div>
                <div class="preset-btn" data-x="-10" data-y="0" data-z="0">西</div>
                <div class="preset-btn" data-x="0" data-y="0" data-z="-10">南</div>
                <div class="preset-btn" data-x="0" data-y="0" data-z="10">北</div>
                <div class="preset-btn" data-x="0" data-y="5" data-z="0">跳跃</div>
                <div class="preset-btn" data-x="0" data-y="-3" data-z="0">潜行</div>
            </div>
        </div>

        <!-- 鼠标追踪 & 追踪聚焦 -->
        <div class="glass-card">
            <div class="toggle-row">
                <span><i class="fas fa-mouse-pointer"></i> 鼠标追踪</span>
                <div class="toggle active" id="toggle-tracking"></div>
            </div>
            <div style="margin-top:6px;">
                <button class="btn btn-primary" id="btn-focus" type="button" style="width:100%;">
                    <i class="fas fa-crosshairs"></i><span>追踪聚焦</span>
                </button>
            </div>
        </div>

        <!-- 快速追踪 -->
        <div class="glass-card">
            <div class="toggle-row">
                <span><i class="fas fa-bullseye"></i> 快速追踪</span>
                <div class="toggle" id="toggle-quick-track"></div>
            </div>
            <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">
                开启后点击画布左键可移动角色至点击位置
            </div>
        </div>

        <!-- 当前状态 -->
        <div class="glass-card">
            <div class="stat-row"><span>当前 X</span><span id="stat-x">0.00</span></div>
            <div class="stat-row"><span>当前 Y</span><span id="stat-y">0.00</span></div>
            <div class="stat-row"><span>当前 Z</span><span id="stat-z">0.00</span></div>
            <div class="stat-row">
                <span>移动状态</span>
                <span class="move-phase idle" id="stat-phase">静止</span>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="btn-row">
            <button class="btn btn-primary" id="btn-move" type="button">
                <i class="fas fa-location-arrow"></i><span>移动到目标</span>
            </button>
            <button class="btn btn-danger" id="btn-stop" type="button">
                <i class="fas fa-stop"></i><span>停止</span>
            </button>
        </div>
    </div>

    <script>
        const CHANNEL_NAME = 'integrated-studio-bus';
        const SOURCE = 'movement-panel';
        const channel = new BroadcastChannel(CHANNEL_NAME);

        const elements = {
            inputX: document.getElementById('input-x'),
            inputY: document.getElementById('input-y'),
            inputZ: document.getElementById('input-z'),
            sliderYaw: document.getElementById('slider-yaw'),
            sliderPitch: document.getElementById('slider-pitch'),
            valYaw: document.getElementById('val-yaw'),
            valPitch: document.getElementById('val-pitch'),
            toggleTracking: document.getElementById('toggle-tracking'),
            btnFocus: document.getElementById('btn-focus'),
            toggleQuickTrack: document.getElementById('toggle-quick-track'),
            statX: document.getElementById('stat-x'),
            statY: document.getElementById('stat-y'),
            statZ: document.getElementById('stat-z'),
            statPhase: document.getElementById('stat-phase'),
            btnMove: document.getElementById('btn-move'),
            btnStop: document.getElementById('btn-stop'),
            presetBtns: document.querySelectorAll('.preset-btn'),
        };

        const state = {
            mouseTracking: true,
            isMoving: false,
            quickTrack: false,
        };

        function init() {
            bindEvents();
            channel.postMessage({ type: 'panel_ready', source: SOURCE, timestamp: Date.now() });
        }

        function bindEvents() {
            elements.btnMove.addEventListener('click', () => {
                const x = parseFloat(elements.inputX.value) || 0;
                const y = parseFloat(elements.inputY.value) || 0;
                const z = parseFloat(elements.inputZ.value) || 0;
                // 执行移动时强制关闭鼠标追踪
                state.mouseTracking = false;
                elements.toggleTracking.classList.remove('active');
                broadcast('movement', { position: { x, y, z }, resumeTracking: false });
            });

            elements.btnStop.addEventListener('click', () => {
                broadcast('movement', { position: null, resumeTracking: true, action: 'stop' });
            });

            // 偏航滑动条
            elements.sliderYaw.addEventListener('input', () => {
                const yaw = parseFloat(elements.sliderYaw.value);
                elements.valYaw.textContent = yaw + '°';
                broadcast('rotation', { yaw });
            });

            // 俯仰滑动条
            elements.sliderPitch.addEventListener('input', () => {
                const pitch = parseFloat(elements.sliderPitch.value);
                elements.valPitch.textContent = pitch + '°';
                broadcast('rotation', { pitch });
            });

            elements.toggleTracking.addEventListener('click', () => {
                state.mouseTracking = !state.mouseTracking;
                elements.toggleTracking.classList.toggle('active', state.mouseTracking);
                broadcast('mouse_tracking', { enabled: state.mouseTracking });
            });

            elements.btnFocus.addEventListener('click', () => {
                broadcast('focus_character', {});
            });

            elements.presetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    elements.inputX.value = btn.dataset.x;
                    elements.inputY.value = btn.dataset.y || 0;
                    elements.inputZ.value = btn.dataset.z;
                });
            });

            // 快速追踪
            elements.toggleQuickTrack.addEventListener('click', () => {
                state.quickTrack = !state.quickTrack;
                elements.toggleQuickTrack.classList.toggle('active', state.quickTrack);
                broadcast('quick_track', { enabled: state.quickTrack });
            });

            channel.onmessage = (event) => {
                const msg = event.data;
                if (!msg || msg.source === SOURCE) return;
                if (msg.type === 'telemetry') {
                    updatePosition(msg.payload);
                } else if (msg.type === 'movement_complete') {
                    state.isMoving = false;
                    updatePhase('idle');
                } else if (msg.type === 'theme_changed') {
                    document.body.classList.toggle('dark-mode', msg.payload?.dark === true);
                }
            };
        }

        function updatePosition(p) {
            if (!p || !p.character) return;
            elements.statX.textContent = p.character.x.toFixed(2);
            elements.statY.textContent = p.character.y.toFixed(2);
            elements.statZ.textContent = p.character.z.toFixed(2);

            const targetY = parseFloat(elements.inputY.value) || 0;
            const dy = targetY - p.character.y;
            if (p.isMoving) {
                if (dy > 0.5) updatePhase('jumping');
                else if (dy < -0.5) updatePhase('sneaking');
                else updatePhase('moving');
            } else {
                updatePhase('idle');
            }
        }

        const PHASE_LABELS = {
            idle: '静止',
            moving: '移动中',
            jumping: '跳跃中',
            sneaking: '潜行中',
            sitting: '无法抵达',
        };

        function updatePhase(phase) {
            elements.statPhase.textContent = PHASE_LABELS[phase] || phase;
            elements.statPhase.className = `move-phase ${phase}`;
        }

        function broadcast(type, payload) {
            channel.postMessage({ type, source: SOURCE, payload, timestamp: Date.now() });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
