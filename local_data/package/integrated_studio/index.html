<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 星月智能 』复合引擎工作室</title>
    <!-- 标准样式库 -->
    <link rel="stylesheet" href="/file/read/package/standard_dependency/styles.css">
    <!-- 标准脚本库 -->
    <script src="/file/read/package/standard_dependency/script.js"></script>
    <!-- 项目私有样式 -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 背景层 -->
    <div class="background"></div>
    <!-- 玻璃效果层 -->
    <div class="glass-effect"></div>

    <!-- 主容器：CSS Grid 布局（顶栏 + 引擎 + 操纵面板 + 信息栏） -->
    <div class="studio-grid">
        <!-- 顶栏：操纵层 tab 切换 + 工具按钮 -->
        <header class="area-topbar">
            <div class="tab-strip">
                <button class="tab-btn" data-panel="physics" type="button">
                    <i class="fas fa-atom"></i><span>物理</span>
                </button>
                <button class="tab-btn active" data-panel="animation" type="button">
                    <i class="fas fa-film"></i><span>动画</span>
                </button>
                <button class="tab-btn" data-panel="movement" type="button">
                    <i class="fas fa-arrows-alt"></i><span>位移</span>
                </button>
                <button class="tab-btn" data-panel="elements" type="button">
                    <i class="fas fa-shapes"></i><span>元素</span>
                </button>
            </div>
            <div class="toolbar">
                <button class="tool-btn" id="btn-mode" type="button" title="切换编辑器/嵌入式视图">
                    <i class="fas fa-eye"></i><span>编辑器视图</span>
                </button>
                <button class="tool-btn" id="btn-theme" type="button" title="切换主题">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="tool-btn" id="btn-help" type="button" title="帮助">
                    <i class="fas fa-question-circle"></i>
                </button>
            </div>
        </header>

        <!-- 引擎 iframe（中央 3D 视口） -->
        <main class="area-engine">
            <iframe src="engine/index.html?mode=editor" name="engine-frame" allow="fullscreen" title="引擎视口"></iframe>
        </main>

        <!-- 操纵面板容器（右侧 360px，4 个 iframe 一次性挂载） -->
        <aside class="area-panel">
            <iframe data-panel="physics"   src="panels/physics.html"   hidden title="物理操纵面板"></iframe>
            <iframe data-panel="animation" src="panels/animation.html" class="active" title="动画操纵面板"></iframe>
            <iframe data-panel="movement"  src="panels/movement.html"  hidden title="位移操纵面板"></iframe>
            <iframe data-panel="elements"  src="panels/elements.html"  hidden title="元素操纵面板"></iframe>
            <div class="panel-loading" hidden>
                <i class="fas fa-spinner fa-spin"></i>
                <span>加载中...</span>
            </div>
        </aside>

        <!-- 信息 iframe（底部 80px 状态栏） -->
        <footer class="area-info">
            <iframe src="panels/info.html" name="info-frame" title="状态信息栏"></iframe>
        </footer>
    </div>

    <!-- 帮助模态框 -->
    <div class="modal-overlay" id="help-modal" hidden>
        <div class="modal glass-panel">
            <div class="modal-header">
                <h3><i class="fas fa-keyboard"></i> 快捷键说明</h3>
                <button class="modal-close" type="button" aria-label="关闭">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <table class="shortcut-table">
                    <thead>
                        <tr><th>按键</th><th>功能</th><th>生效条件</th></tr>
                    </thead>
                    <tbody>
                        <tr><td><kbd>W</kbd> / <kbd>A</kbd> / <kbd>S</kbd> / <kbd>D</kbd></td><td>角色水平移动（相机相对）</td><td>点击引擎视口获取焦点后</td></tr>
                        <tr><td><kbd>Space</kbd></td><td>跳跃（高度 = 0.5 × 包围盒高度）</td><td>角色接地时</td></tr>
                        <tr><td><kbd>Ctrl</kbd></td><td>潜行（碰撞箱减半，移速 ×0.5）</td><td>角色接地时</td></tr>
                        <tr><td><kbd>Z</kbd></td><td>切换物理碰撞体线框可视化</td><td>引擎视口聚焦</td></tr>
                        <tr><td>鼠标拖拽</td><td>轨道相机旋转</td><td>引擎视口</td></tr>
                        <tr><td>滚轮</td><td>相机缩放</td><td>引擎视口</td></tr>
                        <tr><td>点击模型部位</td><td>显示部位名提示</td><td>引擎视口</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div class="toast" id="toast"></div>

    <!-- 项目私有脚本（ES Module） -->
    <script type="module" src="app.js"></script>
</body>
</html>
