<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 星月智能 』智能翻译</title>
    <link rel="stylesheet" href="/file/read/package/standard_dependency/styles.css">
    <script src="/file/read/package/standard_dependency/script.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="background"></div>
    <div class="glass-effect"></div>

    <!-- 左侧边缘触发区 -->
    <div class="sidebar-trigger" id="sidebarTrigger"></div>

    <!-- 侧边栏覆盖层 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
            <div class="sidebar-handle">
                <i class="fas fa-chevron-right" id="sidebarArrow"></i>
            </div>
            <div class="sidebar-scroll">
                <h3 class="sidebar-title"><i class="fas fa-sliders-h"></i> 功能面板</h3>

                <!-- 翻译按钮 -->
                <button id="btnTranslate" class="btn-glass btn-glass-primary btn-full">
                    <i class="fas fa-language"></i> 开始翻译
                </button>

                <!-- 目标语言 -->
                <div class="sidebar-group">
                    <label class="sidebar-label"><i class="fas fa-globe"></i> 目标语言</label>
                    <select id="targetLang" class="glass-select">
                        <option value="Chinese">中文</option>
                        <option value="English" selected>英文</option>
                        <option value="Japanese">日文</option>
                        <option value="Korean">韩文</option>
                        <option value="French">法文</option>
                        <option value="German">德文</option>
                        <option value="Spanish">西班牙文</option>
                        <option value="Russian">俄文</option>
                        <option value="Arabic">阿拉伯文</option>
                        <option value="Portuguese">葡萄牙文</option>
                        <option value="Italian">意大利文</option>
                        <option value="Thai">泰文</option>
                        <option value="Vietnamese">越南文</option>
                    </select>
                </div>

                <!-- 翻译模式 -->
                <div class="sidebar-group">
                    <label class="sidebar-label"><i class="fas fa-exchange-alt"></i> 翻译模式</label>
                    <div class="mode-toggle-group">
                        <button class="mode-btn" data-mode="full" id="modeFull">
                            <i class="fas fa-file-lines"></i> 全文
                        </button>
                        <button class="mode-btn" data-mode="line" id="modeLine">
                            <i class="fas fa-list-ul"></i> 逐行
                        </button>
                    </div>
                </div>

                <!-- 样式转换区 -->
                <div class="sidebar-group" id="styleGroup">
                    <label class="sidebar-label"><i class="fas fa-text-height"></i> 样式转换</label>
                    <div class="style-buttons-grid" id="styleButtonsGrid">
                        <button class="btn-glass btn-style" data-style="upper">全大写</button>
                        <button class="btn-glass btn-style" data-style="lower">全小写</button>
                        <button class="btn-glass btn-style" data-style="capitalize">首字母大写</button>
                        <button class="btn-glass btn-style" data-style="uncapitalize">首字母小写</button>
                        <button class="btn-glass btn-style" data-style="space_to_underscore">空格→下划线</button>
                        <button class="btn-glass btn-style" data-style="underscore_space_to_camel">→驼峰</button>
                        <button class="btn-glass btn-style" data-style="camel_to_underscore">驼峰→下划线</button>
                        <button class="btn-glass btn-style" data-style="camel_to_space">驼峰→空格</button>
                        <button class="btn-glass btn-style" data-style="space_to_hyphen">空格→中横线</button>
                        <button class="btn-glass btn-style" data-style="underscore_to_hyphen">下划线→中横线</button>
                        <button class="btn-glass btn-style" data-style="hyphen_to_underscore">中横线→下划线</button>
                        <button class="btn-glass btn-style" data-style="underscore_to_space">下划线→空格</button>
                        <button class="btn-glass btn-style" data-style="underscore_to_dot">下划线→小数点</button>
                        <button class="btn-glass btn-style" data-style="dot_to_underscore">小数点→下划线</button>
                    </div>
                    <div class="style-placeholder" id="stylePlaceholder" style="display:none;">
                        <i class="fas fa-info-circle"></i> 文本超过500字，样式转换已隐藏
                    </div>
                </div>
            </div>

            <!-- 主题切换 -->
            <div class="sidebar-footer">
                <button id="themeToggle" class="btn-glass btn-full" title="切换深色/浅色模式">
                    <i class="fas fa-moon"></i>
                    <span id="themeLabel">深色模式</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- 主布局：左右全高面板 -->
    <main class="main-layout">
        <!-- 左侧：输入面板 -->
        <section class="panel input-panel" id="inputPanel">
            <header class="panel-header">
                <span class="panel-title"><i class="fas fa-pen-to-square"></i> 输入文本</span>
                <span class="char-count" id="charCount">0 字</span>
            </header>
            <div class="panel-body" id="inputBody">
                <div class="page-drop-zone" id="dropZone">
                    <textarea id="inputText" class="page-textarea" placeholder="在此输入待翻译文本，或拖入文件..." autocomplete="off"></textarea>
                    <div class="drop-overlay" id="dropOverlay">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>释放文件以导入</span>
                    </div>
                </div>
            </div>
            <footer class="panel-footer" id="inputFooter" style="display:none;">
                <button class="btn-page" id="inputFirst" title="首页"><i class="fas fa-angle-double-left"></i></button>
                <button class="btn-page" id="inputPrev" title="上一页"><i class="fas fa-chevron-left"></i></button>
                <span class="page-info" id="inputPageInfo">第 1/1 页</span>
                <button class="btn-page" id="inputNext" title="下一页"><i class="fas fa-chevron-right"></i></button>
                <button class="btn-page" id="inputLast" title="末页"><i class="fas fa-angle-double-right"></i></button>
            </footer>
        </section>

        <!-- 右侧：输出面板 -->
        <section class="panel output-panel" id="outputPanel">
            <header class="panel-header">
                <span class="panel-title"><i class="fas fa-eye"></i> 翻译结果</span>
                <div class="panel-header-right">
                    <span class="char-count" id="outputCharCount">0 字</span>
                    <button id="btnCopy" class="btn-glass btn-sm" title="复制全部翻译结果">
                        <i class="fas fa-copy"></i> 复制
                    </button>
                </div>
            </header>
            <div class="panel-body" id="outputBody">
                <div class="output-loading" id="outputLoading" style="display:none;">
                    <div class="spinner"></div>
                    <p id="loadingText">正在翻译中...</p>
                </div>
                <div class="output-empty" id="outputEmpty">
                    <i class="fas fa-comment-dots"></i>
                    <p>翻译结果将在此处显示</p>
                </div>
                <pre class="page-content" id="outputText" style="display:none;"></pre>
                <div class="output-error" id="outputError" style="display:none;"></div>
            </div>
            <footer class="panel-footer" id="outputFooter" style="display:none;">
                <button class="btn-page" id="outputFirst" title="首页"><i class="fas fa-angle-double-left"></i></button>
                <button class="btn-page" id="outputPrev" title="上一页"><i class="fas fa-chevron-left"></i></button>
                <span class="page-info" id="outputPageInfo">第 1/1 页</span>
                <button class="btn-page" id="outputNext" title="下一页"><i class="fas fa-chevron-right"></i></button>
                <button class="btn-page" id="outputLast" title="末页"><i class="fas fa-angle-double-right"></i></button>
            </footer>
        </section>
    </main>

    <!-- Toast -->
    <div id="toast" class="toast"></div>
</body>
</html>
