<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时光宝盒 - 番茄钟 · 仪表盘时钟</title>
    <script src="/read/package/echarts.min.js"></script>
    <style>
        @import url('/read/package/fontAwesome/css/all.min.css');
        @import url('/read/package/timevault/styles.css');
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-clock"></i> 时光宝盒</h1>
            <p>实时追踪时间流逝，专注高效每一天</p>
        </div>

        <div class="dashboard">
            <div class="charts-container">
                <h2 class="charts-title">时间仪表盘</h2>
                <div class="charts-wrapper">
                    <div class="chart-item">
                        <div id="hourChart" class="chart"></div>
                        <div class="chart-title">小时</div>
                    </div>
                    <div class="chart-item">
                        <div id="minuteChart" class="chart"></div>
                        <div class="chart-title">分钟</div>
                    </div>
                    <div class="chart-item">
                        <div id="secondChart" class="chart"></div>
                        <div class="chart-title">秒钟</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <div class="time-display" id="timeDisplay">--:--:--</div>

                <div class="time-info">
                    <div>
                        <div class="value" id="dayValue">0</div>
                        <div class="label">天</div>
                    </div>
                    <div>
                        <div class="value" id="hourValue">0</div>
                        <div class="label">小时</div>
                    </div>
                    <div>
                        <div class="value" id="minuteValue">0</div>
                        <div class="label">分钟</div>
                    </div>
                    <div>
                        <div class="value" id="secondValue">0</div>
                        <div class="label">秒</div>
                    </div>
                </div>

                <div class="control-group">
                    <h3><i class="fas fa-calendar-alt"></i> 时间格式</h3>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="timeFormat" value="12" checked>
                            <span>12小时制</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="timeFormat" value="24">
                            <span>24小时制</span>
                        </label>
                    </div>
                </div>

                <!-- 番茄钟控制区域 -->
                <div class="control-group">
                    <h3><i class="fas fa-hourglass-half"></i> 番茄钟</h3>
                    <div class="pomodoro-status" id="pomodoroStatus">准备开始</div>
                    <div class="pomodoro-timer" id="pomodoroTimer">25:00</div>
                    <div class="pomodoro-settings">
                        <label>专注 <input type="number" id="focusMinutes" value="25" min="1" max="60"> 分钟</label>
                        <label>休息 <input type="number" id="breakMinutes" value="5" min="1" max="30"> 分钟</label>
                    </div>
                    <div class="pomodoro-buttons">
                        <button id="startPomodoro"><i class="fas fa-play"></i> 开始</button>
                        <button id="pausePomodoro"><i class="fas fa-pause"></i> 暂停</button>
                        <button id="resetPomodoro"><i class="fas fa-redo"></i> 重置</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/read/package/timevault/script.js"></script>
</body>

</html>
