<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 星月智能 』基岩渲染引擎</title>
    <link rel="stylesheet" href="/file/read/package/standard_dependency/styles.css">
    <script src="/file/read/package/standard_dependency/script.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script defer type="module" src="app.js"></script>
</head>
<body>
    <!-- 背景层 -->
    <div class="background"></div>
    <div class="glass-effect"></div>

    <!-- 主渲染画布 -->
    <canvas id="render-canvas"></canvas>

    <!-- 左上角：状态气泡（轮播） -->
    <div id="status-bubble" class="status-bubble glass-panel">
        <i class="fas fa-tachometer-alt" id="status-icon"></i>
        <span id="status-text">就绪</span>
    </div>

    <!-- 右下角：浮动按钮组 -->
    <div id="fab-container" class="fab-container">
        <button class="fab-btn glass-panel" id="btn-import" title="导入资源">
            <i class="fas fa-folder-open"></i>
        </button>
        <button class="fab-btn glass-panel" id="btn-movement" title="移动控制">
            <i class="fas fa-arrows-alt"></i>
        </button>
        <button class="fab-btn glass-panel" id="btn-toggle-panels" title="切换面板">
            <i class="fas fa-columns"></i>
        </button>
        <button class="fab-btn glass-panel" id="btn-theme" title="切换主题">
            <i class="fas fa-moon"></i>
        </button>
        <button class="fab-btn glass-panel" id="btn-help" title="操作说明">
            <i class="fas fa-question"></i>
        </button>
    </div>
    <input type="file" id="resource-file-input" accept=".bbmodel,.json" multiple style="display:none">

    <!-- 左侧面板：骨骼层级 + 动画组编辑（默认隐藏） -->
    <div id="left-panel" class="glass-panel side-panel side-panel-left" style="display:none">
        <div class="panel-tabs">
            <div class="panel-tab active" data-tab="hierarchy">骨骼层级</div>
            <div class="panel-tab" data-tab="agm-editor" style="display:none">动画组编辑</div>
        </div>
        <div id="tab-hierarchy" class="panel-body">
            <div id="hierarchy-tree">
                <div class="empty-state">
                    <i class="fas fa-bone"></i>
                    <p>暂无模型</p>
                </div>
            </div>
        </div>
        <div id="tab-agm-editor" class="panel-body" style="display:none">
            <div id="agm-editor" class="agm-editor" style="display:none"></div>
        </div>
    </div>

    <!-- 右侧面板：动画组管理（默认隐藏） -->
    <div id="right-panel" class="glass-panel side-panel side-panel-right" style="display:none">
        <div class="panel-tabs">
            <div class="panel-tab active" data-tab="anim-groups">动画组</div>
        </div>
        <div id="tab-anim-groups" class="panel-body">
            <div id="anim-group-container">
                <div class="empty-state">
                    <i class="fas fa-layer-group"></i>
                    <p>无动画组</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 模态层 -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content glass-panel" id="modal-content"></div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>
</body>
</html>
