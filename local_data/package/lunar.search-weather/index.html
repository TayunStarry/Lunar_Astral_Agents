<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>『 星月智能 』实时天气与新闻</title>
	<!-- 标准样式库 -->
	<link rel="stylesheet" href="/file/read/package/standard_dependency/styles.css">
	<!-- 标准脚本库 -->
	<script src="/file/read/package/standard_dependency/script.js"></script>
	<!-- 项目私有样式 -->
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<div class="background"></div>
	<div class="glass-effect"></div>

	<!-- 主布局：左右全高面板 -->
	<main class="main-layout">
		<!-- 左侧：查询输入 + 历史记录 -->
		<section class="panel input-panel">
			<header class="panel-header">
				<span class="panel-title"><i class="fas fa-cloud-sun-rain"></i> 实时查询</span>
				<div class="panel-header-right">
					<button class="btn-glass btn-sm btn-clear" id="themeToggle" title="切换深色/浅色模式">
						<i class="fas fa-moon" id="themeIcon"></i><span id="themeLabel">深色</span>
					</button>
				</div>
			</header>
			<div class="panel-body input-body">
				<div class="query-zone">
					<div class="search-row">
						<i class="fas fa-magnifying-glass"></i>
						<input type="text" id="cityInput" placeholder="输入城市，如 北京、上海、Tokyo" autocomplete="off" spellcheck="false">
					</div>
					<div class="query-btns">
						<button class="btn-glass btn-glass-primary" id="weatherBtn"><i class="fas fa-cloud-sun-rain"></i> 查询天气</button>
						<button class="btn-glass" id="newsBtn"><i class="fas fa-newspaper"></i> 新闻</button>
					</div>
					<div class="query-hint">
						<i class="fas fa-circle-info"></i>
						也可通过月华呼叫琉璃，用自然语言直接查询（如「查询北京今天的天气」「今天有什么新闻」）。
					</div>
				</div>

				<div class="panel-separator"></div>

				<div class="subsection-header">
					<span class="panel-title"><i class="fas fa-clock-rotate-left"></i> 历史记录</span>
					<button class="btn-glass btn-sm btn-clear" id="clearHistoryBtn" title="清空历史"><i class="fas fa-broom"></i> 清空</button>
				</div>
				<div class="list-scroll" id="historyList">
					<div class="list-empty">暂无查询记录。</div>
				</div>
			</div>
		</section>

		<!-- 右侧：查询结果 + 月华操作步骤 -->
		<section class="panel output-panel">
			<header class="panel-header">
				<span class="panel-title"><i class="fas fa-display"></i> 查询结果</span>
				<div class="panel-header-right">
					<span class="char-count" id="resultCount"></span>
				</div>
			</header>
			<div class="panel-body output-body">
				<div class="result-body" id="resultBody">
					<div class="result-empty"><i class="fas fa-circle-info"></i> 暂无结果，请手动查询或等待月华指令。</div>
				</div>

				<div class="panel-separator"></div>

				<div class="step-section">
					<div class="subsection-header">
						<span class="panel-title"><i class="fas fa-list-ul"></i> 月华操作步骤</span>
						<button class="btn-glass btn-sm btn-clear" id="clearStepBtn" title="清空步骤"><i class="fas fa-broom"></i> 清空</button>
					</div>
					<div class="list-scroll step-scroll" id="stepList">
						<div class="list-empty">暂无月华操作记录。</div>
					</div>
				</div>
			</div>
		</section>
	</main>

	<!-- Toast -->
	<div id="toast" class="toast"></div>

	<script src="ltpx-agent.js"></script>
	<script src="script.js"></script>
</body>

</html>
