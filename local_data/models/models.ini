[system-multimodal]
# 多模态模型配置
model = ./local_data/models/Gemma-4-12B/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
# 多模态模型的草稿模型路径
model-draft = ./local_data/models/Gemma-4-12B/mtp-gemma-4-12B-it.gguf
# 多模态模型的 mmproj 模型路径
mmproj = ./local_data/models/Gemma-4-12B/mmproj-BF16.gguf
# 推测解码类型：使用多令牌预测草稿模型
spec-type = draft-mtp
# 推测解码最大草稿令牌数
spec-draft-n-max = 2
# 上下文窗口大小：20K tokens
ctx-size = 20480
# 推理模式：禁用
reasoning = off
# 主模型 K 缓存量化：8 位
# cache-type-k = q8_0
# 主模型 V 缓存量化：8 位
# cache-type-v = q8_0
# 草稿模型的 K 缓存数据类型
# spec-draft-type-k = q8_0
# 草稿模型的 V 缓存数据类型
# spec-draft-type-v = q8_0

[system-embedding]
# 嵌入模型配置
model = ./local_data/models/Qwen3-Embedding-0.6B-Q8_0.gguf
# 是否启用嵌入模型
embeddings = true
# 禁用推测解码
spec-type = none
# 推理模式：关闭
reasoning = off
# 嵌入模型的上下文大小
ctx-size = 4096 
# 禁用使用 GPU 加速推理
n-gpu-layers = 0

[system-asr]
# 语音识别模型路径
model = ./local_data/models/Qwen3-ASR-0.6B/Qwen3-ASR-0.6B-Q8_0.gguf
# 音频编码器模型路径
mmproj = ./local_data/models/Qwen3-ASR-0.6B/mmproj-Qwen3-ASR-0.6B-Q8_0.gguf
# 禁用推测解码
spec-type = none
# 推理模式：关闭
reasoning = off
# 上下文大小：音频约 10 token/秒，4K 可容纳约 5 分钟语音
ctx-size = 4096
# 禁用 GPU 加速推理
n-gpu-layers = 0
# 温度：转写任务固定输出
temperature = 0.0