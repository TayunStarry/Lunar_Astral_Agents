[primary_reasoning]
# 主模型路径
model = ./local_data/models/primary_reasoning/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
# 草稿模型路径
model-draft = ./local_data/models/primary_reasoning/mtp-gemma-4-12B-it.gguf
# 映射模型路径
mmproj = ./local_data/models/primary_reasoning/mmproj-BF16.gguf
# 推测解码类型：使用多令牌预测草稿模型
spec-type = draft-mtp
# 推测解码最大草稿令牌数
spec-draft-n-max = 2
# 上下文窗口大小：20480 tokens
ctx-size = 20480
# 推理模式：自动选择
reasoning = auto
# 量化 KV 缓存，降低 20480 上下文的显存占用
cache-type-k = q8_0
cache-type-v = q8_0

[light_reasoning]
# 主模型路径
model = ./local_data/models/light_reasoning/Qwen3-0.6B-UD-Q4_K_XL.gguf
# 上下文窗口大小：32768 tokens
ctx-size = 32768
# 禁用推测解码
spec-type = none
# 推理模式：自动选择
reasoning = auto

[music_generation]
# 主模型路径
model = ./local_data/models/music_generation/midi-llm-1b-q4_k_m.gguf
# 上下文窗口大小：8192 tokens
ctx-size = 8192
# 禁用推测解码
spec-type = none
# 模型无思维链
reasoning = off

[text_embedding]
# 主模型路径
model = ./local_data/models/text_embedding/Qwen3-Embedding-0.6B-Q8_0.gguf
# 启用嵌入模型
embeddings = true
# 禁用推测解码
spec-type = none
# 推理模式：关闭
reasoning = off
# 上下文窗口大小：4096 tokens
ctx-size = 4096 
# 禁用使用 GPU 加速推理
n-gpu-layers = 0

[audio_transcriber]
# 主模型路径
model = ./local_data/models/audio_transcriber/Qwen3-ASR-0.6B-Q8_0.gguf
# 映射模型路径
mmproj = ./local_data/models/audio_transcriber/mmproj-Qwen3-ASR-0.6B-Q8_0.gguf
# 禁用推测解码
spec-type = none
# 推理模式：关闭
reasoning = off
# 上下文窗口大小：4096 tokens
ctx-size = 4096
# 禁用 GPU 加速推理
n-gpu-layers = 0
# 温度：转写任务固定输出
temperature = 0.0