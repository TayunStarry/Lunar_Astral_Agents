window.addEventListener("error", e => window.__errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", e => window.__errors.push(String(e.reason)));

const NS = "http://www.w3.org/2000/svg";
const nodeEls = {};
const edgeItems = [];
const edgeMap = {};
let curveAudit = null;

let litMap = new Map();
let rafId = null;
let lastTs = 0;
let restTimer = null;
let eventTimer = null;
let pinned = null;
let particle = null;

/* 自动轮播：最近 4 场去重；一场结束后 2–4 秒再抽下一场 */
const RECENT_WINDOW = 4;
const REST_MIN = 2000, REST_MAX = 4000;
const state = {
  scene:0, def:null, run:null, speed:1, playing:false, playhead:0, finished:false,
  started:[], arrived:[], tone:"system", auto:true, testing:false,
  recent:[], touched:new Set(), journal:[]
};

/* 调试 turbo：加速轮播用于无头压测（默认不启用） */
const turbo = params.get("turbo") === "1";
const hud = params.get("hud") === "1"
  ? Object.assign(document.createElement("div"), {id:"hud"}) : null;
if (hud){
  hud.style.cssText = "position:fixed;right:14px;top:42px;z-index:50;font:10px Consolas,monospace;"
    + "color:#9fd8ee;background:rgba(5,12,22,.7);padding:4px 8px;border-radius:6px;pointer-events:none";
  document.body.appendChild(hud);
}
function restDelay(){
  return turbo ? 260 + Math.random() * 240
    : REST_MIN + Math.random() * (REST_MAX - REST_MIN);
}

const liveOffsets = {};
let motionRaf = null, motionStart = 0;

function isFar(n){ return n.layer === "engine" || n.layer === "protocol"; }

function makeNode(n){
  const el = document.createElement("div");
  el.className = "node " + n.layer + (n.chip ? " chip" : "") + (n.core ? " core" : "") + (isFar(n) ? " far" : "");
  el.id = "n-" + n.id;
  el.dataset.id = n.id;
  el.style.left = n.x + "px";
  el.style.top = n.y + "px";
  el.style.width = n.w + "px";
  el.style.height = n.h + "px";
  if (!reduceMotion){
    el.style.setProperty("--bd", (6 + rnd(n.id, "bd") * 7).toFixed(1) + "s");
    el.style.setProperty("--fdl", "-" + (rnd(n.id, "dl") * 12).toFixed(1) + "s");
  }
  el.style.transform = "translate3d(0,0,0) scale(1)";
  el.innerHTML = '<span class="orb"></span><span class="l">' + (n.short || n.title) + '</span>';
  el.setAttribute("aria-label", n.title);
  el.addEventListener("mouseenter", () => {
    if (pinned !== el) showTip(n);
  });
  el.addEventListener("mouseleave", () => {
    if (!pinned || pinned !== el) hideTip();
  });
  el.addEventListener("click", ev => {
    ev.stopPropagation();
    if (pinned === el){ pinned = null; el.classList.remove("pin"); hideTip(); return; }
    if (pinned) pinned.classList.remove("pin");
    pinned = el;
    el.classList.add("pin");
    showTip(n);
  });
  (isFar(n) ? farLayer : nearLayer).appendChild(el);
  nodeEls[n.id] = el;
}

function nodesElFor(n){ return nodeEls[n.id]; }

function baseOpacity(kind){
  if (kind === "engine") return 0.05;
  if (kind === "tool") return 0.34;
  if (kind === "in") return 0.26;
  return 0.22;
}

/* 端点端子：每帧跟随卡片边框，让线看起来是「接上去」的 */
function addEndpointDots(geom, color, tool){
  const dots = [];
  [geom.p1, geom.p2].forEach(p => {
    const dot = document.createElementNS(NS, "circle");
    dot.setAttribute("cx", p.x.toFixed(1));
    dot.setAttribute("cy", p.y.toFixed(1));
    dot.setAttribute("r", tool ? "2.6" : "1.9");
    dot.setAttribute("fill", color);
    dot.setAttribute("opacity", tool ? "0.78" : "0.55");
    fx.appendChild(dot);
    dots.push(dot);
  });
  return dots;
}

function makeEdges(){
  const routes = planRoutes();
  EDGES.forEach((e, i) => {
    const a = nav[e.from], b = nav[e.to];
    const rt = routes[i];
    if (!a || !b || !rt) return;
    const key = e.from + "|" + e.to;
    const geom = curveOf(rt, a, b);
    geom.soft = rt.soft;
    const far = e.kind === "engine";
    const color = TONE[e.kind] || TONE.in;
    const d0 = pathData(geom);
    const path = document.createElementNS(NS, "path");
    path.setAttribute("class", "edge");
    path.setAttribute("d", d0);
    path.dataset.from = e.from;
    path.dataset.to = e.to;
    path.style.stroke = color;
    path.style.opacity = String(geom.soft ? baseOpacity(e.kind) * 0.55 : baseOpacity(e.kind));
    path.style.strokeWidth = far ? "0.9px" : (e.kind === "tool" ? "1.35px" : "1.15px");
    if (!far && e.kind === "tool") path.style.filter = "drop-shadow(0 0 3px " + color + ")";
    (far ? farEdgesSvg : edgesSvg).appendChild(path);
    const item = {
      def:e, el:path, geom:geom, far:far, key:key, color:color,
      a:a, b:b, dots:null, lastD:d0, live:null,
      ua:rt.ua, ub:rt.ub, bA:rt.bA, bB:rt.bB
    };
    if (!far) item.dots = addEndpointDots(geom, color, e.kind === "tool");
    edgeItems.push(item);
    edgeMap[key] = item;
  });
  /* 曲线形态自检（投影单调 / 自环 / 重复边 / 同节点最小夹角） */
  curveAudit = auditCurves(routes);
}

/* 每帧重算端点：按锚点槽位落在当前帧卡片边框上，控制点随位移同步 */
function syncEdges(){
  edgeItems.forEach(it => {
    const sa = liveOffsets[it.a.id] || ZERO_OFFSET;
    const sb = liveOffsets[it.b.id] || ZERO_OFFSET;
    const ra = rectOf(it.a, sa), rb = rectOf(it.b, sb);
    const p1 = perimeterPoint(ra, it.ua);
    const p2 = perimeterPoint(rb, it.ub);
    const g = curveFromPoints(p1, p2, it.bA, it.bB);
    it.live = g;
    const d = pathData(g);
    if (d !== it.lastD){
      it.el.setAttribute("d", d);
      it.lastD = d;
    }
    if (it.dots){
      it.dots[0].setAttribute("cx", p1.x.toFixed(1));
      it.dots[0].setAttribute("cy", p1.y.toFixed(1));
      it.dots[1].setAttribute("cx", p2.x.toFixed(1));
      it.dots[1].setAttribute("cy", p2.y.toFixed(1));
    }
  });
}

function startMotion(){
  if (reduceMotion){
    nodes.forEach(n => { liveOffsets[n.id] = ZERO_OFFSET; });
    syncEdges();
    return;
  }
  if (motionRaf) return;
  motionRaf = requestAnimationFrame(motionFrame);
}

function applyMotion(t){
  for (let i = 0; i < nodes.length; i++){
    const n = nodes[i];
    const o = offsetAt(n, t);
    liveOffsets[n.id] = o;
    const el = nodeEls[n.id];
    if (el){
      el.style.transform = "translate3d(" + o.dx.toFixed(2) + "px," + o.dy.toFixed(2) +
        "px,0) scale(" + o.s.toFixed(4) + ")";
    }
  }
  syncEdges();
}

function motionFrame(ts){
  if (motionStart === 0){
    motionStart = ts;
    return requestAnimationFrame(motionFrame);
  }
  notePerf(ts);
  const t = FLOAT_HOLD != null ? FLOAT_HOLD : (ts - motionStart) / 1000;
  applyMotion(t);
  motionRaf = requestAnimationFrame(motionFrame);
}

/* 分派边：工具分派 → 各链 / 智能体 / 执行体，以及链 → 下属 */
const DISPATCH_KEYS = EDGES.filter((e, i) => e.kind === "tool" ||
  (nav[e.from] && nav[e.from].layer === "chain" && nav[e.to] &&
   (nav[e.to].layer === "agent" || nav[e.to].layer === "executor")));

function auditEdges(){
  let hanging = 0, crossings = 0, soft = 0;
  const softList = [];
  EDGES.forEach(e => {
    if (!nav[e.from] || !nav[e.to]) hanging++;
  });
  edgeItems.forEach(it => {
    if (it.far) return;
    if (it.geom.soft){ soft++; crossings++; softList.push(it.def.from + ">" + it.def.to); }
  });
  return {hanging:hanging, crossings:crossings, soft:soft, softList:softList};
}

function auditDispatch(){
  let total = 0, missing = 0;
  DISPATCH_KEYS.forEach(e => {
    total++;
    if (!nav[e.from] || !nav[e.to]) missing++;
  });
  return {total:total, missing:missing};
}

/* 边与边交叉计数（采样折线段求交），用于新旧曲率对比 */
function segHit(a, b, c, d){
  const d1 = (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
  const d2 = (b.x - a.x) * (d.y - a.y) - (b.y - a.y) * (d.x - a.x);
  const d3 = (d.x - c.x) * (a.y - c.y) - (d.y - c.y) * (a.x - c.x);
  const d4 = (d.x - c.x) * (b.y - c.y) - (d.y - c.y) * (b.x - c.x);
  return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
}
function edgePolyline(it, n){
  const g = it.live || it.geom;
  const pts = [];
  for (let i = 0; i <= n; i++){
    const t = i / n;
    pts.push(g.mode === "Q" ? quadPoint(g.p1, g.c, g.p2, t) : cubicPoint(g.p1, g.c1, g.c2, g.p2, t));
  }
  return pts;
}
function auditEdgeCrossings(){
  const fg = edgeItems.filter(it => !it.far);
  const polys = fg.map(it => edgePolyline(it, 14));
  let pairs = 0;
  const list = [];
  const per = fg.map(() => 0);
  for (let i = 0; i < fg.length; i++){
    for (let j = i + 1; j < fg.length; j++){
      const A = polys[i], B = polys[j];
      let hit = false;
      for (let x = 0; x < A.length - 1 && !hit; x++){
        for (let y = 0; y < B.length - 1; y++){
          if (segHit(A[x], A[x + 1], B[y], B[y + 1])){ hit = true; break; }
        }
      }
      if (hit){
        pairs++;
        per[i]++; per[j]++;
        if (list.length < 12) list.push(fg[i].key + " × " + fg[j].key);
      }
    }
  }
  const top = fg.map((it, i) => ({key:it.key, n:per[i]})).filter(x => x.n > 0).sort((a, b) => b.n - a.n).slice(0, 10);
  return {pairs:pairs, list:list, top:top};
}

function setupParticle(){
  const g = document.createElementNS(NS, "g");
  g.setAttribute("opacity", "0");
  particle = {g:g, dots:[]};
  const radii = [3.4, 2.3, 1.5, 1];
  radii.forEach((r, i) => {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("r", String(r));
    c.setAttribute("fill", TONE.in);
    c.setAttribute("opacity", String(0.95 - i * 0.22));
    g.appendChild(c);
    particle.dots.push(c);
  });
  fx.appendChild(g);
}

function showTip(n){
  const m = n.meta || {};
  tip.innerHTML = '<div class="tt">' + n.title + '</div>' +
    '<div class="row"><div class="k">包路径</div><div class="v"><code>' + (m.path || "—") + '</code></div>' +
    '<div class="k">上报 ID</div><div class="v">' + (m.report || "—") + '</div>' +
    '<div class="k">模型</div><div class="v">' + (m.model || "—") + '</div>' +
    '<div class="k">能力</div><div class="v">' + (m.tools || "—") + '</div></div>';
  const el = nodeEls[n.id];
  const rect = el.getBoundingClientRect();
  const x = Math.min(window.innerWidth - 350, Math.max(10, rect.right + 10));
  const y = Math.min(window.innerHeight - 150, Math.max(10, rect.top - 6));
  tip.style.left = x + "px";
  tip.style.top = y + "px";
  tip.classList.add("on");
}

function hideTip(){
  tip.classList.remove("on");
}

function pulse(n, tone, strong){
  const el = nodeEls[n.id];
  if (!el) return;
  el.style.setProperty("--hc", colorRgb(TONE[tone] || TONE.system));
  el.classList.add("hot");
  setTimeout(() => el.classList.remove("hot"), strong ? 820 : 520);
  if (strong && !reduceMotion){
    const off = liveOffsets[n.id] || ZERO_OFFSET;
    const ripple = document.createElement("div");
    ripple.className = "ripple";
    ripple.style.left = (n.x + n.w / 2 + off.dx) + "px";
    ripple.style.top = (n.y + n.h / 2 + off.dy) + "px";
    ripple.style.setProperty("--rc", colorRgb(TONE[tone] || TONE.system));
    (isFar(n) ? farLayer : nearLayer).appendChild(ripple);
    ripple.addEventListener("animationend", () => ripple.remove());
  }
}

function colorRgb(hex){
  const h = hex.replace("#", "");
  const v = parseInt(h, 16);
  return ((v >> 16) & 255) + "," + ((v >> 8) & 255) + "," + (v & 255);
}

function lightEdge(step){
  if (!step.from || !step.to) return;
  const item = edgeMap[step.from + "|" + step.to];
  if (!item) return;
  const color = TONE[step.tone] || TONE.in;
  const engine = item.def.kind === "engine";
  item.el.style.stroke = color;
  item.el.style.opacity = engine ? "0.66" : "0.92";
  item.el.style.strokeWidth = item.far ? "1.5px" : (engine ? "1.7px" : "2.2px");
  item.el.style.filter = "drop-shadow(0 0 " + (engine ? "3px" : "5px") + " " + color + ")";
  item.el.classList.add("lit");
  if (item.dots){
    item.dots.forEach(d => {
      d.setAttribute("fill", color);
      d.setAttribute("opacity", "0.95");
    });
  }
  litMap.set(item.key, step.tone);
  particle.g.setAttribute("opacity", "1");
  particle.dots.forEach(c => c.setAttribute("fill", color));
}

function clearLit(){
  litMap = new Map();
  edgeItems.forEach(item => {
    const kind = item.def.kind;
    item.el.style.stroke = item.color;
    item.el.style.opacity = String(item.geom.soft ? baseOpacity(kind) * 0.55 : baseOpacity(kind));
    item.el.style.strokeWidth = item.far ? "0.9px" : (kind === "tool" ? "1.35px" : "1.15px");
    item.el.style.filter = (!item.far && kind === "tool")
      ? "drop-shadow(0 0 3px " + item.color + ")" : "none";
    item.el.classList.remove("lit");
    if (item.dots){
      item.dots.forEach(d => {
        d.setAttribute("fill", item.color);
        d.setAttribute("opacity", item.def.kind === "tool" ? "0.78" : "0.55");
      });
    }
  });
  if (particle) particle.g.setAttribute("opacity", "0");
}

/* 演一场时把没走到的边压到几乎不可见，让当前链路成为唯一亮面 */
function dimUnlit(){
  edgeItems.forEach(item => {
    item.el.style.opacity = item.far ? "0.02" : "0.045";
    item.el.style.strokeWidth = item.far ? "0.8px" : "1px";
    item.el.style.filter = "none";
    if (item.dots){
      item.dots.forEach(d => d.setAttribute("opacity", "0.10"));
    }
  });
}

function showEvent(text, tone){
  eventEl.textContent = text;
  eventEl.style.color = TONE[tone] || TONE.system;
  eventEl.classList.add("on");
  clearTimeout(eventTimer);
  eventTimer = setTimeout(() => eventEl.classList.remove("on"), 3200);
}

/* ==================================================================
   播放状态机 + 自动轮播
   ================================================================== */
function sceneSteps(){ return state.run ? state.run.steps : []; }
function sceneTotal(){ return sceneSteps().reduce((s, x) => s + (x.dur || 1000), 0); }
function sceneStart(i){
  let acc = 0;
  for (let k = 0; k < i; k++) acc += sceneSteps()[k].dur || 1000;
  return acc;
}
function currentIndex(t){
  const steps = sceneSteps();
  let acc = 0;
  for (let i = 0; i < steps.length; i++){
    const d = steps[i].dur || 1000;
    if (t < acc + d) return i;
    acc += d;
  }
  return steps.length;
}
function arrivalAt(i){ return sceneStart(i) + (sceneSteps()[i].dur || 1000) * 0.75; }

/* 每场只点亮走过的节点：其余先压暗，走到时再解除 */
function touchNode(id){
  const el = nodeEls[id];
  if (el && !state.touched.has(id)){
    state.touched.add(id);
    el.classList.remove("dim");
  }
}

function resetSceneVisuals(){
  clearLit();
  dimUnlit();
  Object.keys(nodeEls).forEach(id => {
    nodeEls[id].classList.remove("hot");
    nodeEls[id].classList.add("dim");
  });
  state.touched = new Set();
  barEl.style.width = "0%";
  if (particle) particle.g.setAttribute("opacity", "0");
}

function startStep(i){
  const st = sceneSteps()[i];
  state.tone = st.tone || "system";
  if (st.from){
    lightEdge(st);
    touchNode(st.from);
    const src = nav[st.from];
    if (src) pulse(src, state.tone, false);
  }
  if (st.stay) touchNode(st.stay);
  if (st.log) showEvent(st.log, state.tone);
}

function arriveStep(i){
  const st = sceneSteps()[i];
  const target = nav[st.to || st.stay];
  if (target){
    touchNode(target.id);
    pulse(target, st.tone || "system", true);
  }
}

function renderAt(t){
  const steps = sceneSteps();
  const total = sceneTotal();
  let idx = 0, local = 0, acc = 0, found = false;
  for (let i = 0; i < steps.length; i++){
    const d = steps[i].dur || 1000;
    if (t < acc + d){ idx = i; local = t - acc; found = true; break; }
    acc += d;
  }
  if (!found){ idx = steps.length; local = 0; }

  for (let i = 0; i < steps.length; i++){
    if (!state.started[i] && (i <= idx)){
      state.started[i] = true;
      startStep(i);
    }
  }
  for (let i = 0; i < steps.length; i++){
    if (state.started[i] && !state.arrived[i] && t >= arrivalAt(i)){
      state.arrived[i] = true;
      arriveStep(i);
    }
  }

  if (found && steps[idx].from && steps[idx].to){
    const dur = steps[idx].dur || 1000;
    const p = Math.max(0, Math.min(1, local / dur));
    drawParticle(idx, p);
  } else if (particle){
    particle.g.setAttribute("opacity", "0");
  }

  barEl.style.width = (Math.min(1, t / total) * 100).toFixed(1) + "%";

  if (t >= total) finishScene();
}

function drawParticle(idx, p){
  const st = sceneSteps()[idx];
  const item = edgeMap[st.from + "|" + st.to];
  if (!item) return;
  const path = item.el;
  const len = path.getTotalLength();
  const head = Math.min(0.96, 0.06 + p * 0.9);
  particle.g.setAttribute("opacity", p > 0.02 ? "1" : "0");
  particle.dots.forEach((c, i) => {
    const d = Math.max(0, (head - i * 0.028) * len);
    const pt = path.getPointAtLength(d);
    c.setAttribute("cx", pt.x.toFixed(1));
    c.setAttribute("cy", pt.y.toFixed(1));
  });
}

/* ---- 剧目浮字：播完约半秒后淡出 ---- */
function showNow(){
  const r = state.run;
  if (!r) return;
  const tagText = r.tag === "self" ? "自发" :
    (r.tag === "system" ? "外部" : (r.tag === "platform" ? "平台" : "用户"));
  nowEl.innerHTML = "<b>" + tagText + "</b>" + r.name + " · " + r.hint;
  nowEl.classList.toggle("self", r.tag === "self");
  nowEl.classList.add("on");
}

/* ---- 加权随机 + 最近 4 场去重 ---- */
function pickNextScenario(exceptId){
  const blocked = new Set(state.recent);
  if (exceptId) blocked.add(exceptId);
  const poolTotal = SCENARIOS.reduce((s, d) => s + (d.weight || 1), 0);
  for (let tries = 0; tries < 60; tries++){
    let r = Math.random() * poolTotal;
    let pick = SCENARIOS[0];
    for (let i = 0; i < SCENARIOS.length; i++){
      r -= (SCENARIOS[i].weight || 1);
      if (r <= 0){ pick = SCENARIOS[i]; break; }
    }
    if (!blocked.has(pick.id)) return SCENARIOS.indexOf(pick);
  }
  const idx = SCENARIOS.findIndex(d => !blocked.has(d.id));
  return idx >= 0 ? idx : 0;
}

function markRecent(def){
  state.recent.push(def.id);
  while (state.recent.length > RECENT_WINDOW) state.recent.shift();
}

function syncJournal(){
  canvas.dataset.journal = JSON.stringify({
    n:state.journal.length,
    scenes:state.journal.map(j => j.id),
    ends:state.journal.filter(j => j.end !== null).length,
    recent:state.recent.slice()
  });
  if (hud){
    hud.textContent = "轮播 " + state.journal.length + " 场 · 收束 " +
      state.journal.filter(j => j.end !== null).length + " · 最近 " +
      state.recent.join(",") + " · 当前 " + (state.run ? state.run.id : "-");
  }
}

function finishScene(){
  if (state.finished) return;
  state.finished = true;
  state.playing = false;
  const lastRun = state.journal[state.journal.length - 1];
  if (lastRun && lastRun.end === null) lastRun.end = Math.round(performance.now());
  syncJournal();
  cancelAnimationFrame(rafId);
  btnPlay.textContent = "▶";
  if (particle) particle.g.setAttribute("opacity", "0");
  barEl.style.width = "100%";
  /* 收束：全部边回暗 + 节点解除压暗，留一段静场 */
  clearLit();
  Object.keys(nodeEls).forEach(id => nodeEls[id].classList.remove("dim"));
  showEvent("本场收束 · " + (state.run ? state.run.name : ""), "system");
  setTimeout(() => nowEl.classList.remove("on"), 520);
  if (state.auto && !state.testing){
    restTimer = setTimeout(() => { loadScene(null, true, true); }, restDelay());
  }
}

function loadScene(i, autoplay, fromAuto){
  clearTimeout(restTimer);
  nowEl.classList.remove("on");
  const idx = (i === null || i === undefined)
    ? pickNextScenario(state.def ? state.def.id : null)
    : Math.max(0, Math.min(SCENARIOS.length - 1, i));
  state.scene = idx;
  state.def = SCENARIOS[idx];
  state.run = buildScene(state.def);
  markRecent(state.def);
  state.journal.push({
    id:state.run.id, tag:state.run.tag, run:state.run.run,
    steps:state.run.steps.length, total:Math.round(sceneTotal()),
    at:Math.round(performance.now()), end:null
  });
  if (state.journal.length > 80) state.journal.shift();
  syncJournal();
  state.playhead = 0;
  state.finished = false;
  state.started = [];
  state.arrived = [];
  resetSceneVisuals();
  showNow();
  btnPlay.textContent = "▶";
  if (autoplay) play();
}
function restartCurrent(){
  loadScene(state.scene, true);
}
function nextScene(){
  loadScene(null, true, true);
}

function play(){
  if (state.finished || state.playhead >= sceneTotal()){
    if (state.auto) nextScene();
    else restartCurrent();
    return;
  }
  clearTimeout(restTimer);
  state.playing = true;
  btnPlay.textContent = "⏸";
  lastTs = 0;
  rafId = requestAnimationFrame(frame);
}

function pause(){
  state.playing = false;
  cancelAnimationFrame(rafId);
  btnPlay.textContent = "▶";
}

function frame(ts){
  if (!state.playing) return;
  if (!lastTs) lastTs = ts;
  const dt = Math.min(64, ts - lastTs);
  lastTs = ts;
  state.playhead += dt * state.speed;
  renderAt(state.playhead);
  if (state.playing) rafId = requestAnimationFrame(frame);
}

function seekTo(t){
  const total = sceneTotal();
  const target = Math.max(0, Math.min(total, t));
  cancelAnimationFrame(rafId);
  state.playing = false;
  state.finished = false;
  state.started = [];
  state.arrived = [];
  resetSceneVisuals();
  state.playhead = target;
  /* 不预置 started：让 renderAt 依序补跑 startStep，seek / 单步也能正确点亮连线 */
  renderAt(target);
  btnPlay.textContent = "▶";
  if (!state.finished) barEl.style.width = (target / total * 100).toFixed(1) + "%";
}

function stepOnce(){
  cancelAnimationFrame(rafId);
  state.playing = false;
  btnPlay.textContent = "▶";
  if (state.finished){ state.finished = false; }
  const idx = currentIndex(state.playhead);
  const total = sceneTotal();
  const next = idx >= sceneSteps().length ? total : Math.min(total, sceneStart(idx + 1));
  seekTo(next === total ? total : next);
}

function setAuto(on){
  state.auto = !!on;
  btnAuto.textContent = state.auto ? "自动" : "手动";
  btnAuto.classList.toggle("on", state.auto);
  if (!state.auto) clearTimeout(restTimer);
  else if (state.finished && !state.playing) nextScene();
}


/* ==================================================================
   控件与启动
   ================================================================== */
btnPlay.addEventListener("click", () => { state.playing ? pause() : play(); });
btnNext.addEventListener("click", () => { nextScene(); });
btnAuto.addEventListener("click", () => setAuto(!state.auto));
function cycleSpeed(){
  state.speed = state.speed === 1 ? 2 : (state.speed === 2 ? 0.5 : 1);
  speedBtn.textContent = state.speed + "×";
}
speedBtn.addEventListener("click", cycleSpeed);

/* 空格：播放 / 暂停；→：下一场；↓：单步 */
document.addEventListener("keydown", ev => {
  if (ev.key === " "){ ev.preventDefault(); state.playing ? pause() : play(); }
  else if (ev.key === "ArrowRight") nextScene();
  else if (ev.key === "ArrowDown"){ ev.preventDefault(); stepOnce(); }
});

document.addEventListener("click", () => {
  if (pinned){ pinned.classList.remove("pin"); pinned = null; hideTip(); }
});
window.addEventListener("resize", fit);

function fit(){
  const s = Math.min(1, (window.innerWidth - 24) / W, (window.innerHeight - 20) / H);
  stage.style.transform = "scale(" + s.toFixed(3) + ")";
}

/* 构建：先跑 3 个种子的布局自检，再回到 0 号种子落位 */
const seedAudit = auditLayout();

/* 连线多帧自检：每个种子重新计算路由，逐帧把漂浮偏移算进锚点 */
const edgeFrameReports = [0, 1, 2].map(seed => {
  applyLayout(seed);
  initFloats();
  syncNav();
  return Object.assign({seed:seed}, auditEdgeFrames());
});
applyLayout(0);
initFloats();
syncNav();

nodes.forEach(makeNode);
makeEdges();
setupParticle();
startMotion();

/* 最终布局的 10 帧漂浮采样（真实漂浮位移参与碰撞判定） */
let frameOverlaps = 0;
for (let f = 0; f < 10; f++){
  const t = f * 2.4 + 0.17;
  const phase = {};
  nodes.forEach(n => {
    const o = offsetAt(n, t);
    phase[n.id] = {x:o.dx, y:o.dy};
  });
  frameOverlaps = Math.max(frameOverlaps, countOverlaps(LAYER_PAD, phase));
}

const edgeAudit = auditEdges();
const dispatchAudit = auditDispatch();
const floatEdge = edgeFrameReports.reduce((acc, r) => {
  acc.hanging += r.hanging;
  acc.detached += r.detached;
  acc.crossings += r.crossings;
  acc.staticCross += r.staticCross;
  acc.maxGap = Math.max(acc.maxGap, r.maxGap);
  acc.crossList = acc.crossList.concat((r.crossList || []).map(x => "s" + r.seed + ":" + x));
  acc.staticCrossList = acc.staticCrossList.concat((r.staticCrossList || []).map(x => "s" + r.seed + ":" + x));
  return acc;
}, {hanging:0, detached:0, crossings:0, maxGap:0, staticCross:0, crossList:[], staticCrossList:[]});

const report = {
  seeds:seedAudit,
  staticOverlaps:countOverlaps(LAYER_PAD + FLOAT_PAD),
  frameOverlaps:frameOverlaps,
  hanging:edgeAudit.hanging,
  crossings:edgeAudit.crossings + floatEdge.crossings,
  soft:edgeAudit.soft,
  softList:edgeAudit.softList,
  dispatch:dispatchAudit,
  bgEdges:EDGES.filter(e => e.kind === "engine").length,
  edgeCross:auditEdgeCrossings(),
  curve:curveAudit,
  floatEdge:{seeds:3, frames:edgeFrameReports[0] ? edgeFrameReports[0].frames : 0,
    hanging:floatEdge.hanging, detached:floatEdge.detached,
    maxGap:Number(floatEdge.maxGap.toFixed(3)), crossings:floatEdge.crossings,
    staticCross:floatEdge.staticCross,
    staticCrossList:floatEdge.staticCrossList,
    crossList:floatEdge.crossList}
};

canvas.dataset.nodes = String(NODES.length);
canvas.dataset.edges = String(edgeItems.length);
canvas.dataset.floatPad = String(FLOAT_PAD);
canvas.dataset.overlapPairs = String(report.staticOverlaps);
canvas.dataset.detached = String(report.floatEdge.detached);
canvas.dataset.maxGap = String(report.floatEdge.maxGap);
canvas.dataset.audit = encodeURIComponent(JSON.stringify(report));


fit();

/* 默认进随机自动轮播；?scene=N 进入单场调试（手动模式） */
if (turbo){
  state.speed = 6;
  speedBtn.textContent = "6×";
}
const sceneParam = params.get("scene");
if (sceneParam !== null){
  const n = parseInt(sceneParam, 10);
  const idx = Number.isFinite(n) && n >= 1 ? n - 1 : 0;
  setAuto(false);
  loadScene(Math.max(0, Math.min(SCENARIOS.length - 1, idx)), true);
} else {
  setAuto(true);
  loadScene(null, true, true);
}

if (params.get("t") !== null){
  const t = parseInt(params.get("t"), 10) || 0;
  seekTo(t);
}

/* ?overview=1：整体全貌（全部边回暗、节点全部解除压暗） */
if (params.get("overview") === "1"){
  pause();
  clearLit();
  Object.keys(nodeEls).forEach(id => nodeEls[id].classList.remove("dim"));
  nowEl.classList.remove("on");
  barEl.style.width = "0%";
}

/* 剧本路径：入口 → 链路 → 智能体 → 出口 */
function scenarioPath(def){
  const parts = [];
  def.steps.forEach(st => {
    if (st.from){
      if (parts[parts.length - 1] !== st.from) parts.push(st.from);
      parts.push(st.to);
    } else if (st.stay){
      parts.push("(" + st.stay + ")");
    }
  });
  return parts.join(" → ");
}

/* ?selftest=1：剧本 / 轮播 / 随机参数 / 单步 / 曲线全量自检 */
if (params.get("selftest") === "1"){
  state.testing = true;
  const badPairs = [];
  const catalogue = SCENARIOS.map(def => {
    def.steps.forEach(st => {
      ["from", "to", "stay"].forEach(k => {
        if (st[k] && !nav[st[k]]) badPairs.push(def.id + ":missing node " + st[k]);
      });
      if (st.from && st.to && !edgeMap[st.from + "|" + st.to]){
        badPairs.push(def.id + ":missing edge " + st.from + ">" + st.to);
      }
    });
    return {
      id:def.id, name:def.name, hint:def.hint, tag:def.tag,
      steps:def.steps.length, path:scenarioPath(def)
    };
  });

  /* 逐剧本跑到终点 */
  setAuto(false);
  const runs = SCENARIOS.map((def, i) => {
    loadScene(i, false);
    seekTo(sceneTotal());
    return {id:def.id, ok:state.finished, steps:sceneSteps().length, total:sceneTotal()};
  });

  /* 连续轮播模拟 40 场：去重窗口 + 无死循环 */
  state.recent = [];
  const seq = [];
  for (let k = 0; k < 40; k++){
    const idx = pickNextScenario();
    markRecent(SCENARIOS[idx]);
    seq.push(SCENARIOS[idx].id);
  }
  let dedupeOk = true;
  for (let k = 0; k < seq.length && dedupeOk; k++){
    for (let j = Math.max(0, k - RECENT_WINDOW); j < k; j++){
      if (seq[j] === seq[k]){ dedupeOk = false; break; }
    }
  }
  const uniq = seq.filter((x, i) => seq.indexOf(x) === i).length;

  /* 同剧本两次参数必须不同 */
  const runA = buildScene(SCENARIOS[0]);
  const runB = buildScene(SCENARIOS[0]);
  const randomOk = JSON.stringify(runA.vars) !== JSON.stringify(runB.vars) ||
    runA.steps[0].log !== runB.steps[0].log;

  /* 单步 / 倍速 / 暂停 */
  loadScene(0, false);
  const beforeStep = state.playhead;
  stepOnce();
  const stepOk = state.playhead > beforeStep;
  const beforeSpeed = state.speed;
  cycleSpeed();
  const speedOk = state.speed !== beforeSpeed;
  pause();

  canvas.dataset.selftest = JSON.stringify({
    catalogue:catalogue,
    badPairs:badPairs,
    runs:runs,
    allFinished:runs.every(r => r.ok),
    carousel:{n:seq.length, uniq:uniq, dedupeOk:dedupeOk,
      window:RECENT_WINDOW, seq:seq.slice(0, 16), selfShare:seq.filter(id => SCENARIOS.find(d => d.id === id).tag === "self").length},
    randomOk:randomOk,
    step:stepOk,
    speed:speedOk,
    paused:!state.playing,
    reduced:canvas.classList.contains("reduce"),
    sceneTotal:sceneTotal(),
    anchors:auditAnchorsLive(),
    edges:report.floatEdge,
    curve:curveAudit
  });
  setAuto(false);
  state.recent = [];
  loadScene(0, false);
  state.testing = false;
}

/* ?cycle=N：同步压测自动轮播状态机 N 场（真实 finishScene + loadScene 路径，不起 rAF） */
if (params.get("cycle") !== null){
  const want = Math.max(1, Math.min(80, parseInt(params.get("cycle"), 10) || 40));
  state.testing = true;
  setAuto(true);
  state.recent = [];
  state.journal = [];
  const seq = [];
  let stuck = 0, ended = 0, dedupe = true;
  for (let k = 0; k < want; k++){
    loadScene(null, false, true);
    seq.push(state.run.id);
    if (seq.length > RECENT_WINDOW){
      for (let j = seq.length - RECENT_WINDOW - 1; j < seq.length - 1; j++){
        if (seq[j] === seq[seq.length - 1]) dedupe = false;
      }
    }
    seekTo(sceneTotal());
    if (state.finished) ended++; else stuck++;
  }
  const unique = seq.filter((x, i) => seq.indexOf(x) === i).length;
  const selfRuns = seq.filter(id => SCENARIOS.find(d => d.id === id).tag === "self").length;
  canvas.dataset.cycle = JSON.stringify({
    n:want, ended:ended, stuck:stuck, unique:unique, dedupe:dedupe,
    selfRuns:selfRuns, seq:seq,
    errorCount:window.__errors ? window.__errors.length : 0
  });
  setAuto(false);
  state.recent = [];
  state.journal = [];
  loadScene(0, false);
  state.testing = false;
}

/* ?probe=from|to：输出该边每个候选控制点形态的首个阻挡节点（临时调试用） */
if (params.get("probe")){
  const key = params.get("probe");
  const routes = planRoutes();
  const rt = routes.find(r => r && r.key === key);
  const rects = staticRects();
  const out = [];
  if (rt){
    const dirs = [rt.side, -rt.side];
    dirs.forEach((sd, di) => {
      BOW_RATIO.forEach((ra, ri) => {
        BOW_SCALE.forEach(sc => {
          const g = applyRouteScale(rt, sd, sc, ra);
          out.push("d" + di + " r" + ri + " s" + sc + " -> " +
            (firstCrossId(g.p1, g.c1, g.c2, g.p2, rt.def.from, rt.def.to, rects, "C", -ROUTE_CLEAR) || "OK"));
        });
      });
    });
  }
  canvas.dataset.probe = out.join(" ;; ");
}

/* ?check=1：同步模拟一个漂浮时刻后写回「DOM 实测锚点贴合 / 单帧成本 / 运行时错误」 */
if (params.get("check") === "1"){
  try {
    applyMotion(2.35);
    const bench = benchMotion(120);
    const d = {
      dom:auditAnchorsDom(),
      geom:auditAnchorsLive(),
      bench:bench,
      errors:window.__errors.slice(),
      offsets:Object.keys(liveOffsets).length
    };
    canvas.dataset.domcheck = JSON.stringify(d);
    canvas.dataset.errors = String(window.__errors.length);
  } catch (err){
    canvas.dataset.domcheck = JSON.stringify({error:String(err && err.stack || err)});
  }
}

/* 多帧几何自检：锚点是否落在卡片当前边框上 */
function auditAnchorsLive(){
  let maxGap = 0, detached = 0;
  for (let f = 0; f < 10; f++){
    const t = f * 2.4 + 0.17;
    const rects = frameRects(t);
    const rmap = {};
    rects.forEach(r => { rmap[r.id] = r; });
    edgeItems.forEach(it => {
      const ra = rmap[it.a.id], rb = rmap[it.b.id];
      if (!ra || !rb) return;
      const p1 = perimeterPoint(ra, it.ua);
      const p2 = perimeterPoint(rb, it.ub);
      const g = Math.max(rectGap(p1, ra), rectGap(p2, rb));
      maxGap = Math.max(maxGap, g);
      if (g > 1) detached++;
    });
  }
  return {frames:10, maxGap:Number(maxGap.toFixed(3)), detached:detached};
}

/* 独立于几何计算的 DOM 复核：端子圆点与卡片渲染盒的屏幕距离 */
function auditAnchorsDom(){
 let maxGap = 0, detached = 0, checked = 0;
  const scale = stage.getBoundingClientRect().width / W || 1;
  edgeItems.forEach(it => {
    if (!it.dots) return;
    [it.a, it.b].forEach((n, k) => {
      const el = nodeEls[n.id];
      const dot = it.dots[k];
      if (!el || !dot) return;
      const r = el.getBoundingClientRect();
      const d = dot.getBoundingClientRect();
      const x = d.left + d.width / 2, y = d.top + d.height / 2;
      const gx = Math.max(r.left - x, 0, x - r.right);
      const gy = Math.max(r.top - y, 0, y - r.bottom);
      const g = Math.hypot(gx, gy) / scale;
      maxGap = Math.max(maxGap, g);
      if (g > 1) detached++;
      checked++;
    });
  });
  return {checked:checked, maxGap:Number(maxGap.toFixed(3)), detached:detached};
}

/* 性能采样：漂浮 + 逐帧重算连线的 rAF 频率 */
const perfSamples = [];
function notePerf(ts){
  perfSamples.push(ts);
  if (perfSamples.length > 200) perfSamples.shift();
}
function perfReport(){
  if (perfSamples.length < 20) return {fps:0, samples:perfSamples.length};
  const span = perfSamples[perfSamples.length - 1] - perfSamples[0];
  return {fps:Number(((perfSamples.length - 1) / (span / 1000)).toFixed(1)), samples:perfSamples.length};
}

/* 单帧更新成本：58 卡片 transform + 97 边重算 + 130 端子，连续 120 帧取分位 */
function benchMotion(n){
  n = n || 120;
  const times = [];
  for (let i = 0; i < n; i++){
    const t0 = performance.now();
    applyMotion(i * 0.08);
    times.push(performance.now() - t0);
  }
  times.sort((a, b) => a - b);
  return {
    frames:n,
    avg:Number((times.reduce((a, b) => a + b, 0) / n).toFixed(3)),
    p95:Number(times[Math.floor(n * 0.95)].toFixed(3)),
    max:Number(times[n - 1].toFixed(3))
  };
}

/* 验收接口 */
window.__demo = {
  get state(){
    return {
      scene:state.scene, id:state.run ? state.run.id : null, auto:state.auto,
      speed:state.speed, playing:state.playing, playhead:state.playhead,
      finished:state.finished, tone:state.tone, recent:state.recent.slice()
    };
  },
  scenarios: SCENARIOS.map(d => ({id:d.id, name:d.name, hint:d.hint, tag:d.tag, path:scenarioPath(d)})),
  get journal(){ return state.journal.slice(); },
  get audit(){ return report; },
  get overlapPairs(){ return Number(canvas.dataset.overlapPairs); },
  get litEdges(){ return Array.from(litMap.keys()); },
  load:(i, auto) => loadScene(i, auto !== false),
  next: () => nextScene(),
  setAuto: (on) => setAuto(on),
  play: play,
  pause: pause,
  step: stepOnce,
  seek: seekTo,
  runToEnd:(i) => { loadScene(i, false); seekTo(sceneTotal()); },
  total: () => sceneTotal(),
  layout: () => nodes.map(n => ({id:n.id, x:n.x, y:n.y, w:n.w, h:n.h})),
  anchors: () => ({geom:auditAnchorsLive(), dom:auditAnchorsDom()}),
  perf: perfReport,
  bench: benchMotion,
  offsets: () => Object.assign({}, liveOffsets)
};
</script>
