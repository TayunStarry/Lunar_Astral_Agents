<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunar Harness · 动态架构展示</title>
<style>
  :root{
    --in:#3ee6ff;
    --out:#ff8db0;
    --tool:#ffc169;
    --event:#c1a2ff;
    --engine:#7db2ff;
    --protocol:#c58bff;
    --text:#e9f3ff;
    --muted:#9db2cc;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:#04070d;
    color:var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ==== 深空背景 ==== */
  .auras{position:fixed;inset:-10%;z-index:0;pointer-events:none}
  .auras i{position:absolute;display:block;border-radius:50%;filter:blur(70px);opacity:.5}
  .auras i:nth-child(1){width:52vw;height:46vw;left:6%;top:2%;
    background:radial-gradient(circle,rgba(34,180,255,.18),transparent 66%);animation:auraA 38s ease-in-out infinite alternate}
  .auras i:nth-child(2){width:46vw;height:42vw;right:2%;top:16%;
    background:radial-gradient(circle,rgba(150,90,255,.16),transparent 66%);animation:auraB 46s ease-in-out infinite alternate}
  .auras i:nth-child(3){width:52vw;height:38vw;left:26%;bottom:-12%;
    background:radial-gradient(circle,rgba(255,150,90,.09),transparent 68%);animation:auraA 54s ease-in-out infinite alternate-reverse}
  @keyframes auraA{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}
  @keyframes auraB{from{transform:translate3d(2%,1%,0) scale(1.05)}to{transform:translate3d(-3%,-2%,0) scale(.96)}}

  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.14;mix-blend-mode:overlay}
  .grain svg{width:100%;height:100%;display:block}

  /* ==== 角落文字 ==== */
  .brand{position:fixed;left:22px;top:16px;z-index:20;font-size:13px;letter-spacing:2.4px;
    color:rgba(214,232,255,.62);pointer-events:none;text-transform:lowercase}
  .brand span{font-size:9.5px;letter-spacing:1.4px;margin-left:9px;color:rgba(158,184,214,.42)}
  .wm{position:fixed;right:16px;bottom:12px;z-index:20;font-size:9.5px;letter-spacing:.6px;
    color:rgba(150,175,205,.30);pointer-events:none}

  /* ==== 舞台缩放 ==== */
  #viewport{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
  #stage{width:1900px;height:1290px;transform-origin:center center;flex:none}
  #canvas{position:relative;width:1900px;height:1290px}
  #canvas::before{content:"";position:absolute;inset:-140px;pointer-events:none;
    background:radial-gradient(52% 46% at 50% 42%,rgba(30,90,140,.10),transparent 70%),
      radial-gradient(38% 34% at 74% 26%,rgba(120,80,200,.07),transparent 72%);
    filter:blur(10px)}
  svg.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #farEdges{z-index:3}
  #far{position:absolute;inset:0;z-index:4;pointer-events:none;animation:farDrift 52s ease-in-out infinite alternate}
  #edges{z-index:5}
  #near{position:absolute;inset:0;z-index:6;pointer-events:none}
  #fx{position:absolute;inset:0;z-index:8;pointer-events:none}
  #far .node,#near .node{pointer-events:auto}
  @keyframes farDrift{from{transform:translate3d(-6px,3px,0)}to{transform:translate3d(9px,-4px,0)}}

  /* ==== 连线 ==== */
  .edge{fill:none;stroke-linecap:round;transition:opacity .35s ease,stroke-width .35s ease}
  .edge.lit{transition:opacity .2s ease,stroke-width .2s ease}

  /* ==== 节点 ==== */
  .node{
    position:absolute;border-radius:14px;overflow:hidden;
    display:flex;align-items:center;gap:7px;padding:0 12px;
    border:1px solid rgba(var(--tint),.34);
    background:linear-gradient(155deg,rgba(var(--tint),.15),rgba(7,13,23,.62) 72%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 16px rgba(0,0,0,.28);
    cursor:pointer;user-select:none;
    animation:breathe var(--bd,9s) ease-in-out var(--fdl,0s) infinite alternate;
    will-change:transform,opacity;
    transition:border-color .25s,box-shadow .25s;
  }
  .node.end{--tint:148,168,192}
  .node.chain{--tint:56,223,245}
  .node.agent{--tint:255,180,87}
  .node.executor{--tint:180,224,90}
  .node.engine{--tint:111,168,255}
  .node.protocol{--tint:192,139,255}
  .node.far{opacity:.50;filter:blur(.2px)}
  .node.far .l{font-size:9px}
  .node .orb{flex:none;width:6px;height:6px;border-radius:50%;background:rgb(var(--tint));
    box-shadow:0 0 8px rgba(var(--tint),.9)}
  .node .l{font-size:11px;font-weight:600;letter-spacing:.2px;color:#eef7ff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node.chip .l{font-size:9.4px;font-weight:500;color:#dfeafa}
  .node.core{background:linear-gradient(155deg,rgba(var(--tint),.16),rgba(6,12,22,.66) 74%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 26px rgba(var(--tint),.12)}
  .node.core .l{font-size:12.5px;font-weight:700}
  .node.core{flex-direction:column;align-items:flex-start;justify-content:flex-start;padding-top:9px;gap:0}
  .node.core .l{margin-left:13px}
  .node.core .orb{position:absolute;left:12px;top:16px}

  .node:hover,.node.pin{border-color:rgba(var(--tint),.75);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 24px rgba(var(--tint),.28)}
  .node.hot{--hc:255,255,255;box-shadow:0 0 0 1px rgba(var(--hc),.55),0 0 30px rgba(var(--hc),.35);
    border-color:rgba(var(--hc),.7)}
  .node.dim{opacity:.22}
  /* 位移由 JS 每帧写入 transform；CSS 只负责透明度呼吸，避免两套动画抢 transform */
  @keyframes breathe{from{opacity:.87}to{opacity:1}}

  /* ==== 涟漪 ==== */
  .ripple{position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;
    border:1px solid rgba(var(--rc),.65);pointer-events:none;z-index:9;
    animation:rip .85s cubic-bezier(.2,.7,.4,1) forwards}
  @keyframes rip{from{transform:scale(.45);opacity:.75}to{transform:scale(2.5);opacity:0}}

  /* ==== 悬浮胶囊控件 ==== */
  #cap{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;
    background:rgba(7,13,24,.72);border:1px solid rgba(130,170,220,.16);border-radius:999px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 34px rgba(0,0,0,.5);padding:7px 12px 8px;transition:opacity .3s}
  #cap .bar{position:absolute;left:16px;right:16px;top:0;height:1.5px;background:rgba(120,170,220,.14);
    border-radius:2px;overflow:hidden}
  #cap .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(62,230,255,.5),rgba(62,230,255,.95));transition:width .12s linear}
  #cap .row{display:flex;align-items:center;gap:6px}
  #cap .sep{width:1px;height:14px;background:rgba(130,170,220,.2);margin:0 2px}
  #cap button.ctl{font:inherit;font-size:10.5px;line-height:1;cursor:pointer;border:0;
    width:24px;height:22px;border-radius:999px;color:rgba(198,220,244,.82);background:transparent;transition:.2s}
  #cap button.ctl:hover{color:#fff;background:rgba(60,90,130,.5)}
  #cap button.wide{width:auto;padding:0 9px;font-size:9.5px;letter-spacing:.4px}
  #cap button.on{color:#e9feff;background:rgba(62,230,255,.16);box-shadow:inset 0 0 0 1px rgba(62,230,255,.38)}
  #speed{width:auto!important;padding:0 5px!important;font-size:9.5px!important}

  /* ==== 当前剧目浮字 ==== */
  #now{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(6px);z-index:31;
    font-size:11.5px;letter-spacing:1.1px;color:rgba(224,240,255,.94);white-space:nowrap;
    padding:5px 13px;border-radius:9px;background:rgba(7,14,26,.62);
    border:1px solid rgba(130,170,220,.14);pointer-events:none;opacity:0;
    transition:opacity .45s ease,transform .45s ease}
  #now.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #now.self{color:#d9caff;border-color:rgba(193,162,255,.3);background:rgba(16,10,30,.66)}
  #now b{font-weight:600;letter-spacing:.6px;margin-right:8px;opacity:.6;font-size:9px}

  /* ==== 当前事件浮字 ==== */
  #event{position:fixed;left:26px;bottom:24px;z-index:25;max-width:38vw;
    font-size:11px;letter-spacing:.3px;color:rgba(190,214,238,.9);
    padding:4px 10px;border-radius:8px;background:rgba(8,14,25,.32);
    border:1px solid rgba(130,170,220,.08);opacity:0;transform:translateY(4px);
    transition:opacity .5s ease,transform .5s ease;pointer-events:none;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #event.on{opacity:.92;transform:none}

  /* ==== 气泡 ==== */
  #tip{position:fixed;z-index:40;max-width:330px;padding:9px 11px;border-radius:11px;
    background:rgba(5,10,19,.94);border:1px solid rgba(130,170,220,.22);
    box-shadow:0 16px 40px rgba(0,0,0,.55);backdrop-filter:blur(12px);
    font-size:10px;line-height:1.55;color:#cfe0f3;opacity:0;transform:translateY(4px);
    transition:opacity .15s,transform .15s;pointer-events:none}
  #tip.on{opacity:1;transform:none}
  #tip .tt{font-size:12px;font-weight:700;color:#fff;margin-bottom:5px}
  #tip .row{display:grid;grid-template-columns:54px 1fr;gap:4px}
  #tip .k{color:#7890ad}
  #tip .v{color:#d9e7f6;word-break:break-word}
  #tip code{font-family:Consolas,monospace;font-size:9.5px;color:#9fd8ee}

  /* ==== reduced-motion / 小屏 ==== */
  @media (prefers-reduced-motion: reduce){
    .node,.auras i,#far,#farEdges{animation:none!important}
    .ripple{display:none!important}
  }
  .reduce .node,.reduce .auras i,.reduce #far,.reduce #farEdges{animation:none!important}
  .reduce .ripple{display:none!important}
  @media (max-width:760px){
    #cap{bottom:12px;padding:6px 9px}
    #now{font-size:10px;bottom:62px;letter-spacing:.6px}
    #event{font-size:10px;left:14px;bottom:14px;max-width:54vw}
    .brand{left:14px;top:12px}
  }
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="auras"><i></i><i></i><i></i></div>
<div class="grain">
  <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <filter id="grainFilter"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#grainFilter)" opacity="0.55"/>
  </svg>
</div>

<div class="brand">Lunar Harness<span>动态架构展示</span></div>

<div id="viewport">
  <div id="stage">
    <div id="canvas">
      <svg id="farEdges" class="layer"></svg>
      <div id="far"></div>
      <svg id="edges" class="layer"></svg>
      <div id="near"></div>
      <svg id="fx" class="layer"></svg>
    </div>
  </div>
</div>

<div id="event"></div>

<div id="cap">
  <div class="bar"><i id="bar"></i></div>
  <div class="row">
    <button class="ctl" id="btnPlay" title="播放 / 暂停">▶</button>
    <button class="ctl" id="btnNext" title="下一场">⏭</button>
    <button class="ctl" id="speed" title="倍速">1×</button>
    <span class="sep"></span>
    <button class="ctl wide" id="btnAuto" title="自动轮播 / 手动">自动</button>
  </div>
</div>

<div id="now"></div>

<div class="wm">模拟演示 · 合成数据</div>
<div id="tip"></div>

<script>
/* ==================================================================
   数据：节点 / 星簇 / 连线 / 场景
   ================================================================== */
const W = 1900, H = 1290;
const FLOAT_PAD = 12;
const LAYER_PAD = 14;
const ROUTE_CLEAR = 12;   // 路由时给卡片外扩的净空，等于漂浮最大振幅 + 余量

const TONE = {
  in:"#3ee6ff", out:"#ff8db0", tool:"#ffc169",
  event:"#c1a2ff", engine:"#7db2ff", system:"#a7bdd8"
};

const NODES = [
  /* 四端（固定）：同一节点既收也发，去程来自这里、回程也回到这里 */
  {id:"end_web",layer:"end",short:"月华前端",title:"月华前端 · WebSocket 双向",w:172,h:56,x:34,y:210,fixed:true,
   meta:{path:"subsystem/lunar_harness/server + engine/websocket",report:"—",model:"不参与模型调用",tools:"WebSocket /ws 收消息 · 流式回推"}},
  {id:"end_qq_pri",layer:"end",short:"QQ 私聊",title:"QQ 私聊 · 收 / 发",w:172,h:56,x:58,y:372,fixed:true,
   meta:{path:"subsystem/lunar_harness/clients/napcat",report:"—",model:"不参与模型调用",tools:"NapCat 私聊事件收 · send_text / send_images / send_files 发"}},
  {id:"end_qq_grp",layer:"end",short:"QQ 群聊",title:"QQ 群聊 · 收 / 发",w:172,h:56,x:28,y:534,fixed:true,
   meta:{path:"subsystem/lunar_harness/clients/napcat",report:"—",model:"不参与模型调用",tools:"NapCat 群事件收 · send_text / send_images / send_files 发"}},
  {id:"end_http",layer:"end",short:"HTTP 调用",title:"HTTP 调用 · 收 / 回",w:172,h:56,x:66,y:696,fixed:true,
   meta:{path:"subsystem/lunar_harness/server",report:"—",model:"不参与模型调用",tools:"/agent/chat/completions 入站 · 200 JSON 回程"}},

  /* 核心（固定） */
  {id:"a_bridging",layer:"agent",short:"发送者",title:"发送者 DialogueBridging",w:186,h:66,x:460,y:430,fixed:true,core:true,
   meta:{path:"subsystem/lunar_harness/agents/DialogueBridging",report:"dialogue_bridging",model:"StreamWithRetry（投递规划）",tools:"resolve_target / send_text / send_images / send_files"}},
  {id:"a_dialogue",layer:"agent",short:"对话者",title:"对话者 Dialogue",w:204,h:86,x:790,y:420,fixed:true,core:true,
   meta:{path:"subsystem/lunar_harness/agents/Dialogue",report:"dialogue",model:"StreamWithRetry + RunToolLoop（5 轮 + 收尾轮）",tools:"dispatch_technique / fetch_resources / life_planning / network_explore / qq_send"}},
  {id:"c_thinking",layer:"chain",short:"思维链",title:"思维链 · chain/thinking",w:216,h:86,x:760,y:590,fixed:true,core:true,
   meta:{path:"subsystem/lunar_harness/chain/thinking",report:"dialogue（Tick 失败上报）",model:"不直接调用；委托对话者",tools:"tickloop / tool_registry"}},
  {id:"hub",layer:"chain",short:"工具分派",title:"工具分派 · dispatch_technique",w:168,h:50,x:812,y:838,fixed:true,
   meta:{path:"subsystem/lunar_harness/agents/Dialogue/tools.go",report:"—",model:"不调用模型",tools:"dispatch_technique / network_explore / life_planning"}},
  {id:"a_responder",layer:"agent",short:"响应者",title:"响应者 Responder",w:176,h:62,x:470,y:690,fixed:true,
   meta:{path:"subsystem/lunar_harness/agents/Responder",report:"responder",model:"原生 Stream + 自建重试（无工具）",tools:"无工具（HTTP 透传）"}},

  /* 七条链：挂在各自语义簇里，不做等距排布 */
  {id:"c_viewer",layer:"chain",short:"观影链",title:"观影链 · chain/viewer",w:136,h:42,cluster:"viewer",
   meta:{path:"subsystem/lunar_harness/chain/viewer",report:"bilibili（链级）",model:"不直接调用；委托四个观影者",tools:"tool_catalog（由四观影者声明派生）"}},
  {id:"c_search",layer:"chain",short:"搜索链",title:"搜索链 · chain/search",w:136,h:42,cluster:"search",
   meta:{path:"subsystem/lunar_harness/chain/search",report:"web_search（链级）",model:"不直接调用；委托两搜索者",tools:"catalog（由两搜索者声明派生）"}},
  {id:"c_creation",layer:"chain",short:"创作链",title:"创作链 · chain/creation",w:136,h:42,cluster:"creation",
   meta:{path:"subsystem/lunar_harness/chain/creation",report:"—（修复目标 creative）",model:"不直接调用；委托创作规划者",tools:"从 CreatorPlanner 注册表派生"}},
  {id:"c_life",layer:"chain",short:"生活链",title:"生活链 · chain/life",w:136,h:42,cluster:"life",
   meta:{path:"subsystem/lunar_harness/chain/life",report:"—",model:"不直接调用；委托生活记忆整理者",tools:"—（事件登记与派发）"}},
  {id:"c_forum",layer:"chain",short:"论坛链",title:"论坛链 · chain/forum",w:136,h:42,cluster:"forum",
   meta:{path:"subsystem/lunar_harness/chain/forum",report:"mutual_forum（链级）",model:"不直接调用；委托论坛角色",tools:"agents/MutualForum/tool_catalog.go"}},
  {id:"c_desktop",layer:"chain",short:"桌控链",title:"桌控链 · chain/desktop",w:136,h:42,cluster:"desktop",
   meta:{path:"subsystem/lunar_harness/chain/desktop",report:"desktop（链级）",model:"不直接调用；委托桌控角色",tools:"agents/desktop/tool_catalog.go"}},

  /* 观影四兄弟 */
  {id:"a_screening",layer:"agent",short:"阅片者",title:"观影者-阅片 ViewerScreening",w:136,h:40,cluster:"viewer",
   meta:{path:"subsystem/lunar_harness/agents/ViewerScreening",report:"viewer_screening",model:"StreamWithRetry（4 个调用点）",tools:"4 条，经 toolreg 声明"}},
  {id:"a_censor",layer:"agent",short:"审查者",title:"观影者-审查 ViewerCensor",w:136,h:40,cluster:"viewer",
   meta:{path:"subsystem/lunar_harness/agents/ViewerCensor",report:"viewer_censor",model:"StreamWithRetry",tools:"review_video"}},
  {id:"a_critic",layer:"agent",short:"评论者",title:"观影者-评论 ViewerCritic",w:136,h:40,cluster:"viewer",
   meta:{path:"subsystem/lunar_harness/agents/ViewerCritic",report:"viewer_critic",model:"StreamWithRetry",tools:"2 条，经 toolreg 声明"}},
  {id:"a_share",layer:"agent",short:"分享者",title:"观影者-分享 ViewerShare",w:136,h:40,cluster:"viewer",
   meta:{path:"subsystem/lunar_harness/agents/ViewerShare",report:"viewer_share",model:"StreamWithRetry",tools:"write_dynamic / write_share"}},

  /* 搜索两兄弟 + 抓取执行体 */
  {id:"a_search_planner",layer:"agent",short:"搜索规划",title:"搜索者-规划 SearchPlanner",w:136,h:40,cluster:"search",
   meta:{path:"subsystem/lunar_harness/agents/SearchPlanner",report:"search_planner",model:"StreamWithRetry（HoldLease）",tools:"plan_search"}},
  {id:"a_search_summarizer",layer:"agent",short:"搜索摘要",title:"搜索者-摘要 SearchSummarizer",w:136,h:40,cluster:"search",
   meta:{path:"subsystem/lunar_harness/agents/SearchSummarizer",report:"search_summarizer",model:"StreamWithRetry（HoldLease）",tools:"digest_pages"}},
  {id:"x_crawler",layer:"executor",short:"搜索抓取",title:"搜索抓取 SearchCrawler",w:142,h:40,cluster:"search",
   meta:{path:"subsystem/lunar_harness/chain/search/crawler",report:"—（执行体不参与运行上报）",model:"零模型调用",tools:"Fetch / Extract"}},

  /* 创作簇：规划者、文件操作与解析执行体 */
  {id:"a_creator",layer:"agent",short:"创作规划",title:"创作规划者 CreatorPlanner",w:136,h:40,cluster:"creation",
   meta:{path:"subsystem/lunar_harness/agents/CreatorPlanner",report:"creator",model:"RunToolLoop（规划 6 轮 / 执行 8 轮）",tools:"21 条，经 toolreg 声明"}},
  {id:"a_fileeditor",layer:"agent",short:"文件编辑",title:"文件编辑 FileEditor",w:136,h:40,cluster:"creation",
   meta:{path:"subsystem/lunar_harness/agents/FileEditor",report:"file_editor",model:"RunToolLoop",tools:"catalog.go / task_scheduling"}},
  {id:"x_archivereader",layer:"executor",short:"归档解析",title:"归档解析 ArchiveReader",w:142,h:40,cluster:"creation",
   meta:{path:"subsystem/lunar_harness/executors/ArchiveReader",report:"archive_reader（导出登记）",model:"零模型调用",tools:"catalog.go"}},
  {id:"a_archiveops",layer:"agent",short:"归档操作",title:"归档操作 ArchiveOps",w:136,h:40,cluster:"creation",
   meta:{path:"subsystem/lunar_harness/agents/ArchiveOps",report:"archive_ops",model:"RunToolLoop",tools:"catalog.go"}},
  {id:"a_docreader",layer:"agent",short:"文献解析",title:"文献解析 DocumentReader",w:136,h:40,cluster:"creation",
   meta:{path:"subsystem/lunar_harness/agents/DocumentReader",report:"document_reader",model:"RunToolLoop + ChatWithRetry",tools:"catalog.go"}},

let runSeq = 0;

function pickRun(key){
  const pool = RUN_POOLS[key];
  return pool ? pool[Math.floor(Math.random() * pool.length)] : "";
}

function fillTokens(text, vars){
  return text.replace(/\{\{(\w+)\}\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
}

function buildScene(def){
  const vars = {};
  Object.keys(RUN_POOLS).forEach(k => { vars[k] = pickRun(k); });
  runSeq++;
  /* 定向投递：目标是人就走私聊出口，是群就走群聊出口（两条都是真实边） */
  const toPri = def.id === "qq_target" && vars.target.indexOf("私聊") === 0;
  return {
    id:def.id, name:def.name, hint:def.hint, tag:def.tag, weight:def.weight || 1,
    run:runSeq, vars:vars,
    steps:def.steps.map(st => {
      const out = Object.assign({}, st);
      if (out.log) out.log = fillTokens(out.log, vars);
      if (toPri && (out.to === "end_qq_grp" || out.stay === "end_qq_grp")){
        if (out.to === "end_qq_grp") out.to = "end_qq_pri";
        if (out.stay === "end_qq_grp") out.stay = "end_qq_pri";
      }
      return out;
    })
  };
}

/* ==================================================================
   布局：星簇散布 + 碰撞松弛（含漂浮余量，保证零重叠）
   ================================================================== */
let LAYOUT_SEED = 0;

function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rnd(seed, salt){
  return (hashStr(LAYOUT_SEED + "#" + seed + "|" + (salt || "")) % 100000) / 100000;
}

const nav = {};
NODES.forEach(n => { nav[n.id] = n; });

const nodes = NODES.map(n => Object.assign({}, n));

/* 散布：按簇分行铺开，槽位间距把「漂浮振幅 + 安全边距」直接算进去，
   因此静止与漂浮两种状态都不会相碰（不是靠肉眼调常量） */
const SLOT_W = 196;   // 142 最大节点宽 + 54（含漂浮 14 与 26 边距）
const SLOT_H = 86;    // 42 最大节点高 + 44（含漂浮 16 与 26 边距）

function placeClusters(){
  Object.keys(CLUSTERS).forEach(key => {
    const c = CLUSTERS[key];
    const members = nodes.filter(n => n.cluster === key);
    let row = 0, col = 0, shiftX = 0;
    members.forEach((n, i) => {
      if (i > 0 && i % c.per === 0){ row++; col = 0; shiftX = row * c.shift; }
      n.x = Math.round(c.x0 + shiftX + col * SLOT_W + (rnd(n.id, "sx") - 0.5) * 14);
      n.y = Math.round(c.y0 + row * SLOT_H + (rnd(n.id, "sy") - 0.5) * 8);
      col++;
    });
  });
  nodes.forEach(clampNode);
}

function clampNode(n){
  if (n.fixed) return;
  n.x = Math.max(18, Math.min(W - n.w - 18, n.x));
  n.y = Math.max(96, Math.min(1060 - n.h, n.y));
}

/* 最小位移松弛：仅在兜底时使用，避免节点被推到别的簇 */
function separate(rounds){
  for (let it = 0; it < rounds; it++){
    let moved = 0;
    for (let i = 0; i < nodes.length; i++){
      for (let j = i + 1; j < nodes.length; j++){
        const a = nodes[i], b = nodes[j];
        if (a.fixed && b.fixed) continue;
        const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
        const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
        if (ox <= 0 || oy <= 0) continue;
        const needX = ox + LAYER_PAD;
        const needY = oy + LAYER_PAD;
        let dx = 0, dy = 0;
        if (needX <= needY){
          dx = needX;
          if ((a.x + a.w / 2) <= (b.x + b.w / 2)) dx = -dx;
        } else {
          dy = needY;
          if ((a.y + a.h / 2) <= (b.y + b.h / 2)) dy = -dy;
        }
        if (a.fixed){ b.x += dx; b.y += dy; }
        else if (b.fixed){ a.x -= dx; a.y -= dy; }
        else {
          a.x -= dx / 2; a.y -= dy / 2;
          b.x += dx / 2; b.y += dy / 2;
        }
        clampNode(a); clampNode(b);
        moved++;
      }
    }
    if (!moved) break;
  }
}

function countOverlaps(pad, offs){
  let count = 0;
  for (let i = 0; i < nodes.length; i++){
    for (let j = i + 1; j < nodes.length; j++){
      const a = nodes[i], b = nodes[j];
      const oa = offs ? offs[a.id] : null, ob = offs ? offs[b.id] : null;
      const ax = a.x + (oa ? oa.x : 0), ay = a.y + (oa ? oa.y : 0);
      const bx = b.x + (ob ? ob.x : 0), by = b.y + (ob ? ob.y : 0);
      if (ax - pad < bx + b.w && bx - pad < ax + a.w &&
          ay - pad < by + b.h && by - pad < ay + a.h) count++;
    }
  }
  return count;
}

/* 漂浮参数：相位 / 周期 / 振幅全部取自随机种子，禁止整排同步；
   纵向振幅与横向漂移都计入碰撞预算（FLOAT_PAD=12） */
let floats = {};
function initFloats(){
  floats = {};
  nodes.forEach(n => {
    const far = n.layer === "engine" || n.layer === "protocol";
    floats[n.id] = {
      ax: (far ? 0.4 : 0.8) + rnd(n.id, "ax") * (far ? 0.6 : 1.4),
      ay: (far ? 1.4 : 5.2) + rnd(n.id, "ay") * (far ? 1.4 : 2.4),
      wx: Math.PI * 2 / (9 + rnd(n.id, "wx") * 9),
      wy: Math.PI * 2 / (8 + rnd(n.id, "wy") * 10),
      ws: Math.PI * 2 / (7 + rnd(n.id, "ws") * 8),
      px: rnd(n.id, "px") * Math.PI * 2,
      py: rnd(n.id, "py") * Math.PI * 2,
      ps: rnd(n.id, "ps") * Math.PI * 2,
      sa: far ? 0.002 : 0.004 + rnd(n.id, "sa") * 0.003
    };
  });
}
function offsetAt(n, t){
  const f = floats[n.id];
  if (!f) return {dx:0, dy:0, s:1};
  return {
    dx:f.ax * Math.sin(f.wx * t + f.px),
    dy:f.ay * Math.sin(f.wy * t + f.py),
    s:1 + f.sa * Math.sin(f.ws * t + f.ps)
  };
}
function maxOffsets(){
  const o = {};
  nodes.forEach(n => { o[n.id] = {x:floats[n.id].ax, y:floats[n.id].ay}; });
  return o;
}

function applyLayout(seed){
  LAYOUT_SEED = seed;
  placeClusters();
  separate(180);
}

function syncNav(){
  nodes.forEach(n => {
    const t = nav[n.id];
    if (t){ t.x = n.x; t.y = n.y; t.w = n.w; t.h = n.h; }
  });
}

/* 布局自检：3 个随机种子，每个 10 帧漂浮相位；浮移逐帧生效 */
function auditLayout(){
  const seedReports = [];
  for (const seed of [0, 1, 2]){
    applyLayout(seed);
    initFloats();
    const offs = maxOffsets();
    let worst = 0;
    for (let f = 0; f < 10; f++){
      const phase = {};
      nodes.forEach(n => {
        const p = (f / 10 + rnd(n.id, "dl")) % 1;
        const amp = 1 - Math.abs(2 * p - 1);
        phase[n.id] = {x:offs[n.id].x * amp, y:offs[n.id].y * amp};
      });
      worst = Math.max(worst, countOverlaps(LAYER_PAD, phase));
    }
    seedReports.push({seed:seed, static:countOverlaps(LAYER_PAD + FLOAT_PAD), frames:worst});
  }
  applyLayout(0);
  initFloats();
  syncNav();
  return seedReports;
}

/* ==================================================================
   连线几何：边框锚点分散 + 单弯三次贝塞尔（投影单调，禁止回折）
   —— 每条边在两端各占一个独立的边框槽位；控制点固定落在弦的 1/3、2/3，
   只沿法线做同向偏移，因此沿弦投影恒为线性（结构上排除 S 形与回折）。
   ================================================================== */
const ZERO_OFFSET = {dx:0, dy:0, s:1};
const ANCHOR_GAP = 14;        // 同一节点相邻锚点的最小边框弧长（px）
const ANGLE_MIN_DEG = 3.4;    // 同节点出发/到达边的最小夹角
const BOW_COEF = 0.13;        // 弯幅 = min(弦长 × 系数, 上限)
const BOW_MAX = 72;           // 常规弯幅上限（px）
const BOW_SCALE = [1, 1.3, 1.6, 2.0, 2.4, 2.9, 3.5, 4.2, 0.72, 0.5, 0.3, 0.14, 0];

function centerOf(n){ return {x:n.x + n.w / 2, y:n.y + n.h / 2}; }

/* 当前帧的卡片包围盒（含缩放呼吸与漂浮位移） */
function rectOf(n, st){
  const o = st || ZERO_OFFSET;
  const w = n.w * o.s, h = n.h * o.s;
  return {id:n.id, x:n.x + (n.w - w) / 2 + o.dx, y:n.y + (n.h - h) / 2 + o.dy, w:w, h:h};
}

/* 边框参数化：u∈[0,1) 从左上角顺时针 */
function perimeterPoint(r, u){
  const w = r.w, h = r.h, P = 2 * (w + h);
  let d = ((u % 1) + 1) % 1 * P;
  if (d <= w) return {x:r.x + d, y:r.y};
  d -= w;
  if (d <= h) return {x:r.x + w, y:r.y + d};
  d -= h;
  if (d <= w) return {x:r.x + w - d, y:r.y + h};
  d -= w;
  return {x:r.x, y:r.y + h - d};
}

function perimeterU(r, p){
  const w = r.w, h = r.h, P = 2 * (w + h);
  const dT = Math.abs(p.y - r.y), dR = Math.abs(p.x - (r.x + w));
  const dB = Math.abs(p.y - (r.y + h)), dL = Math.abs(p.x - r.x);
  const m = Math.min(dT, dR, dB, dL);
  if (m === dT) return (p.x - r.x) / P;
  if (m === dR) return (w + (p.y - r.y)) / P;
  if (m === dB) return (w + h + (r.x + w - p.x)) / P;
  return (2 * w + h + (r.y + h - p.y)) / P;
}

/* 中心 → 目标方向的射线与边框交点，再换算成边框参数 */
function rayU(r, tx, ty){
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  const dx = tx - cx, dy = ty - cy;
  if (!dx && !dy) return 0;
  const k = 1 / Math.max(Math.abs(dx) / (r.w / 2), Math.abs(dy) / (r.h / 2));
  return perimeterU(r, {x:cx + dx * k, y:cy + dy * k});
}

function cubicPoint(p1, c1, c2, p2, t){
  const u = 1 - t;
  return {
    x:u * u * u * p1.x + 3 * u * u * t * c1.x + 3 * u * t * t * c2.x + t * t * t * p2.x,
    y:u * u * u * p1.y + 3 * u * u * t * c1.y + 3 * u * t * t * c2.y + t * t * t * p2.y
  };
}

function quadPoint(p1, c, p2, t){
  const u = 1 - t;
  return {x:u * u * p1.x + 2 * u * t * c.x + t * t * p2.x,
    y:u * u * p1.y + 2 * u * t * c.y + t * t * p2.y};
}

function insideRect(p, r, inset){
  const m = inset == null ? 0 : inset;
  return p.x > r.x + m && p.x < r.x + r.w - m && p.y > r.y + m && p.y < r.y + r.h - m;
}

/* 采样曲线：检测节点实体 + 拒绝越界；margin<0 表示把卡片外扩，给漂浮留安全距离 */
function crossesWith(p1, c1, c2, p2, aId, bId, rects, mode, margin){
  const m = margin == null ? 2 : margin;
  for (let s = 2; s <= 18; s++){
    const t = s / 20;
    const pt = mode === "Q" ? quadPoint(p1, c1, p2, t) : cubicPoint(p1, c1, c2, p2, t);
    if (pt.x < 6 || pt.x > W - 6 || pt.y < 6 || pt.y > H - 6) return true;
    for (let k = 0; k < rects.length; k++){
      const r = rects[k];
      if (r.id === aId || r.id === bId) continue;
      if (insideRect(pt, r, m)) return true;
    }
  }
  return false;
}

/* 返回第一个被曲线侵入的卡片 id（调试 / 自检用） */
function firstCrossId(p1, c1, c2, p2, aId, bId, rects, mode, margin){
  const m = margin == null ? 2 : margin;
  for (let s = 2; s <= 18; s++){
    const t = s / 20;
    const pt = mode === "Q" ? quadPoint(p1, c1, p2, t) : cubicPoint(p1, c1, c2, p2, t);
    for (let k = 0; k < rects.length; k++){
      const r = rects[k];
      if (r.id === aId || r.id === bId) continue;
      if (insideRect(pt, r, m)) return r.id;
    }
  }
  return null;
}

/* 静态布局下的节点盒 */
function staticRects(){
  return nodes.map(n => ({id:n.id, x:n.x, y:n.y, w:n.w, h:n.h}));
}

/* 边框参数槽位松弛：按周长把同一节点上的锚点均匀错开，避免同点扇出 */
function relaxSlots(list, gap){
  list.sort((p, q) => p.u - q.u);
  for (let pass = 0; pass < 14; pass++){
    for (let i = 1; i < list.length; i++){
      const d = list[i].u - list[i - 1].u;
      if (d < gap){
        const mid = (list[i].u + list[i - 1].u) / 2;
        list[i - 1].u = mid - gap / 2;
        list[i].u = mid + gap / 2;
      }
    }
  }
  let lo = list[0].u, hi = list[list.length - 1].u;
  if (lo < 0 || hi > 1){
    const span = Math.max(0.0001, hi - lo);
    list.forEach(x => { x.u = 0.004 + (x.u - lo) / span * 0.992; });
  }
}

/* 曲率偏置：入站 / 出站 / 工具分别偏到不同侧，减少同色流互穿 */
function sideBias(kind, dx, dy, key){
  if (kind === "in") return -1;
  if (kind === "out") return 1;
  if (kind === "tool") return dy < 0 ? -1 : 1;   // 上方目标向左弯，下方目标向右弯
  return rnd(key, "sd") > 0.5 ? 1 : -1;
}

function curveOf(rt, a, b){
  const p1 = perimeterPoint(rectOf(a), rt.ua);
  const p2 = perimeterPoint(rectOf(b), rt.ub);
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const len = Math.hypot(dx, dy) || 1;
  return curveFromPoints(p1, p2, rt.bA, rt.bB);
}

/* 单弯曲线：控制点落在弦的 1/3 / 2/3，只做法线偏移（同号） */
function curveFromPoints(p1, p2, bA, bB){
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  return {
    mode:"C", p1:p1, p2:p2, len:len,
    c1:{x:p1.x + dx / 3 + nx * bA, y:p1.y + dy / 3 + ny * bA},
    c2:{x:p1.x + dx * 2 / 3 + nx * bB, y:p1.y + dy * 2 / 3 + ny * bB}
  };
}

function applyRouteScale(rt, side, scale, ratio){
  const ra = ratio ? ratio[0] : 1, rb = ratio ? ratio[1] : 1;
  rt.side = side;
  rt.bA = rt.baseA * side * scale * ra;
  rt.bB = rt.baseB * side * scale * rb;
  return curveOf(rt, nav[rt.def.from], nav[rt.def.to]);
}

/* 非对称微调：两端弯幅取不同比例，形成「单侧钩形」绕过一张卡，仍不产生 S 形 */
const BOW_RATIO = [[1, 1], [0.45, 1], [1, 0.45], [0.28, 1], [1, 0.28], [1.7, 1], [1, 1.7]];

/* 逐边挑选弯幅/弯向：优先保持原侧与原幅度，仅在穿卡时加弯或换形 */
function tryShapes(rt, rects){
  rt.side = rt.side0;
  const dirs = [rt.side, -rt.side];
  const scales = BOW_SCALE;
  for (let d = 0; d < dirs.length; d++){
    for (let r = 0; r < BOW_RATIO.length; r++){
      for (let k = 0; k < scales.length; k++){
        const g = applyRouteScale(rt, dirs[d], scales[k], BOW_RATIO[r]);
        if (!crossesWith(g.p1, g.c1, g.c2, g.p2, rt.def.from, rt.def.to, rects, "C", -ROUTE_CLEAR)){
          rt.soft = false;
          return true;
        }
      }
    }
  }
  return false;
}

function anchorPts(rt){
  const a = nav[rt.def.from], b = nav[rt.def.to];
  return {p1:perimeterPoint(rectOf(a), rt.ua), p2:perimeterPoint(rectOf(b), rt.ub)};
}

/* 依据当前弦长重算弯幅基数（锚点换面后弦长改变，弯幅必须同步） */
function recalcBase(rt){
  const p = anchorPts(rt);
  const len = Math.hypot(p.p2.x - p.p1.x, p.p2.y - p.p1.y) || 1;
  const B = Math.min(BOW_MAX, Math.max(5, len * BOW_COEF));
  rt.baseA = B * (0.72 + 0.56 * rnd(rt.key, "ka"));
  rt.baseB = B * (0.72 + 0.56 * rnd(rt.key, "kb"));
  rt.len = len;
}

/* 弦的阻挡采样数：用来在候选锚点对里优先挑选走空隙的那一对 */
function chordHits(p1, p2, aId, bId, rects, margin){
  let hits = 0;
  for (let s = 2; s <= 18; s++){
    const t = s / 20;
    const pt = {x:p1.x + (p2.x - p1.x) * t, y:p1.y + (p2.y - p1.y) * t};
    for (let k = 0; k < rects.length; k++){
      const r = rects[k];
      if (r.id === aId || r.id === bId) continue;
      if (insideRect(pt, r, margin)){ hits++; break; }
    }
  }
  return hits;
}

/* 环距 */
function circDist(a, b){
  let d = Math.abs(a - b);
  return Math.min(d, 1 - d);
}

/* 候选槽位不得挤占同节点其它边的锚点（至少留 7px 边框弧长） */
function slotFree(routes, rt, end, u, nodeId, P){
  for (let i = 0; i < routes.length; i++){
    const o = routes[i];
    if (!o || o === rt) continue;
    if (o.def.from === nodeId && o.def.to === nodeId) continue;
    const ou = o.def.from === nodeId ? o.ua : (o.def.to === nodeId ? o.ub : null);
    if (ou == null) continue;
    if (circDist(ou, u) * P < 7) return false;
  }
  return true;
}

/* 两端锚点联合重选：先按「弦穿卡采样数」排序候选对，优先走卡片之间的空隙，
   再对前列候选尝试单弯形态；锚点换面后按新弦长重算弯幅，避免短边过弯/长边不够弯 */
function reselectAnchors(routes, rt, rects){
  const nA = nav[rt.def.from], nB = nav[rt.def.to];
  const PA = 2 * (nA.w + nA.h), PB = 2 * (nB.w + nB.h);
  const ra = rectOf(nA), rb = rectOf(nB);
  const ua0 = rt.ua, ub0 = rt.ub;
  const candA = [], candB = [];
  for (let k = 0; k < 16; k++){
    const u = (k / 16 + 0.03125) % 1;
    if (slotFree(routes, rt, "a", u, nA.id, PA)) candA.push(u);
    if (slotFree(routes, rt, "b", u, nB.id, PB)) candB.push(u);
  }
  if (!candA.length) candA.push(ua0);
  if (!candB.length) candB.push(ub0);
  const pairs = [];
  candA.forEach(ua => {
    const p1 = perimeterPoint(ra, ua);
    candB.forEach(ub => {
      const p2 = perimeterPoint(rb, ub);
      pairs.push({ua:ua, ub:ub, hits:chordHits(p1, p2, nA.id, nB.id, rects, -4)});
    });
  });
  pairs.sort((x, y) => x.hits - y.hits);
  const top = Math.min(pairs.length, 40);
  for (let i = 0; i < top; i++){
    rt.ua = pairs[i].ua;
    rt.ub = pairs[i].ub;
    recalcBase(rt);
    if (tryShapes(rt, rects)){ rt.moved = true; return true; }
  }
  rt.ua = ua0;
  rt.ub = ub0;
  recalcBase(rt);
  return false;
}

function clearRoutes(routes){
  const rects = staticRects();
  routes.forEach(rt => {
    if (!rt) return;
    if (tryShapes(rt, rects)) return;
    if (reselectAnchors(routes, rt, rects)) return;
    rt.soft = true;
    applyRouteScale(rt, rt.side, 1, BOW_RATIO[0]);
  });
}

function normAngle(a){
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

/* 出发角 / 到达角：看点而非弦，用来度量同一节点上边的扇开程度 */
function edgeAngle(rt, end){
  const g = curveOf(rt, nav[rt.def.from], nav[rt.def.to]);
  if (end === "a") return Math.atan2(g.c1.y - g.p1.y, g.c1.x - g.p1.x);
  return Math.atan2(g.p2.y - g.c2.y, g.p2.x - g.c2.x);
}

function routeCrosses(rt){
  const g = curveOf(rt, nav[rt.def.from], nav[rt.def.to]);
  return crossesWith(g.p1, g.c1, g.c2, g.p2, rt.def.from, rt.def.to, staticRects(), "C", -ROUTE_CLEAR);
}

/* 带额外净空的穿卡检查：给漂浮帧留出余量，避免贴边判定在边界上翻转 */
function routeCrossesBy(rt, extra){
  const g = curveOf(rt, nav[rt.def.from], nav[rt.def.to]);
  return crossesWith(g.p1, g.c1, g.c2, g.p2, rt.def.from, rt.def.to, staticRects(), "C", -(ROUTE_CLEAR + extra));
}

/* 单端改弯：factor > 0 缩放幅度，factor < 0 翻到另一侧；仍保持单弯 */
function bendValue(rt, which, factor){
  const base = Math.max(1, which === "bA" ? rt.baseA : rt.baseB);
  const cur = rt[which];
  const sign = cur >= 0 ? 1 : -1;
  const mag = Math.min(base * 2.6, Math.max(base * 0.14, Math.abs(cur) * factor));
  return sign * mag;
}

function pairAngle(rtA, rtB, which){
  const end = which === "bA" ? "a" : "b";
  return Math.abs(normAngle(edgeAngle(rtA, end) - edgeAngle(rtB, end)));
}

/* 同节点出发/到达边的最小夹角不足时，尝试翻侧 / 缩放，取角度最大且不穿卡的一种 */
function refineAngles(routes){
  const rad = ANGLE_MIN_DEG * Math.PI / 180;
  const byStart = {}, byEnd = {};
  routes.forEach(rt => {
    if (!rt) return;
    (byStart[rt.def.from] = byStart[rt.def.from] || []).push(rt);
    (byEnd[rt.def.to] = byEnd[rt.def.to] || []).push(rt);
  });
  for (let pass = 0; pass < 8; pass++){
    let fixed = false;
    ["start", "end"].forEach(kind => {
      const map = kind === "start" ? byStart : byEnd;
      Object.keys(map).forEach(id => {
        const list = map[id];
        if (list.length < 2) return;
        for (let i = 0; i < list.length; i++){
          for (let j = i + 1; j < list.length; j++){
            const which = kind === "start" ? "bA" : "bB";
            const end = kind === "start" ? "a" : "b";
            const d = Math.abs(normAngle(edgeAngle(list[i], end) - edgeAngle(list[j], end)));
            if (d >= rad) continue;
            const a0 = list[i][which], b0 = list[j][which];
            let best = d, bestVals = null;
            [[1.55, 0.6], [0.6, 1.55], [1.9, 0.5], [0.5, 1.9], [-1, -1], [-0.6, -1.4], [-1.4, -0.6]].forEach(c => {
              const va = bendValue(list[i], which, c[0]);
              const vb = bendValue(list[j], which, c[1]);
              if ((va >= 0) !== (vb >= 0)) return;   // 禁止 S 形（两端同号）
              if (Math.abs(va - a0) < 0.6 && Math.abs(vb - b0) < 0.6) return;
              list[i][which] = va;
              list[j][which] = vb;
              if (!routeCrosses(list[i]) && !routeCrosses(list[j])){
                const nd = pairAngle(list[i], list[j], which);
                if (nd > best){ best = nd; bestVals = [va, vb]; }
              }
              list[i][which] = a0;
              list[j][which] = b0;
            });
            if (bestVals){
              list[i][which] = bestVals[0];
              list[j][which] = bestVals[1];
              fixed = true;
            }
          }
        }
      });
    });
    if (!fixed) break;
  }
}

/* 同节点两条边的夹角仍不足时，沿边框把其中一个锚点挪开（仍保持槽位间距与零穿卡） */
function spreadAngles(routes){
  const rects = staticRects();
  const rad = ANGLE_MIN_DEG * Math.PI / 180;
  for (let pass = 0; pass < 4; pass++){
    let fixed = false;
    const groups = {};
    routes.forEach(rt => {
      if (!rt || rt.def.kind === "engine") return;
      (groups["s|" + rt.def.from] = groups["s|" + rt.def.from] || []).push(rt);
      (groups["e|" + rt.def.to] = groups["e|" + rt.def.to] || []).push(rt);
    });
    Object.keys(groups).forEach(gk => {
      const save = gk.split("|");
      const nodeId = save[1], end = save[0] === "s" ? "a" : "b";
      const which = end === "a" ? "bA" : "bB";
      const list = groups[gk];
      const node = nav[nodeId];
      const P = 2 * (node.w + node.h);
      for (let i = 0; i < list.length; i++){
        for (let j = i + 1; j < list.length; j++){
          const d = Math.abs(normAngle(edgeAngle(list[i], end) - edgeAngle(list[j], end)));
          if (d >= rad) continue;
          let solved = false;
          for (let t = 0; t < 2 && !solved; t++){
            const rt = list[t === 0 ? j : i];
            const uKey = end === "a" ? "ua" : "ub";
            const u0 = rt[uKey], bA0 = rt.bA, bB0 = rt.bB, side0 = rt.side, soft0 = rt.soft;
            for (let s = 1; s <= 4 && !solved; s++){
              for (let dir = -1; dir <= 1; dir += 2){
                const u = ((u0 + dir * s / 24) % 1 + 1) % 1;
                if (!slotFree(routes, rt, end, u, nodeId, P)) continue;
                rt[uKey] = u;
                recalcBase(rt);
                if (!tryShapes(rt, rects)) continue;
                if (routeCrossesBy(rt, 4)) continue;
                const nd = Math.abs(normAngle(edgeAngle(list[i], end) - edgeAngle(list[j], end)));
                if (nd > rad){ solved = true; fixed = true; break; }
              }
            }
            if (!solved){ rt[uKey] = u0; rt.bA = bA0; rt.bB = bB0; rt.side = side0; rt.soft = soft0; recalcBase(rt); }
          }
        }
      }
    });
    if (!fixed) break;
  }
}

/* 锚点扇形夹角：同一节点上两条边的锚点相对节点中心的方位角差，
   直接衡量「是否还从同一点扇出」（锚点已沿边框错开） */
function minFanAngleAtNodes(routes, kinds){
  let best = {deg:360, node:"", edges:[]};
  const map = {};
  routes.forEach(rt => {
    if (!rt) return;
    if (kinds && kinds.indexOf(rt.def.kind) < 0) return;
    (map[rt.def.from] = map[rt.def.from] || []).push({rt:rt, end:"a"});
    (map[rt.def.to] = map[rt.def.to] || []).push({rt:rt, end:"b"});
  });
  Object.keys(map).forEach(nodeId => {
    const list = map[nodeId];
    if (list.length < 2) return;
    const node = nav[nodeId];
    const c = centerOf(node);
    const angs = list.map(o => {
      const u = o.end === "a" ? o.rt.ua : o.rt.ub;
      const p = perimeterPoint(rectOf(node), u);
      return {a:Math.atan2(p.y - c.y, p.x - c.x), key:o.rt.key, end:o.end};
    });
    for (let i = 0; i < angs.length; i++){
      for (let j = i + 1; j < angs.length; j++){
        const ri = list[i].rt, rj = list[j].rt;
        if (ri.def.from === rj.def.to && ri.def.to === rj.def.from) continue; // 双向对按一条连接计
        const d = Math.abs(normAngle(angs[i].a - angs[j].a)) * 180 / Math.PI;
        if (d < best.deg) best = {deg:d, node:nodeId, edges:[angs[i].key, angs[j].key]};
      }
    }
  });
  return best;
}

function minAngleAtNodes(routes, kinds){
  const byStart = {}, byEnd = {};
  routes.forEach(rt => {
    if (!rt) return;
    if (kinds && kinds.indexOf(rt.def.kind) < 0) return;
    (byStart[rt.def.from] = byStart[rt.def.from] || []).push(rt);
    (byEnd[rt.def.to] = byEnd[rt.def.to] || []).push(rt);
  });
  let min = Infinity;
  const duo = {a:[], b:[]};
  [byStart, byEnd].forEach((map, ci) => {
    const end = ci === 0 ? "a" : "b";
    Object.keys(map).forEach(id => {
      const list = map[id];
      for (let i = 0; i < list.length; i++){
        for (let j = i + 1; j < list.length; j++){
          const d = Math.abs(normAngle(edgeAngle(list[i], end) - edgeAngle(list[j], end))) * 180 / Math.PI;
          if (d < min){ min = d; duo.a = [list[i].key, list[j].key, id]; }
        }
      }
    });
  });
  return {deg:min === Infinity ? 0 : min, node:duo.a[2] || "", edges:[duo.a[0] || "", duo.a[1] || ""]};
}

/* 交叉收敛：主干优先放置，逐边在「零穿卡」候选形态里挑与已放置边交叉最少的，
   交叉数相同则取弯幅更小的。只在已有零穿卡解附近微调，不会引入新的穿卡。 */
const TRUNK_ORDER = [
  "end_web|c_thinking", "end_qq_pri|a_bridging", "end_qq_grp|a_bridging",
  "a_bridging|a_dialogue", "a_dialogue|c_thinking", "c_thinking|a_dialogue",
  "a_dialogue|a_bridging", "c_thinking|end_web", "a_bridging|end_qq_pri",
  "a_bridging|end_qq_grp"
];

function routePoly(rt, n){
  const g = curveOf(rt, nav[rt.def.from], nav[rt.def.to]);
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push(cubicPoint(g.p1, g.c1, g.c2, g.p2, i / n));
  return pts;
}

function polyHits(A, B){
  for (let x = 0; x < A.length - 1; x++){
    for (let y = 0; y < B.length - 1; y++){
      if (segHit(A[x], A[x + 1], B[y], B[y + 1])) return true;
    }
  }
  return false;
}

function shapeValid(rt, bA, bB, rects){
  const p = anchorPts(rt);
  const g = curveFromPoints(p.p1, p.p2, bA, bB);
  return !crossesWith(g.p1, g.c1, g.c2, g.p2, rt.def.from, rt.def.to, rects, "C", -ROUTE_CLEAR);
}

function polishCrossings(routes){
  const rects = staticRects();
  const list = [];
  TRUNK_ORDER.forEach(k => {
    const rt = routes.find(r => r && r.key === k && r.def.kind !== "engine");
    if (rt) list.push(rt);
  });
  routes.forEach(rt => {
    if (rt && rt.def.kind !== "engine" && list.indexOf(rt) < 0) list.push(rt);
  });
  /* 候选形态：整体翻侧 / 缩放 / 单端微调，全部保持同号单弯 */
  function variants(rt){
    const curA = rt.bA, curB = rt.bB, out = [];
    [1, -1, 0.72, -0.72, 0.45, -0.45, 0.18, -0.18, 1.3, -1.3, 1.6, -1.6].forEach(f => out.push([curA * f, curB * f]));
    [[1.5, 1], [1, 1.5], [0.6, 1], [1, 0.6]].forEach(rs => out.push([curA * rs[0], curB * rs[1]]));
    return out;
  }
  /* 坐标下降：每轮按当前所有边重挑形态，直到不再变化 */
  for (let pass = 0; pass < 3; pass++){
    const polys = list.map(rt => routePoly(rt, 12));
    let changed = false;
    list.forEach((rt, ci) => {
      const cands = variants(rt);
      const curA = rt.bA, curB = rt.bB;
      let best = {a:curA, b:curB, score:Infinity, poly:polys[ci]};
      cands.forEach(c => {
        if (!shapeValid(rt, c[0], c[1], rects)) return;
        rt.bA = c[0]; rt.bB = c[1];
        const poly = routePoly(rt, 12);
        let cr = 0;
        for (let i = 0; i < list.length; i++){
          if (i === ci) continue;
          if (polyHits(poly, polys[i])) cr++;
        }
        const score = cr * 1000 + Math.abs(c[0]) + Math.abs(c[1]);
        if (score < best.score) best = {a:c[0], b:c[1], score:score, poly:poly};
      });
      rt.bA = best.a;
      rt.bB = best.b;
      if (best.a !== curA || best.b !== curB) changed = true;
      polys[ci] = best.poly;
    });
    if (!changed) break;
  }
}

/* 高交叉边的锚点再优化：只对交叉最严重的若干条边，在相邻边框槽位里找
   「不穿卡 + 与其它边交叉更少」的单弯形态；锚点仍保持同节点最小环距 */
function countCross(poly, polys, skip){
  let c = 0;
  for (let i = 0; i < polys.length; i++){
    if (i === skip) continue;
    if (polyHits(poly, polys[i])) c++;
  }
  return c;
}

function polishAnchors(routes){
  const rects = staticRects();
  const list = routes.filter(rt => rt && rt.def.kind !== "engine");
  let polys = list.map(rt => routePoly(rt, 12));
  const counts = list.map((rt, i) => countCross(polys[i], polys, i));
  const targets = list.map((rt, i) => ({rt:rt, i:i, n:counts[i]}))
    .filter(x => x.n >= 6)
    .sort((a, b) => b.n - a.n)
    .slice(0, 6);
  targets.forEach(tg => {
    const rt = tg.rt, ci = tg.i;
    const nA = nav[rt.def.from], nB = nav[rt.def.to];
    const PA = 2 * (nA.w + nA.h), PB = 2 * (nB.w + nB.h);
    const baseUa = rt.ua, baseUb = rt.ub, baseA = rt.bA, baseB = rt.bB;
    let best = {
      ua:baseUa, ub:baseUb, a:baseA, b:baseB,
      score:countCross(polys[ci], polys, ci) * 1000 + Math.abs(baseA) + Math.abs(baseB),
      poly:polys[ci]
    };
    const as = [], bs = [];
    for (let k = 0; k < 10; k++){
      const u = (k / 10 + 0.05) % 1;
      if (circDist(u, baseUa) * PA > 9 && slotFree(routes, rt, "a", u, nA.id, PA)) as.push(u);
      if (circDist(u, baseUb) * PB > 9 && slotFree(routes, rt, "b", u, nB.id, PB)) bs.push(u);
    }
    const pairs = [{ua:baseUa, ub:baseUb}];
    as.forEach(u => pairs.push({ua:u, ub:baseUb}));
    bs.forEach(u => pairs.push({ua:baseUa, ub:u}));
    as.slice(0, 4).forEach(ua => bs.slice(0, 4).forEach(ub => pairs.push({ua:ua, ub:ub})));
    pairs.forEach(pr => {
      rt.ua = pr.ua;
      rt.ub = pr.ub;
      recalcBase(rt);
      const moved = pr.ua !== baseUa || pr.ub !== baseUb;
      [1, -1].forEach(sd => [1, 1.3, 0.7, 0.45, 0.18].forEach(sc => {
        const bA = rt.baseA * sd * sc, bB = rt.baseB * sd * sc;
        if (!shapeValid(rt, bA, bB, rects)) return;
        rt.bA = bA;
        rt.bB = bB;
        const poly = routePoly(rt, 12);
        const score = countCross(poly, polys, ci) * 1000 + Math.abs(bA) + Math.abs(bB) + (moved ? 20 : 0);
        if (score < best.score) best = {ua:pr.ua, ub:pr.ub, a:bA, b:bB, score:score, poly:poly};
      }));
    });
    rt.ua = best.ua;
    rt.ub = best.ub;
    rt.bA = best.a;
    rt.bB = best.b;
    polys[ci] = best.poly;
  });
}
let routeCache = null;
function planRoutes(){
  if (routeCache && routeCache.seed === LAYOUT_SEED) return routeCache.routes;
  const routes = [];
  const lists = {};
  EDGES.forEach((e, i) => {
    const a = nav[e.from], b = nav[e.to];
    if (!a || !b){ routes[i] = null; return; }
    const ra = rectOf(a), rb = rectOf(b);
    const ca = centerOf(a), cb = centerOf(b);
    const rt = {i:i, def:e, key:e.from + "|" + e.to,
      ua:rayU(ra, cb.x, cb.y), ub:rayU(rb, ca.x, ca.y), soft:false, side:1};
    routes[i] = rt;
    (lists[e.from] = lists[e.from] || []).push({rt:rt, end:"a"});
    (lists[e.to] = lists[e.to] || []).push({rt:rt, end:"b"});
  });
  Object.keys(lists).forEach(id => {
    const list = lists[id];
    list.forEach(x => { x.u = x.end === "a" ? x.rt.ua : x.rt.ub; });
    list.sort((p, q) => p.u - q.u);
    const n = nav[id], P = 2 * (n.w + n.h);
    let gap = ANCHOR_GAP / P;
    if (gap * list.length > 0.82) gap = 0.82 / list.length;
    relaxSlots(list, gap);
    list.forEach(x => {
      const u = ((x.u % 1) + 1) % 1;
      if (x.end === "a") x.rt.ua = u; else x.rt.ub = u;
    });
  });
  routes.forEach(rt => {
    if (!rt) return;
    const a = nav[rt.def.from], b = nav[rt.def.to];
    recalcBase(rt);
    const p1 = perimeterPoint(rectOf(a), rt.ua);
    const p2 = perimeterPoint(rectOf(b), rt.ub);
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    rt.side = sideBias(rt.def.kind, dx, dy, rt.key);
    rt.side0 = rt.side;
  });
  clearRoutes(routes);
  refineAngles(routes);
  polishCrossings(routes);
  polishAnchors(routes);
  refineAngles(routes);
  spreadAngles(routes);
  routeCache = {seed:LAYOUT_SEED, routes:routes};
  return routes;
}

/* 曲线自检：投影单调 / 自环 / 重复边 / 同节点最小夹角 */
function auditCurves(routes){
  let fold = 0, selfLoops = 0, dupPairs = 0;
  const foldList = [];
  const seen = {};
  EDGES.forEach(e => {
    if (e.from === e.to) selfLoops++;
    const k = e.from + "|" + e.to;
    if (seen[k]) dupPairs++;
    seen[k] = 1;
  });
  routes.forEach(rt => {
    if (!rt) return;
    const g = curveOf(rt, nav[rt.def.from], nav[rt.def.to]);
    const dx = g.p2.x - g.p1.x, dy = g.p2.y - g.p1.y;
    const len = Math.hypot(dx, dy) || 1;
    let prev = 0;
    for (let s = 1; s <= 32; s++){
      const pt = cubicPoint(g.p1, g.c1, g.c2, g.p2, s / 32);
      const proj = ((pt.x - g.p1.x) * dx + (pt.y - g.p1.y) * dy) / len;
      if (proj < prev - 0.15){ fold++; break; }
      prev = proj;
    }
    if (Math.abs(rt.bA) > 3 && Math.abs(rt.bB) > 3){
      if ((rt.bA > 0) !== (rt.bB > 0)){
        fold++;
        if (foldList.length < 6) foldList.push(rt.key + " bA=" + rt.bA.toFixed(1) + " bB=" + rt.bB.toFixed(1));
      }
    }
  });
  return {fold:fold, foldList:foldList, selfLoops:selfLoops, dupPairs:dupPairs, fanAngle:minFanAngleAtNodes(routes, ["in", "out", "tool", "event"]), minAngle:minAngleAtNodes(routes, ["in", "out", "tool", "event"]), minAngleAll:minAngleAtNodes(routes), softInfo:routes.filter(rt => rt && rt.soft && rt.def.kind !== "engine").slice(0, 14).map(rt => rt.key + "@" + rt.ua.toFixed(3) + "," + rt.ub.toFixed(3) + " b=" + rt.bA.toFixed(0) + "/" + rt.bB.toFixed(0))};
}

function pathData(g){
  if (g.mode === "Q"){
    return "M " + g.p1.x.toFixed(1) + " " + g.p1.y.toFixed(1) + " Q " +
      g.c.x.toFixed(1) + " " + g.c.y.toFixed(1) + ", " +
      g.p2.x.toFixed(1) + " " + g.p2.y.toFixed(1);
  }
  return "M " + g.p1.x.toFixed(1) + " " + g.p1.y.toFixed(1) + " C " +
    g.c1.x.toFixed(1) + " " + g.c1.y.toFixed(1) + ", " +
    g.c2.x.toFixed(1) + " " + g.c2.y.toFixed(1) + ", " +
    g.p2.x.toFixed(1) + " " + g.p2.y.toFixed(1);
}

function rectGap(p, r){
  const dx = Math.max(r.x - p.x, 0, p.x - (r.x + r.w));
  const dy = Math.max(r.y - p.y, 0, p.y - (r.y + r.h));
  return Math.hypot(dx, dy);
}

/* 某一时刻所有卡片的实际外框（含漂浮位移与缩放呼吸） */
function frameRects(t){
  return nodes.map(n => {
    const o = offsetAt(n, t);
    const w = n.w * o.s, h = n.h * o.s;
    return {id:n.id, x:n.x + (n.w - w) / 2 + o.dx, y:n.y + (n.h - h) / 2 + o.dy, w:w, h:h};
  });
}

/* 多帧连线自检：锚点脱开、悬空端点、曲线穿卡、越界 */
function auditEdgeFrames(){
  const routes = planRoutes();
  let maxGap = 0, detached = 0, crossings = 0, hanging = 0;
  const crossList = [];
  /* 静态零偏移复核：区分「路由本身穿卡」与「漂浮导致穿卡」；
     引擎背景线绘制在卡片之下（z3 < 节点 z4/z6），不参与前景穿越计数 */
  let staticCross = 0;
  const staticCrossList = [];
  const srects = staticRects();
  EDGES.forEach((e, i) => {
    if (!nav[e.from] || !nav[e.to]){ hanging++; return; }
    if (e.kind === "engine") return;
    const rt = routes[i];
    if (!rt) return;
    const g = curveOf(rt, nav[e.from], nav[e.to]);
    const id = firstCrossId(g.p1, g.c1, g.c2, g.p2, e.from, e.to, srects, "C", 1);
    if (id){
      staticCross++;
      if (staticCrossList.length < 12) staticCrossList.push(e.from + ">" + e.to + ":" + id);
    }
  });
  for (let f = 0; f < 10; f++){
    const t = f * 2.4 + 0.17;
    const rects = frameRects(t);
    const rmap = {};
    rects.forEach(r => { rmap[r.id] = r; });
    EDGES.forEach((e, i) => {
      if (e.kind === "engine") return;
      const rt = routes[i];
      if (!rt) return;
      const ra = rmap[e.from], rb = rmap[e.to];
      if (!ra || !rb) return;
      const p1 = perimeterPoint(ra, rt.ua), p2 = perimeterPoint(rb, rt.ub);
      const g1 = rectGap(p1, ra), g2 = rectGap(p2, rb);
      maxGap = Math.max(maxGap, g1, g2);
      if (g1 > 1 || g2 > 1) detached++;
      const g = curveFromPoints(p1, p2, rt.bA, rt.bB);
      if (crossesWith(g.p1, g.c1, g.c2, g.p2, e.from, e.to, rects, "C", 1)){
        crossings++;
        if (crossList.length < 12) crossList.push(e.from + ">" + e.to + "@" + f);
      }
    });
  }
  return {frames:10, edges:EDGES.length, hanging:hanging, detached:detached, maxGap:maxGap, crossings:crossings, crossList:crossList, staticCross:staticCross, staticCrossList:staticCrossList};
}
