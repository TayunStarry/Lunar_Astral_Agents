<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, minimum-scale=0.5, maximum-scale=0.8">
    <title>LunarCore - 月之华</title>
    <!-- 外部资源路径保持不变 -->
    <script src="/read/resources/external/marked.min.js"></script>
    <script src="/read/resources/external/echarts.min.js"></script>
    <script src="/read/resources/external/mermaid.min.js"></script>
    <link rel="stylesheet" href="/read/resources/external/fontAwesome/css/all.min.css">
    <script src="/read/resources/external/highlight/highlight.min.js"></script>
    <link rel="stylesheet" href="/read/resources/external/highlight/styles/github.css">
    <script src="/read/resources/external/live2dcubismcore.min.js"></script>
    <script src="/read/resources/external/pixi.5.3.12.min.js"></script>
    <script src="/read/resources/external/pixi-live2d-display-cubism4.min.js"></script>
    <link rel="stylesheet" href="/read/resources/external/katex/katex.min.css">
    <script defer src="/read/resources/external/katex/katex.min.js"></script>
    <script defer src="/read/resources/external/katex/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="/read/resources/external/katex/contrib/auto-render.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- 动态渐变背景 -->
    <div class="background"></div>
    <!-- 毛玻璃叠加层 -->
    <div class="glass-effect"></div>

    <div class="container">
        <div class="main-container-panel" id="mainContainerPanel">
            <!-- 顶部控制区 -->
            <div class="control-panel" id="controlPanel">
                <button class="control-button" id="chatHistoryButton" title="聊天记录">
                    <i class="fas fa-history"></i>
                </button>
            </div>

            <!-- 核心展示区：Live2D 模型 -->
            <div class="live2d-wrapper" id="live2dWrapper">
                <div class="live2d-container" id="live2dContainer">
                    <canvas id="live2dCanvas"></canvas>
                    <div class="live2d-model-intel" id="modelIntel">月之华</div>
                </div>
            </div>

            <!-- 聊天记录条（默认隐藏） -->
            <div class="chat-history-panel" id="chatHistoryPanel"></div>

            <!-- 底部输入区 -->
            <div class="input-container" id="inputContainer">
                <div class="file-preview-area" id="filePreviewArea"></div>
                <div class="input-wrapper">
                    <textarea class="message-input" id="messageInput" placeholder="输入消息..." rows="1"></textarea>
                    <button class="send-button" id="sendButton">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息记录模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <div class="modal-header">
                <h3>消息记录</h3>
                <button class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- 错误提示条 -->
    <div class="error-toast" id="errorToast"></div>

    <script type="module" src="./dist/app.js"></script>
</body>

</html>
