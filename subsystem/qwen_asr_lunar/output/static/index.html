<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音识别测试 - Qwen ASR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            color: #e0e0e0;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d2ff 0%, #7b2cbf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.online {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .status-dot.offline {
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.05);
        }

        .upload-area.drag-over {
            border-color: #7b2cbf;
            background: rgba(123, 44, 191, 0.1);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .upload-hint {
            font-size: 0.8rem;
            color: #666;
        }

        #fileInput {
            display: none;
        }

        .file-info {
            display: none;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            align-items: center;
            gap: 15px;
        }

        .file-info.show {
            display: flex;
        }

        .file-icon {
            font-size: 2rem;
        }

        .file-details {
            flex: 1;
        }

        .file-name {
            font-weight: 500;
            margin-bottom: 3px;
            word-break: break-all;
        }

        .file-size {
            font-size: 0.8rem;
            color: #888;
        }

        .remove-btn {
            background: rgba(255, 68, 68, 0.2);
            border: none;
            color: #ff4444;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            background: rgba(255, 68, 68, 0.4);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00d2ff 0%, #7b2cbf 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-area {
            display: none;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .result-area.show {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-title {
            font-weight: 500;
            color: #00d2ff;
        }

        .confidence-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .confidence-high {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .confidence-medium {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .confidence-low {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
        }

        .result-text {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 60px;
            word-break: break-word;
        }

        .error-text {
            color: #ff4444;
        }

        .audio-player {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        audio {
            width: 100%;
            height: 40px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #00d2ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .log-area {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            color: #888;
        }

        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: #666;
            margin-right: 10px;
        }

        .log-info {
            color: #00d2ff;
        }

        .log-success {
            color: #00ff88;
        }

        .log-error {
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Qwen ASR 语音识别</h1>
        <p class="subtitle">基于 Qwen3-ASR 模型的中文语音识别系统</p>

        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">检查服务器连接...</span>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">🎤</div>
            <div class="upload-text">点击或拖拽上传 WAV 音频文件</div>
            <div class="upload-hint">仅支持 WAV 格式，16kHz 采样率，16位 PCM</div>
        </div>
        <input type="file" id="fileInput" accept=".wav">

        <div class="file-info" id="fileInfo">
            <div class="file-icon">🎵</div>
            <div class="file-details">
                <div class="file-name" id="fileName">-</div>
                <div class="file-size" id="fileSize">-</div>
            </div>
            <button class="remove-btn" id="removeBtn">移除</button>
        </div>

        <audio class="audio-player" id="audioPlayer" controls style="display: none;"></audio>

        <button class="btn btn-primary" id="recognizeBtn" disabled>
            开始语音识别
        </button>

        <div class="result-area" id="resultArea">
            <div class="result-header">
                <span class="result-title">识别结果</span>
                <span class="confidence-badge" id="confidenceBadge">-</span>
            </div>
            <div class="result-text" id="resultText">-</div>
        </div>

        <div class="log-area" id="logArea">
            <div class="log-entry">
                <span class="log-time" id="initTime"></span>
                <span class="log-info">系统初始化完成</span>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const removeBtn = document.getElementById('removeBtn');
        const audioPlayer = document.getElementById('audioPlayer');
        const recognizeBtn = document.getElementById('recognizeBtn');
        const resultArea = document.getElementById('resultArea');
        const resultText = document.getElementById('resultText');
        const confidenceBadge = document.getElementById('confidenceBadge');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const logArea = document.getElementById('logArea');

        let selectedFile = null;

        document.getElementById('initTime').textContent = new Date().toLocaleTimeString('zh-CN');

        async function checkHealth() {
            try {
                const res = await fetch(`${API_BASE}/health`);
                if (res.ok) {
                    statusDot.className = 'status-dot online';
                    statusText.textContent = '服务器已连接';
                    addLog('success', '服务器连接成功');
                } else {
                    throw new Error('Health check failed');
                }
            } catch (e) {
                statusDot.className = 'status-dot offline';
                statusText.textContent = '服务器未连接';
                addLog('error', '服务器连接失败，请检查服务是否启动');
            }
        }

        checkHealth();

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                handleFile(fileInput.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.name.toLowerCase().endsWith('.wav')) {
                alert('仅支持 WAV 格式文件');
                addLog('error', '不支持的文件格式，请使用 WAV 格式');
                return;
            }

            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('show');
            audioPlayer.style.display = 'block';
            audioPlayer.src = URL.createObjectURL(file);
            recognizeBtn.disabled = false;
            resultArea.classList.remove('show');
            addLog('info', `已选择文件: ${file.name} (${formatFileSize(file.size)})`);
        }

        removeBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            fileInfo.classList.remove('show');
            audioPlayer.style.display = 'none';
            audioPlayer.src = '';
            recognizeBtn.disabled = true;
            resultArea.classList.remove('show');
            addLog('info', '已移除文件');
        });

        recognizeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            recognizeBtn.disabled = true;
            recognizeBtn.innerHTML = '<span class="spinner"></span>识别中...';
            resultArea.classList.remove('show');
            addLog('info', '开始语音识别...');

            try {
                const formData = new FormData();
                formData.append('audio', selectedFile);

                const startTime = Date.now();
                const response = await fetch(`${API_BASE}/asr`, {
                    method: 'POST',
                    body: formData
                });

                const elapsed = Date.now() - startTime;
                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    addLog('success', `识别成功 (${elapsed}ms): ${data.text}`);
                    resultText.textContent = data.text;
                    resultText.classList.remove('error-text');

                    const confidence = data.confidence * 100;
                    confidenceBadge.textContent = `置信度: ${confidence.toFixed(0)}%`;
                    confidenceBadge.className = 'confidence-badge ' +
                        (confidence >= 80 ? 'confidence-high' :
                         confidence >= 60 ? 'confidence-medium' : 'confidence-low');
                } else {
                    addLog('error', `识别失败: ${data.error}`);
                    resultText.textContent = `错误: ${data.error}`;
                    resultText.classList.add('error-text');
                    confidenceBadge.textContent = '识别失败';
                    confidenceBadge.className = 'confidence-badge confidence-low';
                }

                resultArea.classList.add('show');
            } catch (e) {
                addLog('error', `请求失败: ${e.message}`);
                resultText.textContent = `请求失败: ${e.message}`;
                resultText.classList.add('error-text');
                confidenceBadge.textContent = '请求失败';
                confidenceBadge.className = 'confidence-badge confidence-low';
                resultArea.classList.add('show');
            } finally {
                recognizeBtn.disabled = false;
                recognizeBtn.innerHTML = '开始语音识别';
            }
        });

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function addLog(type, message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">${new Date().toLocaleTimeString('zh-CN')}</span><span class="log-${type}">${message}</span>`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }
    </script>
</body>
</html>
