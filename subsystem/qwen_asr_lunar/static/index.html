<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen ASR - 语音识别</title>
<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
  background-attachment: fixed;
  position: relative;
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: url('picture.webp') center/cover no-repeat;
  opacity: 0.35;
  z-index: 0;
}

.bg-decoration {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.12;
  z-index: 0;
  pointer-events: none;
}

.bg-decoration:nth-child(2) {
  width: 450px; height: 450px;
  background: radial-gradient(circle, #667eea, transparent);
  top: -100px; right: -100px;
  animation: floatA 20s ease-in-out infinite;
}

.bg-decoration:nth-child(3) {
  width: 350px; height: 350px;
  background: radial-gradient(circle, #f093fb, transparent);
  bottom: -80px; left: -80px;
  animation: floatB 25s ease-in-out infinite;
}

.bg-decoration:nth-child(4) {
  width: 300px; height: 300px;
  background: radial-gradient(circle, #4facfe, transparent);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation: floatC 18s ease-in-out infinite;
}

@keyframes floatA {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  33% { transform: translate(-60px, 40px) rotate(120deg); }
  66% { transform: translate(30px, -30px) rotate(240deg); }
}

@keyframes floatB {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  33% { transform: translate(50px, -30px) rotate(-120deg); }
  66% { transform: translate(-40px, 20px) rotate(-240deg); }
}

@keyframes floatC {
  0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.3); }
}

.main-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 600px;
  padding: 20px;
}

.glass-card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 24px;
  padding: 40px 36px;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.25),
    0 2px 8px rgba(0, 0, 0, 0.15),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
  transition: all 0.3s ease;
}

.header {
  text-align: center;
  margin-bottom: 36px;
}

.header-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 16px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.header-icon svg {
  width: 28px;
  height: 28px;
  fill: none;
  stroke: rgba(255, 255, 255, 0.85);
  stroke-width: 2;
}

.header h1 {
  font-size: 22px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.92);
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.header p {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.45);
  font-weight: 400;
}

.upload-zone {
  border: 2px dashed rgba(255, 255, 255, 0.18);
  border-radius: 18px;
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  background: rgba(255, 255, 255, 0.03);
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}

.upload-zone:hover {
  border-color: rgba(255, 255, 255, 0.35);
  background: rgba(255, 255, 255, 0.07);
}

.upload-zone.drag-over {
  border-color: rgba(255, 255, 255, 0.55);
  background: rgba(255, 255, 255, 0.12);
  transform: scale(1.01);
}

.upload-zone .upload-icon {
  margin-bottom: 12px;
  opacity: 0.7;
}

.upload-zone .upload-icon svg {
  width: 40px;
  height: 40px;
  stroke: rgba(255, 255, 255, 0.6);
  fill: none;
  stroke-width: 1.8;
}

.upload-zone p {
  color: rgba(255, 255, 255, 0.55);
  font-size: 14px;
  margin-bottom: 4px;
}

.upload-zone span {
  color: rgba(255, 255, 255, 0.3);
  font-size: 12px;
}

.upload-zone input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.controls {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}

.btn {
  flex: 1;
  padding: 13px 20px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(10px);
  color: rgba(255, 255, 255, 0.85);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  letter-spacing: 0.3px;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.25);
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(0) scale(0.98);
}

.btn.primary {
  background: rgba(99, 126, 234, 0.35);
  border-color: rgba(99, 126, 234, 0.4);
}

.btn.primary:hover {
  background: rgba(99, 126, 234, 0.5);
  border-color: rgba(99, 126, 234, 0.6);
}

.btn.recording {
  background: rgba(239, 68, 68, 0.35);
  border-color: rgba(239, 68, 68, 0.5);
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
  50% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
}

.btn svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.file-info {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 12px;
  margin-bottom: 20px;
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.file-info.visible {
  display: flex;
}

.file-info .file-name {
  color: rgba(255, 255, 255, 0.7);
  font-size: 13px;
  font-weight: 500;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-info .remove-btn {
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.4);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
}

.file-info .remove-btn:hover {
  color: rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.08);
}

.audio-player {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  margin-bottom: 20px;
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.audio-player.visible {
  display: flex;
}

.play-btn {
  background: rgba(99, 126, 234, 0.25);
  border: 1px solid rgba(99, 126, 234, 0.3);
  border-radius: 50%;
  width: 34px;
  height: 34px;
  min-width: 34px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  padding: 0;
}

.play-btn:hover {
  background: rgba(99, 126, 234, 0.45);
  border-color: rgba(99, 126, 234, 0.5);
  transform: scale(1.05);
}

.play-btn:active {
  transform: scale(0.95);
}

.play-btn svg {
  width: 16px;
  height: 16px;
  fill: rgba(255, 255, 255, 0.85);
  stroke: none;
}

.audio-seek {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.12);
  outline: none;
  cursor: pointer;
}

.audio-seek::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.8);
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
}

.audio-seek::-webkit-slider-thumb:hover {
  background: rgba(255, 255, 255, 1);
  transform: scale(1.2);
}

.audio-time {
  color: rgba(255, 255, 255, 0.5);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  min-width: 72px;
  text-align: right;
}

.status-bar {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: 14px;
  margin-bottom: 20px;
  font-size: 13px;
  font-weight: 500;
}

.status-bar.visible {
  display: flex;
}

.status-bar.processing {
  background: rgba(99, 126, 234, 0.12);
  border: 1px solid rgba(99, 126, 234, 0.2);
  color: rgba(180, 200, 255, 0.9);
}

.status-bar.success {
  background: rgba(52, 211, 153, 0.1);
  border: 1px solid rgba(52, 211, 153, 0.2);
  color: rgba(110, 231, 183, 0.9);
}

.status-bar.error {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: rgba(252, 165, 165, 0.9);
}

.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-top-color: rgba(255, 255, 255, 0.7);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.recording-timer {
  display: none;
  text-align: center;
  margin-bottom: 20px;
  font-size: 28px;
  font-weight: 300;
  color: rgba(255, 255, 255, 0.8);
  font-variant-numeric: tabular-nums;
  letter-spacing: 2px;
}

.recording-timer.visible {
  display: block;
}

.results-section {
  display: none;
}

.results-section.visible {
  display: block;
}

.results-section .result-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 18px;
  padding: 24px;
  margin-top: 16px;
}

.result-label {
  font-size: 11px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.35);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 10px;
}

.result-text {
  font-size: 16px;
  color: rgba(255, 255, 255, 0.85);
  line-height: 1.8;
  word-break: break-word;
}

.confidence-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  background: rgba(52, 211, 153, 0.12);
  border: 1px solid rgba(52, 211, 153, 0.2);
  color: rgba(110, 231, 183, 0.9);
  font-size: 12px;
  font-weight: 500;
  margin-top: 14px;
}

.confidence-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(52, 211, 153, 0.8);
}

.footer {
  text-align: center;
  margin-top: 32px;
  color: rgba(255, 255, 255, 0.2);
  font-size: 11px;
  letter-spacing: 1px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}

@media (max-width: 640px) {
  .main-container {
    padding: 12px;
  }

  .glass-card {
    padding: 28px 20px;
    border-radius: 20px;
  }

  .header h1 {
    font-size: 19px;
  }

  .controls {
    flex-direction: column;
  }

  .upload-zone {
    padding: 24px 16px;
  }

  .result-text {
    font-size: 14px;
  }
}

@media (min-width: 641px) and (max-width: 1024px) {
  .main-container {
    max-width: 520px;
  }
}

@media (min-width: 1025px) {
  .main-container {
    max-width: 620px;
  }
}
</style>
</head>
<body>

<div class="bg-decoration"></div>
<div class="bg-decoration"></div>
<div class="bg-decoration"></div>

<div class="main-container">
  <div class="glass-card">
    <div class="header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
      <h1>Qwen ASR 语音识别</h1>
      <p>上传音频文件或直接录制，即可转写为文本</p>
    </div>

    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">
        <svg viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p>点击上传或拖拽 WAV 音频文件</p>
      <span>仅支持 WAV 格式</span>
      <input type="file" id="fileInput" accept=".wav,audio/wav,audio/wave,audio/x-wav">
    </div>

    <div class="file-info" id="fileInfo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
        <polyline points="13 2 13 9 20 9"/>
      </svg>
      <span class="file-name" id="fileName"></span>
      <button class="remove-btn" id="removeFileBtn" title="移除文件">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="audio-player" id="audioPlayer">
      <button class="play-btn" id="playBtn" title="播放/暂停">
        <svg viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
      <input class="audio-seek" id="audioSeek" type="range" min="0" max="100" value="0" step="0.1">
      <span class="audio-time" id="audioTime">00:00</span>
    </div>

    <div class="recording-timer" id="recordingTimer">00:00</div>

    <div class="controls">
      <button class="btn primary" id="transcribeBtn" disabled>
        <svg viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        开始转写
      </button>
      <button class="btn" id="recordBtn">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="6"/>
          <circle cx="12" cy="12" r="6"/>
        </svg>
        录制
      </button>
    </div>

    <div class="status-bar" id="statusBar">
      <div class="spinner" id="spinner"></div>
      <span id="statusText"></span>
    </div>

    <div class="results-section" id="resultsSection">
      <div class="result-card">
        <div class="result-label">识别结果</div>
        <div class="result-text" id="resultText"></div>
        <div class="confidence-badge" id="confidenceBadge">
          <span class="confidence-dot"></span>
          <span id="confidenceText"></span>
        </div>
      </div>
    </div>

    <div class="footer">Powered by Qwen ASR Engine</div>
  </div>
</div>

<script>
(function() {
  var fileInput = document.getElementById('fileInput');
  var uploadZone = document.getElementById('uploadZone');
  var fileInfo = document.getElementById('fileInfo');
  var fileName = document.getElementById('fileName');
  var removeFileBtn = document.getElementById('removeFileBtn');
  var transcribeBtn = document.getElementById('transcribeBtn');
  var recordBtn = document.getElementById('recordBtn');
  var statusBar = document.getElementById('statusBar');
  var statusText = document.getElementById('statusText');
  var spinner = document.getElementById('spinner');
  var resultsSection = document.getElementById('resultsSection');
  var resultText = document.getElementById('resultText');
  var confidenceBadge = document.getElementById('confidenceBadge');
  var confidenceText = document.getElementById('confidenceText');
  var recordingTimer = document.getElementById('recordingTimer');

  var selectedFile = null;
  var mediaRecorder = null;
  var audioChunks = [];
  var isRecording = false;
  var recordingStartTime = 0;
  var timerInterval = null;

  var audioPlayer = document.getElementById('audioPlayer');
  var playBtn = document.getElementById('playBtn');
  var audioSeek = document.getElementById('audioSeek');
  var audioTime = document.getElementById('audioTime');
  var audioObj = null;
  var audioUrl = null;
  var seekUpdateInterval = null;

  uploadZone.addEventListener('click', function(e) {
    if (e.target !== fileInput) {
      fileInput.click();
    }
  });

  uploadZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    uploadZone.classList.add('drag-over');
  });

  uploadZone.addEventListener('dragleave', function() {
    uploadZone.classList.remove('drag-over');
  });

  uploadZone.addEventListener('drop', function(e) {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    var files = e.dataTransfer.files;
    if (files.length > 0) {
      handleFile(files[0]);
    }
  });

  fileInput.addEventListener('change', function() {
    if (fileInput.files.length > 0) {
      handleFile(fileInput.files[0]);
    }
  });

  removeFileBtn.addEventListener('click', function() {
    clearFile();
  });

  function handleFile(file) {
    var ext = file.name.split('.').pop().toLowerCase();
    if (ext !== 'wav') {
      showStatus('仅支持 WAV 格式音频文件', 'error');
      return;
    }
    stopAudio();
    selectedFile = file;
    fileName.textContent = file.name + ' (' + formatSize(file.size) + ')';
    fileInfo.classList.add('visible');
    transcribeBtn.disabled = false;
    hideStatus();
    initAudioPlayer(file);
  }

  function clearFile() {
    stopAudio();
    selectedFile = null;
    fileInput.value = '';
    fileInfo.classList.remove('visible');
    transcribeBtn.disabled = true;
    fileName.textContent = '';
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function initAudioPlayer(file) {
    stopAudio();
    audioUrl = URL.createObjectURL(file);
    audioObj = new Audio(audioUrl);
    audioObj.addEventListener('loadedmetadata', function() {
      audioSeek.max = audioObj.duration;
      audioSeek.value = 0;
      audioTime.textContent = '00:00';
    });
    audioObj.addEventListener('timeupdate', function() {
      if (!audioSeek.dragging) {
        audioSeek.value = audioObj.currentTime;
      }
      audioTime.textContent = formatTime(audioObj.currentTime);
    });
    audioObj.addEventListener('ended', function() {
      setPlayIcon(true);
    });
    audioObj.addEventListener('play', function() {
      setPlayIcon(false);
    });
    audioObj.addEventListener('pause', function() {
      setPlayIcon(true);
    });
    audioPlayer.classList.add('visible');
    audioTime.textContent = '00:00';
    audioSeek.value = 0;
    setPlayIcon(true);
  }

  function stopAudio() {
    if (audioObj) {
      audioObj.pause();
      audioObj.src = '';
      audioObj = null;
    }
    if (audioUrl) {
      URL.revokeObjectURL(audioUrl);
      audioUrl = null;
    }
    audioPlayer.classList.remove('visible');
  }

  function togglePlay() {
    if (!audioObj) return;
    if (audioObj.paused) {
      audioObj.play();
    } else {
      audioObj.pause();
    }
  }

  function setPlayIcon(paused) {
    if (paused) {
      playBtn.querySelector('svg').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    } else {
      playBtn.querySelector('svg').innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2"/>';
    }
  }

  function formatTime(seconds) {
    var m = Math.floor(seconds / 60);
    var s = Math.floor(seconds % 60);
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  playBtn.addEventListener('click', togglePlay);

  audioSeek.addEventListener('input', function() {
    if (audioObj) {
      audioObj.currentTime = parseFloat(audioSeek.value);
      audioTime.textContent = formatTime(audioObj.currentTime);
    }
  });

  audioSeek.addEventListener('mousedown', function() {
    audioSeek.dragging = true;
  });

  audioSeek.addEventListener('mouseup', function() {
    audioSeek.dragging = false;
  });

  transcribeBtn.addEventListener('click', function() {
    if (!selectedFile) return;
    transcribeAudio(selectedFile);
  });

  function transcribeAudio(file) {
    showStatus('正在识别中...', 'processing');

    var formData = new FormData();
    formData.append('audio', file);

    fetch('/asr', {
      method: 'POST',
      body: formData
    })
    .then(function(response) {
      if (!response.ok) {
        return response.json().then(function(data) {
          throw new Error(data.error || '服务器错误 (' + response.status + ')');
        });
      }
      return response.json();
    })
    .then(function(data) {
      if (data.status === 'success') {
        showResult(data.text, data.confidence);
        showStatus('识别完成', 'success');
        setTimeout(function() { hideStatus(); }, 2500);
      } else {
        showStatus(data.error || '识别失败', 'error');
      }
    })
    .catch(function(err) {
      showStatus(err.message || '网络连接失败，请检查服务器', 'error');
    });
  }

  recordBtn.addEventListener('click', function() {
    if (isRecording) {
      stopRecording();
    } else {
      startRecording();
    }
  });

  function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus('当前浏览器不支持录音功能', 'error');
      return;
    }

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream) {
        audioChunks = [];

        var mimeType = 'audio/webm';
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
          mimeType = 'audio/webm;codecs=opus';
        } else if (MediaRecorder.isTypeSupported('audio/wav')) {
          mimeType = 'audio/wav';
        }

        mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });

        mediaRecorder.addEventListener('dataavailable', function(e) {
          if (e.data.size > 0) {
            audioChunks.push(e.data);
          }
        });

        mediaRecorder.addEventListener('stop', function() {
          stream.getTracks().forEach(function(track) { track.stop(); });
          processRecording();
        });

        mediaRecorder.start();
        isRecording = true;
        recordingStartTime = Date.now();
        recordBtn.classList.add('recording');
        recordBtn.querySelector('svg').innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2"/>';
        recordBtn.childNodes[recordBtn.childNodes.length - 1].textContent = '停止';
        transcribeBtn.disabled = true;
        recordingTimer.classList.add('visible');
        hideStatus();
        hideResults();
        updateTimer();
        timerInterval = setInterval(updateTimer, 200);
      })
      .catch(function(err) {
        showStatus('无法访问麦克风: ' + err.message, 'error');
      });
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
    isRecording = false;
    recordBtn.classList.remove('recording');
    recordBtn.querySelector('svg').innerHTML = '<circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="6"/>';
    recordBtn.childNodes[recordBtn.childNodes.length - 1].textContent = '录制';
    recordingTimer.classList.remove('visible');
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    transcribeBtn.disabled = false;
  }

  function updateTimer() {
    var elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
    var mins = Math.floor(elapsed / 60);
    var secs = elapsed % 60;
    recordingTimer.textContent =
      (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
  }

  function processRecording() {
    if (audioChunks.length === 0) return;

    var blob = new Blob(audioChunks, { type: audioChunks[0].type });
    var file = new File([blob], 'recording.wav', { type: 'audio/wav' });
    selectedFile = file;
    fileName.textContent = '录音文件 (' + formatSize(blob.size) + ')';
    fileInfo.classList.add('visible');
    transcribeBtn.disabled = false;
  }

  function showStatus(msg, type) {
    statusBar.className = 'status-bar visible ' + type;
    statusText.textContent = msg;
    if (type === 'processing') {
      spinner.style.display = 'block';
    } else {
      spinner.style.display = 'none';
    }
  }

  function hideStatus() {
    statusBar.classList.remove('visible', 'processing', 'success', 'error');
  }

  function showResult(text, confidence) {
    resultText.textContent = text || '（无内容）';
    var pct = Math.round((confidence || 0) * 100);
    confidenceText.textContent = '置信度 ' + pct + '%';
    resultsSection.classList.add('visible');

    if (pct >= 80) {
      confidenceBadge.style.background = 'rgba(52, 211, 153, 0.12)';
      confidenceBadge.style.borderColor = 'rgba(52, 211, 153, 0.2)';
      confidenceBadge.style.color = 'rgba(110, 231, 183, 0.9)';
    } else if (pct >= 60) {
      confidenceBadge.style.background = 'rgba(251, 191, 36, 0.12)';
      confidenceBadge.style.borderColor = 'rgba(251, 191, 36, 0.2)';
      confidenceBadge.style.color = 'rgba(252, 211, 77, 0.9)';
    } else {
      confidenceBadge.style.background = 'rgba(239, 68, 68, 0.12)';
      confidenceBadge.style.borderColor = 'rgba(239, 68, 68, 0.2)';
      confidenceBadge.style.color = 'rgba(252, 165, 165, 0.9)';
    }
  }

  function hideResults() {
    resultsSection.classList.remove('visible');
  }

  fetch('/health')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.status === 'healthy') {
        console.log('ASR 服务已连接');
      }
    })
    .catch(function() {
      console.log('等待服务就绪...');
    });
})();
</script>
</body>
</html>
