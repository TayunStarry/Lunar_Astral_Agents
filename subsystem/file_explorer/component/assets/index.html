<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 星月智能 』文枢阁</title>
    <!-- 导入层叠样式表 -->
    <style>
        @import url("/read/resources/external/highlight/styles/github.css");
        @import url("/read/resources/external/fontAwesome/css/all.min.css");
        @import url("/read/resources/universal/multimedia_preview.css");
        @import url("styles.css");
    </style>
    <!-- QRCode.js库 -->
    <script src="/read/resources/external/qrcode.min.js"></script>
    <!-- 代码高亮 - highlight.js v11.7.0 -->
    <script src="/read/resources/external/highlight/highlight.min.js"></script>
    <!-- 多媒体文件预览页面 -->
    <script src="/read/resources/universal/multimedia_preview.js"></script>
    <!-- 主脚本文件 -->
    <script defer src="script.js"></script>
</head>

<body>
    <!-- 主内容区 -->
    <div class="container">
        <!-- 头部导航 -->
        <header class="header">
            <h1><i class="fas fa-folder-open"></i> 星月智能[ 文枢阁 ] 系统</h1>
            <div class="header-actions">
                <div class="search-section" style="margin-right: 15px;">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="搜索文件或文件夹..." class="search-input">
                        <button id="search-clear" class="search-clear" style="display: none;">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <div class="upload-section">
                    <label for="file-upload" class="btn btn-primary">
                        <i class="fas fa-upload"></i> 上传文件
                    </label>
                    <input type="file" id="file-upload" multiple style="display: none;">
                    <label for="zip-upload" class="btn btn-info">
                        <i class="fas fa-file-archive"></i> 上传解压
                    </label>
                    <input type="file" id="zip-upload" accept=".zip" style="display: none;">
                    <button id="new-folder" class="btn btn-secondary">
                        <i class="fas fa-folder-plus"></i> 新建文件夹
                    </button>
                    <!-- 二维码按钮 -->
                    <button id="qrcode-button" class="btn btn-info" style="margin-left: auto;">
                        <i class="fas fa-qrcode"></i> 二维码
                    </button>
                </div>
                <div class="batch-actions" style="display: none;">
                    <button id="batch-delete" class="btn btn-danger">
                        <i class="fas fa-trash"></i> 批量删除
                    </button>
                    <button id="batch-compress" class="btn btn-success">
                        <i class="fas fa-compress"></i> 压缩所选
                    </button>
                </div>
            </div>
        </header>
        <!-- 主内容区 -->
        <main class="file-manager">
            <!-- 路径导航 -->
            <div class="breadcrumb">
                <button id="back-button" class="btn btn-small btn-secondary" style="margin-right: 10px; display: none;">
                    <i class="fas fa-arrow-left"></i> 返回
                </button>
                <a href="#" data-path="" class="breadcrumb-item">
                    <i class="fas fa-home"></i> 根目录
                </a>
            </div>
            <!-- 统计信息 -->
            <div class="stats-horizontal">
                <div class="stat-item">
                    <span class="stat-label">当前文件总数:</span>
                    <span id="total-files" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">文件夹数量:</span>
                    <span id="total-folders" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">当前层级大小:</span>
                    <span id="total-size" class="stat-value">0 B</span>
                </div>
            </div>
            <!-- 文件列表 -->
            <div class="file-grid" id="file-grid">
                <!-- 文件卡片将通过JavaScript动态生成 -->
            </div>
            <!-- 上传进度 -->
            <div class="upload-progress" id="upload-progress" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                </div>
                <div class="progress-text" id="progress-text">0%</div>
            </div>
        </main>
    </div>
    <!-- 文本文件预览模态框 -->
    <div class="modal" id="text-modal">
        <div class="modal-content text-modal-content">

            <!-- 文件名/标题区 -->
            <div class="text-modal-header">
                <h3 id="text-modal-title">文件预览</h3>
                <div class="text-modal-header-info">
                    <span id="text-modal-file-info" class="text-modal-file-info">文件信息</span>
                    <button id="text-modal-save" class="btn btn-primary" style="display: none;">
                        <i class="fas fa-save"></i> 保存
                    </button>
                </div>
            </div>

            <!-- 按钮/控制区 -->
            <div class="text-modal-controls">
                <div class="text-modal-control-group">
                    <button id="text-modal-edit" class="btn btn-small btn-info">
                        <i class="fas fa-edit"></i> 编辑
                    </button>
                    <button id="text-modal-copy" class="btn btn-small btn-secondary">
                        <i class="fas fa-copy"></i> 复制
                    </button>
                    <button id="text-modal-download" class="btn btn-small btn-secondary">
                        <i class="fas fa-download"></i> 下载
                    </button>
                </div>
            </div>

            <!-- 文本显示/编辑区 -->
            <div class="text-modal-body">
                <pre id="text-modal-content"></pre>
                <textarea id="text-modal-editor" class="text-modal-editor"></textarea>
            </div>
        </div>
    </div>
    <!-- 二维码模态框 -->
    <div class="modal" id="qrcode-modal">
        <div class="modal-content" style="text-align: center;">
            <span class="close">&times;</span>
            <h3>扫描二维码访问</h3>
            <div id="qrcode-container" style="margin: 20px auto; width: 256px; height: 256px;"></div>
            <p id="qrcode-url" style="word-break: break-all; margin: 10px 0;"></p>
        </div>
    </div>
    <!-- 错误提示 -->
    <div class="toast" id="toast"></div>
</body>

</html>
