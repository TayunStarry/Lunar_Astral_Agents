<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen ASR - 语音识别</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-decoration"></div>
<div class="bg-decoration"></div>
<div class="bg-decoration"></div>

<div class="main-container">
  <div class="glass-card">
    <div class="header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
      <h1>Qwen ASR 语音识别</h1>
      <p>上传音频文件或直接录制，即可转写为文本</p>
    </div>

    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">
        <svg viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p>点击上传或拖拽 WAV 音频文件</p>
      <span>仅支持 WAV 格式</span>
      <input type="file" id="fileInput" accept=".wav,audio/wav,audio/wave,audio/x-wav">
    </div>

    <div class="file-info" id="fileInfo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
        <polyline points="13 2 13 9 20 9"/>
      </svg>
      <span class="file-name" id="fileName"></span>
      <button class="remove-btn" id="removeFileBtn" title="移除文件">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="audio-player" id="audioPlayer">
      <button class="play-btn" id="playBtn" title="播放/暂停">
        <svg viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
      <input class="audio-seek" id="audioSeek" type="range" min="0" max="100" value="0" step="0.1">
      <span class="audio-time" id="audioTime">00:00</span>
    </div>

    <div class="recording-timer" id="recordingTimer">00:00</div>

    <div class="controls">
      <button class="btn primary" id="transcribeBtn" disabled>
        <svg viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        开始转写
      </button>
      <button class="btn" id="recordBtn">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="6"/>
          <circle cx="12" cy="12" r="6"/>
        </svg>
        录制
      </button>
    </div>

    <div class="status-bar" id="statusBar">
      <div class="spinner" id="spinner"></div>
      <span id="statusText"></span>
    </div>

    <div class="results-section" id="resultsSection">
      <div class="result-card">
        <div class="result-label">识别结果</div>
        <div class="result-text" id="resultText"></div>
        <div class="confidence-badge" id="confidenceBadge">
          <span class="confidence-dot"></span>
          <span id="confidenceText"></span>
        </div>
        <div class="duration-badge" id="durationBadge">
          <span class="duration-icon"></span>
          <span id="durationText"></span>
        </div>
      </div>
    </div>

    <div class="footer">Powered by Qwen ASR Engine</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
