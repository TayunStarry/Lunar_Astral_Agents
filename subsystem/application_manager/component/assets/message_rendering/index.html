<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>琉璃窗 · 消息展示面板</title>
    <!-- 外部依赖库 -->
    <link rel="stylesheet" href="/read/resources/external/fontAwesome/css/all.min.css">
    <link rel="stylesheet" href="/read/resources/external/highlight/styles/github.css">
    <link rel="stylesheet" href="/read/resources/external/katex/katex.min.css">
    <link rel="stylesheet" href="/read/resources/universal/multimedia_preview.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container" id="appContainer">
        <!-- 优雅头部 -->
        <div class="glass-header">
            <div class="brand">
                <i class="fas fa-comment-dots brand-icon"></i>
                <span>消息中枢</span>
            </div>
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">未连接</span>
            </div>
        </div>

        <!-- 消息展示区 -->
        <main class="message-area" id="messageArea" role="log" aria-live="polite">
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">
                    <i class="fas fa-cloud-moon"></i>
                </div>
                <p class="empty-state-text">等待消息</p>
                <p class="empty-state-subtext">WebSocket 连接后将显示推送内容</p>
            </div>
            <!-- 动态消息列表 -->
        </main>

        <!-- 底部输入栏 -->
        <footer class="input-area">
            <div class="input-wrapper">
                <textarea id="messageInput" class="message-input" placeholder="输入消息… (Enter 发送, Shift+Enter 换行)"
                    rows="1"></textarea>
                <button id="sendButton" class="send-button" title="发送（仅本地展示）">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </footer>

        <!-- 通知容器 -->
        <div class="toast-container" id="toastContainer" aria-live="assertive"></div>
        <!-- 拖拽遮罩 -->
        <div class="drag-overlay" id="dragOverlay" aria-hidden="true">
            <div class="drag-overlay-content">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>释放文件到消息列表</p>
            </div>
        </div>
    </div>

    <!-- 第三方库脚本 -->
    <script src="/read/resources/external/marked.min.js"></script>
    <script src="/read/resources/external/echarts.min.js"></script>
    <script src="/read/resources/external/mermaid.min.js"></script>
    <script src="/read/resources/external/highlight/highlight.min.js"></script>
    <script src="/read/resources/external/katex/katex.min.js"></script>
    <script src="/read/resources/external/katex/contrib/auto-render.min.js"></script>
    <script src="/read/resources/universal/multimedia_preview.js"></script>
    <!-- 主脚本 -->
    <script src="script.js"></script>
</body>

</html>
