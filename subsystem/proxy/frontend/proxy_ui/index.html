<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 星月智能 』代理服务</title>
    <!-- Font Awesome 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 标准样式库 -->
    <link rel="stylesheet" href="/package/standard_dependency/styles.css">
    <!-- 标准脚本库 -->
    <script src="/package/standard_dependency/script.js"></script>
    <!-- 项目私有样式 -->
    <link rel="stylesheet" href="/proxy_ui/styles.css">
</head>

<body>
    <!-- 背景层 -->
    <div class="background"></div>
    <!-- 玻璃效果层 -->
    <div class="glass-effect"></div>

    <!-- 主容器 -->
    <div class="container">
        <div class="qr-card glass-panel">
            <div class="status-indicator">
                <span class="status-dot online"></span>
                <span class="status-text">服务运行中</span>
            </div>
            <div id="qrcode-container" class="qrcode-container"></div>
            <div class="url-display">
                <span id="server-url" class="url-text">加载中...</span>
                <button id="copy-btn" class="btn-glass" title="复制链接">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
            <p class="hint-text">扫描二维码或复制链接访问服务</p>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>

    <!-- 项目私有脚本 -->
    <script defer src="/proxy_ui/script.js"></script>
</body>

</html>
