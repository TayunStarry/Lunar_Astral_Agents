<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星月智能 - 代理服务</title>
    <!-- 标准样式库 -->
    <link rel="stylesheet" href="/file/read/package/standard_dependency/styles.css">
    <!-- 标准脚本库 -->
    <script src="/file/read/package/standard_dependency/script.js"></script>
    <!-- 项目私有样式 -->
    <link rel="stylesheet" href="/proxy_ui/styles.css">
</head>

<body>
    <div class="bg-overlay"></div>
    <div class="bg-credit">『 星月智能 』- 安全代理服务</div>

    <div class="container">
        <div class="qr-card">
            <div class="status-indicator">
                <span class="status-dot online"></span>
                <span class="status-text">服务运行中</span>
            </div>
            <div id="qrcode-container" class="qrcode-container"></div>
            <div class="url-display">
                <span id="server-url" class="url-text">加载中...</span>
                <button id="copy-btn" class="copy-btn" title="复制链接">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
            <p class="hint-text">扫描二维码或复制链接访问服务</p>
        </div>
    </div>

    <!-- 项目私有脚本 -->
    <script src="/proxy_ui/script.js"></script>
</body>

</html>
