<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>『 星月智能 - 月华 』</title>
	<script>
		// 响应式布局：页面尺寸恢复大屏时，自动切回电脑端 UI
		(function () {
			var MOBILE_BREAKPOINT = 768;
			function checkViewport() {
				if (window.innerWidth > MOBILE_BREAKPOINT) {
					window.removeEventListener('resize', checkViewport);
					window.location.replace('/');
				}
			}
			checkViewport();
			window.addEventListener('resize', checkViewport);
		})();
	</script>
    <!-- 标准样式库 -->
    <link rel="stylesheet" href="/reliance/fontAwesome/css/all.min.css">
    <link rel="stylesheet" href="/reliance/multimedia_preview/styles.css">
    <link rel="stylesheet" href="/reliance/music_player/music_player.css">
    <!-- 标准脚本库 -->
    <script src="/reliance/multimedia_preview/script.js"></script>
    <!-- 共享音乐播放器（后端推送音频 + 波形显示） -->
    <script src="/reliance/music_player/music_player.js"></script>
    <!-- 项目私有样式 -->
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/input-area.css">
    <link rel="stylesheet" href="styles/toast.css">
    <link rel="stylesheet" href="styles/history.css">
    <!-- Markdown 渲染（与桌面端共用同一份依赖） -->
    <script src="/reliance/marked.min.js"></script>
    <!-- 项目私有脚本 -->
	<script src="./scripts/app.js" type="module"></script>
</head>

<body>
	<!-- 毛玻璃叠加层（保留背景模糊） -->
	<div class="glass-effect"></div>
	<!-- 主容器 -->
	<div class="container">
		<div class="main-container-panel" id="mainContainerPanel" data-view="stage">
			<!-- 视图舞台：模型区与历史区叠放，双击输入框在两者间切换 -->
			<div class="view-stage">
				<!-- 3D渲染器展示区（视图 A） -->
				<div class="renderer-wrapper" id="rendererWrapper">
					<div class="renderer-container" id="rendererContainer">
						<iframe id="rendererFrame"
							data-src="/reliance/lunar.rendering_engine/index.html?channel=lunar-astral-renderer&bus=0"
							data-src-live2d="/reliance/lunar.live2d_engine/index.html?channel=lunar-astral-renderer&bus=0"
							data-src-gif="/reliance/lunar.gif_engine/index.html?channel=lunar-astral-renderer&bus=0"
							allow="autoplay" title="月岩引擎"></iframe>
					</div>
				</div>
				<!-- 历史记录（视图 B）：与输入区共用底部输入栏 -->
				<section class="history-view" id="historyView" aria-label="历史记录" aria-hidden="true">
					<div class="history-scroll" id="historyScroll">
						<div class="history-status" id="historyStatus"></div>
						<div class="history-list" id="historyList"></div>
					</div>
				</section>
			</div>
			<!-- 底部输入区 -->
			<div class="input-container" id="inputContainer">
				<!-- 首次进入的一次性可发现性提示（非按钮，自动消失） -->
				<div class="history-hint" id="historyHint" role="status">
					<i class="fas fa-hand-pointer"></i>
					<span>双击输入框查看历史</span>
				</div>
				<!-- 待发送附件悬浮气泡 -->
				<div class="file-preview-area" id="filePreviewArea"></div>
				<div class="input-wrapper">
					<button class="btn-glass btn-voice" id="voiceBtn" title="开启连续语音对话">
						<i class="fas fa-microphone"></i>
					</button>
					<textarea class="message-input" id="messageInput" placeholder="想要聊些什么吗？" rows="1"
						enterkeyhint="send" autocomplete="off"></textarea>
					<input type="file" id="fileInput" multiple accept="*/*" hidden>
					<button class="btn-glass btn-file" id="fileImportBtn" title="导入文件">
						<i class="fas fa-paperclip"></i>
					</button>
					<button class="btn-glass btn-send" id="sendButton" title="消息发送" hidden>
						<i class="fas fa-paper-plane"></i>
					</button>
				</div>
			</div>
		</div>
	</div>
	<!-- 音乐播放器挂载区（后端推送的音乐） -->
	<div class="music-dock" id="musicDock" hidden></div>
	<!-- 通用悬浮消息组件 -->
	<div class="toast-container" id="toastContainer"></div>
	<!-- 错误提示条 -->
	<div class="error-toast" id="errorToast"></div>
</body>

</html>
