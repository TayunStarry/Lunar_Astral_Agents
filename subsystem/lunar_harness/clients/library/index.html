<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 星月智能 』资源库</title>
    <link rel="stylesheet" href="/reliance/fontAwesome/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script defer src="/reliance/highlight/highlight.min.js"></script>
    <script type="module" src="js/app.js"></script>
</head>

<body>
    <div class="background"></div>
    <div class="glass-effect"></div>

    <main class="main-layout" id="main-layout">
        <!-- ==== 顶栏 ==== -->
        <header class="app-header">
            <div class="brand">
                <span class="brand-icon"><i class="fas fa-layer-group"></i></span>
                <span class="brand-name">资源库</span>
                <span class="brand-badge">只读</span>
            </div>
            <div class="search-row">
                <i class="fas fa-search"></i>
                <input id="search-input" type="text" placeholder="在当前目录搜索文件…" autocomplete="off" spellcheck="false">
                <button id="search-clear" class="search-clear hidden" title="清除搜索"><i class="fas fa-xmark"></i></button>
            </div>
            <div class="header-actions">
                <button id="details-btn" class="icon-btn details-toggle" title="详情 / 创作">
                    <i class="fas fa-circle-info"></i>
                </button>
                <button id="refresh-btn" class="icon-btn" title="刷新（F5）">
                    <i class="fas fa-rotate"></i>
                </button>
                <button id="theme-btn" class="icon-btn" title="切换深色模式">
                    <i class="fas fa-circle-half-stroke"></i>
                </button>
                <button id="help-btn" class="icon-btn" title="快捷键（F1）">
                    <i class="fas fa-keyboard"></i>
                </button>
            </div>
        </header>

        <!-- ==== 主显示区：预览 / 变更 ==== -->
        <section class="panel content">
            <header class="panel-header content-header">
                <div class="crumb-row">
                    <button id="back-btn" class="icon-btn" title="返回上级（Esc）"><i class="fas fa-arrow-left"></i></button>
                    <nav id="crumbs" class="crumbs" aria-label="路径"></nav>
                </div>
                <div class="content-tools">
                    <div id="view-tabs" class="view-tabs hidden" role="tablist">
                        <button class="view-tab active" data-tab="preview" role="tab">预览</button>
                        <button class="view-tab" data-tab="changes" role="tab">变更</button>
                    </div>
                    <span id="content-summary" class="content-summary"></span>
                </div>
            </header>
            <div class="panel-body content-body">
                <div id="view-preview" class="view-pane active"></div>
                <div id="view-changes" class="view-pane"></div>
                <div id="storyboard-review" class="storyboard-review hidden" role="region" aria-label="分镜审查"></div>
            </div>
        </section>

        <!-- ==== 右侧：详情 / 创作（两个同级标签页，窄窗时为抽屉） ==== -->
        <aside class="panel details" id="details-panel">
            <header class="panel-header details-header">
                <div id="details-tabs" class="details-tabs" role="tablist" aria-label="详情与创作">
                    <button id="details-tab-detail" class="details-tab active" type="button" role="tab"
                        aria-selected="true" aria-controls="details-pane-detail" data-details-tab="detail">
                        <i class="fas fa-circle-info"></i><span>详情</span>
                    </button>
                    <button id="details-tab-database" class="details-tab hidden" type="button" role="tab"
                        aria-selected="false" aria-controls="details-pane-database" data-details-tab="database">
                        <i class="fas fa-database"></i><span>数据库</span>
                    </button>
                    <button id="details-tab-create" class="details-tab" type="button" role="tab"
                        aria-selected="false" aria-controls="details-pane-create" data-details-tab="create">
                        <i class="fas fa-wand-magic-sparkles"></i><span>创作</span>
                    </button>
                    <button id="details-tab-storyboard" class="details-tab" type="button" role="tab"
                        aria-selected="false" aria-controls="details-pane-storyboard" data-details-tab="storyboard">
                        <i class="fas fa-film"></i><span>演绎</span>
                    </button>
                </div>
                <button id="details-close" class="icon-btn details-close" title="关闭面板">
                    <i class="fas fa-xmark"></i>
                </button>
            </header>

            <!-- ==== 标签页：详情 ==== -->
            <div id="details-pane-detail" class="details-pane active" role="tabpanel"
                aria-labelledby="details-tab-detail" data-details-pane="detail">
                <div class="panel-body">
                    <div id="details" class="details-body">
                        <div class="empty-state">
                            <i class="fas fa-hand-pointer"></i>
                            <p>选择文件查看详情</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ==== 标签页：数据库（仅当前预览为数据库文件时出现） ==== -->
            <div id="details-pane-database" class="details-pane" role="tabpanel"
                aria-labelledby="details-tab-database" data-details-pane="database">
                <div class="panel-body">
                    <div id="database-pane" class="database-pane-body"></div>
                </div>
            </div>

            <!-- ==== 标签页：创作 ==== -->
            <div id="details-pane-create" class="details-pane" role="tabpanel"
                aria-labelledby="details-tab-create" data-details-pane="create">
                <form id="requirement-form" class="requirement-body">
                    <label class="requirement-label" for="requirement-handle">资源句柄</label>
                    <div class="requirement-handle-row">
                        <input id="requirement-handle" class="requirement-input" type="text"
                            placeholder="@D.020（留空则随机选题）" autocomplete="off" spellcheck="false">
                        <button id="requirement-pick" class="btn-glass btn-sm" type="button" title="带入当前选中项的资源句柄">
                            <i class="fas fa-arrow-down"></i><span>带入选中</span>
                        </button>
                    </div>
                    <label class="requirement-label" for="requirement-text">需求描述</label>
                    <textarea id="requirement-text" class="requirement-text"
                        placeholder="描述希望创作系统如何编排这个资源…（Enter 提交，Shift+Enter 换行）"></textarea>
                    <div class="requirement-foot">
                        <button id="requirement-submit" class="btn-glass primary btn-sm" type="submit">
                            <i class="fas fa-paper-plane"></i><span>提交需求</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- ==== 标签页：演绎 ==== -->
            <div id="details-pane-storyboard" class="details-pane" role="tabpanel"
                aria-labelledby="details-tab-storyboard" data-details-pane="storyboard">
                <form id="storyboard-form" class="requirement-body">
                    <label class="requirement-label" for="storyboard-text">故事正文</label>
                    <textarea id="storyboard-text" class="requirement-text"
                        placeholder="输入一个故事；也可以只填下方资源句柄，从已有文档读取…（Enter 提交，Shift+Enter 换行）"></textarea>
                    <label class="requirement-label" for="storyboard-handle">故事资源句柄（可选）</label>
                    <div class="requirement-handle-row">
                        <input id="storyboard-handle" class="requirement-input" type="text"
                            placeholder="@D.020（与正文二选一）" autocomplete="off" spellcheck="false">
                        <button id="storyboard-pick" class="btn-glass btn-sm" type="button"
                            title="带入当前选中项的资源句柄">
                            <i class="fas fa-arrow-down"></i><span>带入选中</span>
                        </button>
                    </div>
                    <div class="storyboard-options">
                        <input id="storyboard-title" class="requirement-input" type="text"
                            placeholder="标题（可选）" autocomplete="off">
                        <input id="storyboard-style" class="requirement-input" type="text"
                            placeholder="统一画风（可选）" autocomplete="off">
                        <input id="storyboard-ratio" class="requirement-input" type="text"
                            placeholder="画幅（默认 16:9）" autocomplete="off">
                    </div>
                    <div class="storyboard-controls">
                        <button id="storyboard-review-open" class="btn-glass btn-sm hidden" type="button">
                            <i class="fas fa-list-check"></i><span>打开审查</span>
                        </button>
                        <button id="storyboard-pause" class="btn-glass btn-sm hidden" type="button">
                            <i class="fas fa-pause"></i><span>暂停</span>
                        </button>
                        <button id="storyboard-cancel" class="btn-glass btn-sm danger hidden" type="button">
                            <i class="fas fa-stop"></i><span>终止</span>
                        </button>
                    </div>
                    <div class="requirement-foot">
                        <button id="storyboard-submit" class="btn-glass primary btn-sm" type="submit">
                            <i class="fas fa-film"></i><span>开始演绎</span>
                        </button>
                    </div>
                </form>
            </div>
        </aside>

        <!-- ==== 抽屉遮罩（仅窄窗显示） ==== -->
        <div id="details-backdrop" class="details-backdrop hidden"></div>
    </main>

    <!-- ==== 运行沙箱 ==== -->
    <div id="sandbox-panel" class="sandbox-panel hidden">
        <header class="sandbox-head">
            <span class="sandbox-title">
                <i class="fas fa-play"></i>
                <span id="sandbox-title">沙箱运行</span>
            </span>
            <button id="sandbox-close" class="sandbox-close" title="关闭沙箱（Esc）">
                <i class="fas fa-xmark"></i>
            </button>
        </header>
        <iframe id="sandbox" sandbox="allow-scripts" title="代码运行沙箱"></iframe>
    </div>

    <!-- ==== 运行态浮窗：任务运行期间常驻，终态后自动收起 ==== -->
    <div id="run-status" class="run-status hidden" role="status" aria-live="polite">
        <header class="run-status-head">
            <span class="run-status-title">
                <i class="fas fa-compass-drafting"></i>
                <span id="run-status-title">运行中</span>
            </span>
            <button id="run-status-close" class="run-status-close" type="button" title="收起">
                <i class="fas fa-xmark"></i>
            </button>
        </header>
        <div class="run-status-meta">
            <span id="run-status-stage" class="run-status-stage"></span>
            <span id="run-status-percent" class="run-status-percent">0%</span>
        </div>
        <div class="run-status-track">
            <div id="run-status-bar" class="run-status-bar"></div>
        </div>
        <p id="run-status-detail" class="run-status-detail hidden"></p>
    </div>

    <!-- ==== 弹窗与提示 ==== -->
    <div id="modal-root"></div>
    <!-- toast 轻提示容器：固定定位、不参与文档流，不改变页面已有排版 -->
    <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
</body>

</html>
