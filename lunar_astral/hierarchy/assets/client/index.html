<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, minimum-scale=0.5, maximum-scale=0.8">
	<title>『 星月智能 - 月华 』</title>
    <!-- 标准样式库 -->
    <link rel="stylesheet" href="/file/read/package/standard_dependency/styles.css">
    <!-- 标准脚本库 -->
    <script src="/file/read/package/standard_dependency/script.js"></script>
    <!-- 项目私有样式 -->
    <link rel="stylesheet" href="styles.css">
    <!-- 项目私有脚本 -->
	<script src="./app.js" type="module"></script>
    <!-- 标准脚本引用 -->
</head>

<body>
	<!-- 毛玻璃叠加层（保留背景模糊） -->
	<div class="glass-effect"></div>
	<!-- 主容器 -->
	<div class="container">
		<div class="main-container-panel" id="mainContainerPanel">
			<!-- 核心展示区：Live2D 模型 -->
			<div class="live2d-wrapper" id="live2dWrapper">
				<div class="live2d-container" id="live2dContainer">
					<canvas id="live2dCanvas"></canvas>
					<!-- 触摸交互区域，统一覆盖整个Live2D模型，用于触发AI交流 -->
					<div class="touch-interaction" id="touchInteraction">
						<!-- 点击反馈涟漪动画元素 -->
						<div class="touch-ripple" id="touchRipple"></div>
					</div>
					<div class="live2d-model-intel" id="modelIntel"></div>
				</div>
			</div>
			<!-- 底部输入区 -->
			<div class="input-container" id="inputContainer">
				<div class="file-preview-area" id="filePreviewArea"></div>
				<div class="input-wrapper">
					<div class="function-menu-wrapper" id="functionMenuWrapper">
						<button class="btn-glass" id="functionMenuButton" title="功能菜单">
							<i class="fas fa-bars"></i>
						</button>
						<div class="function-menu-dropdown" id="functionMenuDropdown">
							<button class="dropdown-item" id="chatHistoryItem">
								<i class="fas fa-comments"></i>
								<span>聊天记录</span>
							</button>
							<button class="dropdown-item" id="voiceChatItem">
								<i class="fas fa-microphone"></i>
								<span>语音对话</span>
							</button>
							<button class="dropdown-item" id="fileImportItem">
								<i class="fas fa-file-import"></i>
								<span>文件导入</span>
							</button>
						</div>
					</div>
					<input type="file" id="fileImportInput" multiple accept="*/*" style="display:none">
					<textarea class="message-input" id="messageInput" placeholder="想要聊些什么吗？" rows="1"></textarea>
					<button class="btn-glass btn-send" id="sendButton" title="消息发送">
						<i class="fas fa-paper-plane"></i>
					</button>
				</div>
			</div>
		</div>
	</div>
	<!-- 消息记录模态框 -->
	<div class="modal-overlay" id="modalOverlay">
		<div class="modal-content" id="modalContent">
			<div class="modal-header">
				<h3>消息记录</h3>
				<button class="modal-close btn-glass" id="modalClose">
					<i class="fas fa-times"></i>
				</button>
			</div>
			<div class="modal-body" id="modalBody"></div>
		</div>
	</div>
	<!-- 通用悬浮消息组件 -->
	<div class="toast-container" id="toastContainer"></div>
	<!-- 错误提示条 -->
	<div class="error-toast" id="errorToast"></div>
</body>

</html>
