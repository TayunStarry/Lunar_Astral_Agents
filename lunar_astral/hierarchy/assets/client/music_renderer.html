<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Renderer</title>
    <!-- Font Awesome 图标 -->
    <link rel="stylesheet" href="/file/read/package/standard_dependency/styles.css">
    <!-- 音频引擎 -->
    <script src="/file/read/package/music_libs/tone.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 15px;
        }

        /* ===== 模态框遮罩 ===== */
        .music-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .music-modal-overlay.visible {
            display: flex;
            opacity: 1;
        }

        /* ===== 主面板 ===== */
        .music-modal {
            width: 720px;
            max-width: 95vw;
            max-height: 90vh;
            background: rgba(250, 250, 250, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 20px;
            box-shadow:
                0 8px 48px rgba(0, 0, 0, 0.18),
                0 0 0 1px rgba(157, 107, 255, 0.08) inset;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transform: translateY(12px) scale(0.97);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .music-modal-overlay.visible .music-modal {
            transform: translateY(0) scale(1);
        }
        .dark-mode .music-modal {
            background: rgba(30, 30, 38, 0.92);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow:
                0 8px 48px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(157, 107, 255, 0.06) inset;
        }

        /* ===== 标题栏 ===== */
        .music-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(157, 107, 255, 0.15);
            background: linear-gradient(135deg, rgba(157, 107, 255, 0.08), rgba(108, 155, 207, 0.04));
            flex-shrink: 0;
        }
        .dark-mode .music-modal-header {
            background: linear-gradient(135deg, rgba(157, 107, 255, 0.12), rgba(108, 155, 207, 0.06));
            border-bottom-color: rgba(157, 107, 255, 0.12);
        }

        .music-modal-title-area {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        .music-modal-title {
            font-size: 16px;
            font-weight: 700;
            color: #9d6bff;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .music-modal-title::before {
            content: '\f001';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 14px;
            opacity: 0.7;
            animation: music-note-float 2.5s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes music-note-float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-3px) rotate(5deg); opacity: 1; }
        }

        .music-modal-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        /* ===== 通用按钮 ===== */
        .music-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(157, 107, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            color: #9d6bff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .music-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at center, rgba(157, 107, 255, 0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .music-btn:hover {
            background: rgba(157, 107, 255, 0.12);
            border-color: rgba(157, 107, 255, 0.45);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(157, 107, 255, 0.2);
        }
        .music-btn:hover::after { opacity: 1; }
        .music-btn:active {
            transform: translateY(0) scale(0.95);
            transition: all 0.1s ease;
        }
        .music-btn-close:hover {
            background: rgba(220, 53, 69, 0.12);
            border-color: rgba(220, 53, 69, 0.4);
            color: #dc3545;
            box-shadow: 0 4px 14px rgba(220, 53, 69, 0.2);
        }
        .music-btn-close:hover::after {
            background: radial-gradient(circle at center, rgba(220, 53, 69, 0.25) 0%, transparent 70%);
        }
        .dark-mode .music-btn {
            background: rgba(38, 38, 42, 0.5);
            border-color: rgba(157, 107, 255, 0.25);
            color: #b794f4;
        }

        /* 大号播放按钮 */
        .music-btn-play-lg {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 16px;
            flex-shrink: 0;
        }

        /* ===== 可视化区域 ===== */
        .music-modal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0;
            min-height: 0;
        }

        .music-visualizer-container {
            flex: 1;
            position: relative;
            background: rgba(0, 0, 0, 0.04);
            border-bottom: 1px solid rgba(157, 107, 255, 0.08);
            overflow: hidden;
            min-height: 200px;
        }
        .dark-mode .music-visualizer-container {
            background: rgba(0, 0, 0, 0.15);
        }
        .music-visualizer-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 滚动标题（非播放状态） */
        .music-title-scroll {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            pointer-events: none;
        }
        .music-title-scroll-text {
            font-size: 22px;
            font-weight: 700;
            color: rgba(157, 107, 255, 0.25);
            white-space: nowrap;
            animation: title-marquee 12s linear infinite;
            letter-spacing: 2px;
        }
        @keyframes title-marquee {
            0% { transform: translateX(30%); }
            100% { transform: translateX(-30%); }
        }

        /* ===== 设置栏 ===== */
        .music-modal-settings {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 10px 20px;
            border-bottom: 1px solid rgba(157, 107, 255, 0.1);
            background: rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .dark-mode .music-modal-settings {
            background: rgba(20, 20, 28, 0.2);
        }

        .music-setting {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .music-setting-label {
            font-size: 12px;
            color: rgba(157, 107, 255, 0.7);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .music-setting-label i {
            font-size: 11px;
            opacity: 0.7;
        }

        .music-setting-select {
            padding: 4px 8px;
            border: 1px solid rgba(157, 107, 255, 0.25);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.5);
            color: #9d6bff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .music-setting-select:hover {
            border-color: rgba(157, 107, 255, 0.5);
            background: rgba(255, 255, 255, 0.7);
        }
        .music-setting-select:focus {
            border-color: #9d6bff;
            box-shadow: 0 0 0 2px rgba(157, 107, 255, 0.15);
        }
        .dark-mode .music-setting-select {
            background: rgba(38, 38, 42, 0.5);
            color: #b794f4;
        }

        .music-setting-value {
            font-size: 13px;
            font-weight: 600;
            color: #9d6bff;
            padding: 4px 10px;
            background: rgba(157, 107, 255, 0.08);
            border: 1px solid rgba(157, 107, 255, 0.15);
            border-radius: 8px;
            min-width: 36px;
            text-align: center;
        }
        .dark-mode .music-setting-value {
            background: rgba(157, 107, 255, 0.12);
            color: #b794f4;
        }

        /* ===== 底部控制栏 ===== */
        .music-modal-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-top: 1px solid rgba(157, 107, 255, 0.12);
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            flex-shrink: 0;
        }
        .dark-mode .music-modal-footer {
            background: rgba(20, 20, 28, 0.4);
            border-top-color: rgba(157, 107, 255, 0.1);
        }

        /* 进度条 */
        .music-progress {
            flex: 1;
            height: 6px;
            background: rgba(157, 107, 255, 0.12);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .music-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #9d6bff, #6c9bcf);
            border-radius: 3px;
            transition: width 0.1s linear;
            position: relative;
        }
        .music-progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translate(50%, -50%);
            width: 10px;
            height: 10px;
            background: #fff;
            border: 2px solid #9d6bff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(157, 107, 255, 0.4);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .music-progress:hover .music-progress-fill::after {
            opacity: 1;
        }

        /* 时间 */
        .music-time {
            font-size: 11px;
            color: #9d6bff;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            min-width: 42px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        /* ===== 历史记录面板 ===== */
        .music-history-panel {
            position: absolute;
            right: 20px;
            top: 56px;
            width: 280px;
            max-height: 360px;
            overflow-y: auto;
            background: rgba(250, 250, 250, 0.96);
            border: 1px solid rgba(157, 107, 255, 0.2);
            border-radius: 14px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(157, 107, 255, 0.06) inset;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            scrollbar-width: none;
            z-index: 1001;
            animation: history-slide-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes history-slide-in {
            from { opacity: 0; transform: translateY(-8px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .music-history-panel::-webkit-scrollbar { display: none; }
        .dark-mode .music-history-panel {
            background: rgba(30, 30, 38, 0.96);
            border-color: rgba(157, 107, 255, 0.2);
        }

        .music-history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 700;
            color: #9d6bff;
            border-bottom: 1px solid rgba(157, 107, 255, 0.12);
            letter-spacing: 0.3px;
        }
        .music-history-list { padding: 6px; }
        .music-history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
        }
        .music-history-item:hover {
            background: rgba(157, 107, 255, 0.08);
            transform: translateX(2px);
        }
        .music-history-item:active {
            background: rgba(157, 107, 255, 0.15);
            transform: translateX(2px) scale(0.98);
        }
        .music-history-title {
            color: #9d6bff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            font-weight: 500;
        }
        .music-history-time {
            font-size: 11px;
            color: rgba(128, 128, 128, 0.7);
            margin-left: 10px;
            font-family: 'SF Mono', 'Consolas', monospace;
        }
        .music-history-empty {
            text-align: center;
            padding: 28px 20px;
            color: rgba(128, 128, 128, 0.5);
            font-size: 13px;
        }
        .music-history-empty::before {
            content: '\f001';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
            opacity: 0.4;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .music-modal {
                width: 98vw;
                max-height: 95vh;
                border-radius: 14px;
            }
            .music-modal-header { padding: 10px 14px; }
            .music-modal-settings { padding: 8px 14px; gap: 12px; }
            .music-modal-footer { padding: 10px 14px; }
            .music-visualizer-container { min-height: 150px; }
            .music-title-scroll-text { font-size: 18px; }
            .music-history-panel { right: 6px; top: 50px; width: 250px; max-height: 300px; }
            .music-btn { width: 34px; height: 34px; border-radius: 8px; }
            .music-btn-play-lg { width: 40px; height: 40px; }
            .music-time { font-size: 10px; min-width: 36px; }
        }

        @media (max-width: 480px) {
            .music-modal-settings { gap: 8px; justify-content: center; }
            .music-setting-label { font-size: 11px; }
            .music-setting-select { font-size: 11px; }
            .music-setting-value { font-size: 11px; }
            .music-title-scroll-text { font-size: 16px; letter-spacing: 1px; }
        }
    </style>
</head>
<body>
    <div class="music-modal-overlay" id="music-modal-overlay">
        <div class="music-modal">
            <div class="music-modal-header">
                <div class="music-modal-title-area" id="music-title-area">
                    <span class="music-modal-title" id="music-title">音乐播放器</span>
                </div>
                <div class="music-modal-actions">
                    <button class="music-btn" id="music-btn-history" title="历史记录">
                        <i class="fas fa-history"></i>
                    </button>
                    <button class="music-btn" id="music-btn-download" title="下载音频/乐谱">
                        <i class="fas fa-download"></i>
                    </button>
                    <button class="music-btn music-btn-close" id="music-btn-close" title="关闭">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div class="music-modal-body">
                <div class="music-visualizer-container" id="music-visualizer-container">
                    <canvas id="music-visualizer-canvas"></canvas>
                    <div class="music-title-scroll" id="music-title-scroll" style="display:none;">
                        <span class="music-title-scroll-text" id="music-title-scroll-text"></span>
                    </div>
                </div>
            </div>
            <div class="music-modal-settings" id="music-settings">
                <div class="music-setting">
                    <label class="music-setting-label"><i class="fas fa-tachometer-alt"></i> 速度</label>
                    <select class="music-setting-select" id="music-setting-speed">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                    </select>
                </div>
                <div class="music-setting">
                    <label class="music-setting-label"><i class="fas fa-music"></i> 调式</label>
                    <span class="music-setting-value" id="music-setting-key">C</span>
                </div>
                <div class="music-setting">
                    <label class="music-setting-label"><i class="fas fa-clock"></i> 拍号</label>
                    <span class="music-setting-value" id="music-setting-meter">4/4</span>
                </div>
            </div>
            <div class="music-modal-footer">
                <span class="music-time" id="music-time-current">00:00</span>
                <div class="music-progress" id="music-progress-bar">
                    <div class="music-progress-fill" id="music-progress-fill"></div>
                </div>
                <span class="music-time" id="music-time-total">00:00</span>
                <button class="music-btn music-btn-play-lg" id="music-btn-play" title="播放">
                    <i class="fas fa-play"></i>
                </button>
            </div>
        </div>
        <div class="music-history-panel" id="music-history-panel" style="display:none;">
            <div class="music-history-header">
                <span>创作历史</span>
                <button class="music-btn music-btn-close" id="music-btn-history-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="music-history-list" id="music-history-list"></div>
        </div>
    </div>

    <script>
    /**
     * 音乐渲染器 - 独立页面
     *
     * 负责接收 ABC 记谱法乐谱，使用 Tone.js 合成音频播放，
     * 提供音频可视化、进度控制、速度调节、下载等功能。
     * 通过 BroadcastChannel API 与主应用双向通讯。
     *
     * 通讯协议：
     *   接收（主应用 → 本页）：
     *     { type: 'render', abcNotation: string }  加载并渲染乐谱
     *     { type: 'close' }                         关闭播放器
     *     { type: 'theme', darkMode: boolean }      切换主题
     *   发送（本页 → 主应用）：
     *     { type: 'ready' }                         页面加载完成
     *     { type: 'closed' }                        播放器已关闭
     *     { type: 'error', message: string }        错误通知
     *     { type: 'state', playing, paused, ... }   播放状态变更
     */

    // ==== 广播频道 ====
    const channel = new BroadcastChannel('lunar-astral-music');

    // ==== 状态 ====
    const state = {
        abcNotation: '',
        title: '',
        isPlaying: false,
        isPaused: false,
        totalDuration: 0,
        bpm: 120,
        key: 'C',
        meter: '4/4',
        /** 当前使用的乐器名称（显示用，多声部时为逗号分隔） */
        instruments: '钢琴',
        /** 声部→乐器名映射（来自 %%voice 指令），如 {1:'钢琴', 2:'小提琴'} */
        voiceInstruments: new Map([[1, '钢琴']]),
        /** 声部→合成器运行时映射，如 {1: {synth, reverb, effects, presetKey, instrumentName}} */
        voices: {},
        notes: [],
        /** 旧字段保留用于兼容（单声部场景指向 voices[1]） */
        toneSynth: null,
        toneReverb: null,
        /** 当前主声部预设键名（用于 UI 下拉框显示） */
        currentPresetKey: 'piano',
        /** 效果链节点缓存（单声部兼容，多声部时存在 voices[N].effects） */
        _effectNodes: [],
        /** 最近一次 seek 的时间（用于乐器切换时恢复进度） */
        _lastSeekTime: 0,
        animationId: null,
        history: [],
    };

    // ==== 乐器音色映射表 ====
    // 每个预设包含：keywords、label、factory、effects、velocityRange、defaultArticulation
    // 核心升级：使用 FMSynth/AMSynth 替代基础振荡器，产生更丰富、更有辨识度的音色
    // FMSynth = 频率调制合成（harmonicity × modulationIndex 控制谐波结构）
    // AMSynth = 振幅调制合成（harmonicity 控制边带频率）
    // 每种乐器的 harmonicity 和 modulationIndex 都根据其声学特性调校
    const INSTRUMENT_PRESETS = {
        // ── 钢琴：FM 合成，harmonicity=3 产生钢琴特有的泛音结构 ──
        piano: {
            keywords: ['钢琴', 'piano', '电子琴', 'keyboard', '键盘'],
            label: '钢琴',
            factory: () => new Tone.PolySynth(Tone.FMSynth, {
                harmonicity: 3,
                modulationIndex: 10,
                oscillator: { type: 'sine' },
                envelope: { attack: 0.005, decay: 0.4, sustain: 0.15, release: 1.5 },
                modulation: { type: 'square' },
                modulationEnvelope: { attack: 0.01, decay: 0.3, sustain: 0.1, release: 0.8 },
                volume: -8,
            }),
            effects: () => ({
                reverb: new Tone.Reverb({ decay: 2.5, wet: 0.22 }),
                chorus: new Tone.Chorus({ frequency: 1.5, delayTime: 3.5, depth: 0.15, wet: 0.12 }),
                filter: new Tone.Filter({ type: 'lowpass', frequency: 5500, Q: 0.7 }),
            }),
            velocityRange: [0.25, 0.95],
            defaultArticulation: 'default',
        },
        // ── 小提琴：FM 合成 + 颤音效果，锯齿波载波模拟弓弦摩擦 ──
        violin: {
            keywords: ['小提琴', 'violin', 'fiddle', '弓弦'],
            label: '小提琴',
            factory: () => new Tone.PolySynth(Tone.FMSynth, {
                harmonicity: 2,
                modulationIndex: 5,
                oscillator: { type: 'sawtooth' },
                envelope: { attack: 0.12, decay: 0.15, sustain: 0.75, release: 0.6 },
                modulation: { type: 'sine' },

    /** 默认预设（未知乐器时使用，比原硬编码 triangle 更柔和） */
    const DEFAULT_PRESET_KEY = 'piano';

    // ==== 乐器音域范围表（MIDI 音符号数） ====
    // 用于多乐器单声部场景的回退策略：按音高将音符分配到最合适的乐器
    // 参考 General MIDI 各乐器的典型音域
    const INSTRUMENT_PITCH_RANGES = {
        cello:    { low: 36, high: 72 },  // C2-C4 大提琴低音区
        bass:     { low: 28, high: 55 },  // E1-G3 贝斯
        guitar:   { low: 40, high: 76 },  // E3-E5 吉他
        harp:     { low: 40, high: 84 },  // E3-C6 竖琴
        piano:    { low: 36, high: 96 },  // C2-C7 钢琴全音域
        clarinet: { low: 50, high: 80 },  // D3-G#4 单簧管
        oboe:     { low: 58, high: 84 },  // Bb3-C6 双簧管
        trumpet:  { low: 54, high: 84 },  // F#3-C6 小号
        violin:   { low: 55, high: 96 },  // G3-C7 小提琴
        flute:    { low: 60, high: 96 },  // C4-C7 长笛
        synth:    { low: 36, high: 96 },  // 合成器全音域
    };

    // ==== 表达引擎 ====
    // 核心目标：消除"打点计数器"感，为每个音符注入人性化表达
    // 包括：力度变化、时序偏移、运音法、动态轮廓、乐句呼吸
    const ExpressionEngine = {
        // 确定性伪随机：相同种子总是返回相同结果（保证 seek 后表现一致）
        pseudoRandom(seed) {
            const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
            return x - Math.floor(x);
        },

        // 解析拍号得到每小节拍数
        parseBeatsPerMeasure(meter) {
            if (!meter) return 4;
            const parts = meter.split('/');
            return parseInt(parts[0]) || 4;
        },

        // 计算音符在小节中的节拍位置（0-based 浮点数）
        getBeatPosition(timeSeconds, bpm, beatsPerMeasure) {
            const secondsPerBeat = 60 / bpm;
            const totalBeats = timeSeconds / secondsPerBeat;
            return totalBeats % beatsPerMeasure;
        },

        // 计算乐句位置（0-1，0=乐句开头，0.5=高点，1=结尾）
        // 使用 8 拍为一个乐句单位的正弦弧线
        getPhrasePosition(timeSeconds, bpm) {
            const secondsPerBeat = 60 / bpm;
            const phraseBeats = 8; // 2 小节的乐句单位（4/4 拍）
            const phraseDuration = phraseBeats * secondsPerBeat;
            const pos = (timeSeconds % phraseDuration) / phraseDuration;
            return pos;
        },

        // 计算单个音符的力度（velocity, 0-1）
        // 综合：力度记号 + 节拍强调 + 乐句轮廓 + 乐器动态范围 + 随机人性化
        getVelocity(noteIndex, voiceId, beatPosition, phrasePosition, dynamics, presetKey) {
            const preset = INSTRUMENT_PRESETS[presetKey] || INSTRUMENT_PRESETS[DEFAULT_PRESET_KEY];
            const [vMin, vMax] = preset.velocityRange || [0.2, 0.9];

            // 1. 基础力度（来自 ABC 力度记号）
            const dynamicMap = { pp: 0.15, p: 0.30, mp: 0.45, mf: 0.60, f: 0.80, ff: 0.95 };
            let base = dynamicMap[dynamics] || 0.60;

            // 2. 节拍强调：强拍略响
            const beatNum = Math.floor(beatPosition);
            const beatsPerMeasure = this.parseBeatsPerMeasure(state.meter);
            if (beatNum === 0) base *= 1.10;          // 强拍
            else if (beatsPerMeasure === 4 && beatNum === 2) base *= 1.05; // 次强拍
            else if (beatsPerMeasure === 3 && beatNum === 1) base *= 1.03; // 3/4 拍第二拍微弱

            // 3. 乐句轮廓：正弦弧线——起句渐强，句中高点，收句渐弱
            const phraseCurve = Math.sin(phrasePosition * Math.PI);
            base *= 0.88 + phraseCurve * 0.20;

            // 4. 随机人性化 ±12%（确定性，每次播放一致）
            const rand = this.pseudoRandom(noteIndex * 7 + voiceId * 31 + 13);
            base *= 1 + (rand - 0.5) * 0.24;

            // 映射到乐器动态范围
            return Math.max(vMin, Math.min(vMax, vMin + base * (vMax - vMin)));
        },

        // 计算时序偏移（秒）—— 消除机器人感
        // 强拍微提前，弱拍微延后，再加随机抖动
        getTimingOffset(noteIndex, voiceId, beatPosition) {
            const beatNum = Math.floor(beatPosition);
            // 强拍提前 12ms，弱拍延后 5ms
            const beatOffset = beatNum === 0 ? -0.012 : 0.005;
            // 随机偏移 ±18ms
            const randOffset = (this.pseudoRandom(noteIndex * 11 + voiceId * 23 + 7) - 0.5) * 0.036;
            return beatOffset + randOffset;
        },

        // 计算持续时间乘数（基于运音法）
        getDurationMultiplier(articulation, presetKey) {
            const preset = INSTRUMENT_PRESETS[presetKey] || INSTRUMENT_PRESETS[DEFAULT_PRESET_KEY];
            const defaultArt = preset.defaultArticulation || 'default';
            const art = articulation || defaultArt;

            const map = {
                staccato: 0.35,
                staccatissimo: 0.20,
                tenuto: 1.05,
                accent: 0.80,
                legato: 0.95,
                default: 0.85,  // 默认略微断开
            };
            return map[art] || map[defaultArt];
        },

        // 对原始音符应用完整的表达处理，返回增强后的音符
        applyExpression(notes) {
            const bpm = state.bpm;
            const beatsPerMeasure = this.parseBeatsPerMeasure(state.meter);

            // 构建声部→预设键映射
            const voicePresetMap = {};
            for (const [voiceId, instrumentName] of state.voiceInstruments) {
                voicePresetMap[voiceId] = matchInstrumentPreset(instrumentName);
            }

            return notes.map((n, index) => {
                const presetKey = voicePresetMap[n.voice] || DEFAULT_PRESET_KEY;
                const beatPos = this.getBeatPosition(n.time, bpm, beatsPerMeasure);
                const phrasePos = this.getPhrasePosition(n.time, bpm);

                const velocity = this.getVelocity(
                    index, n.voice, beatPos, phrasePos, n.dynamics, presetKey
                );
                const timingOffset = this.getTimingOffset(index, n.voice, beatPos);
                const durationMul = this.getDurationMultiplier(n.articulation, presetKey);

                return {
                    ...n,
                    velocity,
                    time: Math.max(0, n.time + timingOffset),
                    duration: n.duration * durationMul,
                };
            });
        },
    };

    // ==== DOM 缓存 ====
    const el = {
        overlay: document.getElementById('music-modal-overlay'),

        keyDisplay: document.getElementById('music-setting-key'),

    // ==== 通讯 ====
    function postToParent(msg) {
        channel.postMessage(msg);
    }

    // ==== 接收主应用指令 ====
    channel.onmessage = (event) => {
        const msg = event.data;
        if (!msg || !msg.type) return;

        switch (msg.type) {
            case 'render':
                renderMusicScore(msg.abcNotation);
                break;
            case 'play_audio':
                // 后端 FluidSynth + SoundFont 渲染的 WAV 音频
                playRenderedAudio(msg.audioUrl, msg.fileName);
                break;
            case 'close':
                hideMusicModal();
                break;
            case 'theme':
                document.body.classList.toggle('dark-mode', !!msg.darkMode);
                break;
        }
    };

    // ==== 初始化 ====
    function init() {
        initCanvas();
        bindEvents();
        // 通知主应用页面已就绪
        postToParent({ type: 'ready' });
    }

    function initCanvas() {
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        drawVisualizerIdle();
    }

    function resizeCanvas() {
        const canvas = el.visualizerCanvas;
        const container = canvas.parentElement;
        if (!container) return;
        const rect = container.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        const ctx = canvas.getContext('2d');
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
    }

    // ==== 事件绑定 ====
    function bindEvents() {
        el.btnClose.addEventListener('click', hideMusicModal);
        el.overlay.addEventListener('click', (e) => {
            if (e.target === el.overlay) hideMusicModal();
        });

        el.btnPlay.addEventListener('click', togglePlayback);
        el.btnHistory.addEventListener('click', toggleHistoryPanel);
        el.btnHistoryClose.addEventListener('click', () => {
            el.historyPanel.style.display = 'none';
        });
        el.btnDownload.addEventListener('click', downloadScore);

        el.speedSelect.addEventListener('change', () => {
            if (state.isPlaying) {
                const currentRealTime = Tone.Transport.seconds * (state._speed || 1);
                seekTo(currentRealTime);
            }
            notifyState();
        });

        el.progressBar.addEventListener('click', (e) => {
            if (state.totalDuration <= 0) return;
            const rect = el.progressBar.getBoundingClientRect();
            const ratio = (e.clientX - rect.left) / rect.width;
            const seekTime = Math.max(0, Math.min(state.totalDuration, ratio * state.totalDuration));
            seekTo(seekTime);
        });

        document.addEventListener('keydown', (e) => {
            if (!el.overlay.classList.contains('visible')) return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayback();
            } else if (e.code === 'Escape') {
                hideMusicModal();
            }
        });
    }

    // ==== 状态通知 ====
    function notifyState() {
        postToParent({
            type: 'state',
            playing: state.isPlaying,
            paused: state.isPaused,
            title: state.title,
            totalDuration: state.totalDuration,
        });
    }

    // ==== 渲染乐谱 ====
    function renderMusicScore(abcNotation) {
        if (!abcNotation || typeof abcNotation !== 'string') {
            console.warn('[音乐渲染器] 无效的乐谱数据');
            return;
        }

        if (!window.Tone) {
            console.error('[音乐渲染器] Tone.js 库未加载');
            postToParent({ type: 'error', message: '音频引擎未加载，请刷新页面后重试' });
            return;
        }

        stopPlayback();

        state.abcNotation = abcNotation;

        const titleMatch = abcNotation.match(/^T:\s*(.+)/m);
        state.title = titleMatch ? titleMatch[1].trim() : '未命名作品';

        const tempoMatch = abcNotation.match(/^Q:\s*(.+)/m);
        if (tempoMatch) {
            const bpmMatch = tempoMatch[1].trim().match(/(\d+)/);
            if (bpmMatch) state.bpm = parseInt(bpmMatch[1]);
        }

        const keyMatch = abcNotation.match(/^K:\s*(.+)/m);
        state.key = keyMatch ? keyMatch[1].trim() : 'C';

        const meterMatch = abcNotation.match(/^M:\s*(.+)/m);
        state.meter = meterMatch ? meterMatch[1].trim() : '4/4';

        // 解析声部→乐器映射（来自 musician.ts 注入的 %%voice 指令）
        state.voiceInstruments = parseVoiceInstruments(abcNotation);
        state.instruments = Array.from(state.voiceInstruments.values()).join(',');
        // 主声部预设键名（用于 UI 下拉框显示）
        const firstInstrument = state.voiceInstruments.get(1) || Array.from(state.voiceInstruments.values())[0];
        state.currentPresetKey = matchInstrumentPreset(firstInstrument);
        console.log(`[音乐渲染器] 声部乐器映射:`, Object.fromEntries(state.voiceInstruments));

        // 解析多声部音符（支持 [V:N] 标记）
        const parseResult = parseABCNotesMultiVoice(abcNotation);
        state.notes = parseResult.notes;
        if (state.notes.length === 0) {
            console.warn('[音乐渲染器] 无法解析 ABC 乐谱中的音符');
            postToParent({ type: 'error', message: '乐谱中未找到有效音符' });
            return;
        }

        // 回退策略：单声部多乐器时按音高分配音符到各乐器
        const hasMultipleVoices = new Set(state.notes.map(n => n.voice)).size > 1;
        if (!hasMultipleVoices && state.voiceInstruments.size > 1) {
            console.log('[音乐渲染器] 单声部多乐器场景，启用按音高分配回退策略');
            state.notes = distributeNotesByPitch(state.notes, state.voiceInstruments);
        }

        // 总时长 = 所有声部结束时间的最大值
        state.totalDuration = Math.max(...Object.values(parseResult.voiceTimes), 0);
        // 回退：若 voiceTimes 异常，使用最后一个音符的结束时间
        if (state.totalDuration <= 0 && state.notes.length > 0) {
            const lastNote = state.notes[state.notes.length - 1];
            state.totalDuration = lastNote.time + lastNote.duration;
        }

        updateUI();
        resetPlaybackState();
        showMusicModal();
        addToHistory(state.title, abcNotation);

        const voiceCount = new Set(state.notes.map(n => n.voice)).size;
        console.log(`[音乐渲染器] 乐谱就绪: "${state.title}", ${state.notes.length} 个音符, ${voiceCount} 个声部, ${state.totalDuration.toFixed(1)}s`);
        notifyState();
    }

    // ==== UI 更新 ====
    function updateUI() {
        el.title.textContent = state.title;
        el.titleScrollText.textContent = state.title;
        el.keyDisplay.textContent = state.key;
        el.meterDisplay.textContent = state.meter;
        el.timeTotal.textContent = formatTime(state.totalDuration);
        el.timeCurrent.textContent = '00:00';
        el.progressFill.style.width = '0%';
        el.speedSelect.value = '1';
    }

    function resetPlaybackState() {
        state.isPlaying = false;
        state.isPaused = false;
        updatePlayButton();
        stopAnimation();
        showScrollingTitle();
    }

    // ==== 播放控制 ====
    function togglePlayback() {
        if (state.isPlaying) {
            pausePlayback();
        } else {
            startPlayback();
        }
        notifyState();
    }

    function startPlayback() {
        if (!state.abcNotation || state.notes.length === 0) return;
        Tone.start().then(() => {
            if (state.isPaused) {
                resumePlayback();
            } else {
                beginNewPlayback();
            }
            notifyState();
        });
    }

    function beginNewPlayback() {
        disposeSynth();

        // 为所有声部创建独立的合成器实例（多乐器并行）
        createSynthsForVoices(state.voiceInstruments);

        Tone.Transport.bpm.value = 60;

        const speed = parseFloat(el.speedSelect.value);
        const timeScale = 1 / speed;

        // 应用表达引擎：为每个音符计算 velocity、时序偏移、运音法
        const expressiveNotes = ExpressionEngine.applyExpression(state.notes);

        // 多声部并行调度：每个音符发送到其所属声部的合成器，携带 velocity
        expressiveNotes.forEach(({ note, duration, time, voice, velocity }) => {
            const voiceData = state.voices[voice] || state.voices[1];
            if (!voiceData || !voiceData.synth) return;

            const scheduledTime = time * timeScale;
            const noteDuration = duration * timeScale;
            const vel = velocity || 0.7;
            Tone.Transport.schedule((t) => {
                voiceData.synth.triggerAttackRelease(note, noteDuration, t, vel);
            }, scheduledTime);
        });

        const adjustedTotal = state.totalDuration * timeScale;
        Tone.Transport.schedule(() => {
            stopPlayback();
            notifyState();
        }, adjustedTotal + 0.1);

        state._speed = speed;
        state._timeScale = timeScale;

        Tone.Transport.start();
        state.isPlaying = true;
        state.isPaused = false;
        updatePlayButton();
        startAnimation();
        hideScrollingTitle();
    }

    function resumePlayback() {
        Tone.Transport.start();
        state.isPlaying = true;
        state.isPaused = false;
        updatePlayButton();
        startAnimation();
        hideScrollingTitle();
    }

    function pausePlayback() {
        Tone.Transport.pause();
        state.isPlaying = false;
        state.isPaused = true;
        updatePlayButton();
        stopAnimation();
        showScrollingTitle();
    }

    function stopPlayback() {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        state.isPlaying = false;
        state.isPaused = false;
        updatePlayButton();
        stopAnimation();
        disposeSynth();
        showScrollingTitle();
        el.progressFill.style.width = '0%';
        el.timeCurrent.textContent = '00:00';
    }

    function seekTo(seconds) {
        if (state.totalDuration <= 0) return;

        const wasPlaying = state.isPlaying;
        // 记录当前进度，供乐器切换时恢复
        state._lastSeekTime = seconds;

        Tone.Transport.stop();
        Tone.Transport.cancel();
        disposeSynth();

        // 为所有声部创建独立的合成器实例（多乐器并行）
        createSynthsForVoices(state.voiceInstruments);

        Tone.Transport.bpm.value = 60;

        const speed = parseFloat(el.speedSelect.value);
        const timeScale = 1 / speed;

        // 应用表达引擎：为每个音符计算 velocity、时序偏移、运音法
        const expressiveNotes = ExpressionEngine.applyExpression(state.notes);

        // 多声部并行调度：跳过已播放的音符，剩余音符携带 velocity
        expressiveNotes.forEach(({ note, duration, time, voice, velocity }) => {
            const noteEnd = time + duration;
            if (noteEnd <= seconds) return;

            const voiceData = state.voices[voice] || state.voices[1];
            if (!voiceData || !voiceData.synth) return;

            let scheduledTime = (time - seconds) * timeScale;
            if (scheduledTime < 0) scheduledTime = 0;

            let remainingDuration = duration;
            if (time < seconds) {
                remainingDuration = noteEnd - seconds;
            }
            const noteDuration = remainingDuration * timeScale;
            const vel = velocity || 0.7;

            Tone.Transport.schedule((t) => {
                voiceData.synth.triggerAttackRelease(note, noteDuration, t, vel);
            }, scheduledTime);
        });

        const remainingReal = state.totalDuration - seconds;
        const adjustedRemaining = remainingReal * timeScale;
        Tone.Transport.schedule(() => {
            stopPlayback();
            notifyState();
        }, adjustedRemaining + 0.1);

        state._speed = speed;
        state._timeScale = timeScale;

        if (wasPlaying) {
            Tone.Transport.start();
            state.isPlaying = true;
            state.isPaused = false;
            updatePlayButton();
            startAnimation();
            hideScrollingTitle();
        } else {
            state.isPlaying = false;
            state.isPaused = true;
            updatePlayButton();
            showScrollingTitle();
            const progress = (seconds / state.totalDuration) * 100;
            el.progressFill.style.width = progress + '%';
            el.timeCurrent.textContent = formatTime(seconds);
        }
        notifyState();
    }

    // ==== 乐器元信息解析 ====

    /**
     * 从 ABC 乐谱头部解析声部乐器映射
     *
     * 优先解析 `%%voice N 乐器名` 指令（musician.ts 注入的多声部格式），
     * 回退到 `%%instrument 乐器1,乐器2` 格式（兼容旧版）。
     *
     * @param {string} abcNotation - ABC 乐谱文本
     * @returns {Map<number, string>} 声部ID→乐器名映射，如 {1:'钢琴', 2:'小提琴'}
     */
    function parseVoiceInstruments(abcNotation) {
        const voiceMap = new Map();
        // 优先解析 %%voice N 乐器名
        const voiceRegex = /^%%voice\s+(\d+)\s+(.+)$/gm;
        let match;
        while ((match = voiceRegex.exec(abcNotation)) !== null) {
            const voiceId = parseInt(match[1]);
            const instrument = match[2].trim();
            if (instrument) voiceMap.set(voiceId, instrument);
        }
        if (voiceMap.size > 0) return voiceMap;

        // 回退：解析 %%instrument 乐器1,乐器2（旧版兼容）
        const instMatch = abcNotation.match(/^%%instrument\s+(.+)$/m);
        if (instMatch) {
            const instruments = instMatch[1]
                .replace(/，/g, ',')
                .split(',')
                .map(s => s.trim())
                .filter(Boolean);
            instruments.forEach((inst, i) => voiceMap.set(i + 1, inst));
        }
        if (voiceMap.size === 0) voiceMap.set(1, '钢琴');
        return voiceMap;
    }

    /**
     * 解析 ABC 乐谱中的多声部音符
     *
     * 支持 ABC 标准的 `[V:N]` 声部标记。每个声部维护独立的时间轴，
     * 各声部并行演奏。无 `[V:N]` 标记时所有音符归入声部 1。
     *
     * 算法：
     * 1. 提取 K: 行之后的音乐主体
     * 2. 按 `[V:N]` 标记分段，每段属于对应声部
     * 3. 每个声部独立累加时间（并行演奏）
     *
     * @param {string} abcNotation - ABC 乐谱文本
     * @returns {{notes: Array, voiceTimes: Object}} 音符数组与各声部结束时间
     */
    function parseABCNotesMultiVoice(abcNotation) {
        const notes = [];

        const lengthMatch = abcNotation.match(/^L:\s*(\d+)\/(\d+)/m);
        let defaultDuration = 0.125;
        if (lengthMatch) {
            defaultDuration = parseInt(lengthMatch[1]) / parseInt(lengthMatch[2]);
        }

        const tempoMatch = abcNotation.match(/^Q:\s*(\d+)\/(\d+)=(\d+)/m);
        let bpm = 120;
        let beatDuration = 0.25;
        if (tempoMatch) {
            beatDuration = parseInt(tempoMatch[1]) / parseInt(tempoMatch[2]);
            bpm = parseInt(tempoMatch[3]);
        }

        const secondsPerBeat = 60 / bpm;
        const defaultSeconds = defaultDuration / beatDuration * secondsPerBeat;

        const keyIndex = abcNotation.search(/^K:.*$/m);
        if (keyIndex === -1) return { notes, voiceTimes: { 1: 0 } };

        const musicBody = abcNotation.substring(keyIndex).replace(/^K:.*$/m, '').trim();

        // 按 [V:N] 标记分段（保留标记本身）
        const segments = musicBody.split(/(?=\[V:\d+\])/);

        const voiceTimes = { 1: 0 };
        let currentVoice = 1;

        // 表情状态跟踪（力度和运音法持续到被覆盖为止）
        let currentDynamics = 'mf';  // 默认中强
        let currentArticulation = null;  // 无特殊运音法

        // 预扫描：提取表情记号位置（力度、运音法）
        // ABC 力度记号：!pp! !p! !mp! !mf! !f! !ff!
        // ABC 运音法：. (staccato) > (accent) - (tenuto) ~ (roll/trill)
        const dynamicRegex = /!(pp|p|mp|mf|f|ff)!/g;
        const articulationRegex = /([.>-])/g;

        const noteRegex = /([\^=_]*)([a-gA-G])([,']*)(\d*)(\/?\d*)/g;

        for (const segment of segments) {
            const voiceMatch = segment.match(/^\[V:(\d+)\]/);
            if (voiceMatch) {
                currentVoice = parseInt(voiceMatch[1]);
                if (voiceTimes[currentVoice] === undefined) voiceTimes[currentVoice] = 0;
            }

            noteRegex.lastIndex = 0;
            let match;
            let lastIndex = 0;
            while ((match = noteRegex.exec(segment)) !== null) {
                // 扫描此音符之前的文本，提取表情记号
                const textBefore = segment.substring(lastIndex, match.index);
                lastIndex = match.index + match[0].length;

                // 更新力度记号（最后一个生效）
                let dynMatch;
                dynamicRegex.lastIndex = 0;
                while ((dynMatch = dynamicRegex.exec(textBefore)) !== null) {
                    currentDynamics = dynMatch[1];
                }

                // 更新运音法（紧邻音符前的一个记号生效）
                const lastArtMatch = textBefore.match(/([.>-])\s*$/);
                if (lastArtMatch) {
                    const artMap = { '.': 'staccato', '>': 'accent', '-': 'tenuto' };
                    currentArticulation = artMap[lastArtMatch[1]] || null;
                } else {
                    // 运音法仅作用于紧跟其后的一个音符
                    currentArticulation = null;
                }

                const accidental = match[1];
                const noteName = match[2];
                const octave = match[3];
                const durationNum = match[4];
                const durationFrac = match[5];

                let duration = defaultSeconds;
                if (durationNum) {
                    duration = defaultSeconds * parseInt(durationNum);
                }
                if (durationFrac && durationFrac.startsWith('/')) {
                    const fracVal = parseInt(durationFrac.substring(1));
                    if (fracVal > 0) duration = defaultSeconds / fracVal;
                }

                // 音符格式：音名 + 升降号 + 八度数字（如 "C#3"、"Db4"）
                // 此顺序匹配 noteToNumber 正则 /^([A-Ga-g])([#b]?)(\d+)$/
                // 且 Tone.js triggerAttackRelease 也接受此格式
                let fullNote = noteName;
                if (accidental.includes('^')) fullNote += '#';
                if (accidental.includes('_')) fullNote += 'b';
                if (noteName === noteName.toLowerCase()) {
                    fullNote += '4';
                } else {
                    fullNote += '3';
                }
                if (octave.includes("'")) fullNote = fullNote.replace(/(\d+)$/, m => String(parseInt(m) + 1));
                if (octave.includes(',')) fullNote = fullNote.replace(/(\d+)$/, m => String(parseInt(m) - 1));

                const time = voiceTimes[currentVoice] || 0;
                notes.push({
                    note: fullNote,
                    duration,
                    time,
                    voice: currentVoice,
                    dynamics: currentDynamics,
                    articulation: currentArticulation,
                });
                voiceTimes[currentVoice] = time + duration;
            }
        }

        return { notes, voiceTimes };
    }

    /**
     * 回退策略：单声部多乐器场景下按音高分配音符到各乐器
     *
     * 当乐谱没有 [V:N] 标记（单声部）但指定了多个乐器时，
     * 将每个音符分配到音域最匹配的乐器对应的声部。
     *
     * @param {Array} notes - 原始音符数组（voice 全为 1）
     * @param {Map<number, string>} voiceMap - 声部→乐器映射
     * @returns {Array} 重新分配 voice 后的音符数组
     */
    function distributeNotesByPitch(notes, voiceMap) {
        if (voiceMap.size <= 1) return notes;

        // 构建声部→{presetKey, range, center} 映射
        const voiceRanges = [];
        for (const [voiceId, instrumentName] of voiceMap) {
            const presetKey = matchInstrumentPreset(instrumentName);
            const range = INSTRUMENT_PITCH_RANGES[presetKey] || { low: 0, high: 127 };
            voiceRanges.push({ voiceId, presetKey, range, center: (range.low + range.high) / 2 });
        }
        // 按音域中心从低到高排序
        voiceRanges.sort((a, b) => a.center - b.center);

        // 计算相邻乐器音域中心的分界点
        // 分界点 = 两个相邻中心的中点，音符按分界点分配到最近的乐器
        const boundaries = [];
        for (let i = 0; i < voiceRanges.length - 1; i++) {
            boundaries.push((voiceRanges[i].center + voiceRanges[i + 1].center) / 2);
        }

        return notes.map(n => {
            const pitch = noteToNumber(n.note);

            // 按分界点分配：找到 pitch 落在哪个区间
            let voiceIdx = 0;
            for (let i = 0; i < boundaries.length; i++) {
                if (pitch > boundaries[i]) voiceIdx = i + 1;
                else break;
            }

            return { ...n, voice: voiceRanges[voiceIdx].voiceId };
        });
    }

    /**
     * 根据乐器名称匹配预设键名
     *
     * 遍历 INSTRUMENT_PRESETS 的 keywords 数组，返回首个匹配的预设键名。
     * 支持中英文模糊匹配（包含子串即视为匹配）。
     *
     * @param {string} instrumentName - 乐器名称（如 "钢琴"、"violin"）
     * @returns {string} 预设键名（如 "piano"、"violin"），未匹配则返回 DEFAULT_PRESET_KEY
     */
    function matchInstrumentPreset(instrumentName) {
        if (!instrumentName) return DEFAULT_PRESET_KEY;
        const name = instrumentName.toLowerCase().trim();
        for (const [key, preset] of Object.entries(INSTRUMENT_PRESETS)) {
            if (preset.keywords.some(kw => name.includes(kw.toLowerCase()) || kw.toLowerCase().includes(name))) {
                return key;
            }
        }
        return DEFAULT_PRESET_KEY;
    }

    /**
     * 根据预设键名创建合成器与效果链（独立实例）
     *
     * 创建顺序：合成器 → 效果链节点（filter/vibrato）→ reverb → destination
     * 返回完整的合成器对象供多声部并行使用。
     *
     * @param {string} presetKey - 预设键名
     * @returns {{synth: object, reverb: object, effects: Array}} 合成器、混响与效果节点数组
     */
    function createSynthForInstrument(presetKey) {
        const preset = INSTRUMENT_PRESETS[presetKey] || INSTRUMENT_PRESETS[DEFAULT_PRESET_KEY];
        const synth = preset.factory();
        const effects = preset.effects();

        // 效果节点连接顺序：synth → filter → vibrato → reverb → destination
        let lastNode = synth;
        const effectNodes = [];

        if (effects.filter) {
            synth.connect(effects.filter);
            lastNode = effects.filter;
            effectNodes.push(effects.filter);
        }
        if (effects.vibrato) {
            lastNode.connect(effects.vibrato);
            lastNode = effects.vibrato;
            effectNodes.push(effects.vibrato);
        }
        if (effects.reverb) {
            lastNode.connect(effects.reverb);
            effects.reverb.toDestination();
            effectNodes.push(effects.reverb);
        } else {
            lastNode.toDestination();
        }

        return { synth, reverb: effects.reverb || null, effects: effectNodes };
    }

    /**
     * 为所有声部创建独立的合成器实例
     *
     * 遍历 state.voiceInstruments 映射，为每个声部创建对应的合成器与效果链。
     * 每个声部拥有完全独立的合成器实例，实现真正的多乐器并行演奏。
     *
     * @param {Map<number, string>} voiceInstruments - 声部ID→乐器名映射
     */
    function createSynthsForVoices(voiceInstruments) {
        disposeAllSynths();
        state.voices = {};

        for (const [voiceId, instrumentName] of voiceInstruments) {
            const presetKey = matchInstrumentPreset(instrumentName);
            const { synth, reverb, effects } = createSynthForInstrument(presetKey);
            state.voices[voiceId] = {
                synth,
                reverb,
                effects,
                presetKey,
                instrumentName,
            };
            console.log(`[音乐渲染器] 声部 ${voiceId}: ${instrumentName} → 预设 ${presetKey}`);
        }

        // 兼容旧字段：toneSynth 指向声部 1 的合成器
        const firstVoice = state.voices[1] || Object.values(state.voices)[0];
        if (firstVoice) {
            state.toneSynth = firstVoice.synth;
            state.toneReverb = firstVoice.reverb;
            state._effectNodes = firstVoice.effects;
            state.currentPresetKey = firstVoice.presetKey;
        }
    }

    /**
     * 释放所有声部的合成器与效果节点
     */
    function disposeAllSynths() {
        for (const voiceId in state.voices) {
            const v = state.voices[voiceId];
            if (v.synth) {
                try { v.synth.dispose(); } catch (e) { /* 已释放 */ }
            }
            if (v.effects && v.effects.length > 0) {
                v.effects.forEach(node => {
                    try { node.dispose(); } catch (e) { /* 已释放 */ }
                });
            }
        }
        state.voices = {};
        state.toneSynth = null;
        state.toneReverb = null;
        state._effectNodes = [];
    }

    function disposeSynth() {
        disposeAllSynths();
    }

    // ==== 后端音频播放（FluidSynth + SoundFont 渲染的 WAV） ====

    /** 当前 HTML5 Audio 实例（后端渲染音频） */
    let _renderedAudio = null;
    /** 后端渲染的音频 URL（供下载使用，即使 Audio 对象被释放也不丢失） */
    let _renderedAudioUrl = null;
    /** 后端渲染的文件名 */
    let _renderedAudioName = null;

    /**
     * 播放后端渲染的 WAV 音频
     *
     * 当后端 FluidSynth + SoundFont 渲染完成时，前端收到音频 URL，
     * 使用 HTML5 Audio API 直接播放，音质远超前端 Tone.js 合成。
     * 同时更新 UI 进度条和时间显示。
     */
    function playRenderedAudio(audioUrl, fileName) {
        console.log(`[音乐渲染器] 收到后端渲染音频: ${audioUrl}`);

        // 停止前端合成器播放（如果正在进行）
        if (state.isPlaying) {
            Tone.Transport.stop();
            Tone.Transport.cancel();
            state.isPlaying = false;
            state.isPaused = false;
        }
        disposeSynth();

        // 停止之前的渲染音频
        if (_renderedAudio) {
            _renderedAudio.pause();
            _renderedAudio = null;
        }

        // 保存音频 URL 和文件名（供下载使用）
        _renderedAudioUrl = audioUrl;
        _renderedAudioName = fileName || 'music.wav';

        // 创建 HTML5 Audio 实例
        const audio = new Audio(audioUrl);
        _renderedAudio = audio;

        audio.addEventListener('loadedmetadata', () => {
            state.totalDuration = audio.duration;
            state.isPlaying = true;
            state.isPaused = false;
            state.title = fileName ? fileName.replace(/\.wav$/, '') : state.title;
            updatePlayButton();
            updateUI();
            showMusicModal();
            hideScrollingTitle();
            console.log(`[音乐渲染器] 后端音频加载完成，时长: ${audio.duration.toFixed(1)}s`);
        });

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const progress = (audio.currentTime / audio.duration) * 100;
            el.progressFill.style.width = progress + '%';
            el.timeCurrent.textContent = formatTime(audio.currentTime);
        });

        audio.addEventListener('ended', () => {
            state.isPlaying = false;
            state.isPaused = false;
            updatePlayButton();
            showScrollingTitle();
            notifyState();
        });

        audio.addEventListener('error', (e) => {
            console.error('[音乐渲染器] 后端音频播放失败:', e);
            postToParent({ type: 'error', message: '音频播放失败，将使用前端合成器' });
            // 回退：如果有 ABC 乐谱数据，使用前端合成器
            if (state.abcNotation) {
                console.log('[音乐渲染器] 回退到前端合成器播放');
                beginNewPlayback();
            }
        });

        audio.play().catch(err => {
            console.warn('[音乐渲染器] 音频自动播放被阻止:', err);
        });
    }

    /**
     * 检查当前是否正在播放后端渲染音频
     */
    function isPlayingRenderedAudio() {
        return _renderedAudio !== null && !_renderedAudio.paused;
    }

    // ==== 进度动画 ====
    function startAnimation() {
        stopAnimation();
        function tick() {
            if (!state.isPlaying) {
                state.animationId = null;
                return;
            }
            const realTime = Tone.Transport.seconds * (state._speed || 1);
            if (state.totalDuration > 0) {
                const progress = Math.min(100, (realTime / state.totalDuration) * 100);
                el.progressFill.style.width = progress + '%';
                el.timeCurrent.textContent = formatTime(realTime);
            }
            drawVisualizerPlaying(realTime);
            state.animationId = requestAnimationFrame(tick);
        }
        state.animationId = requestAnimationFrame(tick);
    }

    function stopAnimation() {
        if (state.animationId) {
            cancelAnimationFrame(state.animationId);
            state.animationId = null;
        }
    }

    // ==== 可视化 ====
    function drawVisualizerIdle() {
        const canvas = el.visualizerCanvas;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(157, 107, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();
    }

    function drawVisualizerPlaying(currentTime) {
        const canvas = el.visualizerCanvas;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;

        if (w <= 0 || h <= 0) return;
        ctx.clearRect(0, 0, w, h);

        if (state.notes.length === 0) return;

        ctx.strokeStyle = 'rgba(157, 107, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 8]);
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();
        ctx.setLineDash([]);

        const windowStart = Math.max(0, currentTime - 2);
        const windowEnd = Math.min(state.totalDuration, currentTime + 2);
        const windowDuration = windowEnd - windowStart;

        if (windowDuration <= 0) return;

        const barWidth = Math.max(2, w / 80);
        const timeSlots = new Map();
        const slotSize = windowDuration / 60;

        state.notes.forEach(note => {
            if (note.time + note.duration < windowStart || note.time > windowEnd) return;
            const slot = Math.floor((note.time - windowStart) / slotSize);
            if (!timeSlots.has(slot)) timeSlots.set(slot, []);
            timeSlots.get(slot).push(note);
        });

        timeSlots.forEach((notes, slot) => {
            const x = (slot / 60) * w;
            const normalizedPitch = (noteToNumber(notes[0].note) - 48) / 36;
            const barHeight = h * 0.15 + normalizedPitch * h * 0.7;

            const distFromCenter = Math.abs((slot / 60) * windowDuration - (currentTime - windowStart));
            const alpha = Math.max(0.15, 1 - distFromCenter / (windowDuration / 2));

            const isNearCurrent = distFromCenter < 0.3;
            const hue = isNearCurrent ? 270 : 260;
            const saturation = isNearCurrent ? '80%' : '60%';
            const lightness = isNearCurrent ? '65%' : '50%';

            ctx.fillStyle = `hsla(${hue}, ${saturation}, ${lightness}, ${alpha})`;
            ctx.fillRect(x, h / 2 - barHeight / 2, barWidth, barHeight);
        });

        const indicatorX = ((currentTime - windowStart) / windowDuration) * w;
        ctx.strokeStyle = 'rgba(157, 107, 255, 0.8)';
        ctx.lineWidth = 2;
        ctx.shadowColor = 'rgba(157, 107, 255, 0.5)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(indicatorX, 0);
        ctx.lineTo(indicatorX, h);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    function noteToNumber(note) {
        const notes = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
        const match = note.match(/^([A-Ga-g])([#b]?)(\d+)$/);
        if (!match) return 60;
        let base = notes[match[1].toUpperCase()] || 0;
        if (match[2] === '#') base++;
        if (match[2] === 'b') base--;
        return base + (parseInt(match[3]) + 1) * 12;
    }

    // ==== 滚动标题 ====
    function showScrollingTitle() {
        if (el.titleScroll) el.titleScroll.style.display = 'flex';
    }
    function hideScrollingTitle() {
        if (el.titleScroll) el.titleScroll.style.display = 'none';
    }

    // ==== 下载 ====
    function downloadScore() {
        const safeName = state.title.replace(/[\\/:*?"<>|]/g, '_');

        // 优先下载后端渲染的 WAV 音频（fetch→blob 确保触发下载而非浏览器直接播放）
        if (_renderedAudioUrl) {
            fetch(_renderedAudioUrl)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.blob();
                })
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = _renderedAudioName || `${safeName}.wav`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                })
                .catch(err => {
                    console.warn('[音乐渲染器] WAV 下载失败，回退到 ABC 文件:', err);
                    downloadABCFile(safeName);
                });
            return;
        }

        // 回退：下载 ABC 乐谱文件
        downloadABCFile(safeName);
    }

    /** 下载 ABC 乐谱文件 */
    function downloadABCFile(safeName) {
        if (!state.abcNotation) return;
        const blob = new Blob([state.abcNotation], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${safeName}.abc`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // ==== 播放按钮 ====
    function updatePlayButton() {
        const icon = el.btnPlay.querySelector('i');
        if (state.isPlaying) {
            icon.className = 'fas fa-pause';
            el.btnPlay.title = '暂停';
        } else {
            icon.className = 'fas fa-play';
            el.btnPlay.title = '播放';
        }
    }

    // ==== 模态框 ====
    function showMusicModal() {
        el.overlay.classList.add('visible');
        el.historyPanel.style.display = 'none';
        requestAnimationFrame(() => {
            resizeCanvas();
            drawVisualizerIdle();
        });
    }

    function hideMusicModal() {
        stopPlayback();
        el.overlay.classList.remove('visible');
        postToParent({ type: 'closed' });
        notifyState();
    }

    // ==== 历史记录 ====
    function toggleHistoryPanel() {
        const isVisible = el.historyPanel.style.display !== 'none';
        el.historyPanel.style.display = isVisible ? 'none' : 'block';
        if (!isVisible) renderHistoryList();
    }

    function addToHistory(title, abcNotation) {
        state.history.unshift({ title, abcNotation, time: new Date().toLocaleTimeString() });
        if (state.history.length > 20) state.history.pop();
    }

    function renderHistoryList() {
        if (state.history.length === 0) {
            el.historyList.innerHTML = '<div class="music-history-empty">暂无创作历史</div>';
            return;
        }

        el.historyList.innerHTML = state.history.map((item, index) => `
            <div class="music-history-item" data-index="${index}">
                <span class="music-history-title">${escapeHtmlSafe(item.title)}</span>
                <span class="music-history-time">${item.time}</span>
            </div>
        `).join('');

        el.historyList.querySelectorAll('.music-history-item').forEach(item => {
            item.addEventListener('click', () => {
                const index = parseInt(item.dataset.index);
                const record = state.history[index];
                if (record) {
                    el.historyPanel.style.display = 'none';
                    renderMusicScore(record.abcNotation);
                }
            });
        });
    }

    // ==== 工具函数 ====
    function formatTime(seconds) {
        if (!isFinite(seconds) || seconds < 0) return '00:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function escapeHtmlSafe(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ==== 启动 ====
    init();
    </script>
</body>
</html>
